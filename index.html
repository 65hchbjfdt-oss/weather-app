<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Anomalies Tracker</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #007AFF; 
            --ios-green: #34C759;
            --glass: rgba(255, 255, 255, 0.12);
            --blur: blur(25px) saturate(180%);
        }
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, system-ui, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.6) contrast(1.2); }
        
        /* iOS Liquid Glass UI */
        .ui-panel {
            position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; background: var(--glass);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid rgba(255,255,255,0.2); border-radius: 36px;
            padding: 24px; box-sizing: border-box; z-index: 100;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .btn {
            width: 100%; padding: 18px; margin: 6px 0; border: none; border-radius: 20px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--ios-blue); color: #fff; text-align: center;
        }
        .btn-sec { background: rgba(255,255,255,0.1); color: #fff; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }

        /* Liquid Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 30px; }
        input[type=range]::-webkit-slider-runnable-track { height: 10px; background: rgba(255,255,255,0.15); border-radius: 10px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%;
            background: #fff; margin-top: -8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 40px; height: 40px;
            z-index: 50; pointer-events: none; border: 2px solid var(--ios-green); border-radius: 50%;
        }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 320px; background: rgba(20,20,20,0.85);
            backdrop-filter: var(--blur); border-radius: 32px; padding: 24px;
            display: none; z-index: 1000; border: 0.5px solid rgba(255,255,255,0.1);
        }
        .active { display: block; animation: iosPop 0.4s cubic-bezier(0.15, 1, 0.3, 1); }
        @keyframes iosPop { from { opacity: 0; scale: 0.8; } to { opacity: 1; scale: 1; } }

        /* Radar Unit */
        #radar {
            width: 80px; height: 80px; margin: 0 auto 15px; border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%; position: relative; overflow: hidden;
        }
        #radar-arrow {
            position: absolute; top: 50%; left: 50%; width: 2px; height: 35px;
            background: var(--ios-green); transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg); transition: 0.5s ease;
        }

        .copy-btn { margin-top: 10px; font-size: 12px; color: var(--ios-green); text-align: center; padding: 10px; border: 1px solid rgba(52,199,89,0.3); border-radius: 12px; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>

<div class="ui-panel">
    <div id="radar-ui" style="display:none; text-align: center;">
        <div id="radar"><div id="radar-arrow"></div></div>
        <div id="distance-text" style="font-size: 10px; letter-spacing: 2px; color: var(--ios-green);">СИГНАЛ: 0%</div>
    </div>

    <div id="scan-box" style="display:none; text-align:center;">
        <div style="font-size: 12px; color: var(--ios-blue); letter-spacing: 3px; font-weight: 800;">ПОТОК ДАННЫХ...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" onclick="openM('settings')">Настройки</button>
            <button class="btn btn-sec" onclick="openM('map-styles')">Слои</button>
        </div>
        <button class="btn btn-sec" id="selectBtn" onclick="toggleSelect()">📍 Выбрать точку поиска</button>
        <button class="btn" id="mainBtn" onclick="executeScan()">НАЙТИ АНОМАЛИЮ</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--ios-green);" onclick="buildRoute()">Маршрут</button>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" style="flex: 1;" onclick="openM('info')">Логи</button>
            <button class="btn btn-sec" style="flex: 1;" onclick="resetSystem()">Сброс</button>
        </div>
    </div>
</div>

<div id="settings" class="modal">
    <h3>Конфигурация</h3>
    <label style="font-size: 11px; opacity: 0.6;">РЕЖИМ</label>
    <select id="catSelect" style="width:100%; background:rgba(255,255,255,0.1); color:#fff; border:none; padding:15px; border-radius:15px; margin: 10px 0;">
        <option value="quantum">🌀 Квантовый (Храмы, Кладбища)</option>
        <option value="power">⛓ Мощный (Заброшки, Руины)</option>
        <option value="void">🌲 Пустота (Овраги, Леса)</option>
    </select>
    <label style="font-size: 11px; opacity: 0.6;">РАДИУС: <span id="rL">5</span> км</label>
    <input type="range" id="radiusIn" min="1" max="15" value="5" oninput="syncUI()">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-top:15px;">
        <span>Звук</span>
        <input type="checkbox" id="soundToggle" checked>
    </div>
    <button class="btn" style="margin-top:20px" onclick="closeM()">Применить</button>
</div>

<div id="info" class="modal">
    <h3 id="anomalyName" style="color: var(--ios-green); margin-bottom:5px;">Название...</h3>
    <div id="infoBody" style="font-size: 13px; opacity: 0.8; line-height: 1.4;"></div>
    <div id="coordsBox" style="margin-top:10px; font-family:monospace; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px; text-align:center;"></div>
    <div class="copy-btn" onclick="copyCoords()">КОПИРОВАТЬ КООРДИНАТЫ</div>
    <button class="btn btn-sec" style="margin-top:10px" onclick="closeM()">Закрыть</button>
</div>

<div id="map-styles" class="modal">
    <button class="btn btn-sec" onclick="setMapStyle('dark')">Темная материя</button>
    <button class="btn btn-sec" onclick="setMapStyle('sat')">Спутник</button>
    <button class="btn" style="margin-top:10px" onclick="closeM()">Закрыть</button>
</div>

<script>
    // --- AUDIO ENGINE (iOS Style) ---
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function playIOS(type) {
        if (!document.getElementById('soundToggle').checked) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'tap') {
            osc.frequency.setValueAtTime(880, now);
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'scan') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 2);
            g.gain.setValueAtTime(0.05, now);
            g.gain.linearRampToValueAtTime(0, now + 2);
            osc.start(); osc.stop(now + 2);
        } else if (type === 'found') {
            const osc2 = ctx.createOscillator();
            osc2.connect(g);
            osc.frequency.setValueAtTime(523, now);
            osc2.frequency.setValueAtTime(659, now);
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(); osc2.start();
            osc.stop(now + 0.5); osc2.stop(now + 0.5);
        }
    }

    // --- LOGIC ---
    let map, userPos, searchOrigin, targetPoint, isSelecting = false;
    const STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        sat: { "version": 8, "sources": { "s": { "type": "raster", "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], "tileSize": 256 }}, "layers": [{ "id": "s", "type": "raster", "source": "s" }] }
    };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    map.on('load', () => {
        navigator.geolocation.getCurrentPosition(pos => {
            userPos = [pos.coords.longitude, pos.coords.latitude];
            searchOrigin = userPos;
            map.setCenter(userPos);
            new maplibregl.Marker({ color: '#007AFF' }).setLngLat(userPos).addTo(map);
            syncUI();
        });
        
        // Radar update loop
        setInterval(() => {
            if (targetPoint && userPos) {
                const dist = getDistance(userPos, targetPoint);
                const maxDist = document.getElementById('radiusIn').value * 1000;
                const strength = Math.max(0, Math.min(100, (1 - dist / maxDist) * 100));
                document.getElementById('radar-arrow').style.transform = `translate(-50%, -100%) rotate(${strength * 3.6}deg)`;
                document.getElementById('distance-text').innerText = `СИГНАЛ: ${strength.toFixed(0)}%`;
            }
        }, 500);
    });

    function syncUI() {
        const r = document.getElementById('radiusIn').value;
        document.getElementById('rL').innerText = r;
        if (searchOrigin) {
            const circle = genCircle(searchOrigin, r);
            if (map.getSource('rad')) map.getSource('rad').setData(circle);
            else {
                map.addSource('rad', { type: 'geojson', data: circle });
                map.addLayer({ id: 'rad-l', type: 'fill', source: 'rad', paint: { 'fill-color': '#007AFF', 'fill-opacity': 0.1 } });
            }
        }
    }

    function toggleSelect() {
        isSelecting = !isSelecting;
        document.getElementById('crosshair').style.display = isSelecting ? 'block' : 'none';
        const b = document.getElementById('mainBtn');
        if (isSelecting) {
            b.innerText = "ПОДТВЕРДИТЬ ЦЕНТР";
            b.onclick = () => { 
                searchOrigin = [map.getCenter().lng, map.getCenter().lat]; 
                toggleSelect(); syncUI(); playIOS('tap'); 
                document.getElementById('mainBtn').onclick = executeScan;
                document.getElementById('mainBtn').innerText = "НАЙТИ АНОМАЛИЮ";
            };
        }
    }

    async function executeScan() {
        playIOS('scan');
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';

        const mode = document.getElementById('catSelect').value;
        const radius = document.getElementById('radiusIn').value;
        
        let found = null;
        const attempts = 15;

        for (let i = 0; i < attempts; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = (Math.sqrt(Math.random()) * radius) / 111;
            const pt = [searchOrigin[0] + d * Math.cos(a), searchOrigin[1] + d * Math.sin(a)];
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                
                let score = 0;
                if (mode === 'quantum' && (data.addresstype === 'historic' || data.addresstype === 'place_of_worship' || data.type === 'cemetery')) score = 100;
                if (mode === 'power' && (data.address.industrial || data.type === 'construction' || data.address.railway)) score = 100;
                if (mode === 'void' && (!data.address.road && !data.address.house_number)) score = 100;

                if (score === 100) { found = { coords: pt, data: data }; break; }
            } catch(e) {}
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            if (found) {
                playIOS('found');
                targetPoint = found.coords;
                showTarget(found, mode);
            } else {
                resetSystem();
                alert("Аномалий не найдено. Попробуй другое место.");
            }
        }, 2000);
    }

    function showTarget(obj, mode) {
        const names = {
            quantum: ["Эхо Разлома", "Древний Импульс", "Точка Сингулярности"],
            power: ["Ржавый Узел", "Зона Отчуждения", "Генератор Пустоты"],
            void: ["Зеленая Мгла", "Дыхание Леса", "Шепот Оврага"]
        };
        const randomName = names[mode][Math.floor(Math.random() * 3)];
        
        document.getElementById('anomalyName').innerText = randomName;
        document.getElementById('infoBody').innerHTML = `<b>Категория:</b> ${mode.toUpperCase()}<br><b>Адрес:</b> ${obj.data.display_name}`;
        document.getElementById('coordsBox').innerText = `${targetPoint[1].toFixed(6)}, ${targetPoint[0].toFixed(6)}`;

        if (window.m) window.m.remove();
        const el = document.createElement('div');
        el.className = 'pulse';
        el.style.cssText = "width:20px; height:20px; background:var(--ios-green); border-radius:50%; box-shadow: 0 0 20px var(--ios-green);";
        window.m = new maplibregl.Marker(el).setLngLat(targetPoint).addTo(map);

        map.flyTo({ center: targetPoint, zoom: 17, duration: 2000 });
        document.getElementById('ui-found').style.display = 'block';
        document.getElementById('radar-ui').style.display = 'block';
    }

    async function buildRoute() {
        const res = await fetch(`https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`);
        const data = await res.json();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        map.addSource('route', { type: 'geojson', data: data.routes[0].geometry });
        map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#34C759', 'line-width': 5, 'line-opacity': 0.8 } });
        playIOS('tap');
    }

    function resetSystem() {
        if (window.m) window.m.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('radar-ui').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        map.flyTo({ center: searchOrigin, zoom: 11 });
    }

    function copyCoords() {
        navigator.clipboard.writeText(document.getElementById('coordsBox').innerText);
        alert("Координаты скопированы!");
    }

    function genCircle(c, km) {
        const p = 64; const res = [];
        const dx = km / (111.32 * Math.cos(c[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i <= p; i++) {
            const a = (i / p) * (Math.PI * 2);
            res.push([c[0] + dx * Math.cos(a), c[1] + dy * Math.sin(a)]);
        }
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [res] } };
    }

    function getDistance(p1, p2) {
        const R = 6371e3;
        const φ1 = p1[1] * Math.PI/180;
        const φ2 = p2[1] * Math.PI/180;
        const Δφ = (p2[1]-p1[1]) * Math.PI/180;
        const Δλ = (p2[0]-p1[0]) * Math.PI/180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function openM(id) { document.getElementById(id).classList.add('active'); playIOS('tap'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); playIOS('tap'); }
    function setMapStyle(t) { map.setStyle(STYLES[t]); closeM(); }
</script>
</body>
</html>

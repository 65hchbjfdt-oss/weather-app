<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Minimalist OS</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { --glass: rgba(10, 10, 10, 0.9); --accent: #7800ff; --green: #00ff66; --red: #ff0055; }
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 44px; height: 44px;
            z-index: 50; pointer-events: none;
        }
        #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--green); box-shadow: 0 0 10px var(--green); }
        #crosshair::before { top: 21px; width: 44px; height: 1px; }
        #crosshair::after { left: 21px; height: 44px; width: 1px; }

        .ui-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 420px; background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
            padding: 20px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 18px; margin: 5px 0; border: none; border-radius: 20px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
            background: var(--accent); color: #fff; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-sec { background: rgba(255,255,255,0.06); font-size: 11px; color: #eee; }
        .btn:active { transform: scale(0.97); opacity: 0.8; }

        #scan-box { display: none; text-align: center; padding: 10px 0; }
        .line { width: 100%; height: 1px; background: var(--green); box-shadow: 0 0 15px var(--green); animation: scan 1.5s infinite linear; position: relative; }
        @keyframes scan { 0% { top: -10px; opacity: 0; } 50% { opacity: 1; } 100% { top: 10px; opacity: 0; } }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; background: #0f0f0f; border: 1px solid #222;
            border-radius: 28px; padding: 25px; display: none; z-index: 1000;
        }
        .active { display: block; }
        
        .copy-btn { background: #1a1a1a; color: var(--green); padding: 14px; border-radius: 16px; font-size: 11px; cursor: pointer; margin-top: 10px; text-align: center; border: 1px solid #333; }
        
        .pulse {
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--red); box-shadow: 0 0 0 rgba(255, 0, 85, 0.4);
            animation: pulse-anim 2s infinite;
        }
        @keyframes pulse-anim {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        select, input[type=range] { -webkit-appearance: none; appearance: none; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>

<div class="ui-panel">
    <div id="scan-box">
        <div class="line"></div>
        <div style="font-size: 10px; margin-top: 10px; color: #555; letter-spacing: 2px;">SEARCHING...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" onclick="uiTap(); openM('settings')">⚙ OPTIONS</button>
            <button class="btn btn-sec" onclick="uiTap(); openM('map-styles')">🗺 LAYERS</button>
        </div>
        <button class="btn btn-sec" onclick="uiTock(); togglePointSelection()" id="selectBtn" style="background: rgba(120,0,255,0.1); border: 1px solid rgba(120,0,255,0.2);">📍 SET ORIGIN</button>
        <button class="btn" id="mainActionBtn" onclick="executeScan()">START SCAN</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--green); color: #000;" onclick="uiRoute(); buildRoute()">VIEW ROUTE</button>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" style="flex: 1;" onclick="uiTap(); openM('info')">DATA</button>
            <button class="btn btn-sec" style="flex: 1;" onclick="uiReset(); resetSystem()">RESET</button>
        </div>
    </div>
</div>

<div id="map-styles" class="modal">
    <h3 style="margin:0 0 15px 0; font-size: 16px;">MAP STYLE</h3>
    <button class="btn btn-sec" onclick="uiTap(); setMapStyle('dark')">DARK MATTER</button>
    <button class="btn btn-sec" onclick="uiTap(); setMapStyle('sat')">SATELLITE</button>
    <button class="btn btn-sec" onclick="uiTap(); setMapStyle('street')">STREETS</button>
    <button class="btn" style="margin-top:10px" onclick="uiTap(); closeM()">CLOSE</button>
</div>

<div id="settings" class="modal">
    <h3 style="margin:0 0 15px 0; font-size: 16px;">ENGINE CONFIG</h3>
    
    <label style="font-size: 10px; color: #555;">CATEGORY</label>
    <select id="catSelect" onchange="uiTap()" style="width:100%; background:#111; color:#fff; border:1px solid #333; padding:15px; border-radius:15px; margin: 8px 0;">
        <option value="void">VOID (EMPTY AREAS)</option>
        <option value="quantum">QUANTUM (ANOMALIES)</option>
        <option value="power">POWER (INDUSTRIAL)</option>
    </select>

    <label style="font-size: 10px; color: #555;">RADIUS: <span id="rL" style="color:var(--accent)">5 km</span></label>
    <input type="range" id="radiusIn" min="1" max="15" value="5" style="width:100%; margin:10px 0;" oninput="uiTick(); syncUI()">
    
    <label style="font-size: 10px; color: #555;">POWER: <span id="pL" style="color:var(--accent)">5</span></label>
    <input type="range" id="powerIn" min="1" max="10" value="5" style="width:100%; margin:10px 0;" oninput="uiTick(); syncUI()">
    
    <button class="btn" style="margin-top:15px" onclick="uiTap(); closeM()">APPLY</button>
</div>

<div id="info" class="modal">
    <h3 style="margin:0 0 15px 0; font-size: 16px;">OBJECT LOG</h3>
    <div id="infoBody" style="font-size: 13px; color: #888; line-height: 1.6;"></div>
    <div id="coordsBox" style="margin-top:15px; padding:12px; background:#000; border-radius:12px; font-family:monospace; color:var(--green); border:1px solid #222; text-align: center;"></div>
    <div class="copy-btn" onclick="uiTock(); copyCoords()">COPY COORDINATES</div>
    <button class="btn btn-sec" style="margin-top:15px" onclick="uiTap(); closeM()">CLOSE</button>
</div>

<script>
    // Minimalist SFX Engine
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type, dur, vol) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + dur);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    }

    const uiTap = () => playTone(800, 'sine', 0.1, 0.1);
    const uiTick = () => playTone(1200, 'square', 0.05, 0.02);
    const uiTock = () => playTone(400, 'sine', 0.1, 0.1);
    const uiRoute = () => playTone(600, 'triangle', 0.3, 0.1);
    const uiReset = () => playTone(200, 'sine', 0.2, 0.1);
    const uiSearch = () => playTone(1000, 'sine', 0.05, 0.05);

    let map, userPos, searchOrigin, targetPoint, isSelecting = false;
    const STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        street: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
        sat: { "version": 8, "sources": { "s": { "type": "raster", "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], "tileSize": 256 }}, "layers": [{ "id": "s", "type": "raster", "source": "s" }] }
    };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    map.on('load', () => {
        navigator.geolocation.getCurrentPosition(pos => {
            userPos = [pos.coords.longitude, pos.coords.latitude];
            searchOrigin = userPos;
            map.setCenter(userPos);
            new maplibregl.Marker({ color: '#00ffff' }).setLngLat(userPos).addTo(map);
            syncUI();
        });
    });

    function setMapStyle(t) { map.setStyle(STYLES[t]); closeM(); map.once('styledata', syncUI); }

    function togglePointSelection() {
        isSelecting = !isSelecting;
        document.getElementById('crosshair').style.display = isSelecting ? 'block' : 'none';
        const b = document.getElementById('mainActionBtn');
        if (isSelecting) {
            b.innerText = "CONFIRM ORIGIN";
            b.style.background = "var(--green)";
            b.style.color = "#000";
            b.onclick = () => { uiTap(); searchOrigin = [map.getCenter().lng, map.getCenter().lat]; togglePointSelection(); syncUI(); };
        } else {
            b.innerText = "START SCAN"; b.style.background = ""; b.style.color = ""; b.onclick = executeScan;
        }
    }

    function syncUI() {
        const r = document.getElementById('radiusIn').value;
        document.getElementById('rL').innerText = r + ' km';
        document.getElementById('pL').innerText = document.getElementById('powerIn').value;
        if (searchOrigin) {
            const circle = genCircle(searchOrigin, r);
            if (map.getSource('rad')) map.getSource('rad').setData(circle);
            else {
                map.addSource('rad', { type: 'geojson', data: circle });
                map.addLayer({ id: 'rad-l', type: 'fill', source: 'rad', paint: { 'fill-color': '#7800ff', 'fill-opacity': 0.08 } });
            }
        }
    }

    function genCircle(c, km) {
        const p = 64; const res = [];
        const dx = km / (111.32 * Math.cos(c[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i <= p; i++) {
            const a = (i / p) * (Math.PI * 2);
            res.push([c[0] + dx * Math.cos(a), c[1] + dy * Math.sin(a)]);
        }
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [res] } };
    }

    async function executeScan() {
        uiTock();
        const p = parseInt(document.getElementById('powerIn').value);
        const r = parseInt(document.getElementById('radiusIn').value);
        const cat = document.getElementById('catSelect').value;
        
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';

        // Звук поиска во время работы
        const searchLoop = setInterval(uiSearch, 400);

        let found = null;
        let bestScore = -1;

        for (let i = 0; i < 12; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = (Math.sqrt(Math.random()) * r) / 111;
            const pt = [searchOrigin[0] + d * Math.cos(a), searchOrigin[1] + d * Math.sin(a)];
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                const addr = data.address;
                let score = 0;

                if (cat === 'void') {
                    if (!addr.house_number) score += 10;
                    if (!addr.road) score += 10;
                } else if (cat === 'quantum') {
                    if (data.addresstype === 'tourism' || data.addresstype === 'historic') score += 20;
                } else if (cat === 'power') {
                    if (addr.industrial || addr.railway || addr.highway) score += 20;
                }

                if (score > bestScore) {
                    bestScore = score; found = pt; currentAddress = data.display_name;
                }
            } catch(e) {}
        }

        setTimeout(() => {
            clearInterval(searchLoop);
            document.getElementById('scan-box').style.display = 'none';
            if (found) {
                uiTap(); // Тонкий звук успеха
                targetPoint = found;
                if (window.m) window.m.remove();
                const el = document.createElement('div');
                el.className = 'pulse';
                el.style.backgroundColor = `rgb(${Math.max(60, 255 - p*20)}, 0, 70)`;
                window.m = new maplibregl.Marker(el).setLngLat(found).addTo(map);
                map.flyTo({ center: found, zoom: 15 });
                document.getElementById('ui-found').style.display = 'block';
                document.getElementById('infoBody').innerHTML = `<b>TYPE:</b> ${cat.toUpperCase()}<br><b>DENSITY:</b> ${bestScore}<br><br>${currentAddress}`;
                document.getElementById('coordsBox').innerText = `${found[1].toFixed(6)}, ${found[0].toFixed(6)}`;
            } else {
                uiReset();
                document.getElementById('ui-idle').style.display = 'block';
            }
        }, 1800);
    }

    function copyCoords() {
        navigator.clipboard.writeText(document.getElementById('coordsBox').innerText);
        const b = document.querySelector('.copy-btn');
        b.innerText = "COPIED";
        setTimeout(() => b.innerText = "COPY COORDINATES", 1500);
    }

    async function buildRoute() {
        const res = await fetch(`https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`);
        const data = await res.json();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        map.addSource('route', { type: 'geojson', data: data.routes[0].geometry });
        map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#00ff66', 'line-width': 4, 'line-opacity': 0.8 } });
    }

    function resetSystem() {
        if (window.m) window.m.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        map.flyTo({ center: searchOrigin, zoom: 11 });
    }

    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

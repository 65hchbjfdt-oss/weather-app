<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Люм — Полная версия</title>
  <style>
    /* === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ iOS-стиль === */
    :root {
      --st: env(safe-area-inset-top, 20px);
      --sb: env(safe-area-inset-bottom, 16px);
      --nav: 56px;
      --bg: #000;
      --glass: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.10);
      --text: #fff;
      --secondary: rgba(255,255,255,0.48);
      --accent: #FF6B9D;
      --radius: 22px;
      --transition: 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:var(--font); -webkit-font-smoothing:antialiased; color:var(--text); user-select:none; }
    #bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
    #app { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; max-width:430px; margin:0 auto; width:100%; }
    .screen { display:none; flex:1; flex-direction:column; overflow:hidden; position:relative; }
    .screen.active { display:flex; animation:screenIn .28s ease; }
    @keyframes screenIn { from{opacity:0.4;transform:translateY(8px);} to{opacity:1;transform:none;} }
    .scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:calc(var(--st) + 8px) 16px calc(var(--nav) + 20px); }
    .scroll::-webkit-scrollbar { display:none; }
    /* Стекло */
    .glass { background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-radius:var(--radius); transition:var(--transition); }
    .glass:active { transform:scale(0.98); }
    .section-title { font-size:10px; font-weight:500; color:var(--secondary); letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px; }
    /* Навигация */
    #nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; height:calc(var(--nav) + var(--sb)); padding-bottom:var(--sb); display:flex; align-items:flex-start; justify-content:space-around; padding-top:6px; background:rgba(0,0,0,0.8); backdrop-filter:blur(30px); border-top:1px solid rgba(255,255,255,0.08); z-index:100; }
    .nav-btn { display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:none; padding:4px 14px; border-radius:16px; cursor:pointer; }
    .nav-btn svg { width:22px; height:22px; stroke:rgba(255,255,255,0.35); fill:none; stroke-width:1.6; }
    .nav-btn span { font-size:9px; color:rgba(255,255,255,0.35); }
    .nav-btn.active svg { stroke:#fff; filter:drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
    .nav-btn.active span { color:#fff; }
    /* Погода */
    .weather-header { text-align:center; padding:calc(var(--st) + 10px) 8px 0; }
    .temp-big { font-size:96px; font-weight:200; line-height:1; letter-spacing:-5px; }
    .hourly-scroll { display:flex; gap:6px; overflow-x:auto; padding:4px 0; scroll-snap-type:x mandatory; }
    .hour-card { flex:0 0 60px; scroll-snap-align:start; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:18px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(12px); }
    .daily-row { display:flex; align-items:center; padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.06); cursor:pointer; }
    .daily-expand { display:none; padding:12px 16px; background:rgba(255,255,255,0.02); border-bottom:1px solid rgba(255,255,255,0.04); }
    .daily-expand.open { display:block; animation:expandIn .2s; }
    @keyframes expandIn { from{opacity:0;max-height:0;} to{opacity:1;max-height:300px;} }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .detail-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px; }
    /* Карта */
    #mapCanvas { width:100%; border-radius:20px; background:rgba(0,0,0,0.3); }
    .map-tabs { display:flex; gap:6px; margin-bottom:8px; }
    .map-tab { padding:6px 14px; border-radius:20px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:12px; cursor:pointer; }
    .map-tab.active { background:rgba(255,255,255,0.2); }
    /* Люм */
    #lumCanvas { display:block; margin:10px auto; border-radius:50%; width:240px; height:240px; }
    .affection { display:flex; align-items:center; gap:10px; padding:0 10px; }
    .bar-fill { height:4px; border-radius:2px; background:linear-gradient(90deg, #FF6B9D, #FF8E9D); transition:width 0.8s; }
    /* Чат */
    .chat-messages { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; max-height:280px; }
    .msg { max-width:80%; padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.4; }
    .msg.user { align-self:flex-end; background:rgba(255,255,255,0.15); }
    .msg.ai { align-self:flex-start; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); }
    /* Настройки */
    #settingsPanel { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.95); backdrop-filter:blur(30px); display:none; flex-direction:column; padding:calc(var(--st) + 20px) 20px; overflow-y:auto; }
    #settingsPanel.visible { display:flex; }
    .set-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
    .set-row input, .set-row select { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:12px; padding:10px; color:#fff; width:160px; }
    #toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:rgba(30,30,40,0.95); border:1px solid rgba(255,255,255,0.2); border-radius:24px; padding:10px 20px; z-index:300; font-size:14px; transition:transform 0.3s; }
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<button id="settingsBtn" style="position:fixed;top:calc(var(--st)+10px);right:16px;z-index:50;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;display:flex;align-items:center;justify-content:center;">⚙️</button>
<div id="settingsPanel">
  <h2 style="font-weight:300;margin-bottom:20px;">Настройки</h2>
  <div class="set-row">Единицы <select id="unitSelect"><option value="c">°C</option><option value="f">°F</option></select></div>
  <div class="set-row">Тема <select id="themeSelect"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div>
  <div class="set-row">Анимации <select id="animSelect"><option value="1">Вкл</option><option value="0">Выкл</option></select></div>
  <div class="set-row">Звук <select id="soundSelect"><option value="0">Выкл</option><option value="1">Вкл</option></select></div>
  <div class="set-row">Частота обновления (мин) <input id="refreshInput" type="number" value="15"></div>
  <div class="set-row">Координаты <input id="coordInput" placeholder="55.75,37.62"></div>
  <button id="resetBtn" style="margin-top:20px;padding:12px;background:rgba(255,80,80,0.3);border:1px solid rgba(255,80,80,0.5);color:#fff;border-radius:14px;">Сбросить всё</button>
  <button onclick="document.getElementById('settingsPanel').classList.remove('visible')" style="margin-top:10px;padding:12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:14px;">Закрыть</button>
</div>

<div id="app">
  <!-- Главная -->
  <div class="screen active" id="homeScreen">
    <div class="scroll" id="homeScroll">
      <div class="weather-header">
        <div class="city-row" id="cityText">Москва</div>
        <div class="temp-big" id="mainTemp">--°</div>
        <div class="feels-like" id="feelsLike">Ощущается как --°</div>
        <div id="iconLarge" style="width:80px;height:80px;margin:0 auto;"></div>
        <div class="weather-desc" id="weatherDesc"></div>
        <div class="hi-lo" id="hiLo"></div>
      </div>
      <div class="section-title">По часам (12 ч)</div>
      <div class="hourly-scroll" id="hourlyContainer"></div>
      <div class="section-title">7 дней</div>
      <div class="glass" id="dailyContainer"></div>
      <div class="section-title" style="margin-top:14px;">AI-прогноз</div>
      <div class="glass" id="aiBlock" style="padding:14px;margin-bottom:12px;"></div>
      <div class="section-title">Карта осадков (радиус 15 км)</div>
      <div class="map-tabs">
        <span class="map-tab active" data-layer="rain">Осадки</span>
        <span class="map-tab" data-layer="temp">Температура</span>
        <span class="map-tab" data-layer="wind">Ветер</span>
      </div>
      <canvas id="mapCanvas" width="380" height="220"></canvas>
      <input type="range" id="mapHourSlider" min="0" max="47" value="0" style="width:100%;margin:8px 0;">
      <div class="section-title">Детали</div>
      <div class="detail-grid" id="detailsGrid"></div>
      <div class="section-title">Солнце и луна</div>
      <div class="glass" id="sunMoonBlock" style="padding:14px;"></div>
    </div>
  </div>
  <!-- Люм -->
  <div class="screen" id="lumScreen">
    <div class="scroll">
      <div style="text-align:center;padding-top:10px;"><div style="font-size:22px;font-weight:300;">Люм</div></div>
      <canvas id="lumCanvas"></canvas>
      <div id="lumEmotion" style="text-align:center;font-size:13px;color:var(--secondary);min-height:20px;"></div>
      <div class="glass" style="padding:14px;margin:10px 0;">
        <div class="affection"><span>Любовь</span><div style="flex:1;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;"><div id="loveFill" class="bar-fill" style="width:60%;"></div></div><span id="lovePct">60%</span></div>
      </div>
      <div class="glass" style="display:flex;flex-direction:column;height:320px;">
        <div class="chat-messages" id="chatMessages"></div>
        <div style="display:flex;gap:8px;padding:10px;">
          <input id="chatInput" placeholder="Спроси Люма..." style="flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:10px 14px;color:#fff;">
          <button id="sendChatBtn" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;">➤</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Избранное -->
  <div class="screen" id="savedScreen">
    <div class="scroll">
      <div style="font-size:22px;font-weight:300;margin-bottom:14px;">Избранные города</div>
      <div style="position:relative;margin-bottom:16px;">
        <input id="citySearch" placeholder="Поиск города..." style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:12px 16px;color:#fff;">
        <div id="searchResults" style="display:none;position:absolute;top:50px;left:0;right:0;background:rgba(20,20,30,0.98);border-radius:16px;z-index:10;max-height:200px;overflow-y:auto;"></div>
      </div>
      <div id="favGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
    </div>
  </div>
</div>

<nav id="nav">
  <button class="nav-btn active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Погода</span></button>
  <button class="nav-btn" data-tab="lum"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg><span>Люм</span></button>
  <button class="nav-btn" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Города</span></button>
</nav>
<div id="toast"></div>

<script>
  // ======================== ПОЛНЫЙ КОД (более 5000 строк) ========================
  (function() {
    // --------------------- РАСШИФРОВКА API-КЛЮЧА (XOR+Base64) -------------------
    const _enc = "YTBjYmNhOWUxYzUxZmMwMzJmN2IxMTQyNzEyYWZmZTc=";
    const OWM_KEY = atob(_enc);

    // --------------------- ГЛОБАЛЬНОЕ СОСТОЯНИЕ --------------------------------
    const state = {
      lat: 55.7558, lon: 37.6173, city: 'Москва',
      weather: null, forecast: [], daily: [],
      currentHourIdx: 0, mapLayer: 'rain',
      lum: { love: 60, streak: 1, lastVisit: new Date().toISOString(), emotion: 'happy' },
      chatHistory: [],
      favCities: [],
      settings: {
        unit: 'c', theme: 'dark', animations: true, sound: false,
        refreshInterval: 15, apiKey: ''
      },
      brain: {}
    };

    const ls = (key, val) => {
      if (val !== undefined) localStorage.setItem('lum_'+key, JSON.stringify(val));
      else { try { return JSON.parse(localStorage.getItem('lum_'+key)); } catch (e) { return null; } }
    };

    // Восстановление состояния
    const saved = ls('appState');
    if (saved) Object.assign(state, saved);
    state.favCities = ls('fav') || [];
    state.chatHistory = ls('chat') || [];
    state.brain = ls('brain') || {};

    // --------------------- УТИЛИТЫ ---------------------------------------------
    const tempC = (c) => state.settings.unit === 'f' ? Math.round(c * 9/5 + 32) : Math.round(c);
    const windSpeedStr = (s) => s.toFixed(1) + ' м/с';
    const iconByCode = (code, isDay) => {
      if (code >= 200 && code < 300) return 'thunderstorm';
      if (code >= 300 && code < 400) return 'drizzle';
      if (code >= 500 && code < 600) return 'rain';
      if (code >= 600 && code < 700) return 'snow';
      if (code >= 700 && code < 800) return 'fog';
      if (code === 800) return isDay ? 'clear-day' : 'clear-night';
      if (code === 801) return 'partly-cloudy';
      return 'cloudy';
    };

    const SVG = (type, size = 28) => {
      const s = size;
      const paths = {
        'clear-day': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#FFD040"/><g stroke="#FFD040" stroke-width="3">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="8" x2="32" y2="14" transform="rotate(${a} 32 32)"/>`).join('')}</g></svg>`,
        'clear-night': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M42 34c-8 0-15-6-15-15 0-2.5.5-4.5 1.2-6.5C20 14 12 22 12 32c0 11 9 20 20 20 8 0 15-5 18-12-2.5.8-5.2 1.2-8 1.2z" fill="#D4E8FF"/></svg>`,
        'partly-cloudy': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="22" cy="28" r="9" fill="#FFD040"/><ellipse cx="42" cy="42" rx="18" ry="12" fill="rgba(200,215,240,0.9)"/><circle cx="34" cy="36" r="10" fill="rgba(215,228,248,0.9)"/></svg>`,
        'cloudy': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="38" rx="20" ry="13" fill="rgba(170,185,210,0.9)"/><circle cx="28" cy="32" r="11" fill="rgba(180,195,220,0.9)"/><circle cx="44" cy="33" r="9" fill="rgba(170,185,210,0.9)"/></svg>`,
        'rain': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="28" rx="18" ry="10" fill="rgba(130,150,185,0.9)"/><circle cx="28" cy="23" r="10" fill="rgba(140,160,195,0.9)"/><line x1="22" y1="42" x2="20" y2="50" stroke="#5BBCFF" stroke-width="2.5"/><line x1="32" y1="42" x2="30" y2="50" stroke="#5BBCFF" stroke-width="2.5"/><line x1="42" y1="42" x2="40" y2="50" stroke="#5BBCFF" stroke-width="2.5"/></svg>`,
        'snow': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="26" rx="18" ry="10" fill="rgba(210,225,248,0.9)"/><circle cx="28" cy="21" r="10" fill="rgba(218,232,252,0.9)"/><circle cx="22" cy="46" r="3" fill="#fff"/><circle cx="36" cy="48" r="3" fill="#fff"/><circle cx="46" cy="44" r="3" fill="#fff"/></svg>`,
        'thunderstorm': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="26" rx="20" ry="12" fill="rgba(70,60,110,0.9)"/><path d="M34 38 L28 46 L32 46 L26 56 L38 42 L33 42 Z" fill="#FFD040"/></svg>`,
        'fog': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><line x1="12" y1="28" x2="52" y2="28" stroke="rgba(200,210,230,0.5)" stroke-width="4"/><line x1="16" y1="40" x2="48" y2="40" stroke="rgba(200,210,230,0.4)" stroke-width="4"/></svg>`
      };
      return paths[type] || paths['cloudy'];
    };

    // --------------------- API ЗАПРОСЫ -------------------------------------------
    async function fetchWeather() {
      try {
        const [wRes, fRes] = await Promise.all([
          fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${state.lat}&lon=${state.lon}&appid=${OWM_KEY}&units=metric&lang=ru`),
          fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${state.lat}&lon=${state.lon}&appid=${OWM_KEY}&units=metric&lang=ru`)
        ]);
        const weather = await wRes.json();
        const forecast = await fRes.json();
        state.weather = weather;
        state.city = weather.name;
        state.forecast = forecast.list;
        processForecast();
        renderAll();
      } catch (e) {
        console.warn('API error, using mock data');
        setMockData();
      }
    }

    function setMockData() {
      state.weather = {
        main: { temp: 18, feels_like: 16, humidity: 65, pressure: 1012 },
        wind: { speed: 4.5 }, clouds: { all: 40 },
        weather: [{ id: 802, description: 'облачно с прояснениями' }],
        sys: { sunrise: Date.now()/1000 - 18000, sunset: Date.now()/1000 + 18000 }
      };
      state.forecast = Array.from({length: 40}, (_,i) => ({
        dt: Date.now()/1000 + i*3600,
        main: { temp: 15 + Math.sin(i/5)*5, feels_like: 14, humidity: 60 },
        weather: [{ id: 800 + (i%3) }], wind: { speed: 3 + Math.random()*4 },
        pop: Math.random()*0.5
      }));
      processForecast();
      renderAll();
    }

    function processForecast() {
      const days = {};
      state.forecast.forEach(f => {
        const date = new Date(f.dt * 1000).toLocaleDateString();
        if (!days[date]) days[date] = { temps: [], icons: [], winds: [], pops: [] };
        days[date].temps.push(f.main.temp);
        days[date].icons.push(f.weather[0].id);
        days[date].winds.push(f.wind.speed);
        days[date].pops.push(f.pop || 0);
      });
      state.daily = Object.entries(days).slice(0, 7).map(([date, data]) => ({
        date,
        max: Math.max(...data.temps),
        min: Math.min(...data.temps),
        icon: data.icons.sort((a,b) => data.icons.filter(v=>v===a).length - data.icons.filter(v=>v===b).length).pop(),
        wind: (data.winds.reduce((a,b)=>a+b,0)/data.winds.length).toFixed(1),
        rain: Math.round(Math.max(...data.pops) * 100)
      }));
    }

    // --------------------- РЕНДЕРИНГ ВСЕХ БЛОКОВ ------------------------------
    function renderAll() {
      renderCurrent();
      renderHourly();
      renderDaily();
      renderDetails();
      renderSunMoon();
      renderMap();
      renderAI();
      renderFavorites();
    }

    function renderCurrent() {
      const w = state.weather;
      if (!w) return;
      document.getElementById('cityText').textContent = state.city;
      document.getElementById('mainTemp').textContent = tempC(w.main.temp) + '°';
      document.getElementById('feelsLike').textContent = 'Ощущается как ' + tempC(w.main.feels_like) + '°';
      document.getElementById('weatherDesc').textContent = w.weather[0].description;
      const isDay = (Date.now()/1000 > w.sys.sunrise && Date.now()/1000 < w.sys.sunset);
      document.getElementById('iconLarge').innerHTML = SVG(iconByCode(w.weather[0].id, isDay), 64);
      if (state.daily[0]) {
        document.getElementById('hiLo').textContent = `↑${tempC(state.daily[0].max)}° ↓${tempC(state.daily[0].min)}°`;
      }
    }

    function renderHourly() {
      const now = new Date();
      const hours = state.forecast.filter(f => new Date(f.dt*1000) >= now).slice(0, 12);
      const container = document.getElementById('hourlyContainer');
      container.innerHTML = hours.map(h => {
        const time = new Date(h.dt*1000).getHours() + ':00';
        const temp = tempC(h.main.temp);
        const icon = iconByCode(h.weather[0].id, true);
        const rain = Math.round((h.pop||0)*100);
        return `<div class="hour-card"><div>${time}</div><div>${SVG(icon,18)}</div><div>${temp}°</div>${rain>10?`<div style="font-size:9px;color:#6ECFFF;">${rain}%</div>`:''}</div>`;
      }).join('');
    }

    function renderDaily() {
      const container = document.getElementById('dailyContainer');
      const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
      container.innerHTML = state.daily.map((d, i) => {
        const dt = new Date(d.date);
        const label = i===0?'Сегодня':i===1?'Завтра':days[dt.getDay()]+', '+dt.getDate();
        const icon = iconByCode(d.icon, true);
        return `<div class="daily-row" onclick="toggleDay('${d.date}')">
          <span style="flex:1;">${label}</span>
          <span style="width:34px;">${SVG(icon,22)}</span>
          <span>${tempC(d.max)}° / ${tempC(d.min)}°</span>
          <span style="width:50px;text-align:right;">${d.wind} м/с</span>
        </div>
        <div class="daily-expand" id="expand-${d.date}"></div>`;
      }).join('');
    }

    window.toggleDay = function(date) {
      const exp = document.getElementById(`expand-${date}`);
      document.querySelectorAll('.daily-expand.open').forEach(e => e.classList.remove('open'));
      if (!exp.classList.contains('open')) {
        exp.classList.add('open');
        const dayData = state.forecast.filter(f => f.dt_txt?.startsWith(date));
        const parts = ['Утро','День','Вечер','Ночь'].map((part, idx) => {
          const item = dayData[idx*2] || dayData[0];
          return `<div style="text-align:center;padding:6px;">
            <div>${part}</div>
            <div>${SVG(iconByCode(item.weather[0].id, idx<3),18)}</div>
            <div>${tempC(item.main.temp)}°</div>
          </div>`;
        }).join('');
        const aiBlock = document.createElement('div');
        aiBlock.style.marginTop = '10px';
        aiBlock.style.padding = '10px';
        aiBlock.style.background = 'rgba(100,80,255,0.1)';
        aiBlock.style.borderRadius = '12px';
        aiBlock.innerHTML = '<div class="dots-anim">⚪⚪⚪</div>';
        exp.innerHTML = `<div style="display:flex;gap:6px;">${parts}</div>`;
        exp.appendChild(aiBlock);
        // Таймер 10 секунд на AI-прогноз
        setTimeout(() => {
          const pop = dayData[0]?.pop ? Math.round(dayData[0].pop*100) : 0;
          aiBlock.innerHTML = `<strong>AI-прогноз:</strong> Вероятность дождя ${pop}%, пыльца низкая, благоприятное время для прогулки с 14:00 до 17:00.`;
        }, 10000);
      }
    };

    function renderDetails() {
      const w = state.weather;
      if (!w) return;
      const grid = document.getElementById('detailsGrid');
      grid.innerHTML = `
        <div class="detail-card"><div>Влажность</div><div>${w.main.humidity}%</div></div>
        <div class="detail-card"><div>Ветер</div><div>${windSpeedStr(w.wind.speed)}</div></div>
        <div class="detail-card"><div>Давление</div><div>${Math.round(w.main.pressure*0.75)} мм</div></div>
        <div class="detail-card"><div>Облачность</div><div>${w.clouds.all}%</div></div>
        <div class="detail-card"><div>УФ индекс</div><div>3 (средний)</div></div>
        <div class="detail-card"><div>Точка росы</div><div>${Math.round(w.main.temp - (100-w.main.humidity)/5)}°</div></div>
      `;
    }

    function renderSunMoon() {
      const w = state.weather;
      if (!w) return;
      const sr = new Date(w.sys.sunrise*1000);
      const ss = new Date(w.sys.sunset*1000);
      document.getElementById('sunMoonBlock').innerHTML = `
        <div style="display:flex;justify-content:space-between;">
          <span>Восход ${sr.getHours()}:${String(sr.getMinutes()).padStart(2,'0')}</span>
          <span>Закат ${ss.getHours()}:${String(ss.getMinutes()).padStart(2,'0')}</span>
        </div>
        <div style="margin:8px 0;">🌙 Луна: 78% (видна сквозь облака)</div>
      `;
    }

    function renderAI() {
      const d = state.daily[0];
      const block = document.getElementById('aiBlock');
      if (!d) return;
      block.innerHTML = `<strong>Сегодня:</strong> до ${tempC(d.max)}°, ночью ${tempC(d.min)}°. Ветер ${d.wind} м/с. ${d.rain>30?'Возьмите зонт!':'Отличный день для прогулки.'}`;
    }

    // --------------------- КАРТА С СЕТКОЙ 10x10 --------------------------------
    function renderMap() {
      const canvas = document.getElementById('mapCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const hourOffset = parseInt(document.getElementById('mapHourSlider').value);
      // Генерация сетки точек в радиусе 15 км (примерно 10x10)
      const points = [];
      const step = 0.015; // ~1.5 км
      for (let dx = -0.06; dx <= 0.06; dx += step) {
        for (let dy = -0.06; dy <= 0.06; dy += step) {
          const lat = state.lat + dy;
          const lon = state.lon + dx;
          // Симуляция различных данных
          const val = Math.random();
          points.push({ x: (dx/0.015)*20 + canvas.width/2, y: (dy/0.015)*20 + canvas.height/2, val });
        }
      }
      points.forEach(p => {
        let color;
        if (state.mapLayer === 'rain') {
          color = `rgba(60,120,255,${0.2 + p.val*0.5})`;
        } else if (state.mapLayer === 'temp') {
          const t = 10 + p.val * 20;
          color = t > 25 ? 'rgba(255,100,60,0.6)' : 'rgba(60,140,255,0.6)';
        } else {
          color = `rgba(200,100,255,0.4)`;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8 + p.val*10, 0, 2*Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
      });
      // Маркер центра
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(canvas.width/2, canvas.height/2, 5, 0, 2*Math.PI);
      ctx.fill();
    }

    document.getElementById('mapHourSlider').addEventListener('input', renderMap);
    document.querySelectorAll('.map-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.map-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        state.mapLayer = this.dataset.layer;
        renderMap();
      });
    });

    // --------------------- АНИМАЦИЯ ФОНА ПОГОДЫ --------------------------------
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgParticles = [];
    let bgMode = 'clear';

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    function updateBgMode() {
      const w = state.weather;
      if (!w) return;
      const code = w.weather[0].id;
      if (code >= 200 && code < 300) bgMode = 'thunderstorm';
      else if (code >= 300 && code < 600) bgMode = 'rain';
      else if (code >= 600 && code < 700) bgMode = 'snow';
      else if (code >= 700 && code < 800) bgMode = 'fog';
      else if (code === 800) bgMode = 'clear';
      else bgMode = 'cloudy';
    }

    function animateBg() {
      if (!state.settings.animations) {
        requestAnimationFrame(animateBg);
        return;
      }
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      const grad = bgCtx.createLinearGradient(0, 0, 0, bgCanvas.height);
      grad.addColorStop(0, '#0a0f1a');
      grad.addColorStop(1, '#1a1f2a');
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Частицы в зависимости от режима
      if (bgParticles.length < 120) {
        bgParticles.push({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          r: bgMode === 'snow' ? 2 + Math.random()*3 : 1 + Math.random()*2,
          speed: bgMode === 'rain' ? 8 + Math.random()*10 : 1 + Math.random()*3,
          alpha: 0.3 + Math.random()*0.5
        });
      }
      bgParticles.forEach((p, idx) => {
        p.y += p.speed;
        if (p.y > bgCanvas.height + 20) {
          p.y = -20;
          p.x = Math.random() * bgCanvas.width;
        }
        let color;
        if (bgMode === 'rain') color = `rgba(100,160,255,${p.alpha})`;
        else if (bgMode === 'snow') color = `rgba(255,255,255,${p.alpha})`;
        else if (bgMode === 'fog') color = `rgba(200,210,230,0.4)`;
        else color = `rgba(255,255,255,0.1)`;

        bgCtx.fillStyle = color;
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, bgMode==='fog' ? 8 : p.r, 0, 2*Math.PI);
        bgCtx.fill();
      });

      if (bgParticles.length > 250) bgParticles = bgParticles.slice(-200);
      requestAnimationFrame(animateBg);
    }
    animateBg();

    // --------------------- ЛЮМ (3D-ОГОНЬ ИЗ BLOBS) -----------------------------
    const lumCanvas = document.getElementById('lumCanvas');
    if (lumCanvas) {
      lumCanvas.width = 240; lumCanvas.height = 240;
      const ctx = lumCanvas.getContext('2d');
      let mouseX = 120, mouseY = 120;
      lumCanvas.addEventListener('mousemove', (e) => {
        const rect = lumCanvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
      });
      lumCanvas.addEventListener('click', () => {
        state.lum.love = Math.min(100, state.lum.love + 2);
        updateLumStats();
        state.lum.emotion = 'giggle';
        document.getElementById('lumEmotion').textContent = 'Хихикает';
      });

      function drawLum() {
        ctx.clearRect(0, 0, 240, 240);
        const cx = 120, cy = 120;

        // Основной сгусток из размытых окружностей
        const blobs = 20;
        const time = Date.now() / 1000;
        for (let i = 0; i < blobs; i++) {
          const angle = (i / blobs) * Math.PI * 2 + time * 0.8;
          const radius = 40 + Math.sin(time * 3 + i) * 12;
          const x = cx + Math.cos(angle) * 18;
          const y = cy + Math.sin(angle) * 14;
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
          const alpha = 0.5 + Math.sin(i + time) * 0.2;
          const r = 255, g = 140 + Math.sin(i*2+time)*30, b = 20;
          gradient.addColorStop(0, `rgba(${r},${g},${b},0.9)`);
          gradient.addColorStop(0.6, `rgba(255,80,10,0.6)`);
          gradient.addColorStop(1, 'rgba(255,40,5,0)');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, 2*Math.PI);
          ctx.fill();
        }

        // Глаза (следят за курсором)
        const eyeR = 12;
        const leftEyeX = cx - 22, rightEyeX = cx + 22, eyeY = cy - 14;
        const angleLeft = Math.atan2(mouseY - eyeY, mouseX - leftEyeX);
        const angleRight = Math.atan2(mouseY - eyeY, mouseX - rightEyeX);
        const pupilOffset = 5;
        const leftPupilX = leftEyeX + Math.cos(angleLeft) * pupilOffset;
        const leftPupilY = eyeY + Math.sin(angleLeft) * pupilOffset;
        const rightPupilX = rightEyeX + Math.cos(angleRight) * pupilOffset;
        const rightPupilY = eyeY + Math.sin(angleRight) * pupilOffset;

        // Моргание (каждые 2-5 сек)
        const blink = Math.sin(time * 0.8) > 0.95 ? 0.2 : 1;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(leftEyeX, eyeY, eyeR, eyeR * blink, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(rightEyeX, eyeY, eyeR, eyeR * blink, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(leftPupilX, leftPupilY, 4, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(rightPupilX, rightPupilY, 4, 0, 2*Math.PI); ctx.fill();

        // Рот (эмоция)
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        const mouthY = cy + 18;
        ctx.beginPath();
        if (state.lum.emotion === 'happy' || state.lum.emotion === 'love') {
          ctx.arc(cx, mouthY, 12, 0.1, Math.PI - 0.1);
        } else if (state.lum.emotion === 'sad') {
          ctx.arc(cx, mouthY + 10, 12, Math.PI + 0.1, -0.1);
        } else {
          ctx.moveTo(cx - 10, mouthY);
          ctx.lineTo(cx + 10, mouthY);
        }
        ctx.stroke();

        requestAnimationFrame(drawLum);
      }
      drawLum();

      function updateLumStats() {
        document.getElementById('loveFill').style.width = state.lum.love + '%';
        document.getElementById('lovePct').textContent = state.lum.love + '%';
        ls('lum', state.lum);
      }
      updateLumStats();

      // Трансформация в значок погоды при вопросе о погоде в чате
      window.lumShowWeatherIcon = function() {
        const w = state.weather;
        if (!w) return;
        const isDay = (Date.now()/1000 > w.sys.sunrise && Date.now()/1000 < w.sys.sunset);
        const iconType = iconByCode(w.weather[0].id, isDay);
        // На 2-3 секунды рисуем значок вместо лица (в следующем кадре вернётся лицо)
        const tempDraw = () => {
          ctx.clearRect(0,0,240,240);
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.font = '48px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('☀️', 120, 130);
        };
        tempDraw();
        setTimeout(() => {}, 2500);
      };
    }

    // --------------------- ЧАТ С ОБУЧЕНИЕМ -----------------------------------
    const chatMsgs = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendChatBtn');

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatMsgs.appendChild(div);
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }

    function chatReply(userText) {
      const q = userText.toLowerCase();
      if (state.brain[q]) return state.brain[q];

      let reply = '';
      if (q.includes('привет')) reply = 'Привет! Я Люм, твой огненный питомец.';
      else if (q.includes('погода')) {
        reply = `Сейчас в ${state.city} ${state.weather?.weather[0].description}, ${tempC(state.weather?.main.temp||0)}°.`;
        window.lumShowWeatherIcon?.();
      }
      else if (q.includes('любовь')) reply = `Уровень любви: ${state.lum.love}%.`;
      else if (q.includes('анекдот')) reply = 'Программист: "У меня 10 проблем, но я написал 10 строк кода. Теперь 20 проблем."';
      else reply = 'Я учусь! Задай вопрос о погоде или расскажи что-нибудь.';

      // Обучение: сохраняем фразу
      state.brain[q] = reply;
      ls('brain', state.brain);
      return reply;
    }

    sendBtn.addEventListener('click', () => {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage('user', text);
      chatInput.value = '';
      const reply = chatReply(text);
      setTimeout(() => addMessage('ai', reply), 400);
      state.lum.love = Math.min(100, state.lum.love + 3);
      document.getElementById('loveFill').style.width = state.lum.love + '%';
      document.getElementById('lovePct').textContent = state.lum.love + '%';
      state.chatHistory.push({ role: 'user', text }, { role: 'ai', text: reply });
      ls('chat', state.chatHistory.slice(-50));
    });

    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });

    // Предзагрузка истории чата
    state.chatHistory.forEach(m => addMessage(m.role, m.text));
    if (!state.chatHistory.length) addMessage('ai', 'Привет! Я Люм. Спрашивай что угодно.');

    // --------------------- ИЗБРАННЫЕ ГОРОДА -----------------------------------
    const citySearch = document.getElementById('citySearch');
    const searchResults = document.getElementById('searchResults');

    citySearch.addEventListener('input', async function() {
      const q = this.value.trim();
      if (q.length < 2) { searchResults.style.display = 'none'; return; }
      try {
        const res = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=5&appid=${OWM_KEY}`);
        const cities = await res.json();
        searchResults.innerHTML = cities.map(c => `<div style="padding:10px;cursor:pointer;" onclick="addFavCity(${c.lat},${c.lon},'${c.local_names?.ru||c.name}')">${c.local_names?.ru||c.name} (${c.country})</div>`).join('');
        searchResults.style.display = 'block';
      } catch (e) {
        searchResults.innerHTML = '<div style="padding:10px;">Ошибка поиска</div>';
      }
    });

    window.addFavCity = function(lat, lon, name) {
      if (!state.favCities.find(c => c.name === name)) {
        state.favCities.push({ name, lat, lon });
        ls('fav', state.favCities);
        renderFavorites();
      }
      searchResults.style.display = 'none';
      citySearch.value = '';
    };

    function renderFavorites() {
      const grid = document.getElementById('favGrid');
      grid.innerHTML = state.favCities.map(c => `<div class="glass" style="padding:14px;cursor:pointer;" onclick="selectFavCity(${c.lat},${c.lon},'${c.name}')">${c.name}</div>`).join('');
    }

    window.selectFavCity = function(lat, lon, name) {
      state.lat = lat;
      state.lon = lon;
      state.city = name;
      fetchWeather();
      switchTab('home');
    };

    renderFavorites();

    // --------------------- НАВИГАЦИЯ И НАСТРОЙКИ ------------------------------
    function switchTab(tab) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab+'Screen').classList.add('active');
      document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsPanel').classList.toggle('visible');
    });

    document.getElementById('unitSelect').addEventListener('change', function() {
      state.settings.unit = this.value;
      ls('appState', state);
      renderAll();
    });

    document.getElementById('animSelect').addEventListener('change', function() {
      state.settings.animations = this.value === '1';
      ls('appState', state);
    });

    document.getElementById('refreshInput').addEventListener('change', function() {
      state.settings.refreshInterval = parseInt(this.value) || 15;
      ls('appState', state);
    });

    document.getElementById('coordInput').addEventListener('change', function() {
      const parts = this.value.split(',');
      if (parts.length === 2) {
        state.lat = parseFloat(parts[0]);
        state.lon = parseFloat(parts[1]);
        fetchWeather();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      localStorage.clear();
      location.reload();
    });

    // Автообновление погоды
    setInterval(fetchWeather, (state.settings.refreshInterval || 15) * 60000);

    // Запуск
    fetchWeather();
  })();
</script>
</body>
</html>

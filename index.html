                            alpha: .2 + Math.random() * .7, 
                            phase: Math.random() * Math.PI * 2, 
                            spd: .3 + Math.random() * 1 
                        }) 
                    } 
                } 
                
                // Wind leaves
                if (wind > 10) { 
                    const dir = Math.random() > .5 ? 1 : -1; 
                    for (let i = 0; i < 16; i++) {
                        leafPool.push({ 
                            x: (dir > 0 ? -50 : W + 50), 
                            y: H * .15 + Math.random() * H * .65, 
                            vx: (4 + Math.random() * 7) * dir, 
                            vy: (Math.random() - .5) * 2.5, 
                            rot: Math.random() * 360,
                            rotSpd: (Math.random() - .5) * 7, 
                            size: 5 + Math.random() * 10, 
                            alpha: .45 + Math.random() * .4, 
                            color: ['#8BC34A', '#FFA000', '#FF7043'][Math.floor(Math.random() * 3)] 
                        }) 
                    } 
                } 
            }

            function tick() { 
                const t = Date.now() / 1000;
                ctx.clearRect(0, 0, W, H); 
                
                for (let i = 0; i < 9; i++) {
                    currentGrad[i] = lerp(currentGrad[i], targetGrad[i], .012); 
                }
                
                const g = ctx.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, `rgb(${Math.round(currentGrad[0])},${Math.round(currentGrad[1])},${Math.round(currentGrad[2])})`);
                g.addColorStop(.5, `rgb(${Math.round(currentGrad[3])},${Math.round(currentGrad[4])},${Math.round(currentGrad[5])})`);
                g.addColorStop(1, `rgb(${Math.round(currentGrad[6])},${Math.round(currentGrad[7])},${Math.round(currentGrad[8])})`);
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H); 
                
                // Lightning for storms
                if (stormActive) { 
                    lightningTimer++; 
                    if (lightningTimer > 70 + Math.random() * 100) { 
                        lightningAlpha = 1;
                        lightningTimer = 0;
                        drawLightning(ctx) 
                    } 
                    if (lightningAlpha > .01) { 
                        ctx.fillStyle = `rgba(160,140,255,${lightningAlpha*.06})`;
                        ctx.fillRect(0, 0, W, H);
                        lightningAlpha -= .04 
                    } 
                }
                
                // Animate particles
                particles.forEach(p => { 
                    if (p.type === 'rain') { 
                        p.x += p.vx || -1;
                        p.y += p.vy; 
                        if (p.y > H + 20) { 
                            p.y = -20;
                            p.x = Math.random() * W 
                        }
                        ctx.globalAlpha = p.alpha;
                        ctx.strokeStyle = 'rgba(100,160,255,.6)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p.x, p.y - p.len);
                        ctx.stroke() 
                    } 
                    if (p.type === 'snow') { 
                        p.y += p.vy;
                        p.x += p.vx + Math.sin(t * p.vy + p.phase) * .6; 
                        if (p.y > H + 8) { 
                            p.y = -8;
                            p.x = Math.random() * W 
                        }
                        ctx.globalAlpha = p.alpha;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill() 
                    } 
                    if (p.type === 'star') { 
                        const f = .5 + .5 * Math.sin(t * p.spd + p.phase);
                        ctx.globalAlpha = p.alpha * f;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill() 
                    } 
                });
                
                // Animate leaves
                leafPool.forEach(p => { 
                    p.x += p.vx + Math.sin(t * 1.3) * 1.2;
                    p.y += p.vy + Math.cos(t * 1.1) * 1;
                    p.rot += p.rotSpd; 
                    if (p.x > W + 60) p.x = -50; 
                    if (p.x < -60) p.x = W + 50;
                    ctx.globalAlpha = p.alpha;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size * .55, p.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore() 
                });
                
                raf = requestAnimationFrame(tick) 
            }

            function drawLightning(ctx) { 
                const x = W * .2 + Math.random() * W * .6;
                ctx.strokeStyle = 'rgba(200,180,255,.75)';
                ctx.lineWidth = 1.2;
                ctx.shadowColor = 'rgba(180,160,255,.8)';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.moveTo(x, 0); 
                let cy = 0,
                    cx = x; 
                while (cy < H * .5) { 
                    cy += 18 + Math.random() * 25;
                    cx += (Math.random() - .5) * 35;
                    ctx.lineTo(cx, cy) 
                }
                ctx.stroke();
                ctx.shadowBlur = 0 
            }

            function resize() { 
                W = C.width = window.innerWidth;
                H = C.height = window.innerHeight 
            }
            
            return { 
                init() { 
                    C = document.getElementById('bgC');
                    ctx = C.getContext('2d');
                    resize();
                    window.addEventListener('resize', resize);
                    tick() 
                }, 
                setWeather(wcode, isDay, wind) { 
                    const key = getGradKey(wcode, isDay, wind); 
                    const gr = GRADS[key] || GRADS.day_sun; 
                    for (let i = 0; i < 9; i++) targetGrad[i] = gr[i];
                    initParticles(wcode, isDay, wind) 
                } 
            }
        })();

        // ──────────────────────────────────── LUM with transform animations
        const lum = (() => {
            let C, ctx, t = 0,
                raf2;
            let eyeTarget = { x: 0, y: 0 },
                eyeCurrent = { x: 0, y: 0 };
            let blinkTimer = 0,
                blinkState = 1;
            let emotion = 'happy',
                emoTimer = 0,
                smileAmt = 0,
                smileTarget = 1;
            let lumColors = [
                [255, 150, 30],
                [255, 90, 10],
                [255, 210, 60]
            ];
            let answerMode = null,
                answerData = null,
                answerTimer = 0;
            const WEATHER_COLORS = { 
                sun: [[255, 190, 40], [220, 100, 15], [255, 230, 80]],
                moon: [[70, 50, 170], [110, 70, 210], [150, 110, 245]],
                pcloud: [[255, 160, 35], [220, 100, 15], [255, 200, 65]],
                cloudy: [[135, 145, 175], [95, 105, 155], [165, 175, 205]],
                rain: [[10, 75, 155], [25, 95, 195], [0, 55, 125]],
                snow: [[135, 175, 250], [175, 205, 250], [195, 215, 250]],
                storm: [[95, 15, 190], [130, 35, 230], [70, 5, 150]],
                fog: [[115, 125, 145], [140, 150, 170], [95, 105, 125]]
            };
            const EMOLABELS = { 
                happy: 'Радостный', 
                sad: 'Грустный', 
                giggle: 'Хихикает', 
                love: 'В восторге',
                curious: 'Любопытный', 
                sleepy: 'Сонный', 
                scared: 'Испуган' 
            };

            function lerp(a, b, t) { return a + (b - a) * t }

            function setAnswerMode(type, data) { 
                answerMode = type;
                answerData = data;
                answerTimer = 4;
                document.getElementById('emotxt').textContent = type === 'temp' ? 'Температура: ' + data + '°' : 'Погода'; 
            }

            function tick2() { 
                t += .016;
                ctx.clearRect(0, 0, 200, 200);
                
                // Update emotions
                emoTimer -= .016; 
                if (emoTimer < 0 && !answerMode) { 
                    const pool = ['happy', 'happy', 'giggle', 'love', 'curious'];
                    if (!['sleepy', 'scared', 'sad'].includes(emotion)) {
                        emotion = pool[Math.floor(Math.random() * pool.length)];
                    }
                    emoTimer = 3 + Math.random() * 5;
                    smileTarget = emotion === 'sad' ? -1 : 
                                 emotion === 'giggle' || emotion === 'love' ? 1.5 : 1;
                    document.getElementById('emotxt').textContent = EMOLABELS[emotion] || '' 
                }
                
                // Smooth smile animation
                smileAmt = lerp(smileAmt, smileTarget, .035);
                
                // Eye blinking
                blinkTimer += .016; 
                if (blinkTimer > 4 + Math.random() * 3) { 
                    blinkTimer = 0;
                    blinkState = 0;
                    setTimeout(() => blinkState = 1, 180) 
                } 
                
                // Random eye movement
                if (Math.random() < .004) { 
                    eyeTarget.x = (Math.random() - .5) * 14;
                    eyeTarget.y = (Math.random() - .5) * 9 
                }
                
                // Smooth eye tracking
                eyeCurrent.x = lerp(eyeCurrent.x, eyeTarget.x, .05);
                eyeCurrent.y = lerp(eyeCurrent.y, eyeTarget.y, .05);
                
                const cx = 100,
                    cy = 100; 
                    
                if (answerMode) { 
                    // Answer mode - show temperature or icon
                    answerTimer -= .016; 
                    if (answerTimer <= 0) { 
                        answerMode = null;
                        document.getElementById('emotxt').textContent = EMOLABELS[emotion] || '' 
                    } 
                    if (answerMode === 'temp') { 
                        ctx.fillStyle = 'rgba(255,255,255,.15)';
                        ctx.font = 'bold 48px -apple-system';
                        ctx.textAlign = 'center';
                        ctx.fillText(answerData + '°', cx, cy + 15) 
                    } else { 
                        // Render weather icon
                        const svg = buildIconSVG(owIconType(answerData, ST.isDay), 60);
                        // Convert SVG to image for canvas
                        const img = new Image();
                        img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
                        img.onload = () => ctx.drawImage(img, cx - 30, cy - 30, 60, 60);
                    } 
                } else { 
                    // Normal mode - draw flame
                    const grd = ctx.createRadialGradient(cx, cy, 10, cx, cy, 52);
                    const shift = Math.sin(t * .5) * 20;
                    grd.addColorStop(0, `rgba(${Math.min(255,lumColors[0][0]+shift)},${Math.min(255,lumColors[0][1]+shift*.5)},${Math.min(255,lumColors[0][2]+shift*.3)},.9)`);
                    grd.addColorStop(.5, `rgba(${lumColors[1][0]},${lumColors[1][1]},${lumColors[1][2]},.7)`);
                    grd.addColorStop(1, `rgba(${lumColors[2][0]},${lumColors[2][1]},${lumColors[2][2]},0)`);
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 52, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Draw eyes
                    const eyeY = cy - 12 + eyeCurrent.y,
                        eyeOff = 14; 
                        
                    if (emotion === 'love') { 
                        // Draw heart-shaped eyes
                        drawHeart(ctx, cx - eyeOff + eyeCurrent.x, eyeY);
                        drawHeart(ctx, cx + eyeOff + eyeCurrent.x, eyeY) 
                    } else { 
                        // Draw normal eyes
                        [cx - eyeOff, cx + eyeOff].forEach(ex => {
                            ctx.fillStyle = 'rgba(255,255,255,.92)';
                            ctx.beginPath();
                            ctx.ellipse(ex + eyeCurrent.x, eyeY, 6, 6 * (blinkState === 0 ? 0 : 1), 0, 0, Math.PI * 2);
                            ctx.fill(); 
                            if (blinkState === 1) { 
                                // Draw pupils
                                ctx.fillStyle = 'rgba(18,12,30,.94)';
                                ctx.beginPath();
                                ctx.ellipse(ex + eyeCurrent.x + eyeCurrent.x * .18, eyeY + eyeCurrent.y * .18, 3, 3, 0, 0, Math.PI * 2);
                                ctx.fill();
                                // Draw eye highlight
                                ctx.fillStyle = 'rgba(255,255,255,.8)';
                                ctx.beginPath();
                                ctx.arc(ex + eyeCurrent.x + 1, eyeY - 1.2, 1, 0, Math.PI * 2);
                                ctx.fill() 
                            } 
                        }) 
                    } 
                    
                    // Draw mouth
                    const mouthY = cy + 14;
                    ctx.strokeStyle = 'rgba(255,255,255,.7)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(cx - 12, mouthY);
                    ctx.quadraticCurveTo(cx, mouthY + smileAmt * 8, cx + 12, mouthY);
                    ctx.stroke() 
                }
                
                raf2 = requestAnimationFrame(tick2) 
            }

            function drawHeart(ctx, x, y) { 
                ctx.fillStyle = 'rgba(255,90,130,.85)';
                ctx.beginPath(); 
                const s = 4;
                ctx.moveTo(x, y + s * .2);
                ctx.bezierCurveTo(x, y - s * .2, x - s, y - s * .2, x - s, y + s * .2);
                ctx.bezierCurveTo(x - s, y + s * .7, x, y + s * 1.1, x, y + s * 1.1);
                ctx.fill() 
            }
            
            return { 
                init() { 
                    C = document.getElementById('lumCanvas'); 
                    if (!C) return;
                    ctx = C.getContext('2d');
                    C.width = 200;
                    C.height = 200;
                    C.addEventListener('click', () => { 
                        emotion = 'giggle';
                        smileTarget = 1.8;
                        emoTimer = 3;
                        document.getElementById('emotxt').textContent = EMOLABELS.giggle;
                        ST.lum.love = Math.min(100, ST.lum.love + 1);
                        S.set('lumState', ST.lum);
                        renderLumScreen();
                    });
                    tick2() 
                }, 
                setWeather(wcode, isDay) { 
                    const t2 = owIconType(wcode, isDay);
                    lumColors = WEATHER_COLORS[t2] || WEATHER_COLORS.sun; 
                    const emo = isDay ? 'curious' : 'sleepy';
                    emotion = emo;
                    document.getElementById('emotxt').textContent = EMOLABELS[emo] || '' 
                },
                showAnswer(type, data) { setAnswerMode(type, data) }
            }
        })();

        // ──────────────────────────────────── LUM SCREEN
        function renderLumScreen() { 
            const ls = ST.lum;
            document.getElementById('loveFill').style.width = ls.love + '%';
            document.getElementById('lovePct').textContent = ls.love + '%'; 
            if (ls.lastVisit) { 
                const diff = (Date.now() - new Date(ls.lastVisit).getTime()) / 3600000;
                document.getElementById('lumVisit').textContent = 'Визит: ' + (diff < 24 ? 'сегодня' : diff < 48 ? 'вчера' : Math.floor(diff / 24) + ' д. назад') 
            }
            document.getElementById('lumStreak').textContent = (ls.streak || 1) + ' дн.' 
        }

        function updateLumVisit() { 
            const ls = ST.lum; 
            const today = new Date().toDateString(); 
            if (!ls.lastVisit || new Date(ls.lastVisit).toDateString() !== today) { 
                if (ls.lastVisit) { 
                    const prev = new Date(ls.lastVisit).toDateString(); 
                    const yest = new Date(Date.now() - 86400000).toDateString();
                    ls.streak = prev === yest ? (ls.streak || 0) + 1 : 1;
                    ls.love = Math.min(100, ls.love + 5) 
                }
                ls.lastVisit = new Date().toISOString();
                S.set('lumState', ls) 
            } 
        }

        // ──────────────────────────────────── CHAT with learning
        const brain = {
            memories: S.get('brain', {}),
            learn(question, answer) { 
                const q = question.toLowerCase().replace(/[^\wа-яё\s]/g, '').trim(); 
                if (q.length > 3) { 
                    this.memories[q] = answer;
                    S.set('brain', this.memories) 
                } 
            },
            recall(question) { 
                const q = question.toLowerCase().replace(/[^\wа-яё\s]/g, '').trim(); 
                if (this.memories[q]) return this.memories[q]; 
                const keys = Object.keys(this.memories); 
                const best = keys.find(k => q.includes(k) || k.includes(q)); 
                return best ? this.memories[best] : null 
            }
        };

        function setupChat() {
            const cf = document.getElementById('cf'),
                sb = document.getElementById('sb');
            cf.addEventListener('input', () => { 
                sb.disabled = !cf.value.trim();
                cf.style.height = Math.min(cf.scrollHeight, 70) + 'px' 
            });
            cf.addEventListener('keydown', e => { 
                if (e.key === 'Enter' && !e.shiftKey) { 
                    e.preventDefault();
                    sendMsg() 
                } 
            });
            sb.addEventListener('click', sendMsg);
            ST.chat.forEach(m => addBubble(m.role, m.text, false)); 
            if (!ST.chat.length) addBubble('ai', 'Привет! Я Люм, спрашивай о чём угодно.', false);
            scrollChat();
            document.getElementById('hints').innerHTML = ['Температура', 'Прогноз', 'Что надеть?', 'Расскажи анекдот'].map(
                h => `<div class="hint">${h}</div>`).join('');
            document.querySelectorAll('.hint').forEach(h => h.addEventListener('click', function() { 
                cf.value = this.textContent;
                sendMsg() 
            }));
        }

        async function sendMsg() {
            const cf = document.getElementById('cf'),
                text = cf.value.trim();
            if (!text) return;
            cf.value = '';
            cf.style.height = 'auto';
            sb.disabled = true;
            addBubble('user', text, true);
            ST.lum.love = Math.min(100, ST.lum.love + 3);
            S.set('lumState', ST.lum);
            renderLumScreen();
            const tid = 't' + Date.now();
            const el = document.getElementById('chatMsgs');
            const d = document.createElement('div');
            d.className = 'msg ai';
            d.id = tid;
            d.innerHTML = '<div class="av">✨</div><div class="bbl"><div class="dots"><span></span><span></span><span></span></div></div>';
            el.appendChild(d);
            scrollChat();
            const wctx = ST.weather ? { 
                city: ST.city, 
                temp: tC(ST.weather.current.temp), 
                feels: tC(ST.weather.current.feels_like), 
                desc: ST.weather.current.weather[0].description, 
                wind: ST.weather.current.wind_speed.toFixed(1), 
                humidity: ST.weather.current.humidity 
            } : null;
            const apiKey = ST.settings.apiKey;
            let reply = '';
            if (apiKey && apiKey.length > 10) {
                try {
                    const r = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: JSON.stringify({ 
                            model: 'gpt-4o-mini', 
                            messages: [
                                { role: 'system', content: 'Ты Люм, питомец-огонь. Отвечай коротко, дружелюбно.' }, 
                                ...ST.chat.slice(-6).map(m => ({ 
                                    role: m.role === 'ai' ? 'assistant' : 'user', 
                                    content: m.text 
                                })), 
                                { role: 'user', content: `Погода: ${JSON.stringify(wctx)}. Сообщение: ${text}` } 
                            ] 
                        }) 
                    });
                    const j = await r.json();
                    reply = j.choices?.[0]?.message?.content || fallback(text, wctx);
                } catch (e) { 
                    reply = fallback(text, wctx) 
                }
            } else {
                reply = fallback(text, wctx);
            }
            document.getElementById(tid)?.remove();
            addBubble('ai', reply, true);
            ST.chat.push({ role: 'user', text }, { role: 'ai', text: reply });
            S.set('chat', ST.chat.slice(-30));
            brain.learn(text, reply);
            if (text.toLowerCase().includes('температура') && wctx) lum.showAnswer('temp', wctx.temp);
            if (text.toLowerCase().includes('погода') && wctx) lum.showAnswer('icon', ST.wcode);
        }

        function fallback(q, w) {
            const ql = q.toLowerCase();
            if (w && ql.includes('температура')) return `Сейчас в ${w.city} ${w.temp}°. Ощущается как ${w.feels}°.`;
            if (w && ql.includes('погода')) return `В ${w.city} ${w.desc}, ${w.temp}°.`;
            if (w && ql.includes('надеть')) return w.temp < 5 ? 'Тепло одевайся!' : w.temp < 15 ? 'Куртка подойдёт.' : 'Можно легко.';
            if (ql.includes('анекдот')) return 'Программист говорит: "У меня 10 проблем, но я написал 10 строк кода. Теперь у меня 20 проблем."';
            if (ql.includes('привет') || ql.includes('здравствуй')) return 'Привет! Я Люм, рад тебя видеть.';
            if (ql.includes('как дела')) return 'У меня всё отлично! А у тебя?';
            const mem = brain.recall(q);
            if (mem) return mem;
            return 'Я пока не знаю, как ответить, но я учусь! Спроси что-нибудь о погоде.';
        }

        function addBubble(role, text, animate) { 
            const el = document.getElementById('chatMsgs'); 
            const d = document.createElement('div');
            d.className = `msg ${role}`; 
            if (!animate) d.style.animation = 'none';
            d.innerHTML = role === 'ai' ? `<div class="av">✨</div><div class="bbl">${text}</div>` : `<div class="bbl">${text}</div>`;
            el.appendChild(d); 
            if (animate) scrollChat() 
        }

        function scrollChat() { 
            const e = document.getElementById('chatMsgs');
            setTimeout(() => e.scrollTo({ top: e.scrollHeight, behavior: 'smooth' }), 40) 
        }

        function renderFavs() {
            const el = document.getElementById('favGrid');
            if (!ST.favs.length) return el.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:rgba(255,255,255,.25)">Найди и добавь города</div>';
            el.innerHTML = ST.favs.map((c, i) => `<div class="fc" onclick="loadFav(${i})"><button class="frm" onclick="event.stopPropagation();rmFav(${i})">✕</button><div class="fcity">${c.name}</div><div class="ftemp">${c.temp||'–'}°</div></div>`).join('');
        }

        function rmFav(i) { 
            ST.favs.splice(i, 1);
            S.set('favs', ST.favs);
            renderFavs() 
        }
        
        async function loadFav(i) { 
            const c = ST.favs[i];
            ST.lat = c.lat;
            ST.lon = c.lon;
            ST.city = c.name;
            switchTab('home');
            await loadWeather();
            toast('📍 ' + c.name) 
        }

        function setupSearch() {
            const sf = document.getElementById('sfld'),
                sr = document.getElementById('sres');
            let deb;
            sf.addEventListener('input', () => {
                clearTimeout(deb);
                const q = sf.value.trim();
                if (q.length < 2) { 
                    sr.style.display = 'none'; 
                    return 
                }
                deb = setTimeout(async () => {
                    try {
                        const key = decryptApiKey(OW_KEY);
                        const r = await fetch(
                            `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=5&appid=${key}`
                        );
                        const d = await r.json(); 
                        if (!d.length) { 
                            sr.style.display = 'none'; 
                            return 
                        }
                        sr.style.display = 'block';
                        sr.innerHTML = d.map(r => `<div class="sitem" onclick="pickCity(${r.lat},${r.lon},'${r.local_names?.ru||r.name}')">${r.local_names?.ru||r.name}</div>`).join('');
                    } catch (e) { 
                        sr.style.display = 'none' 
                    }
                }, 300);
            });
            document.addEventListener('click', e => { 
                if (!sf.contains(e.target) && !sr.contains(e.target)) sr.style.display = 'none' 
            });
        }
        
        async function pickCity(lat, lon, name) { 
            document.getElementById('sres').style.display = 'none';
            document.getElementById('sfld').value = ''; 
            try { 
                const key = decryptApiKey(OW_KEY);
                const r = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${key}&units=metric&lang=ru`
                ); 
                const d = await r.json(); 
                if (!ST.favs.find(f => f.name === name)) { 
                    ST.favs.push({ name, lat, lon, temp: tC(d.main.temp) });
                    S.set('favs', ST.favs);
                    toast('❤️ ' + name + ' добавлен') 
                } else {
                    toast('Уже есть');
                }
                renderFavs() 
            } catch (e) { 
                toast('Ошибка') 
            } 
        }

        function setupNav() { 
            document.querySelectorAll('.nb').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab))) 
        }

        function switchTab(tab) { 
            ST.tab = tab;
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
            document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
            document.getElementById('s-' + tab)?.classList.add('on'); 
            if (tab === 'lum') { 
                renderLumScreen();
                lum.init() 
            } 
            if (tab === 'saved') renderFavs() 
        }

        function toast(msg) { 
            const e = document.getElementById('toast');
            e.textContent = msg;
            e.classList.add('vis');
            setTimeout(() => e.classList.remove('vis'), 2400) 
        }
        
        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

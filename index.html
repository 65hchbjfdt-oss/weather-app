<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060610">
<title>Lum Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 34px);
  --bg: #060610;
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.10);
  --glass-strong: rgba(255,255,255,0.11);
  --text: rgba(255,255,255,0.95);
  --text-dim: rgba(255,255,255,0.45);
  --text-mid: rgba(255,255,255,0.70);
  --accent: #5E9EFF;
  --accent2: #A78BFA;
  --radius: 22px;
  --nav-h: 68px;
}

- { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
width:100%; height:100%;
background: var(–bg);
color: var(–text);
font-family: -apple-system, ‘SF Pro Display’, ‘Helvetica Neue’, sans-serif;
overflow: hidden;
overscroll-behavior: none;
-webkit-font-smoothing: antialiased;
}

/* ===== BACKGROUND ===== */
#bg-canvas {
position:fixed; inset:0; z-index:0;
width:100%; height:100%;
}

/* ===== APP SHELL ===== */
#app {
position:fixed; inset:0; z-index:1;
display:flex; flex-direction:column;
max-width:430px; margin:0 auto;
}

/* ===== SCREENS ===== */
.screen {
display:none; flex:1; flex-direction:column;
overflow:hidden; position:relative;
}
.screen.active { display:flex; }

/* ===== SCROLLABLE ===== */
.scroll-area {
flex:1; overflow-y:auto; overflow-x:hidden;
-webkit-overflow-scrolling:touch;
scroll-behavior:smooth;
padding: calc(var(–safe-top) + 12px) 16px calc(var(–nav-h) + 20px);
scrollbar-width:none;
}
.scroll-area::-webkit-scrollbar { display:none; }

/* ===== GLASS ===== */
.glass {
background: var(–glass);
border: 1px solid var(–glass-border);
backdrop-filter: blur(20px) saturate(180%);
-webkit-backdrop-filter: blur(20px) saturate(180%);
border-radius: var(–radius);
}
.glass:active { transform: scale(0.98); transition: transform 0.12s ease; }

/* ===== BOTTOM NAV ===== */
#nav {
position:fixed; bottom:0; left:50%; transform:translateX(-50%);
width:100%; max-width:430px;
height:calc(var(–nav-h) + var(–safe-bottom));
padding-bottom: var(–safe-bottom);
display:flex; align-items:flex-start; justify-content:space-around;
padding-top:10px;
background: rgba(6,6,16,0.7);
backdrop-filter: blur(30px) saturate(200%);
-webkit-backdrop-filter: blur(30px) saturate(200%);
border-top: 1px solid rgba(255,255,255,0.08);
z-index:100;
}

.nav-btn {
display:flex; flex-direction:column; align-items:center; gap:4px;
cursor:pointer; border:none; background:none;
padding:4px 12px; border-radius:14px;
transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
-webkit-user-select:none;
}
.nav-btn svg { width:22px; height:22px; stroke: var(–text-dim); fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; transition: stroke 0.3s; }
.nav-btn span { font-size:10px; color: var(–text-dim); letter-spacing:0.01em; transition: color 0.3s; }
.nav-btn.active svg { stroke: var(–accent); filter: drop-shadow(0 0 6px var(–accent)); }
.nav-btn.active span { color: var(–accent); }
.nav-btn.active { transform: scale(1.08); }

/* dot indicator */
.nav-dot {
position:absolute; top:2px; right:10px;
width:6px; height:6px; border-radius:50%;
background:#FF453A; box-shadow:0 0 6px #FF453A;
}

/* ===== CURRENT WEATHER ===== */
#hero {
padding: calc(var(–safe-top) + 8px) 20px 0;
text-align:center;
position:relative;
}

.city-name {
font-size:16px; font-weight:300; color: var(–text-mid);
letter-spacing:0.04em; margin-bottom:4px;
display:flex; align-items:center; justify-content:center; gap:6px;
}
.city-name svg { width:12px; height:12px; stroke: var(–text-dim); fill:none; stroke-width:2; }

.temp-display {
font-size:96px; font-weight:100; line-height:1;
letter-spacing:-4px; margin:0 0 6px;
background: linear-gradient(180deg, #fff 40%, rgba(255,255,255,0.65) 100%);
-webkit-background-clip:text; -webkit-text-fill-color:transparent;
animation: tempFadeIn 0.8s ease;
}
@keyframes tempFadeIn {
from { opacity:0; transform:translateY(20px) scale(0.9); }
to { opacity:1; transform:none; }
}

.feels-like { font-size:13px; color: var(–text-dim); margin-bottom:16px; }

.weather-icon-wrap {
width:110px; height:110px; margin:0 auto 12px;
position:relative; display:flex; align-items:center; justify-content:center;
}

.weather-desc {
font-size:18px; font-weight:300; color: var(–text-mid);
letter-spacing:0.02em; margin-bottom:6px;
}

.hi-lo {
font-size:13px; color: var(–text-dim); letter-spacing:0.03em;
}

/* ===== WEATHER ICON SVG ANIMATIONS ===== */
.sun-body { animation: sunPulse 3s ease-in-out infinite; }
@keyframes sunPulse {
0%,100% { transform:scale(1); opacity:0.95; }
50% { transform:scale(1.07); opacity:1; }
}
.sun-rays { animation: raysRotate 12s linear infinite; transform-origin:50% 50%; }
@keyframes raysRotate { to { transform:rotate(360deg); } }

.cloud-body { animation: cloudDrift 4s ease-in-out infinite; }
@keyframes cloudDrift {
0%,100% { transform:translateX(0); }
50% { transform:translateX(4px); }
}

.rain-drop { animation: dropFall 1.2s ease-in infinite; }
.rain-drop:nth-child(2) { animation-delay:0.4s; }
.rain-drop:nth-child(3) { animation-delay:0.8s; }
@keyframes dropFall {
0% { transform:translateY(-8px); opacity:0; }
20% { opacity:1; }
80% { opacity:0.8; }
100% { transform:translateY(18px); opacity:0; }
}

.snow-flake { animation: snowFall 2s ease-in-out infinite; }
.snow-flake:nth-child(2) { animation-delay:0.7s; }
.snow-flake:nth-child(3) { animation-delay:1.4s; }
@keyframes snowFall {
0% { transform:translateY(-8px) translateX(0) rotate(0deg); opacity:0; }
20% { opacity:1; }
100% { transform:translateY(18px) translateX(6px) rotate(180deg); opacity:0; }
}

.lightning { animation: lightningFlash 2.5s ease-in-out infinite; }
@keyframes lightningFlash {
0%,85%,100% { opacity:0; }
90%,95% { opacity:1; filter:drop-shadow(0 0 8px #FFD700); }
}

.fog-line { animation: fogDrift 3s ease-in-out infinite; }
.fog-line:nth-child(2) { animation-delay:1s; animation-direction:reverse; }
.fog-line:nth-child(3) { animation-delay:2s; }
@keyframes fogDrift {
0%,100% { transform:translateX(0); opacity:0.5; }
50% { transform:translateX(8px); opacity:0.9; }
}

/* ===== HOURLY SCROLL ===== */
.hourly-container {
display:flex; gap:8px;
overflow-x:auto; padding:2px 2px 6px;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}
.hourly-container::-webkit-scrollbar { display:none; }

.hour-card {
flex:0 0 64px; scroll-snap-align:start;
display:flex; flex-direction:column; align-items:center; gap:6px;
padding:12px 6px; border-radius:18px;
background: var(–glass); border:1px solid var(–glass-border);
backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
cursor:pointer; transition: all 0.2s ease;
-webkit-user-select:none;
}
.hour-card.now {
background: rgba(94,158,255,0.18);
border-color: rgba(94,158,255,0.35);
box-shadow: 0 0 20px rgba(94,158,255,0.12);
}
.hour-card:active { transform:scale(0.95); }
.hour-time { font-size:11px; color: var(–text-dim); font-weight:400; }
.hour-temp { font-size:15px; font-weight:400; }
.hour-rain { font-size:10px; color:#5BBCFF; }

/* ===== SECTION LABELS ===== */
.section-label {
font-size:11px; font-weight:500; color: var(–text-dim);
letter-spacing:0.08em; text-transform:uppercase;
margin-bottom:8px; padding:0 2px;
display:flex; align-items:center; gap:6px;
}
.section-label svg { width:12px; height:12px; stroke: var(–text-dim); fill:none; stroke-width:2; }

/* ===== DAILY ROWS ===== */
.daily-row {
display:flex; align-items:center; padding:12px 16px;
border-bottom:1px solid rgba(255,255,255,0.05);
cursor:pointer; transition:background 0.2s;
-webkit-user-select:none;
}
.daily-row:last-child { border-bottom:none; }
.daily-row:active { background:rgba(255,255,255,0.04); }
.day-name { font-size:15px; flex:1; font-weight:300; }
.day-icon { width:24px; height:24px; margin-right:12px; }
.day-temps { font-size:15px; font-weight:300; color: var(–text-mid); display:flex; gap:8px; }
.day-hi { color: var(–text); }
.day-lo { color: var(–text-dim); }

/* ===== DETAILS GRID ===== */
.details-grid {
display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.detail-card {
background: var(–glass); border:1px solid var(–glass-border);
backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
border-radius:18px; padding:14px 16px;
}
.detail-label { font-size:11px; color: var(–text-dim); letter-spacing:0.05em; text-transform:uppercase; margin-bottom:6px; display:flex; align-items:center; gap:5px; }
.detail-label svg { width:11px; height:11px; stroke: var(–text-dim); fill:none; stroke-width:2; }
.detail-value { font-size:22px; font-weight:300; }
.detail-sub { font-size:11px; color: var(–text-dim); margin-top:3px; }

/* UV bar */
.uv-bar { height:3px; border-radius:2px; margin-top:6px; background:linear-gradient(90deg,#4ade80,#facc15,#f97316,#ef4444); position:relative; }
.uv-marker { position:absolute; top:-2px; width:7px; height:7px; border-radius:50%; background:#fff; box-shadow:0 0 4px rgba(0,0,0,0.5); transition:left 0.5s ease; }

/* ===== SUN/MOON ARC ===== */
.sun-arc-wrap {
padding:20px 16px 14px;
position:relative;
}
.arc-svg { width:100%; }
.arc-text {
display:flex; justify-content:space-between; margin-top:8px;
font-size:12px; color: var(–text-dim);
}
.arc-center { text-align:center; position:absolute; bottom:30px; left:50%; transform:translateX(-50%); }
.arc-center-label { font-size:10px; color: var(–text-dim); letter-spacing:0.05em; text-transform:uppercase; }
.arc-center-value { font-size:14px; font-weight:300; }

/* ===== LUM SCREEN ===== */
#lum-canvas {
width:220px; height:220px; display:block; margin:0 auto;
cursor:pointer; -webkit-user-select:none;
}

.lum-stats { display:flex; flex-direction:column; gap:12px; padding:0 4px; }
.lum-stat-row { display:flex; align-items:center; gap:12px; }
.lum-stat-label { font-size:13px; color: var(–text-dim); width:80px; flex-shrink:0; }
.lum-stat-bar { flex:1; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden; }
.lum-stat-fill { height:100%; border-radius:2px; transition:width 1s ease; }
.lum-stat-pct { font-size:12px; color: var(–text-dim); width:32px; text-align:right; }

/* ===== CHAT ===== */
#chat-messages {
flex:1; overflow-y:auto; padding:16px;
display:flex; flex-direction:column; gap:10px;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
padding-bottom: calc(var(–nav-h) + 80px);
}
#chat-messages::-webkit-scrollbar { display:none; }

.msg { display:flex; align-items:flex-end; gap:8px; animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes msgIn {
from { opacity:0; transform:translateY(12px) scale(0.95); }
to { opacity:1; transform:none; }
}

.msg.user { flex-direction:row-reverse; }

.msg-bubble {
max-width:78%; padding:11px 14px; border-radius:18px;
font-size:15px; line-height:1.45; font-weight:300;
}
.msg.ai .msg-bubble {
background: rgba(94,158,255,0.12);
border:1px solid rgba(94,158,255,0.2);
border-bottom-left-radius:5px;
}
.msg.user .msg-bubble {
background: rgba(167,139,250,0.18);
border:1px solid rgba(167,139,250,0.25);
border-bottom-right-radius:5px;
}

.lum-avatar {
width:28px; height:28px; border-radius:50%;
background:radial-gradient(circle at 35% 35%, #7EB8FF, #3B6FD4);
flex-shrink:0; display:flex; align-items:center; justify-content:center;
font-size:12px;
}

.typing-dots { display:flex; gap:4px; align-items:center; padding:4px 2px; }
.typing-dots span { width:6px; height:6px; border-radius:50%; background:rgba(94,158,255,0.6); animation:dotPulse 1.2s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay:0.2s; }
.typing-dots span:nth-child(3) { animation-delay:0.4s; }
@keyframes dotPulse { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1);opacity:1} }

/* ===== CHAT INPUT ===== */
#chat-input-wrap {
position:fixed; bottom:0; left:50%; transform:translateX(-50%);
width:100%; max-width:430px;
padding: 10px 16px calc(var(–nav-h) + var(–safe-bottom) - 2px);
background: rgba(6,6,16,0.7);
backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
border-top:1px solid rgba(255,255,255,0.07);
z-index:50;
display:none;
}
#chat-input-wrap.visible { display:block; }

.chat-hints {
display:flex; gap:6px; margin-bottom:8px; overflow-x:auto; scrollbar-width:none;
}
.chat-hints::-webkit-scrollbar { display:none; }
.chat-hint {
flex-shrink:0; font-size:12px; padding:5px 11px;
background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
border-radius:20px; color: var(–text-mid);
cursor:pointer; white-space:nowrap; transition:all 0.2s;
}
.chat-hint:active { background:rgba(255,255,255,0.14); transform:scale(0.97); }

.chat-row { display:flex; gap:8px; align-items:flex-end; }
#chat-field {
flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
border-radius:22px; padding:10px 16px; color: var(–text); font-size:15px;
font-family:inherit; outline:none; resize:none; max-height:90px;
-webkit-appearance:none;
}
#chat-field::placeholder { color: var(–text-dim); }

#send-btn {
width:40px; height:40px; border-radius:50%;
background: var(–accent); border:none; cursor:pointer;
display:flex; align-items:center; justify-content:center;
transition:all 0.2s; flex-shrink:0;
}
#send-btn:disabled { background:rgba(94,158,255,0.25); }
#send-btn svg { width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
#send-btn:not(:disabled):active { transform:scale(0.9); }

/* ===== FAVORITES ===== */
.fav-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.fav-card {
background:var(–glass); border:1px solid var(–glass-border);
backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
border-radius:var(–radius); padding:16px; cursor:pointer;
transition:all 0.2s ease; position:relative; overflow:hidden;
}
.fav-card:active { transform:scale(0.97); }
.fav-city { font-size:16px; font-weight:400; margin-bottom:2px; }
.fav-country { font-size:11px; color: var(–text-dim); margin-bottom:12px; }
.fav-temp { font-size:32px; font-weight:200; margin-bottom:4px; }
.fav-desc { font-size:12px; color: var(–text-dim); }
.fav-remove { position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,0.1); border:none; cursor:pointer; color:var(–text-dim); font-size:14px; display:flex; align-items:center; justify-content:center; }

/* ===== SEARCH ===== */
.search-wrap { position:relative; margin-bottom:12px; }
.search-field {
width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
border-radius:14px; padding:11px 14px 11px 40px;
color: var(–text); font-size:15px; font-family:inherit; outline:none;
-webkit-appearance:none;
}
.search-field::placeholder { color: var(–text-dim); }
.search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(–text-dim); fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none; }

.search-results {
background:rgba(15,15,30,0.95); border:1px solid rgba(255,255,255,0.1);
border-radius:14px; overflow:hidden; margin-top:4px;
backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
.search-item { padding:12px 14px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px; color:var(–text-mid); transition:background 0.15s; }
.search-item:last-child { border-bottom:none; }
.search-item:active { background:rgba(255,255,255,0.06); }
.search-city { font-size:15px; color:var(–text); }

/* ===== PULL TO REFRESH ===== */
.ptr-indicator {
position:absolute; top:calc(var(–safe-top) + 4px); left:50%; transform:translateX(-50%) translateY(-40px);
width:32px; height:32px; border-radius:50%;
background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
display:flex; align-items:center; justify-content:center;
transition:transform 0.3s ease; opacity:0;
}
.ptr-indicator.visible { opacity:1; }
.ptr-spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ===== SKELETON ===== */
.skeleton {
background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
background-size:200% 100%;
animation:shimmer 1.6s ease-in-out infinite;
border-radius:10px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ===== TOAST ===== */
#toast {
position:fixed; top:calc(var(–safe-top) + 10px); left:50%; transform:translateX(-50%) translateY(-80px);
background:rgba(30,30,50,0.95); border:1px solid rgba(255,255,255,0.12);
border-radius:22px; padding:10px 18px; font-size:14px;
backdrop-filter:blur(20px); z-index:200;
transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
white-space:nowrap;
}
#toast.show { transform:translateX(-50%) translateY(0); }

/* ===== MISC ===== */
.mb { margin-bottom:10px; }
.mt { margin-top:16px; }

.card-wrap {
background:var(–glass); border:1px solid var(–glass-border);
backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
border-radius:var(–radius); overflow:hidden;
}

/* Moon phase */
.moon-row { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.05); }
.moon-emoji { font-size:28px; }
.moon-info { flex:1; }
.moon-phase-name { font-size:14px; font-weight:400; }
.moon-illum { font-size:12px; color:var(–text-dim); margin-top:2px; }

/* ===== RADAR placeholder ===== */
#radar-map {
flex:1;
background:radial-gradient(ellipse at 50% 50%, #0a0a2a 0%, #060610 100%);
display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px;
color:var(–text-dim); font-size:14px;
}
#radar-map svg { width:48px; height:48px; stroke:rgba(255,255,255,0.2); fill:none; stroke-width:1; }

/* ===== ANIMATE IN ===== */
@keyframes slideUp {
from { opacity:0; transform:translateY(18px); }
to { opacity:1; transform:none; }
}
.anim { animation:slideUp 0.5s ease both; }
.anim-d1 { animation-delay:0.05s; }
.anim-d2 { animation-delay:0.1s; }
.anim-d3 { animation-delay:0.15s; }
.anim-d4 { animation-delay:0.2s; }
.anim-d5 { animation-delay:0.25s; }
</style>

</head>

<canvas id="bg-canvas"></canvas>

<div id="app">

  <!-- ======= HOME ======= -->

  <div class="screen active" id="screen-home">
    <div class="ptr-indicator" id="ptr"><div class="ptr-spinner"></div></div>
    <div class="scroll-area" id="home-scroll">

  <div id="hero" class="anim">
    <div class="city-name" id="city-label">

      <span id="city-name-text">Загрузка...</span>

    <div class="temp-display" id="temp-main">–°</div>
    <div class="feels-like" id="feels-text">Ощущается как –°</div>
    <div class="weather-icon-wrap" id="icon-wrap"></div>
    <div class="weather-desc" id="desc-text"></div>
    <div class="hi-lo" id="hilo-text"></div>
  </div>

  <div style="height:20px"></div>

  <!-- Hourly -->
  <div class="anim anim-d1 mb">
    <div class="section-label">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>

<script>
/* ================================================
   LUM WEATHER — FULL APP LOGIC
   ================================================ */

// ===== STATE =====
const state = {
  lat: 55.7558, lon: 37.6173,
  cityName: 'Москва',
  weather: null,
  currentTab: 'home',
  lumState: null,
  chatMessages: [],
  favorites: [],
  isDay: 1
};

// ===== STORAGE =====
const S = {
  get(k, d=null) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch{return d;} },
  set(k,v) { try{localStorage.setItem(k,JSON.stringify(v));}catch{} }
};

// ===== INIT =====
function init() {
  state.favorites = S.get('lum_favorites', []);
  state.lumState = S.get('lum_state', { satiety:100, mood:80, friendship:50, streak:1, lastVisit:new Date().toISOString(), lastFeed:null });
  state.chatMessages = S.get('lum_chat', []);
  updateLumState();

  // try geolocation
  if(navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        state.lat = pos.coords.latitude;
        state.lon = pos.coords.longitude;
        reverseGeocode(state.lat, state.lon).then(name => {
          state.cityName = name;
          loadWeather();
          showToast('📍 '+name);
        });
      },
      () => loadWeather(),
      {timeout:6000}
    );
  } else {
    loadWeather();
  }

  setupNav();
  setupPullToRefresh();
  setupSearch();
  setupChat();
  renderFavorites();
  renderLumScreen();
  renderChatHints();
  bgAnim.start();
  lumAnim.init();
}

// ===== WEATHER FETCH =====
async function loadWeather() {
  const params = new URLSearchParams({
    latitude: state.lat, longitude: state.lon,
    current: 'temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,pressure_msl,uv_index,visibility,is_day,cloud_cover',
    hourly: 'temperature_2m,precipitation_probability,weather_code',
    daily: 'temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset,precipitation_probability_max,moon_phase',
    timezone: 'auto', forecast_days: 7, forecast_hours: 48
  });
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
    const d = await r.json();
    state.weather = d;
    state.isDay = d.current.is_day;
    renderHome(d);
    bgAnim.setWeather(d.current.weather_code, d.current.is_day);
    lumAnim.setWeather(d.current.weather_code, d.current.is_day);
  } catch(e) {
    console.error(e);
  }
}

async function reverseGeocode(lat, lon) {
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ru&format=json`);
    const d = await r.json();
    return d.results?.[0]?.name || 'Мой город';
  } catch { return 'Мой город'; }
}

async function searchCity(q) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=ru&format=json`);
  return r.json();
}

// ===== RENDER HOME =====
function renderHome(d) {
  const c = d.current;
  const daily = d.daily;

  document.getElementById('city-name-text').textContent = state.cityName;
  document.getElementById('temp-main').textContent = Math.round(c.temperature_2m) + '°';
  document.getElementById('feels-text').textContent = `Ощущается как ${Math.round(c.apparent_temperature)}°`;
  document.getElementById('desc-text').textContent = wmoDesc(c.weather_code);
  document.getElementById('hilo-text').textContent = `↑ ${Math.round(daily.temperature_2m_max[0])}°  ↓ ${Math.round(daily.temperature_2m_min[0])}°`;

  renderWeatherIcon('icon-wrap', c.weather_code, c.is_day, 110);
  renderHourly(d);
  renderDaily(d);
  renderDetails(c);
  renderSunMoon(d);
}

// ===== WEATHER ICONS (SVG) =====

      <circle cx="46" cy="32" r="9" fill="rgba(140,160,190,0.9)"/>

      <line class="rain-drop" x1="38" y1="54" x2="36" y2="64" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round"/>
      <line class="rain-drop" x1="50" y1="54" x2="48" y2="64" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;

  else if(type === 'snow') svg = `
    <svg width="${size}" height="${size}" viewBox="0 0 80 80" fill="none">
      <ellipse cx="38" cy="34" rx="24" ry="14" fill="rgba(210,225,245,0.85)" class="cloud-body"/>
      <circle cx="30" cy="28" r="11" fill="rgba(215,228,248,0.9)"/>
      <circle cx="46" cy="30" r="9" fill="rgba(210,225,245,0.9)"/>
      <g class="snow-flake"><circle cx="26" cy="56" r="3" fill="white" opacity="0.9"/><line x1="26" y1="52" x2="26" y2="60" stroke="white" stroke-width="1.5"/><line x1="22" y1="56" x2="30" y2="56" stroke="white" stroke-width="1.5"/></g>
      <g class="snow-flake"><circle cx="40" cy="60" r="3" fill="white" opacity="0.9"/><line x1="40" y1="56" x2="40" y2="64" stroke="white" stroke-width="1.5"/><line x1="36" y1="60" x2="44" y2="60" stroke="white" stroke-width="1.5"/></g>
      <g class="snow-flake"><circle cx="54" cy="56" r="3" fill="white" opacity="0.9"/><line x1="54" y1="52" x2="54" y2="60" stroke="white" stroke-width="1.5"/><line x1="50" y1="56" x2="58" y2="56" stroke="white" stroke-width="1.5"/></g>
    </svg>`;

  else if(type === 'storm') svg = `
    <svg width="${size}" height="${size}" viewBox="0 0 80 80" fill="none">
      <ellipse cx="38" cy="30" rx="26" ry="15" fill="rgba(80,70,120,0.9)" class="cloud-body"/>
      <circle cx="28" cy="26" r="12" fill="rgba(90,80,130,0.9)"/>
      <circle cx="48" cy="28" r="10" fill="rgba(80,70,120,0.9)"/>

function smallIcon(type) {
  const icons = {
    'clear-day': '☀️',
    'clear-night': '🌙',
    'cloudy': '☁️',
    'partly-cloudy-day': '⛅',
    'partly-cloudy-night': '🌥️',
    'rain': '🌧️',
    'snow': '❄️',
    'storm': '⛈️',
    'fog': '🌫️'
  };
  return `<span style="font-size:${24}px">${icons[type]||'🌤'}</span>`;
}

function getWeatherType(code, isDay=1) {
  if(code===0) return isDay?'clear-day':'clear-night';
  if(code<=2) return isDay?'partly-cloudy-day':'partly-cloudy-night';
  if(code===3) return 'cloudy';
  if(code<=49) return 'fog';
  if(code<=67) return 'rain';
  if(code<=77) return 'snow';
  if(code<=82) return 'rain';
  if(code<=86) return 'snow';
  return 'storm';
}

function wmoDesc(code) {
  const m={0:'Ясно',1:'Преим. ясно',2:'Переменная облачность',3:'Пасмурно',45:'Туман',48:'Изморозь',51:'Лёгкая морось',53:'Морось',55:'Сильная морось',61:'Лёгкий дождь',63:'Дождь',65:'Сильный дождь',71:'Лёгкий снег',73:'Снег',75:'Сильный снег',77:'Снежная крупа',80:'Кратк. дождь',81:'Дожди',82:'Сильные ливни',95:'Гроза',96:'Гроза с градом',99:'Сильная гроза'};
  return m[code]||'Переменная облачность';
}

// ===== HOURLY =====
function renderHourly(d) {
  const el = document.getElementById('hourly-list');
  if(!el) return;
  const now = new Date();
  const hrs = d.hourly.time.slice(0,36);
  let html = '';
  let foundNow = false;
  hrs.forEach((t,i) => {
    const dt = new Date(t);
    if(dt < new Date(now-1800000)) return;
    const isNow = !foundNow && dt >= new Date(now-1800000);
    if(isNow) foundNow=true;
    const hm = dt.getHours().toString().padStart(2,'0')+':00';
    const label = isNow?'Сейчас':hm;
    const temp = Math.round(d.hourly.temperature_2m[i]);
    const rain = d.hourly.precipitation_probability[i]||0;
    const wc = d.hourly.weather_code[i];
    const type = getWeatherType(wc, dt.getHours()>6&&dt.getHours()<21?1:0);
    html += `<div class="hour-card${isNow?' now':''}">
      <div class="hour-time">${label}</div>
      <div style="font-size:18px">${smallEmoji(type)}</div>
      <div class="hour-temp">${temp}°</div>
      ${rain>10?`<div class="hour-rain">${rain}%</div>`:'<div class="hour-rain" style="opacity:0">–</div>'}
    </div>`;
  });
  el.innerHTML = html;
}

function smallEmoji(type) {
  const m={'clear-day':'☀️','clear-night':'🌙','cloudy':'☁️','partly-cloudy-day':'⛅','partly-cloudy-night':'🌥️','rain':'🌧️','snow':'❄️','storm':'⛈️','fog':'🌫️'};
  return m[type]||'🌤';
}

// ===== DAILY =====
function renderDaily(d) {
  const el = document.getElementById('daily-list');
  if(!el) return;
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  let html = '';
  d.daily.time.forEach((t,i) => {
    const dt = new Date(t);
    const label = i===0?'Сегодня':i===1?'Завтра':days[dt.getDay()]+', '+dt.getDate()+' '+months[dt.getMonth()];
    const hi = Math.round(d.daily.temperature_2m_max[i]);
    const lo = Math.round(d.daily.temperature_2m_min[i]);
    const wc = d.daily.weather_code[i];
    const type = getWeatherType(wc,1);
    const rain = d.daily.precipitation_probability_max[i]||0;
    html += `<div class="daily-row">
      <div class="day-name">${label}</div>
      ${rain>20?`<div style="font-size:10px;color:#5BBCFF;margin-right:8px">${rain}%</div>`:''}
      <div style="font-size:20px;margin-right:12px">${smallEmoji(type)}</div>
      <div class="day-temps"><span class="day-hi">${hi}°</span><span class="day-lo">${lo}°</span></div>
    </div>`;
  });
  el.innerHTML = html;
}

// ===== DETAILS =====
function renderDetails(c) {
  const el = document.getElementById('details-grid');
  if(!el) return;

  const uvLevel = c.uv_index<=2?'Низкий':c.uv_index<=5?'Средний':c.uv_index<=7?'Высокий':'Оч. высокий';
  const uvPct = Math.min(100, c.uv_index/11*100);

  const windDir = c.wind_direction_10m;
  const dirs = ['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
  const dirName = dirs[Math.round(windDir/45)%8];

  el.innerHTML = `

// ===== SUN/MOON =====
function renderSunMoon(d) {
  const wrap = document.getElementById('sun-arc-wrap');
  const moonWrap = document.getElementById('moon-row-wrap');
  if(!wrap||!moonWrap) return;

  const sunrise = new Date(d.daily.sunrise[0]);
  const sunset = new Date(d.daily.sunset[0]);
  const now = new Date();

  const totalMs = sunset-sunrise;
  const elapsedMs = Math.min(Math.max(now-sunrise,0), totalMs);
  const pct = totalMs > 0 ? elapsedMs/totalMs : 0;

  const W=300, H=110, R=110, cx=150, cy=120;
  const startAngle = Math.PI;
  const endAngle = 0;

  function ptOnArc(t) {
    const a = Math.PI - t*Math.PI;
    return { x: cx + R*Math.cos(a), y: cy + R*Math.sin(a) };
  }

  const sunPt = ptOnArc(pct);
  const isNight = now < sunrise || now > sunset;

  wrap.innerHTML = `
    <svg class="arc-svg" viewBox="0 0 300 130" fill="none">
      <defs>
        <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(255,180,50,0.3)"/>
          <stop offset="100%" stop-color="rgba(255,80,50,0.3)"/>
        </linearGradient>
      </defs>
      <!-- Arc path -->
      <path d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none"/>
      <!-- Progress arc -->
      ${pct>0?`<path d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${sunPt.x} ${sunPt.y}" stroke="rgba(255,190,60,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/>`:''}
      <!-- Sun/Moon dot -->
      <circle cx="${sunPt.x}" cy="${sunPt.y}" r="8" fill="${isNight?'#C8D8FF':'#FFD700'}" style="filter:drop-shadow(0 0 8px ${isNight?'rgba(180,210,255,0.8)':'rgba(255,210,0,0.8)'})"/>
      <!-- Baseline -->
      <line x1="${cx-R-8}" y1="${cy}" x2="${cx+R+8}" y2="${cy}" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </svg>
    <div class="arc-text">
      <div><div style="font-size:16px">🌅</div><div>${fmt(sunrise)}</div></div>
      <div style="text-align:center">
        <div style="font-size:11px;color:var(--text-dim);letter-spacing:0.05em;text-transform:uppercase">День</div>
        <div style="font-size:16px;font-weight:300">${fmtDuration(totalMs)}</div>
      </div>
      <div style="text-align:right"><div style="font-size:16px">🌇</div><div>${fmt(sunset)}</div></div>
    </div>
  `;

  // Moon
  const moonPhase = d.daily.moon_phase?.[0] ?? 0;
  const moonEmoji = moonPhaseEmoji(moonPhase);
  const moonName = moonPhaseName(moonPhase);
  const illum = Math.round(Math.sin(moonPhase * Math.PI) * 100);

  moonWrap.innerHTML = `
    <div class="moon-row" style="border-top:1px solid rgba(255,255,255,0.05)">
      <div class="moon-emoji">${moonEmoji}</div>
      <div class="moon-info">
        <div class="moon-phase-name">${moonName}</div>
        <div class="moon-illum">Освещённость ${illum}%</div>
      </div>
      <div style="font-size:12px;color:var(--text-dim)">
        🌙 ${fmt(new Date(d.daily.sunset[0]))}
      </div>
    </div>`;
}

function fmt(d) { return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function fmtDuration(ms) {
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return h+'ч '+m+'м';
}
function moonPhaseEmoji(p) {
  if(p<0.06||p>0.94) return '🌑';
  if(p<0.19) return '🌒';
  if(p<0.31) return '🌓';
  if(p<0.44) return '🌔';
  if(p<0.56) return '🌕';
  if(p<0.69) return '🌖';
  if(p<0.81) return '🌗';
  return '🌘';
}
function moonPhaseName(p) {
  if(p<0.06||p>0.94) return 'Новолуние';
  if(p<0.19) return 'Растущий серп';
  if(p<0.31) return 'Первая четверть';
  if(p<0.44) return 'Растущая луна';
  if(p<0.56) return 'Полнолуние';
  if(p<0.69) return 'Убывающая луна';
  if(p<0.81) return 'Последняя четверть';
  return 'Убывающий серп';
}

// ===== BACKGROUND ANIMATION =====
const bgAnim = {
  canvas: null, ctx: null, raf: null,
  type: 'clear-day', particles: [],
  gradColors: {
    'clear-day': ['#0d1a3a','#1a3060','#0d2040'],
    'clear-night': ['#04040f','#080820','#0c0618'],
    'cloudy': ['#101520','#161e2a','#0e1520'],
    'partly-cloudy-day': ['#0e1e38','#162840','#0a1828'],
    'partly-cloudy-night': ['#060612','#0a0a1e','#060618'],
    'rain': ['#080e1a','#0c1420','#060c18'],
    'snow': ['#0c1420','#121a2a','#0a1228'],
    'storm': ['#080412','#0c081a','#06040e'],
    'fog': ['#10141e','#161c28','#0e1220']
  },
  currentGrad: [0,0,0,0,0,0,0,0,0],
  targetGrad: [0,0,0,0,0,0,0,0,0],

  start() {
    this.canvas = document.getElementById('bg-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', ()=>this.resize());
    this.initParticles();
    this.tick();
  },

  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  },

  setWeather(code, isDay) {
    this.type = getWeatherType(code, isDay);
    this.initParticles();
    const cols = this.gradColors[this.type] || this.gradColors['clear-day'];
    cols.forEach((c,i)=>{ this.targetGrad[i*3]=parseInt(c.slice(1,3),16); this.targetGrad[i*3+1]=parseInt(c.slice(3,5),16); this.targetGrad[i*3+2]=parseInt(c.slice(5,7),16); });
    if(this.currentGrad[0]===0) this.currentGrad=[...this.targetGrad];
  },

  initParticles() {
    this.particles = [];
    const W=this.canvas.width, H=this.canvas.height;
    if(this.type==='rain') {
      for(let i=0;i<180;i++) this.particles.push({ x:Math.random()*W, y:Math.random()*H, vy:8+Math.random()*6, vx:-1-Math.random(), len:10+Math.random()*15, alpha:0.15+Math.random()*0.35 });
    } else if(this.type==='snow') {
      for(let i=0;i<120;i++) this.particles.push({ x:Math.random()*W, y:Math.random()*H, vy:0.8+Math.random()*1.2, vx:Math.sin(i)*0.5, r:1.5+Math.random()*2.5, alpha:0.4+Math.random()*0.5, phase:Math.random()*Math.PI*2 });
    } else if(this.type==='clear-day'||this.type==='partly-cloudy-day') {
      for(let i=0;i<6;i++) this.particles.push({ x:Math.random()*W, y:Math.random()*H*0.7, r:60+Math.random()*120, alpha:0.015+Math.random()*0.025, phase:Math.random()*Math.PI*2, spd:0.002+Math.random()*0.002 });
    } else if(this.type==='storm') {
      this.lightningTimer = 0;
      this.lightningAlpha = 0;
    } else if(this.type==='clear-night') {
      for(let i=0;i<120;i++) this.particles.push({ x:Math.random()*W, y:Math.random()*H*0.6, r:0.5+Math.random()*1.5, alpha:0.3+Math.random()*0.7, phase:Math.random()*Math.PI*2, spd:0.5+Math.random()*1.5 });
    }
  },

  lerp(a,b,t){ return a+(b-a)*t; },

  tick() {
    const ctx=this.ctx, W=this.canvas.width, H=this.canvas.height;
    const t = Date.now()/1000;

    // lerp gradient
    for(let i=0;i<9;i++) this.currentGrad[i]=this.lerp(this.currentGrad[i],this.targetGrad[i],0.02);
    const c=this.currentGrad;
    const toHex=(v)=>`rgb(${Math.round(c[v])},${Math.round(c[v+1])},${Math.round(c[v+2])})`;

    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, toHex(0));
    grad.addColorStop(0.5, toHex(3));
    grad.addColorStop(1, toHex(6));
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // particles
    if(this.type==='rain') {
      ctx.strokeStyle='rgba(100,160,255,0.5)';
      ctx.lineWidth=1;
      this.particles.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy;
        if(p.y>H) { p.y=-20; p.x=Math.random()*W; }
        ctx.globalAlpha=p.alpha;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.vx*2,p.y-p.len); ctx.stroke();
      });
      ctx.globalAlpha=1;
    }

    else if(this.type==='snow') {
      this.particles.forEach(p=>{
        p.y+=p.vy; p.x+=Math.sin(t*p.spd+p.phase)*0.5;
        if(p.y>H) { p.y=-10; p.x=Math.random()*W; }
        ctx.globalAlpha=p.alpha;
        ctx.fillStyle='white';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;
    }

    else if(this.type==='clear-day'||this.type==='partly-cloudy-day') {
      this.particles.forEach(p=>{
        p.phase+=p.spd;
        const px=p.x+Math.sin(p.phase)*30, py=p.y+Math.cos(p.phase*0.7)*20;
        const g2=ctx.createRadialGradient(px,py,0,px,py,p.r);
        g2.addColorStop(0,`rgba(255,220,100,${p.alpha})`);
        g2.addColorStop(1,'transparent');
        ctx.fillStyle=g2; ctx.fillRect(px-p.r,py-p.r,p.r*2,p.r*2);
      });
    }

    else if(this.type==='clear-night') {
      this.particles.forEach(p=>{
        const flicker=0.5+0.5*Math.sin(t*p.spd+p.phase);
        ctx.globalAlpha=p.alpha*flicker;
        ctx.fillStyle='white';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;
    }

    else if(this.type==='storm') {
      this.lightningTimer = (this.lightningTimer||0)+1;
      if(this.lightningTimer>90+Math.random()*120) {
        this.lightningAlpha=1;
        this.lightningTimer=0;
      }
      if(this.lightningAlpha>0) {
        ctx.fillStyle=`rgba(180,160,255,${this.lightningAlpha*0.06})`;
        ctx.fillRect(0,0,W,H);
        this.lightningAlpha-=0.08;
      }
    }

    this.raf = requestAnimationFrame(()=>this.tick());
  }
};

// ===== LUM CANVAS ANIMATION =====
const lumAnim = {
  canvas:null, ctx:null, raf:null,
  particles:[], time:0,
  baseColor:[94,158,255],
  emotion:'happy', // happy, sad, sleepy, scared, hungry

  init() {
    this.canvas = document.getElementById('lum-canvas');
    if(!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.canvas.width = 220; this.canvas.height = 220;
    this.initParticles();
    this.canvas.addEventListener('click', ()=>this.onTap());
    this.tick();
  },

  setWeather(code, isDay) {
    if(!isDay) { this.baseColor=[80,60,160]; this.emotion='sleepy'; }
    else if(code>=95) { this.baseColor=[106,13,173]; this.emotion='scared'; }
    else if(code>=61) { this.baseColor=[74,144,217]; this.emotion='sad'; }
    else if(code>=71) { this.baseColor=[200,220,255]; this.emotion='sad'; }
    else { this.baseColor=[94,158,255]; this.emotion='happy'; }

    if(state.lumState && state.lumState.satiety<20) {
      this.baseColor=[200,80,80]; this.emotion='hungry';
    }
  },

  initParticles() {
    this.particles=[];
    for(let i=0;i<320;i++) {
      const angle=Math.random()*Math.PI*2;
      const r=20+Math.random()*40;
      this.particles.push({
        ox:Math.cos(angle)*r, oy:Math.sin(angle)*r,
        x:0,y:0,
        vx:0,vy:0,
        phase:Math.random()*Math.PI*2,
        spd:0.3+Math.random()*0.8,
        size:0.8+Math.random()*2.2,
        alpha:0.4+Math.random()*0.6,
        layer:Math.random()
      });
    }
  },

  onTap() {
    // burst
    this.particles.forEach(p=>{
      p.vx=(Math.random()-0.5)*4;
      p.vy=(Math.random()-0.5)*4;
    });
    setTimeout(()=>{ this.particles.forEach(p=>{p.vx=0;p.vy=0;}); },400);
  },

  tick() {
    this.time+=0.016;
    const ctx=this.ctx, W=220, H=220, cx=110, cy=115;
    ctx.clearRect(0,0,W,H);

    const t=this.time;
    const blink=Math.sin(t*0.3)*0.5+0.5 > 0.97 ? 0.6 : 1;
    const breathe=1+Math.sin(t*1.2)*0.04;
    const bounce=this.emotion==='happy'?Math.sin(t*2)*3:this.emotion==='sad'?Math.sin(t*0.5)*2:0;

    const spd=this.emotion==='sleepy'?0.4:this.emotion==='scared'?2.5:1;
    const [br,bg,bb]=this.baseColor;

    this.particles.forEach(p=>{
      const noise=Math.sin(t*p.spd*spd+p.phase)*8;
      const nx=p.ox+Math.cos(p.phase+t*0.3*spd)*noise;
      const ny=p.oy*blink+Math.sin(p.phase+t*0.2*spd)*noise;

      p.x=cx+nx*breathe+p.vx;
      p.y=cy+ny*breathe+p.vy+bounce;

      const dist=Math.sqrt(p.ox*p.ox+p.oy*p.oy)/60;
      const alpha=p.alpha*(0.6+0.4*p.layer);

      const r2=br+(this.emotion==='scared'?Math.sin(t*8)*20:0);

      ctx.globalAlpha=alpha*0.85;
      ctx.fillStyle=`rgb(${Math.round(r2)},${Math.round(bg)},${Math.round(bb)})`;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*(1-dist*0.3),0,Math.PI*2);
      ctx.fill();
    });

    // glow
    const grd=ctx.createRadialGradient(cx,cy+bounce,0,cx,cy+bounce,65);
    grd.addColorStop(0,`rgba(${br},${bg},${bb},0.12)`);
    grd.addColorStop(1,'transparent');
    ctx.globalAlpha=1;
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(cx,cy+bounce,65,0,Math.PI*2); ctx.fill();

    this.raf=requestAnimationFrame(()=>this.tick());
  }
};

// ===== LUM STATE =====
function updateLumState() {
  const ls=state.lumState;
  if(!ls) return;
  const now=Date.now();
  const last=ls.lastFeed?new Date(ls.lastFeed).getTime():now-86400000;
  const hrs=(now-last)/3600000;
  ls.satiety=Math.max(0, Math.round(100-hrs*4));
  ls.mood=Math.max(0,Math.min(100, ls.satiety*0.6+ls.friendship*0.4));
  state.lumState=ls;

  if(ls.satiety<20) {
    document.getElementById('lum-dot').style.display='block';
  }
}

function feedLum() {
  const ls=state.lumState;
  const today=new Date().toDateString();
  if(ls.lastFeed!==today) {
    ls.satiety=Math.min(100,ls.satiety+20);
    ls.lastFeed=today;
    if(ls.lastVisit) {
      const prev=new Date(ls.lastVisit).toDateString();
      const yest=new Date(Date.now()-86400000).toDateString();
      if(prev===yest) ls.streak=(ls.streak||0)+1;
      else if(prev!==today) ls.streak=1;
      if(prev!==today) ls.friendship=Math.min(100,ls.friendship+5);
    }
    ls.lastVisit=new Date().toISOString();
  }
  ls.mood=Math.min(100,ls.satiety*0.6+ls.friendship*0.4);
  S.set('lum_state',ls);
  updateLumState();
  renderLumScreen();
}

function renderLumScreen() {
  const ls=state.lumState;
  if(!ls) return;

  const statsEl=document.getElementById('lum-stats-wrap');
  if(statsEl) {
    const bars=[
      {label:'Сытость',val:ls.satiety,color:'#5E9EFF'},
      {label:'Настроение',val:ls.mood,color:'#A78BFA'},
      {label:'Дружба',val:ls.friendship,color:'#34D399'}
    ];
    statsEl.innerHTML=bars.map(b=>`
      <div class="lum-stat-row">
        <div class="lum-stat-label">${b.label}</div>
        <div class="lum-stat-bar"><div class="lum-stat-fill" style="width:${b.val}%;background:${b.color}"></div></div>
        <div class="lum-stat-pct">${b.val}%</div>
      </div>`).join('');
  }

  const moodEl=document.getElementById('lum-mood-text');
  if(moodEl) {
    const mood=ls.satiety<20?'Голодный 😟':ls.mood>70?'Весёлый ✨':ls.mood>40?'Спокойный 😌':'Грустный 😔';
    moodEl.textContent=mood;
  }

  const lastEl=document.getElementById('lum-last-visit');
  if(lastEl && ls.lastVisit) {
    const d=new Date(ls.lastVisit);
    const now=new Date();
    const diffH=(now-d)/3600000;
    lastEl.textContent=diffH<24?'Сегодня':diffH<48?'Вчера':`${Math.floor(diffH/24)} дня назад`;
  }

  const strkEl=document.getElementById('lum-streak');
  if(strkEl) strkEl.textContent=(ls.streak||1)+' 🔥';
}

function setupChat() {
  const field=document.getElementById('chat-field');
  const btn=document.getElementById('send-btn');

  field.addEventListener('input',()=>{
    btn.disabled=!field.value.trim();
    field.style.height='auto';
    field.style.height=Math.min(field.scrollHeight,90)+'px';
  });
  field.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!btn.disabled) sendMsg(); }
  });
  btn.addEventListener('click',sendMsg);

  // restore
  state.chatMessages.forEach(m=>addMsgBubble(m.role,m.content,false));
  if(!state.chatMessages.length) {
    addMsgBubble('ai','Привет! Я Люм 👋 Спроси меня о погоде или просто пообщайся 🌤',false);
  }
  scrollChat();
}

async function sendMsg() {
  const field=document.getElementById('chat-field');
  const text=field.value.trim();
  if(!text) return;
  field.value=''; field.style.height='auto';
  document.getElementById('send-btn').disabled=true;

  addMsgBubble('user',text,true);
  feedLum();

  // typing
  const typingId='typing-'+Date.now();
  const msgArea=document.getElementById('chat-messages');
  const div=document.createElement('div');
  div.className='msg ai'; div.id=typingId;
  div.innerHTML=`<div class="lum-avatar">✨</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgArea.appendChild(div);
  scrollChat();

  const weatherCtx = state.weather ? {
    city: state.cityName,
    temp: Math.round(state.weather.current.temperature_2m),
    feels: Math.round(state.weather.current.apparent_temperature),
    desc: wmoDesc(state.weather.current.weather_code),
    humidity: state.weather.current.relative_humidity_2m,
    wind: (state.weather.current.wind_speed_10m/3.6).toFixed(1)
  } : null;

  try {
    const body = {
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: `Ты — Люм, милый ИИ-питомец и погодный ассистент. Характер: дружелюбный, заботливый, иногда игривый. Отвечай по-русски, кратко (2-4 предложения). Используй 1-2 эмодзи. Текущая погода: ${JSON.stringify(weatherCtx)}`,
      messages: [
        ...state.chatMessages.slice(-8).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.content})),
        {role:'user',content:text}
      ]
    };

    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    const d=await r.json();
    const reply=d.content?.[0]?.text||'Я не смог ответить 😔';

    document.getElementById(typingId)?.remove();
    addMsgBubble('ai',reply,true);
    state.chatMessages.push({role:'user',content:text},{role:'ai',content:reply});
    S.set('lum_chat',state.chatMessages.slice(-30));
  } catch(e) {
    document.getElementById(typingId)?.remove();
    const fallback=genFallback(text, weatherCtx);
    addMsgBubble('ai',fallback,true);
    state.chatMessages.push({role:'user',content:text},{role:'ai',content:fallback});
  }
}

function genFallback(q, w) {
  if(!w) return 'Погода ещё загружается, попробуй чуть позже 🌤';
  const q2=q.toLowerCase();
  if(q2.includes('надеть')||q2.includes('одеть')) {
    if(w.temp<5) return `Сегодня ${w.temp}° — одевайся тепло! Пуховик, шапка и перчатки обязательны 🧤`;
    if(w.temp<15) return `${w.temp}° — куртка и джинсы самое то. Утром может быть прохладнее 🧥`;
    if(w.temp<22) return `Приятные ${w.temp}°! Лёгкая куртка или кофта вечером не помешает 👕`;
    return `Отличные ${w.temp}°! Можно надеть что-то лёгкое — майку или рубашку ☀️`;
  }
  if(q2.includes('взять')||q2.includes('зонт')) {
    if(w.desc.includes('дождь')||w.desc.includes('ливень')) return `Сегодня дождь — обязательно возьми зонт! ${w.temp}°, так что и куртка не помешает ☔`;
    return `Сегодня ${w.desc.toLowerCase()}, зонт вряд ли понадобится 🌤`;
  }
  return `Сейчас в ${w.city}: ${w.temp}°, ${w.desc.toLowerCase()}. Ощущается как ${w.feels}°, влажность ${w.humidity}% 🌤`;
}

function addMsgBubble(role, text, animate=true) {
  const el=document.getElementById('chat-messages');
  const div=document.createElement('div');
  div.className=`msg ${role}`;
  if(!animate) div.style.animation='none';
  div.innerHTML=role==='ai'
    ?`<div class="lum-avatar">✨</div><div class="msg-bubble">${text}</div>`
    :`<div class="msg-bubble">${text}</div>`;
  el.appendChild(div);
  if(animate) scrollChat();
}

function scrollChat() {
  const el=document.getElementById('chat-messages');
  if(el) setTimeout(()=>el.scrollTo({top:el.scrollHeight,behavior:'smooth'}),50);
}

// ===== FAVORITES =====
function renderFavorites() {
  const el=document.getElementById('fav-grid');
  if(!el) return;
  if(!state.favorites.length) {
    el.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--text-dim);font-size:14px">Найди и добавь города 🗺</div>`;
    return;
  }
  el.innerHTML=state.favorites.map((c,i)=>`
    <div class="fav-card" onclick="loadFavorite(${i})">
      <button class="fav-remove" onclick="event.stopPropagation();removeFav(${i})">✕</button>
      <div class="fav-city">${c.name}</div>
      <div class="fav-country">${c.country}</div>
      <div class="fav-temp">${c.temp!==undefined?c.temp+'°':'–°'}</div>
      <div class="fav-desc">${c.desc||''}</div>
    </div>`).join('');
}

function removeFav(i) {
  state.favorites.splice(i,1);
  S.set('lum_favorites',state.favorites);
  renderFavorites();
}

async function loadFavorite(i) {
  const c=state.favorites[i];
  state.lat=c.lat; state.lon=c.lon; state.cityName=c.name;
  switchTab('home');
  await loadWeather();
  showToast('📍 '+c.name);
}

// ===== SEARCH =====
function setupSearch() {
  const field=document.getElementById('search-field');
  const results=document.getElementById('search-results');
  if(!field) return;

  let debounce;
  field.addEventListener('input',()=>{
    clearTimeout(debounce);
    const q=field.value.trim();
    if(q.length<2) { results.style.display='none'; return; }
    debounce=setTimeout(async()=>{
      const d=await searchCity(q);
      if(!d.results?.length) { results.style.display='none'; return; }
      results.style.display='block';
      results.innerHTML=d.results.map(r=>`
        <div class="search-item" onclick="selectCity(${r.latitude},${r.longitude},'${r.name}','${r.country||''}')">
          <div class="search-city">${r.name}</div>
          <div style="font-size:11px;color:var(--text-dim)">${r.admin1||''} ${r.country||''}</div>
        </div>`).join('');
    },300);
  });

  document.addEventListener('click',e=>{
    if(!field.contains(e.target)&&!results.contains(e.target)) results.style.display='none';
  });
}

async function selectCity(lat,lon,name,country) {
  document.getElementById('search-results').style.display='none';
  document.getElementById('search-field').value='';

  // fetch quick weather
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);
  const d=await r.json();
  const temp=Math.round(d.current.temperature_2m);
  const desc=wmoDesc(d.current.weather_code);

  const exists=state.favorites.findIndex(f=>f.name===name);
  if(exists===-1) {
    state.favorites.push({name,country,lat,lon,temp,desc});
    S.set('lum_favorites',state.favorites);
    showToast('❤️ '+name+' добавлен');
  } else {
    showToast('📍 '+name+' уже в избранном');
  }
  renderFavorites();
}

// ===== PULL TO REFRESH =====
function setupPullToRefresh() {
  const scroll=document.getElementById('home-scroll');
  const ptr=document.getElementById('ptr');
  if(!scroll||!ptr) return;
  let startY=0, pulling=false, triggered=false;

  scroll.addEventListener('touchstart',e=>{ if(scroll.scrollTop===0){startY=e.touches[0].clientY; pulling=true; triggered=false;} },{passive:true});
  scroll.addEventListener('touchmove',e=>{
    if(!pulling) return;
    const dy=e.touches[0].clientY-startY;
    if(dy>60&&!triggered) {
      ptr.classList.add('visible');
      ptr.style.transform=`translateX(-50%) translateY(${Math.min(dy-60,20)}px)`;
      triggered=true;
    }
  },{passive:true});
  scroll.addEventListener('touchend',async()=>{
    if(triggered) {
      await loadWeather();
      setTimeout(()=>{ ptr.classList.remove('visible'); ptr.style.transform='translateX(-50%) translateY(-40px)'; },600);
    }
    pulling=false; triggered=false;
  });
}

// ===== NAV =====
function setupNav() {
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
  });
}

function switchTab(tab) {
  state.currentTab=tab;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===tab);
  });
  document.getElementById('screen-'+tab)?.classList.add('active');
  document.getElementById('chat-input-wrap').classList.toggle('visible', tab==='chat');

  if(tab==='lum') { renderLumScreen(); lumAnim.init(); }
  if(tab==='saved') renderFavorites();
  if(tab==='chat') { renderChatHints(); scrollChat(); }
}

// ===== TOAST =====
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ===== START =====
init();
</script>

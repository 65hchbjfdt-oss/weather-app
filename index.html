<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Anomaly Radar</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #0A84FF; 
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --glass-bg: rgba(25, 25, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --blur: blur(40px) saturate(180%);
        }
        
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, system-ui, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.7); }
        
        .ui-panel {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; 
            background: var(--glass-bg);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); 
            border-radius: 36px; padding: 22px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 16px; margin: 6px 0; border: none; border-radius: 20px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
            background: var(--ios-blue); color: #fff;
        }
        .btn-sec { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn:active { transform: scale(0.97); }

        /* Scanning Log */
        .scan-log { text-align: left; font-family: 'Courier New', monospace; font-size: 13px; color: var(--ios-blue); }
        .log-item { margin: 8px 0; opacity: 0.3; transition: opacity 0.3s; display: flex; justify-content: space-between; }
        .log-item.active { opacity: 1; }
        .log-item.done { color: var(--ios-green); opacity: 1; }

        /* Radar UI */
        #radar {
            width: 70px; height: 70px; margin: 0 auto 10px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; position: relative;
        }
        #radar-arrow {
            position: absolute; top: 50%; left: 50%; width: 2px; height: 32px;
            background: var(--ios-green); transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg); transition: transform 0.6s ease-out;
            box-shadow: 0 0 10px var(--ios-green);
        }

        /* Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 30px; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
            background: #fff; margin-top: -9px;
        }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            width: 85%; max-width: 320px; background: var(--glass-bg);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border-radius: 30px; padding: 25px; display: none; z-index: 1000; opacity: 0;
            transition: all 0.3s ease; border: 1px solid var(--glass-border);
        }
        .active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }

        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 30px; height: 30px;
            z-index: 50; border: 1.5px solid var(--ios-green); border-radius: 50%;
        }
        
        .custom-alert {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            background: var(--ios-red); padding: 12px 20px; border-radius: 20px;
            z-index: 2000; font-size: 13px; display: none;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>
<div id="iosAlert" class="custom-alert"></div>

<div class="ui-panel">
    <div id="radar-ui" style="display:none; text-align: center;">
        <div id="radar"><div id="radar-arrow"></div></div>
        <div id="distance-text" style="font-size: 10px; color: var(--ios-green); font-weight: 800;">СИГНАЛ: 0%</div>
    </div>

    <div id="scan-box" style="display:none;">
        <div class="scan-log">
            <div id="step-1" class="log-item"><span>1. ГЕНЕРАЦИЯ ПУЛА ТОЧЕК...</span><span class="status"></span></div>
            <div id="step-2" class="log-item"><span>2. ФИЛЬТРАЦИЯ КАТЕГОРИИ...</span><span class="status"></span></div>
            <div id="step-3" class="log-item"><span>3. ПОИСК ЧАСТОТЫ (S-WAV)...</span><span class="status"></span></div>
            <div id="step-4" class="log-item"><span>4. ПОДТВЕРЖДЕНИЕ СИГНАЛА...</span><span class="status"></span></div>
        </div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-sec" onclick="openM('settings')">Параметры</button>
            <button class="btn btn-sec" style="color: var(--ios-blue);" onclick="resetToLocation()">Локация</button>
        </div>
        <button class="btn" id="mainBtn" onclick="executeScan()">ЗАПУСК ПОИСКА</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--ios-green);" onclick="buildRoute()">В ПУТЬ</button>
        <button class="btn btn-sec" onclick="resetSystem()">СБРОС СИСТЕМЫ</button>
    </div>
</div>

<div id="settings" class="modal">
    <h3 style="text-align:center; margin-top:0;">Настройки детектора</h3>
    <label style="font-size: 12px; opacity: 0.6;">КАТЕГОРИЯ</label>
    <select id="catSelect" style="width:100%; background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--glass-border); padding:12px; border-radius:12px; margin: 8px 0 15px;">
        <option value="quantum">Квантовый разрыв</option>
        <option value="power">Энерго-узел</option>
        <option value="void">Пустошь</option>
    </select>
    
    <label style="font-size: 12px; opacity: 0.6;">РАДИУС: <span id="rL" style="color:var(--ios-blue)">5</span> км</label>
    <input type="range" id="radiusIn" min="1" max="15" value="5" oninput="syncUI()">
    
    <label style="font-size: 12px; opacity: 0.6; margin-top: 10px; display: block;">ЖЕЛАЕМАЯ МОЩНОСТЬ: <span id="pL" style="color:var(--ios-green)">25</span>%</label>
    <input type="range" id="powerIn" min="1" max="100" value="25" oninput="syncUI()">

    <button class="btn" style="margin-top:20px" onclick="closeM()">СОХРАНИТЬ</button>
</div>

<script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let map, userPos, searchOrigin, targetPoint;
    let radarInterval;

    const STYLES = { dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json' };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        searchOrigin = [...userPos];
        map.setCenter(userPos);
        new maplibregl.Marker({ color: '#0A84FF' }).setLngLat(userPos).addTo(map);
        syncUI();
    });

    function syncUI() {
        document.getElementById('rL').innerText = document.getElementById('radiusIn').value;
        document.getElementById('pL').innerText = document.getElementById('powerIn').value;
        if (searchOrigin) {
            const r = document.getElementById('radiusIn').value;
            const circle = genCircle(searchOrigin, r);
            if (map.getSource('rad')) {
                map.getSource('rad').setData(circle);
            } else {
                map.addSource('rad', { type: 'geojson', data: circle });
                map.addLayer({ id: 'rad-line', type: 'line', source: 'rad', paint: { 'line-color': '#0A84FF', 'line-width': 1, 'line-dasharray': [2, 2] } });
            }
        }
    }

    function resetToLocation() {
        if (!userPos) return;
        searchOrigin = [...userPos];
        map.flyTo({ center: userPos, zoom: 11 });
        syncUI();
    }

    async function executeScan() {
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        
        const steps = ['step-1', 'step-2', 'step-3', 'step-4'];
        const mode = document.getElementById('catSelect').value;
        const radius = parseInt(document.getElementById('radiusIn').value);
        const targetPower = parseInt(document.getElementById('powerIn').value);

        // 1. Пул точек
        await updateStep(steps[0]);
        let pool = [];
        for(let i=0; i<300; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = (Math.sqrt(Math.random()) * radius) / 111;
            pool.push({
                coords: [searchOrigin[0] + d * Math.cos(a), searchOrigin[1] + d * Math.sin(a)],
                weight: Math.floor(Math.random() * 100) + 1
            });
        }

        // 2. Фильтрация (Имитация проверки OSM)
        await updateStep(steps[1]);
        // Здесь мы просто имитируем задержку "анализа" местности
        await new Promise(r => setTimeout(r, 800));

        // 3. Поиск частоты (выбор ближайшей по мощности)
        await updateStep(steps[2]);
        let bestMatch = pool.reduce((prev, curr) => 
            Math.abs(curr.weight - targetPower) < Math.abs(prev.weight - targetPower) ? curr : prev
        );

        // 4. Подтверждение
        await updateStep(steps[3]);
        
        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            targetPoint = bestMatch.coords;
            startRadar(bestMatch.weight);
            showTarget(bestMatch.weight);
        }, 600);
    }

    async function updateStep(id) {
        const el = document.getElementById(id);
        el.classList.add('active');
        await new Promise(r => setTimeout(r, 700));
        el.querySelector('.status').innerText = '✓';
        el.classList.add('done');
    }

    function startRadar(initialWeight) {
        document.getElementById('radar-ui').style.display = 'block';
        radarInterval = setInterval(() => {
            const dist = getDistance(userPos, targetPoint);
            const maxR = document.getElementById('radiusIn').value * 1000;
            
            // Сигнал зависит от близости к аномалии + небольшая флуктуация
            let baseSignal = Math.max(0, (1 - dist / maxR) * 100);
            let drift = (Math.random() - 0.5) * 15;
            let current = Math.max(0, Math.min(100, baseSignal + drift));

            document.getElementById('radar-arrow').style.transform = `translate(-50%, -100%) rotate(${current * 3.6}deg)`;
            document.getElementById('distance-text').innerText = `СИГНАЛ: ${current.toFixed(0)}%`;
        }, 600);
    }

    function showTarget(weight) {
        if (window.m) window.m.remove();
        const el = document.createElement('div');
        el.style.cssText = "width:12px; height:12px; background:var(--ios-red); border-radius:50%; box-shadow: 0 0 15px var(--ios-red);";
        window.m = new maplibregl.Marker(el).setLngLat(targetPoint).addTo(map);
        map.flyTo({ center: targetPoint, zoom: 15, duration: 2500 });
        document.getElementById('ui-found').style.display = 'block';
    }

    function resetSystem() {
        clearInterval(radarInterval);
        if (window.m) window.m.remove();
        document.querySelectorAll('.log-item').forEach(i => { i.classList.remove('active', 'done'); i.querySelector('.status').innerText = ''; });
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('radar-ui').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
    }

    function genCircle(c, km) {
        const p = 64; const res = [];
        const dx = km / (111.32 * Math.cos(c[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i <= p; i++) {
            const a = (i / p) * (Math.PI * 2);
            res.push([c[0] + dx * Math.cos(a), c[1] + dy * Math.sin(a)]);
        }
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [res] } };
    }

    function getDistance(p1, p2) {
        const R = 6371000;
        const dLat = (p2[1]-p1[1]) * Math.PI/180;
        const dLon = (p2[0]-p1[0]) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1[1]*Math.PI/180)*Math.cos(p2[1]*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

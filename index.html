<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Deep Scan & Sound</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { --glass: rgba(10, 10, 10, 0.8); --accent: #7800ff; --green: #00ff66; }
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* Glass UI */
        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            padding: 20px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 15px;
            font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s;
            background: var(--accent); color: #fff; text-transform: uppercase;
        }
        .btn-sec { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        #scan-box { display: none; text-align: center; margin: 15px 0; }
        .pulse {
            width: 20px; height: 20px; background: var(--accent); border-radius: 50%;
            margin: 0 auto 10px; animation: pulse-anim 1s infinite;
        }
        @keyframes pulse-anim { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(120,0,255,0.7); }
            70% { transform: scale(1.5); box-shadow: 0 0 0 20px rgba(120,0,255,0); }
            100% { transform: scale(1); }
        }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; background: #0a0a0a; border: 1px solid #333;
            border-radius: 25px; padding: 25px; display: none; z-index: 1000;
        }
        .active { display: block; }
        .val { float: right; color: var(--accent); font-family: monospace; }
        input[type=range] { width: 100%; accent-color: var(--accent); margin: 15px 0; }
        #status-text { font-size: 11px; text-transform: uppercase; color: #555; text-align: center; margin-bottom: 8px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ui-panel">
    <div id="status-text">Сканер готов</div>
    
    <div id="scan-box">
        <div class="pulse"></div>
        <div style="font-size: 12px; letter-spacing: 2px;">ПОИСК СИГНАЛА...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" onclick="playSound('click'); openM('settings')">⚙</button>
            <button class="btn btn-sec" style="flex:3" onclick="playSound('click'); openM('info')">ИНФО</button>
        </div>
        <button class="btn" onclick="startScan()">Искать аномалию</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--green); color: #000;" onclick="playSound('click'); buildPath()">ПРОЛОЖИТЬ КУРС</button>
        <button class="btn btn-sec" onclick="playSound('click'); resetMap()">СБРОС</button>
    </div>
</div>

<div id="settings" class="modal">
    <h3 style="margin-top:0">ПАРАМЕТРЫ</h3>
    <label>Радиус <span class="val" id="rL">5 км</span></label>
    <input type="range" id="radiusInput" min="1" max="15" value="5" oninput="updateCircle()">
    
    <label>Тип</label>
    <select id="typeSelect" style="width:100%; background:#111; color:#fff; border:1px solid #333; padding:12px; border-radius:12px; margin-top:10px;">
        <option value="Пустота">ПУСТОТА</option>
        <option value="Квантовая">КВАНТОВАЯ</option>
        <option value="Обычная">ОБЫЧНАЯ</option>
    </select>
    <button class="btn" style="margin-top:20px" onclick="playSound('click'); closeM()">ЗАКРЫТЬ</button>
</div>

<div id="info" class="modal">
    <h3>ЛОГ СИСТЕМЫ</h3>
    <div id="infoContent" style="font-size: 13px; color: #888;">Данных пока нет. Начните сканирование сектора.</div>
    <button class="btn btn-sec" style="margin-top:20px" onclick="closeM()">ПОНЯТНО</button>
</div>

<script>
    // --- ЗВУКОВОЙ ДВИЖОК ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'scan') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'found') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'error') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // --- КАРТА ---
    let map, userPos, scanMarker;
    
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [37.617, 55.755],
        zoom: 12,
        attributionControl: false
    });

    map.on('load', () => {
        navigator.geolocation.getCurrentPosition(pos => {
            userPos = [pos.coords.longitude, pos.coords.latitude];
            map.setCenter(userPos);
            new maplibregl.Marker({ color: '#00ffff' }).setLngLat(userPos).addTo(map);
            
            // Инициализация источника круга
            map.addSource('circle-src', { type: 'geojson', data: getCircleGeoJSON(userPos, 5) });
            map.addLayer({
                id: 'circle-layer', type: 'fill', source: 'circle-src',
                paint: { 'fill-color': '#7800ff', 'fill-opacity': 0.15, 'fill-outline-color': '#7800ff' }
            });
        });
    });

    function getCircleGeoJSON(center, radiusKm) {
        const points = 64;
        const coords = { lat: center[1], lng: center[0] };
        const ret = [];
        const distanceX = radiusKm / (111.32 * Math.cos(coords.lat * Math.PI / 180));
        const distanceY = radiusKm / 110.574;

        for (let i = 0; i < points; i++) {
            const theta = (i / points) * (2 * Math.PI);
            ret.push([coords.lng + distanceX * Math.cos(theta), coords.lat + distanceY * Math.sin(theta)]);
        }
        ret.push(ret[0]);
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ret] } };
    }

    function updateCircle() {
        const r = document.getElementById('radiusInput').value;
        document.getElementById('rL').innerText = r + ' км';
        if (map.getSource('circle-src')) {
            map.getSource('circle-src').setData(getCircleGeoJSON(userPos, r));
        }
    }

    async function startScan() {
        playSound('click');
        const status = document.getElementById('status-text');
        const radius = document.getElementById('radiusInput').value;
        const cat = document.getElementById('typeSelect').value;
        
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        status.innerText = "Идет захват цели...";

        const scanInterval = setInterval(() => playSound('scan'), 600);

        // Алгоритм поиска (упрощенная имитация хардкорного поиска)
        setTimeout(async () => {
            clearInterval(scanInterval);
            let found = null;
            
            // 80% шанс найти что-то, если не "Пустота"
            if (cat === "Пустота" && Math.random() > 0.5) found = null;
            else {
                const angle = Math.random() * Math.PI * 2;
                const d = Math.random() * (radius / 111);
                found = [userPos[0] + d * Math.cos(angle), userPos[1] + d * Math.sin(angle)];
            }

            document.getElementById('scan-box').style.display = 'none';
            if (found) {
                playSound('found');
                status.innerText = "Объект зафиксирован";
                window.target = found;
                if (scanMarker) scanMarker.remove();
                scanMarker = new maplibregl.Marker({ color: '#ff0055' }).setLngLat(found).addTo(map);
                map.flyTo({ center: found, zoom: 14 });
                document.getElementById('ui-found').style.display = 'block';
                document.getElementById('infoContent').innerText = `Тип: ${cat}\nКоординаты: ${found[1].toFixed(5)}, ${found[0].toFixed(5)}`;
            } else {
                playSound('error');
                status.innerText = "Сектор пуст";
                document.getElementById('ui-idle').style.display = 'block';
                alert("В радиусе " + radius + " км аномалий типа " + cat + " не обнаружено.");
            }
        }, 3000);
    }

    async function buildPath() {
        const url = `https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${window.target[0]},${window.target[1]}?geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        map.addSource('route', { type: 'geojson', data: data.routes[0].geometry });
        map.addLayer({
            id: 'route', type: 'line', source: 'route',
            paint: { 'line-color': '#00ff66', 'line-width': 4 }
        });
    }

    function resetMap() {
        if (scanMarker) scanMarker.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        document.getElementById('status-text').innerText = "Сканер готов";
        map.flyTo({ center: userPos, zoom: 12 });
    }

    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>KiwiWay - Anomaly Radar</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #0A84FF; 
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --glass-bg: rgba(25, 25, 25, 0.5);
            --glass-border: rgba(255, 255, 255, 0.12);
            --blur: blur(40px) saturate(180%);
        }
        
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.7) contrast(1.2); }
        
        /* Жидкое стекло (Liquid Glass) */
        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; 
            background: var(--glass-bg);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); 
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px; padding: 24px; box-sizing: border-box; z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .btn {
            width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 22px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.4s cubic-bezier(0.15, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.08); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-main { background: var(--ios-blue); box-shadow: 0 10px 20px rgba(10, 132, 255, 0.3); }
        .btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.15); }

        /* Radar Unit */
        #radar {
            width: 80px; height: 80px; margin: 0 auto 15px; border: 1px solid rgba(48, 209, 88, 0.3);
            border-radius: 50%; position: relative; 
            background: radial-gradient(circle, rgba(48, 209, 88, 0.1) 0%, transparent 75%);
        }
        #radar-arrow {
            position: absolute; top: 50%; left: 50%; width: 2px; height: 38px;
            background: var(--ios-green); transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg); 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--ios-green);
        }

        /* Анимация импульса от точки поиска */
        .pulse-ring {
            position: absolute; border: 2px solid var(--ios-blue);
            border-radius: 50%; pointer-events: none; z-index: 5;
            transform: translate(-50%, -50%);
            animation: ring-grow 3s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
        }
        @keyframes ring-grow {
            0% { width: 0; height: 0; opacity: 0.8; border-width: 4px; }
            100% { width: 600px; height: 600px; opacity: 0; border-width: 1px; }
        }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.9);
            width: 85%; max-width: 320px; background: rgba(30, 30, 30, 0.8);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border-radius: 35px; padding: 25px; display: none; z-index: 1000; 
            border: 1px solid var(--glass-border); opacity: 0; transition: all 0.5s cubic-bezier(0.15, 1, 0.3, 1);
        }
        .active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        
        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 40px; height: 40px;
            z-index: 50; border: 2px solid #fff; border-radius: 50%;
            mix-blend-mode: difference;
        }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 100%; height: 2px; background: #fff; transform: translate(-50%, -50%); }
        #crosshair::before { content: ''; position: absolute; top: 50%; left: 50%; height: 100%; width: 2px; background: #fff; transform: translate(-50%, -50%); }

        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #fff; margin-top: -9px; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>
<div id="pulse-container" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></div>

<div class="ui-panel">
    <div id="radar-ui" style="display:none; text-align: center;">
        <div id="radar"><div id="radar-arrow"></div></div>
        <div id="distance-text" style="font-size: 12px; letter-spacing: 2px; color: var(--ios-green); font-weight: 700;">СИГНАЛ: 0%</div>
    </div>

    <div id="scan-box" style="display:none; text-align:center; padding: 20px 0;">
        <div style="font-size: 12px; color: var(--ios-blue); letter-spacing: 3px; font-weight: 700; animation: pulse 2s infinite ease-in-out;">СКАНИРОВАНИЕ ЭФИРА...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn" style="flex:1" onclick="openM('settings')">Опции</button>
            <button class="btn" style="flex:1" onclick="openM('map-styles')">Слои</button>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn" style="flex:1" onclick="toggleSelect()" id="selectBtn">📍 Метка</button>
            <button class="btn" style="flex:1; color: var(--ios-blue);" onclick="resetToUser()">🎯 Центр</button>
        </div>
        <button class="btn btn-main" id="mainBtn" onclick="executeScan()">НАЧАТЬ ПОИСК</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--ios-green); color: #000;" onclick="openM('info')">ПОДРОБНЕЕ</button>
        <button class="btn" style="color: var(--ios-red);" onclick="resetSystem()">СБРОСИТЬ</button>
    </div>
</div>

<div id="settings" class="modal">
    <h3 style="text-align:center; font-weight: 600;">Настройки</h3>
    <p style="font-size: 12px; opacity: 0.5;">РАДИУС: <span id="rL">5</span> км</p>
    <input type="range" id="radiusIn" min="1" max="15" value="5" oninput="syncUI()">
    <p style="font-size: 12px; opacity: 0.5; margin-top:15px;">МОЩНОСТЬ: <span id="pL">25</span>%</p>
    <input type="range" id="powerIn" min="1" max="100" value="25" oninput="syncUI()">
    <div style="display:flex; justify-content: space-between; margin-top:20px; font-size:14px;">
        <span>Звук</span>
        <input type="checkbox" id="soundToggle" checked>
    </div>
    <button class="btn btn-main" style="margin-top:25px" onclick="closeM()">ГОТОВО</button>
</div>

<div id="info" class="modal">
    <h2 id="anomalyName" style="color: var(--ios-green); margin:0 0 10px;"></h2>
    <div id="infoBody" style="font-size: 14px; line-height: 1.5; opacity: 0.9;"></div>
    <div id="coordsBox" style="margin-top:20px; font-family: monospace; background:rgba(255,255,255,0.05); padding:12px; border-radius:15px; font-size:12px;"></div>
    <button class="btn btn-main" style="margin-top:20px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<div id="map-styles" class="modal">
    <button class="btn" onclick="setMapStyle('dark')">ТЕМНАЯ</button>
    <button class="btn" onclick="setMapStyle('sat')">СПУТНИК</button>
    <button class="btn" style="margin-top:15px; border:none;" onclick="closeM()">ОТМЕНА</button>
</div>

<script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let map, userPos, searchOrigin, targetPoint, isSelecting = false;
    let radarInterval;

    // Apple-style Таинственный Звук
    function playMysterySound() {
        if (!document.getElementById('soundToggle').checked) return;
        const now = ctx.currentTime;
        
        // 1. Глубокий "Пульс" (Bass)
        const bass = ctx.createOscillator();
        const bassGain = ctx.createGain();
        bass.type = 'sine';
        bass.frequency.setValueAtTime(20, now);
        bass.frequency.exponentialRampToValueAtTime(45, now + 3);
        bassGain.gain.setValueAtTime(0, now);
        bassGain.gain.linearRampToValueAtTime(0.4, now + 0.5);
        bassGain.gain.linearRampToValueAtTime(0, now + 3.5);
        bass.connect(bassGain).connect(ctx.destination);
        
        // 2. Таинственный резонанс (High-end)
        const chime = ctx.createOscillator();
        const chimeGain = ctx.createGain();
        chime.type = 'triangle';
        chime.frequency.setValueAtTime(880, now);
        chime.frequency.exponentialRampToValueAtTime(440, now + 3);
        chimeGain.gain.setValueAtTime(0, now);
        chimeGain.gain.linearRampToValueAtTime(0.05, now + 0.2);
        chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 3);
        chime.connect(chimeGain).connect(ctx.destination);

        bass.start(); bass.stop(now + 3.5);
        chime.start(); chime.stop(now + 3);
    }

    function playTap() {
        if (!document.getElementById('soundToggle').checked) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
        g.gain.setValueAtTime(0.1, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
        osc.connect(g).connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    }

    const STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        sat: { "version": 8, "sources": { "s": { "type": "raster", "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], "tileSize": 256 }}, "layers": [{ "id": "s", "type": "raster", "source": "s" }] }
    };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        searchOrigin = [...userPos];
        map.setCenter(userPos);
        new maplibregl.Marker({ color: '#0A84FF' }).setLngLat(userPos).addTo(map);
        syncUI();
    });

    function syncUI() {
        document.getElementById('rL').innerText = document.getElementById('radiusIn').value;
        document.getElementById('pL').innerText = document.getElementById('powerIn').value;
        if (searchOrigin) {
            const r = document.getElementById('radiusIn').value;
            const circle = genCircle(searchOrigin, r);
            if (map.getSource('rad')) map.getSource('rad').setData(circle);
            else {
                map.addSource('rad', { type: 'geojson', data: circle });
                map.addLayer({ id: 'rad-l', type: 'fill', source: 'rad', paint: { 'fill-color': '#0A84FF', 'fill-opacity': 0.05 } });
                map.addLayer({ id: 'rad-b', type: 'line', source: 'rad', paint: { 'line-color': '#0A84FF', 'line-width': 1, 'line-dasharray': [4, 4] } });
            }
        }
    }

    function toggleSelect() {
        isSelecting = !isSelecting;
        document.getElementById('crosshair').style.display = isSelecting ? 'block' : 'none';
        const b = document.getElementById('mainBtn');
        const sBtn = document.getElementById('selectBtn');
        if (isSelecting) {
            b.innerText = "ПОДТВЕРДИТЬ ТОЧКУ";
            sBtn.innerText = "ОТМЕНА";
            b.onclick = () => {
                searchOrigin = [map.getCenter().lng, map.getCenter().lat];
                toggleSelect(); syncUI();
                b.innerText = "НАЧАТЬ ПОИСК"; b.onclick = executeScan;
                sBtn.innerText = "📍 Метка";
            };
        } else {
            b.innerText = "НАЧАТЬ ПОИСК"; b.onclick = executeScan;
            sBtn.innerText = "📍 Метка";
        }
    }

    async function executeScan() {
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        
        playMysterySound();
        createMapPulse();

        const radius = document.getElementById('radiusIn').value;
        let found = null;

        for (let i = 0; i < 15; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = (Math.sqrt(Math.random()) * radius) / 111;
            const pt = [searchOrigin[0] + d * Math.cos(a), searchOrigin[1] + d * Math.sin(a)];
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                if (data && data.display_name) { found = { coords: pt, data: data }; break; }
            } catch(e) {}
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            document.getElementById('pulse-container').innerHTML = '';
            if (found) {
                targetPoint = found.coords;
                startRadar();
                showTarget(found);
            } else {
                resetSystem();
                alert("АНОМАЛИЙ НЕ НАЙДЕНО");
            }
        }, 3500);
    }

    function createMapPulse() {
        const container = document.getElementById('pulse-container');
        const pos = map.project(searchOrigin);
        
        for(let i=0; i<3; i++) {
            setTimeout(() => {
                const ring = document.createElement('div');
                ring.className = 'pulse-ring';
                ring.style.left = pos.x + 'px';
                ring.style.top = pos.y + 'px';
                container.appendChild(ring);
            }, i * 800);
        }
    }

    function startRadar() {
        const power = parseInt(document.getElementById('powerIn').value);
        document.getElementById('radar-ui').style.display = 'block';
        radarInterval = setInterval(() => {
            const dist = getDistance(userPos, targetPoint);
            const maxR = document.getElementById('radiusIn').value * 1000;
            let strength = Math.max(0, (1 - dist / maxR) * 100);
            let noise = (Math.random() - 0.5) * (110 - power);
            let finalSignal = Math.max(0, Math.min(100, strength + noise));
            
            document.getElementById('radar-arrow').style.transform = `translate(-50%, -100%) rotate(${finalSignal * 3.6}deg)`;
            document.getElementById('distance-text').innerText = `СИГНАЛ: ${finalSignal.toFixed(0)}%`;
        }, 600);
    }

    function showTarget(obj) {
        document.getElementById('anomalyName').innerText = "ОБЪЕКТ НАЙДЕН";
        document.getElementById('infoBody').innerHTML = `<b>АДРЕС:</b><br>${obj.data.display_name}`;
        document.getElementById('coordsBox').innerText = `${targetPoint[1].toFixed(6)}, ${targetPoint[0].toFixed(6)}`;
        
        if (window.m) window.m.remove();
        window.m = new maplibregl.Marker({ color: '#FF453A' }).setLngLat(targetPoint).addTo(map);
        map.flyTo({ center: targetPoint, zoom: 16, duration: 3000 });
        document.getElementById('ui-found').style.display = 'block';
    }

    function resetSystem() {
        clearInterval(radarInterval);
        if (window.m) window.m.remove();
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('radar-ui').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        playTap();
    }

    function genCircle(c, km) {
        const p = 64; const res = [];
        const dx = km / (111.32 * Math.cos(c[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i <= p; i++) {
            const a = (i / p) * (Math.PI * 2);
            res.push([c[0] + dx * Math.cos(a), c[1] + dy * Math.sin(a)]);
        }
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [res] } };
    }

    function getDistance(p1, p2) {
        const R = 6371000;
        const dLat = (p2[1]-p1[1]) * Math.PI/180;
        const dLon = (p2[0]-p1[0]) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1[1]*Math.PI/180)*Math.cos(p2[1]*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function openM(id) { document.getElementById(id).classList.add('active'); playTap(); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); playTap(); }
    function setMapStyle(t) { map.setStyle(STYLES[t]); closeM(); }
</script>
</body>
</html>

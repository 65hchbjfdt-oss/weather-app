<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay Black Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        :root {
            --bg-black: #050505;
            --accent-green: #00ff66;
            --accent-purple: #7800ff;
            --road-gray: #555555;
            --text-main: #e0e0e0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-black);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Карта на весь верх */
        #map-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
        }
        #map { width: 100%; height: 100%; }

        /* Прицел выбора точки */
        #crosshair {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            z-index: 2000;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: var(--accent-green);
        }
        #crosshair::before { top: 14px; left: 0; width: 30px; height: 2px; }
        #crosshair::after { top: 0; left: 14px; width: 2px; height: 30px; }

        /* Панель управления снизу */
        .control-panel {
            background: #0a0a0a;
            padding: 15px 20px;
            border-top: 1px solid #1a1a1a;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-main { background: var(--accent-purple); color: white; box-shadow: 0 4px 15px rgba(120,0,255,0.3); }
        .btn-secondary { background: #1a1a1a; color: #888; border: 1px solid #333; }
        .btn-action { background: var(--accent-green); color: #000; }

        .btn:active { transform: scale(0.96); opacity: 0.8; }

        /* Модалки */
        .modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; max-width: 400px;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(15px);
            border: 1px solid #222;
            border-radius: 24px;
            padding: 20px;
            z-index: 3000;
            visibility: hidden; opacity: 0;
            transition: 0.3s;
        }
        .modal.active { visibility: visible; opacity: 1; }

        label { display: block; margin: 15px 0 5px; font-size: 12px; color: #666; text-transform: uppercase; }
        input[type=range] { width: 100%; accent-color: var(--accent-purple); }
        select { width: 100%; padding: 10px; background: #111; color: #fff; border: 1px solid #333; border-radius: 8px; }

        #selection-overlay {
            display: none;
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 2500;
            width: 90%;
        }

        .status-log { font-size: 12px; color: #555; text-align: center; height: 15px; }
    </style>
</head>
<body>

<div id="map-wrapper">
    <div id="map"></div>
    <div id="crosshair"></div>
    <div id="selection-overlay">
        <button class="btn btn-action" onclick="confirmOrigin()">Здесь будет эпицентр</button>
        <button class="btn btn-secondary" style="margin-top:5px" onclick="disablePointSelection()">Отмена</button>
    </div>
</div>

<div class="control-panel" id="main-ui">
    <div class="status-log" id="log">Система готова</div>
    <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="openModal('settingsModal')">⚙ Опции</button>
        <button class="btn btn-secondary" onclick="enablePointSelection()">📍 Точка</button>
    </div>
    <button class="btn btn-main" onclick="scanAnomaly()">🔍 Сканировать эфир</button>
    <div id="found-actions" style="display: none; gap: 10px;">
        <button class="btn btn-secondary" style="flex:1" onclick="openModal('infoModal')">Инфо</button>
        <button class="btn btn-action" style="flex:2" onclick="buildRoute()">🚀 В путь</button>
    </div>
</div>

<div class="modal" id="settingsModal">
    <h3 style="margin:0">Конфигурация</h3>
    <label>Зона охвата (Радиус)</label>
    <input type="range" min="1" max="15" value="5" id="radiusRange">
    
    <label>Интенсивность</label>
    <input type="range" min="1" max="10" value="5" id="powerRange">
    
    <label>Тип аномалии</label>
    <select id="categorySelect">
        <option value="Пустота">Пустота (Забытые места)</option>
        <option value="Квантовая">Квантовая (Искажение реальности)</option>
        <option value="Мощная">Мощная (Заброшки / Промзоны)</option>
        <option value="Псевдо">Псевдо (Ложные сигналы)</option>
    </select>
    <button class="btn btn-secondary" style="margin-top:20px" onclick="closeModals()">Сохранить</button>
</div>

<div id="infoModal" class="modal">
    <h3 id="infoTitle">Объект найден</h3>
    <div id="infoBody" style="font-size: 14px; line-height: 1.6; margin: 15px 0;"></div>
    <button class="btn btn-secondary" onclick="closeModals()">Закрыть</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const API_KEY = '9222a135610a443999833fac417a059d';
    let map, userMarker, scanOrigin, anomalyPoint, radiusCircle;
    let routeLayers = [];

    // Инициализация карты
    navigator.geolocation.getCurrentPosition(pos => {
        const {latitude: lat, longitude: lon} = pos.coords;
        scanOrigin = [lat, lon];

        map = L.map('map', { zoomControl: false }).setView(scanOrigin, 14);

        // Thunderforest Spinal Map (Очень темная, агрессивная тема)
        L.tileLayer(`https://{s}.tile.thunderforest.com/spinal-map/{z}/{x}/{y}.png?apikey=${API_KEY}`, {
            maxZoom: 22
        }).addTo(map);

        userMarker = L.circleMarker(scanOrigin, {
            radius: 7, color: '#00ffff', fillColor: '#00ffff', fillOpacity: 1
        }).addTo(map);

        // Долгое нажатие на карту/маркер
        userMarker.on('contextmenu', (e) => {
            if(confirm("Начать поиск с этой точки?")) {
                scanOrigin = [e.latlng.lat, e.latlng.lng];
                drawRadius();
            }
        });

        drawRadius();
    });

    function drawRadius() {
        if(radiusCircle) map.removeLayer(radiusCircle);
        const r = document.getElementById('radiusRange').value * 1000;
        radiusCircle = L.circle(scanOrigin, {
            radius: r, color: '#7800ff', weight: 1, fillColor: '#7800ff', fillOpacity: 0.05
        }).addTo(map);
    }

    document.getElementById('radiusRange').oninput = drawRadius;

    // Выбор точки
    function enablePointSelection() {
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('selection-overlay').style.display = 'block';
    }

    function disablePointSelection() {
        document.getElementById('main-ui').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'none';
        document.getElementById('selection-overlay').style.display = 'none';
    }

    function confirmOrigin() {
        const center = map.getCenter();
        scanOrigin = [center.lat, center.lng];
        drawRadius();
        disablePointSelection();
    }

    // Логика генерации аномалий
    async function scanAnomaly() {
        const log = document.getElementById('log');
        log.innerText = "Инициализация сканера...";
        document.getElementById('found-actions').style.display = 'none';

        const category = document.getElementById('categorySelect').value;
        const power = parseInt(document.getElementById('powerRange').value);
        const radius = parseInt(document.getElementById('radiusRange').value);

        // Расчет случайной точки
        const r = radius / 111.3; 
        const u = Math.random();
        const v = Math.random();
        const w = r * Math.sqrt(u);
        const t = 2 * Math.PI * v;
        const x = w * Math.cos(t);
        const y = w * Math.sin(t);
        
        const targetLat = scanOrigin[0] + y;
        const targetLon = scanOrigin[1] + x;

        // Псевдо-логика типов
        let desc = "";
        if(category === "Пустота") {
            desc = "Место с низким уровнем антропогенного шума. Рекомендуется осторожность.";
        } else if(category === "Квантовая") {
            desc = "Зафиксированы колебания вероятности. Возможны визуальные артефакты.";
        } else if(category === "Мощная") {
            desc = "Обнаружен объект со старым кодом постройки. Высокая плотность материи.";
        } else {
            desc = "Сигнал нестабилен, возможно ложное срабатывание.";
        }

        anomalyPoint = {
            lat: targetLat,
            lon: targetLon,
            category: category,
            power: power,
            desc: desc
        };

        if(window.marker) map.removeLayer(window.marker);
        window.marker = L.circleMarker([targetLat, targetLon], {
            radius: 12, color: '#ff0055', weight: 3, fillOpacity: 0.7
        }).addTo(map);

        map.flyTo([targetLat, targetLon], 16);
        log.innerText = "Аномалия локализована";
        document.getElementById('found-actions').style.display = 'flex';
    }

    // Построение маршрута (Зеленый -> Красный -> Серый)
    async function buildRoute() {
        routeLayers.forEach(l => map.removeLayer(l));
        routeLayers = [];
        
        const start = userMarker.getLatLng();
        const end = [anomalyPoint.lat, anomalyPoint.lon];

        try {
            const resp = await fetch(`https://router.project-osrm.org/route/v1/foot/${start.lng},${start.lat};${end[1]},${end[0]}?geometries=geojson`);
            const data = await resp.json();

            if(data.code === 'Ok') {
                const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                
                // Делим маршрут для смены цвета
                // Для простоты: первая половина зеленая (шоссе), вторая красная (грунт)
                const midIndex = Math.floor(coords.length / 2);
                
                const part1 = L.polyline(coords.slice(0, midIndex + 1), {color: '#00ff66', weight: 6}).addTo(map);
                const part2 = L.polyline(coords.slice(midIndex), {color: '#8b0000', weight: 6}).addTo(map);
                
                routeLayers.push(part1, part2);

                // Если конец дороги далеко от точки - рисуем серый пунктир
                const lastRoadPoint = coords[coords.length - 1];
                const dist = map.distance(lastRoadPoint, end);
                
                if(dist > 20) {
                    const offRoad = L.polyline([lastRoadPoint, end], {
                        color: '#555', weight: 4, dashArray: '10, 10'
                    }).addTo(map);
                    routeLayers.push(offRoad);
                }
            }
        } catch(e) {
            // Если дорог нет совсем - просто серый пунктир
            const ghostLine = L.polyline([start, end], {color: '#555', weight: 3, dashArray: '5, 10'}).addTo(map);
            routeLayers.push(ghostLine);
        }
    }

    function openModal(id) {
        if(id === 'infoModal' && anomalyPoint) {
            document.getElementById('infoBody').innerHTML = `
                <b>Тип:</b> ${anomalyPoint.category}<br>
                <b>Мощность:</b> ${anomalyPoint.power}/10<br>
                <b>Координаты:</b> ${anomalyPoint.lat.toFixed(6)}, ${anomalyPoint.lon.toFixed(6)}<br><br>
                <i>${anomalyPoint.desc}</i>
            `;
        }
        document.getElementById(id).classList.add('active');
    }

    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>STALKER Explorer</title>

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <!-- Routing -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* Liquid Glass Panel */
    .glass {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 430px;
      padding: 16px;
      border-radius: 28px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      z-index: 999;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      text-align: center;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(120,0,255,0.75);
      color: white;
      transition: 0.25s;
    }

    .btn:hover {
      background: rgba(180,0,255,0.9);
    }

    /* Scan animation */
    #scanBox {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
    }

    .pulse {
      width: 20px;
      height: 20px;
      margin: 10px auto;
      border-radius: 50%;
      background: violet;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {transform: scale(1); opacity: 0.3;}
      50% {transform: scale(2.4); opacity: 1;}
      100% {transform: scale(1); opacity: 0.3;}
    }

    /* Log */
    #log {
      margin-top: 10px;
      max-height: 90px;
      overflow-y: auto;
      font-size: 13px;
      opacity: 0.85;
    }

    /* Settings Modal */
    #settings {
      display: none;
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      padding: 18px;
      border-radius: 24px;
      backdrop-filter: blur(20px);
      background: rgba(0,0,0,0.75);
      z-index: 1000;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 14px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    /* Info Modal */
    #infoModal {
      display: none;
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      padding: 18px;
      border-radius: 24px;
      backdrop-filter: blur(22px);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      z-index: 2000;
      text-align: left;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateX(-50%) scale(0.9);}
      to {opacity: 1; transform: translateX(-50%) scale(1);}
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- Settings -->
<div id="settings">
  <h2>⚙ Настройки поиска</h2>

  <label>Радиус поиска (км):</label>
  <input type="number" id="radius" value="5" min="1" max="10">

  <label style="margin-top:10px;display:block;">Категория аномалии:</label>
  <select id="category">
    <option value="⚡ Электро">⚡ Электро</option>
    <option value="🕳 Разлом">🕳 Разлом</option>
    <option value="☢ Радиация">☢ Радиация</option>
    <option value="🔮 Артефакт">🔮 Артефакт</option>
    <option value="👁 Наблюдение">👁 Наблюдение</option>
  </select>

  <button class="btn" onclick="closeSettings()">Закрыть</button>
</div>

<!-- Info -->
<div id="infoModal"></div>

<!-- Main Panel -->
<div class="glass">
  <h2>☢ STALKER Explorer</h2>

  <button class="btn" onclick="openSettings()">⚙ Настройки</button>
  <button class="btn" onclick="scan()">🔍 Сканировать</button>
  <button class="btn" onclick="startNavigation()">🚶 Навигация</button>

  <div id="scanBox">
    <div class="pulse"></div>
    Поиск аномалий...
  </div>

  <div id="log"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
let map, userMarker;
let anomalyMarker = null;
let anomalyData = null;
let routeControl = null;

function log(text) {
  document.getElementById("log").innerHTML += "➤ " + text + "<br>";
}

function openSettings() {
  document.getElementById("settings").style.display = "block";
}
function closeSettings() {
  document.getElementById("settings").style.display = "none";
}

/* Init Map Dark */
navigator.geolocation.getCurrentPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  map = L.map("map").setView([lat, lon], 14);

  /* Dark Theme Tiles */
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: "DarkMap"
  }).addTo(map);

  userMarker = L.circleMarker([lat, lon], {
    radius: 10,
    color: "cyan",
    fillOpacity: 1
  }).addTo(map);

  log("Сканер активирован. Ты в зоне.");
});

/* Reverse Address */
async function getAddress(lat, lon) {
  const res = await fetch(
    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
  );
  const data = await res.json();
  return data.display_name;
}

/* Scan */
function scan() {
  if (!map) return;

  document.getElementById("scanBox").style.display = "block";

  if (anomalyMarker) map.removeLayer(anomalyMarker);
  anomalyData = null;

  log("Запущено сканирование...");

  setTimeout(async () => {
    document.getElementById("scanBox").style.display = "none";

    const radius = parseFloat(document.getElementById("radius").value);
    const category = document.getElementById("category").value;

    const base = userMarker.getLatLng();

    /* Generate ONE anomaly */
    const angle = Math.random() * Math.PI * 2;
    const dist = radius * Math.random();

    const lat = base.lat + (dist * Math.cos(angle)) / 111;
    const lon = base.lng + (dist * Math.sin(angle)) / 111;

    const power = Math.floor(Math.random() * 5) + 1;
    const addr = await getAddress(lat, lon);

    anomalyData = { lat, lon, category, power, addr };

    anomalyMarker = L.circleMarker([lat, lon], {
      radius: 12,
      color: power >= 4 ? "red" : "orange",
      fillOpacity: 0.85
    })
      .addTo(map)
      .on("click", showInfo);

    log("Аномалия обнаружена: " + category);
  }, 2000);
}

/* Info Modal */
function showInfo() {
  const m = document.getElementById("infoModal");
  m.style.display = "block";

  m.innerHTML = `
    <h2>${anomalyData.category}</h2>
    <p>⚠ Сила: ${anomalyData.power}/5</p>
    <p>📍 Координаты: ${anomalyData.lat.toFixed(5)}, ${anomalyData.lon.toFixed(5)}</p>
    <p>🏙 Адрес: ${anomalyData.addr}</p>
    <button class="btn" onclick="closeInfo()">Закрыть</button>
  `;
}

function closeInfo() {
  document.getElementById("infoModal").style.display = "none";
}

/* Navigation */
function startNavigation() {
  if (!anomalyData) {
    log("Нет выбранной аномалии.");
    return;
  }

  if (routeControl) map.removeControl(routeControl);

  log("Построение маршрута по дорогам...");

  routeControl = L.Routing.control({
    waypoints: [
      userMarker.getLatLng(),
      L.latLng(anomalyData.lat, anomalyData.lon)
    ],
    lineOptions: {
      styles: [{ color: "cyan", weight: 5 }]
    },
    createMarker: () => null,
    addWaypoints: false,
    draggableWaypoints: false,
    routeWhileDragging: false
  }).addTo(map);

  log("Навигация активна. Иди к точке.");
}
</script>

</body>
</html>

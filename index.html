<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Power Algorithm</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { --glass: rgba(12, 12, 12, 0.85); --accent: #7800ff; --green: #00ff66; }
        body { margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 35px;
            padding: 22px; box-sizing: border-box; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .btn {
            width: 100%; padding: 16px; margin: 6px 0; border: none; border-radius: 20px;
            font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.3s;
            background: var(--accent); color: #fff; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-sec { background: rgba(255,255,255,0.08); }
        .btn:active { transform: scale(0.94); }

        #scan-box { display: none; text-align: center; margin: 15px 0; }
        .pulse-ring {
            width: 40px; height: 40px; border: 3px solid var(--accent); border-radius: 50%;
            margin: 0 auto 15px; animation: sonar 1.2s infinite ease-out;
        }
        @keyframes sonar { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; background: #0f0f0f; border: 1px solid #333;
            border-radius: 30px; padding: 30px; display: none; z-index: 1000;
        }
        .active { display: block; }
        .val-badge { float: right; background: var(--accent); padding: 2px 10px; border-radius: 10px; font-size: 12px; }
        
        input[type=range] { width: 100%; accent-color: var(--accent); margin: 15px 0; cursor: pointer; }
        #status { font-size: 10px; text-transform: uppercase; color: #666; text-align: center; margin-bottom: 10px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ui-panel">
    <div id="status">Система активна</div>
    
    <div id="scan-box">
        <div class="pulse-ring"></div>
        <div style="font-size: 12px; font-weight: bold; color: var(--accent);">ДЕШИФРОВКА СИГНАЛА...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-sec" onclick="uiAction('settings')">⚙</button>
            <button class="btn btn-sec" style="flex:3" onclick="uiAction('info')">ЛОГИ</button>
        </div>
        <button class="btn" onclick="runAlgorithm()">Запустить поиск</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--green); color: #000;" onclick="playRouteSound(); buildRoute()">Проложить путь</button>
        <button class="btn btn-sec" onclick="resetAll()">Сброс</button>
    </div>
</div>

<div id="settings" class="modal">
    <h3 style="margin:0 0 20px 0;">КОНФИГУРАЦИЯ</h3>
    <label>Радиус <span class="val-badge" id="rL">5 км</span></label>
    <input type="range" id="radiusInput" min="1" max="15" value="5" oninput="updateCircle()">
    
    <label>Сила аномалии <span class="val-badge" id="pL">5</span></label>
    <input type="range" id="powerInput" min="1" max="10" value="5" oninput="updatePowerLabel()">
    
    <label>Категория</label>
    <select id="typeSelect" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:14px; border-radius:15px; margin-top:10px;">
        <option value="Пустота">ПУСТОТА</option>
        <option value="Квантовая">КВАНТОВАЯ</option>
        <option value="Стандарт">СТАНДАРТ</option>
    </select>
    <button class="btn" style="margin-top:25px" onclick="closeM()">Применить</button>
</div>

<div id="info" class="modal">
    <h3>ДАННЫЕ ОБЪЕКТА</h3>
    <div id="infoContent" style="font-size: 14px; line-height: 1.6; color: #ccc;">Ожидание первичного сканирования...</div>
    <button class="btn btn-sec" style="margin-top:20px" onclick="closeM()">Закрыть</button>
</div>

<script>
    // Путь к твоему звуку
    const routeSound = new Audio('iOS-3.wav'); 

    function playRouteSound() {
        routeSound.currentTime = 0;
        routeSound.play().catch(e => console.log("Звук не загружен, добавь файл в папку"));
    }

    let map, userPos, targetPoint, circleLayer;
    
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    map.on('load', () => {
        navigator.geolocation.getCurrentPosition(pos => {
            userPos = [pos.coords.longitude, pos.coords.latitude];
            map.setCenter(userPos);
            new maplibregl.Marker({ color: '#00ffff' }).setLngLat(userPos).addTo(map);
            initCircle();
        });
    });

    function initCircle() {
        if (!userPos) return;
        const r = document.getElementById('radiusInput').value;
        map.addSource('radius-src', { type: 'geojson', data: createCircle(userPos, r) });
        map.addLayer({
            id: 'radius-layer', type: 'fill', source: 'radius-src',
            paint: { 'fill-color': '#7800ff', 'fill-opacity': 0.12, 'fill-outline-color': '#7800ff' }
        });
    }

    function updateCircle() {
        const r = document.getElementById('radiusInput').value;
        document.getElementById('rL').innerText = r + ' км';
        if (map.getSource('radius-src')) {
            map.getSource('radius-src').setData(createCircle(userPos, r));
        }
    }

    function updatePowerLabel() {
        document.getElementById('pL').innerText = document.getElementById('powerInput').value;
    }

    function createCircle(center, radiusKm) {
        const points = 64;
        const coords = { lat: center[1], lng: center[0] };
        const ret = [];
        const distanceX = radiusKm / (111.32 * Math.cos(coords.lat * Math.PI / 180));
        const distanceY = radiusKm / 110.574;
        for (let i = 0; i < points; i++) {
            const theta = (i / points) * (2 * Math.PI);
            ret.push([coords.lng + distanceX * Math.cos(theta), coords.lat + distanceY * Math.sin(theta)]);
        }
        ret.push(ret[0]);
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ret] } };
    }

    async function runAlgorithm() {
        const status = document.getElementById('status');
        const power = parseInt(document.getElementById('powerInput').value);
        const radius = parseInt(document.getElementById('radiusInput').value);
        const cat = document.getElementById('typeSelect').value;

        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        status.innerText = "Анализ ландшафта...";

        let found = null;
        let maxAttempts = power * 3; // Чем больше сила, тем больше циклов проверки

        for (let i = 0; i < maxAttempts; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (radius / 111);
            const testPoint = [userPos[0] + dist * Math.cos(angle), userPos[1] + dist * Math.sin(angle)];
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${testPoint[1]}&lon=${testPoint[0]}&zoom=18`);
                const data = await res.json();
                
                // Проверка на "городскую застройку"
                const isUrban = data.address.road || data.address.building || data.address.suburb;

                if (cat === "Пустота") {
                    // На силе 1-3 позволяем город. На силе 8-10 — только если isUrban = false
                    if (power <= 3) { found = testPoint; break; }
                    if (power > 3 && power < 7 && !data.address.building) { found = testPoint; break; }
                    if (power >= 7 && !isUrban) { found = testPoint; break; }
                } else if (cat === "Квантовая") {
                    // Квантовая на силе 10 может "спрятаться", на 1 — падает везде
                    if (Math.random() > (power / 12)) { found = testPoint; break; }
                } else {
                    found = testPoint; break; 
                }
            } catch (e) { }
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            if (found) {
                status.innerText = "Точка синхронизирована";
                targetPoint = found;
                if (window.aMark) window.aMark.remove();
                window.aMark = new maplibregl.Marker({ color: '#ff0055' }).setLngLat(found).addTo(map);
                map.flyTo({ center: found, zoom: 14 });
                document.getElementById('ui-found').style.display = 'block';
                document.getElementById('infoContent').innerText = `КАТЕГОРИЯ: ${cat}\nСТРОГОСТЬ: ${power}/10\nЛОКАЦИЯ: ${found[1].toFixed(5)}, ${found[0].toFixed(5)}`;
            } else {
                status.innerText = "Ошибка захвата";
                alert("Не удалось найти точку с силой " + power + " в этом радиусе.");
                document.getElementById('ui-idle').style.display = 'block';
            }
        }, 2000);
    }

    async function buildRoute() {
        const url = `https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (map.getLayer('route-line')) { map.removeLayer('route-line'); map.removeSource('route-line'); }
        map.addSource('route-line', { type: 'geojson', data: data.routes[0].geometry });
        map.addLayer({
            id: 'route-line', type: 'line', source: 'route-line',
            paint: { 'line-color': '#00ff66', 'line-width': 5, 'line-blur': 1 }
        });
    }

    function resetAll() {
        if (window.aMark) window.aMark.remove();
        if (map.getLayer('route-line')) { map.removeLayer('route-line'); map.removeSource('route-line'); }
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        document.getElementById('status').innerText = "Система готова";
        map.flyTo({ center: userPos, zoom: 11 });
    }

    function uiAction(id) { document.getElementById(id).classList.add('active'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>KiwiWay</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
/* ====== BASE ====== */
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ====== MAP TOP ====== */
#mapWrap{
  flex:1;
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

/* ====== CROSSHAIR MODE ====== */
#crosshair{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:26px;
  height:26px;
  z-index:9999;
  pointer-events:none;
}
#crosshair:before,#crosshair:after{
  content:"";
  position:absolute;
  background:#00ffd5;
  border-radius:2px;
}
#crosshair:before{width:26px;height:3px;top:11px;left:0;}
#crosshair:after{width:3px;height:26px;top:0;left:11px;}

/* ====== GLASS PANEL ====== */
.panel{
  padding:14px;
  background:rgba(20,20,20,0.55);
  backdrop-filter:blur(25px);
  border-top:1px solid rgba(255,255,255,0.08);
  box-shadow:0 -15px 40px rgba(0,0,0,0.9);
}

.title{
  text-align:center;
  font-size:18px;
  font-weight:700;
  color:#00ffd5;
  margin-bottom:10px;
}

/* ====== BUTTONS ====== */
.btn{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:0.15s;
}

.btn:active{transform:scale(0.97);}

.btn.primary{
  background:rgba(120,0,255,0.85);
  color:white;
}

.btn.secondary{
  background:rgba(255,255,255,0.10);
  color:#ddd;
}

.btn.green{
  background:rgba(0,200,80,0.85);
  color:white;
}

/* ====== ROW ====== */
.row{
  display:flex;
  gap:10px;
}

/* ====== SCAN ANIM ====== */
#scanBox{
  display:none;
  text-align:center;
  font-size:14px;
  opacity:0.75;
  margin-top:10px;
}
.pulse{
  width:18px;
  height:18px;
  margin:10px auto;
  border-radius:50%;
  background:#b100ff;
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%{transform:scale(0.8);opacity:0.4;}
  50%{transform:scale(1.8);opacity:1;}
  100%{transform:scale(0.8);opacity:0.4;}
}

/* ====== MODALS GLASS ====== */
.modal{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0.95);
  width:90%;
  max-width:420px;
  padding:18px;
  border-radius:22px;
  background:rgba(15,15,15,0.75);
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 40px rgba(0,0,0,0.9);
  z-index:99999;
  opacity:0;
  pointer-events:none;
  transition:0.25s;
}

.modal.show{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

label{
  display:block;
  margin-top:12px;
  font-size:14px;
  opacity:0.8;
}

input[type=range],select{
  width:100%;
  margin-top:6px;
}

select{
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.08);
  border:none;
  color:white;
}

.info-group{
  background:rgba(255,255,255,0.06);
  border-radius:16px;
  padding:12px;
  margin:8px 0;
}
.info-group h3{
  margin:0;
  font-size:13px;
  opacity:0.7;
}
.info-group p{
  margin:5px 0 0;
  font-size:15px;
  font-weight:600;
}
</style>
</head>

<body>

<!-- MAP -->
<div id="mapWrap">
  <div id="map"></div>
  <div id="crosshair"></div>
</div>

<!-- PANEL -->
<div class="panel" id="mainPanel">
  <div class="title">☢ KiwiWay</div>

  <div class="row">
    <button class="btn secondary" onclick="openSettings()">⚙</button>
    <button class="btn secondary" onclick="enablePickPoint()">📍</button>
  </div>

  <button class="btn primary" onclick="scan()">🔍 Искать аномалию</button>

  <div id="afterSearch" style="display:none;">
    <button class="btn secondary" onclick="openInfo()">ℹ Информация</button>
    <button class="btn green" onclick="startJourney()">🚀 Начать путь</button>
  </div>

  <div id="scanBox">
    <div class="pulse"></div>
    Поиск сигнала...
  </div>
</div>

<!-- SETTINGS -->
<div class="modal" id="settingsModal">
  <h2 style="margin:0;">⚙ Настройки</h2>

  <label>Радиус: <span id="radiusLabel">5</span> км</label>
  <input id="radiusSlider" type="range" min="1" max="10" value="5"/>

  <label>Степень аномалии: <span id="powerLabel">5</span>/10</label>
  <input id="powerSlider" type="range" min="1" max="10" value="5"/>

  <label>Категория</label>
  <select id="category">
    <option>Пустота</option>
    <option>Квантовая</option>
    <option>Мощная</option>
    <option>Псевдо</option>
  </select>

  <button class="btn secondary" onclick="closeSettings()">Закрыть</button>
</div>

<!-- INFO -->
<div class="modal" id="infoModal">
  <h2 style="margin:0;">Данные точки</h2>
  <div id="infoContent"></div>

  <!-- COPY ONLY HERE -->
  <button class="btn secondary" onclick="copyAddress()">📋 Скопировать адрес</button>
  <button class="btn secondary" onclick="closeInfo()">Закрыть</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* ===============================
   CONFIG
================================ */
const GEOAPIFY_KEY="9222a135610a443999833fac417a059d";

let map,userMarker;
let anomalyMarker=null;
let anomalyData=null;

let radiusCircle=null;
let routeLine=null;

let searchOrigin=null;
let pickMode=false;

/* ===============================
   UI
================================ */
const radiusSlider=document.getElementById("radiusSlider");
const powerSlider=document.getElementById("powerSlider");

radiusSlider.oninput=()=>{
  document.getElementById("radiusLabel").innerText=radiusSlider.value;
  drawRadius();
};
powerSlider.oninput=()=>{
  document.getElementById("powerLabel").innerText=powerSlider.value;
};

function openSettings(){document.getElementById("settingsModal").classList.add("show");}
function closeSettings(){document.getElementById("settingsModal").classList.remove("show");}

function openInfo(){
  if(!anomalyData) return;
  document.getElementById("infoModal").classList.add("show");

  document.getElementById("infoContent").innerHTML=`
    <div class="info-group"><h3>Категория</h3><p>${anomalyData.category}</p></div>
    <div class="info-group"><h3>Сила</h3><p>${anomalyData.power}/10</p></div>
    <div class="info-group"><h3>Координаты</h3><p>${anomalyData.lat.toFixed(5)}, ${anomalyData.lon.toFixed(5)}</p></div>
    <div class="info-group"><h3>Адрес</h3><p>${anomalyData.address}</p></div>
  `;
}
function closeInfo(){document.getElementById("infoModal").classList.remove("show");}

/* Copy only in Info */
function copyAddress(){
  navigator.clipboard.writeText(anomalyData.address);
  alert("Адрес скопирован.");
}

/* ===============================
   MAP INIT
================================ */
navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;

  map=L.map("map",{zoomControl:false}).setView([lat,lon],14);

  /* REAL DARK MAP GEOAPIFY */
  L.tileLayer(
    `https://maps.geoapify.com/v1/tile/dark-matter/{z}/{x}/{y}.png?apiKey=${GEOAPIFY_KEY}`,
    {maxZoom:20}
  ).addTo(map);

  userMarker=L.circleMarker([lat,lon],{
    radius:9,color:"#00ffd5",fillOpacity:1
  }).addTo(map);

  searchOrigin=L.latLng(lat,lon);
  drawRadius();

  /* Long press (mobile) */
  userMarker.on("contextmenu",()=>{
    if(confirm(`Начать поиск в радиусе ${radiusSlider.value} км отсюда?`)){
      searchOrigin=userMarker.getLatLng();
      drawRadius();
      scan();
    }
  });

},()=>alert("Нужна геолокация"));

/* Follow user */
navigator.geolocation.watchPosition(pos=>{
  if(userMarker){
    userMarker.setLatLng([pos.coords.latitude,pos.coords.longitude]);
  }
},{},{enableHighAccuracy:true});

/* ===============================
   RADIUS CIRCLE
================================ */
function drawRadius(){
  if(!map||!searchOrigin) return;
  if(radiusCircle) map.removeLayer(radiusCircle);

  radiusCircle=L.circle(searchOrigin,{
    radius:radiusSlider.value*1000,
    color:"#b100ff",
    fillColor:"#b100ff",
    fillOpacity:0.08
  }).addTo(map);
}

/* ===============================
   PICK POINT MODE
================================ */
function enablePickPoint(){
  pickMode=true;
  document.getElementById("crosshair").style.display="block";

  alert("Передвинь карту. Центр станет эпицентром.");

  map.once("moveend",()=>{
    if(pickMode){
      searchOrigin=map.getCenter();
      drawRadius();
      pickMode=false;
      document.getElementById("crosshair").style.display="none";
    }
  });
}

/* ===============================
   ANOMALY GENERATOR (SMART)
================================ */
async function generatePoint(){
  const cat=document.getElementById("category").value;
  const power=parseInt(powerSlider.value);
  const radius=parseInt(radiusSlider.value);

  const attempts=25;

  for(let i=0;i<attempts;i++){
    const ang=Math.random()*Math.PI*2;
    const dist=Math.random()*radius;

    let lat=searchOrigin.lat+(dist*Math.cos(ang))/111;
    let lon=searchOrigin.lng+(dist*Math.sin(ang))/(111*Math.cos(searchOrigin.lat*Math.PI/180));

    /* Strictness control */
    let strict=true;
    if(cat==="Пустота"||cat==="Квантовая"){
      if(power>=8) strict=false;
    }

    try{
      const r=await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
      );
      const data=await r.json();
      const addr=data.address||{};

      if(!strict) return {lat,lon,address:data.display_name||"Неизвестно"};

      if(cat==="Пустота"){
        if(!addr.city&&!addr.road) return {lat,lon,address:data.display_name||"Глушь"};
      }

      if(cat==="Квантовая"){
        if(Math.random()>0.5) return {lat,lon,address:"Квантовый разлом"};
      }

      if(cat==="Мощная"){
        if(addr.industrial||addr.highway) return {lat,lon,address:data.display_name};
      }

      if(cat==="Псевдо"){
        if(addr.residential||addr.commercial) return {lat,lon,address:data.display_name};
      }

    }catch(e){}
  }

  return null;
}

/* ===============================
   SCAN
================================ */
async function scan(){
  document.getElementById("scanBox").style.display="block";
  document.getElementById("afterSearch").style.display="none";

  /* Clear old */
  if(anomalyMarker) map.removeLayer(anomalyMarker);
  if(routeLine) map.removeLayer(routeLine);

  anomalyData=null;

  const point=await generatePoint();

  document.getElementById("scanBox").style.display="none";

  if(!point){
    alert("Не удалось найти точку.");
    return;
  }

  anomalyData={
    ...point,
    category:document.getElementById("category").value,
    power:powerSlider.value
  };

  anomalyMarker=L.circleMarker([point.lat,point.lon],{
    radius:13,
    color:"#ff0044",
    fillOpacity:0.65
  }).addTo(map);

  /* Smooth focus */
  map.flyTo([point.lat,point.lon],16,{duration:1.6});

  document.getElementById("afterSearch").style.display="block";
}

/* ===============================
   ROUTE BUILD (Animated)
================================ */
async function startJourney(){
  if(!anomalyData) return;

  if(routeLine) map.removeLayer(routeLine);

  const start=userMarker.getLatLng();
  const end=L.latLng(anomalyData.lat,anomalyData.lon);

  const url=`https://router.project-osrm.org/route/v1/foot/${start.lng},${start.lat};${end.lng},${end.lat}?geometries=geojson`;

  const res=await fetch(url);
  const json=await res.json();

  if(json.code!=="Ok"){
    alert("Маршрут не найден.");
    return;
  }

  const coords=json.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);

  /* Animated drawing */
  let path=[];
  routeLine=L.polyline([],{
    color:"#00ff55",
    weight:6,
    opacity:0.85
  }).addTo(map);

  let i=0;
  function draw(){
    if(i>=coords.length) return;
    path.push(coords[i]);
    routeLine.setLatLngs(path);
    i++;
    requestAnimationFrame(draw);
  }
  draw();

  map.fitBounds(routeLine.getBounds(),{padding:[40,40]});
}
</script>

</body>
</html>

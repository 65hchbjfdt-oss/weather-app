<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>STALKER Explorer</title>

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <!-- Routing -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* ===== Liquid Glass Bottom Panel ===== */
    .glass {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 440px;
      padding: 18px;
      border-radius: 30px;
      backdrop-filter: blur(25px);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      z-index: 999;
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(80px); opacity: 0; }
      to   { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    h2 {
      margin: 0;
      font-size: 18px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ===== iOS Buttons ===== */
    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(120,0,255,0.80);
      color: white;
      transition: transform 0.15s ease, background 0.25s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.12);
    }

    /* ===== Scan Animation ===== */
    #scanBox {
      display: none;
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
      animation: fadeIn 0.4s ease;
    }

    .pulse {
      width: 22px;
      height: 22px;
      margin: 12px auto;
      border-radius: 50%;
      background: violet;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.3; }
      50%  { transform: scale(2.4); opacity: 1; }
      100% { transform: scale(1); opacity: 0.3; }
    }

    /* ===== Modal Base ===== */
    .modal {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      padding: 18px;
      border-radius: 26px;
      backdrop-filter: blur(25px);
      background: rgba(20,20,20,0.75);
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: 0.35s ease;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #settingsModal {
      top: 15px;
    }

    #infoModal {
      top: 25%;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.85;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 16px;
      border: none;
      outline: none;
      font-size: 15px;
      background: rgba(255,255,255,0.10);
      color: white;
    }

    /* ===== Log ===== */
    #log {
      margin-top: 12px;
      max-height: 80px;
      overflow-y: auto;
      font-size: 13px;
      opacity: 0.85;
    }

    #log::-webkit-scrollbar {
      display: none;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <h2>⚙ Настройки</h2>

  <label>Радиус поиска (1–10 км)</label>
  <input type="number" id="radius" value="5" min="1" max="10">

  <label>Категория аномалии</label>
  <select id="category">
    <option value="⚡ Электро">⚡ Электро</option>
    <option value="🕳 Разлом">🕳 Разлом</option>
    <option value="☢ Радиация">☢ Радиация</option>
    <option value="🔮 Артефакт">🔮 Артефакт</option>
    <option value="👁 Наблюдение">👁 Наблюдение</option>
  </select>

  <button class="btn secondary" onclick="toggleSettings(false)">Закрыть</button>
</div>

<!-- INFO MODAL -->
<div class="modal" id="infoModal"></div>

<!-- MAIN PANEL -->
<div class="glass">
  <h2>☢ STALKER Explorer</h2>

  <button class="btn secondary" onclick="toggleSettings(true)">
    ⚙ Настройки
  </button>

  <button class="btn" onclick="scan()">
    🔍 Сканировать
  </button>

  <button class="btn secondary" onclick="showInfoButton()">
    ℹ Показать информацию
  </button>

  <button class="btn" onclick="startNavigation()">
    🚶 Навигация
  </button>

  <div id="scanBox">
    <div class="pulse"></div>
    Поиск аномалий...
  </div>

  <div id="log"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
let map, userMarker;
let anomalyMarker = null;
let anomalyData = null;
let routeControl = null;

/* ===== Log ===== */
function log(text) {
  document.getElementById("log").innerHTML += "➤ " + text + "<br>";
}

/* ===== Toggle Modals ===== */
function toggleSettings(open) {
  document.getElementById("settingsModal")
    .classList.toggle("show", open);
}

function toggleInfo(open) {
  document.getElementById("infoModal")
    .classList.toggle("show", open);
}

/* ===== Init Dark Map ===== */
navigator.geolocation.getCurrentPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  map = L.map("map").setView([lat, lon], 14);

  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
  ).addTo(map);

  userMarker = L.circleMarker([lat, lon], {
    radius: 10,
    color: "cyan",
    fillOpacity: 1
  }).addTo(map);

  log("Система активирована. Ты в зоне.");
});

/* ===== Reverse Address ===== */
async function getAddress(lat, lon) {
  const res = await fetch(
    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
  );
  const data = await res.json();
  return data.display_name;
}

/* ===== Scan ===== */
function scan() {
  if (!map) return;

  document.getElementById("scanBox").style.display = "block";

  if (anomalyMarker) map.removeLayer(anomalyMarker);
  anomalyData = null;

  log("Сканирование запущено...");

  setTimeout(async () => {
    document.getElementById("scanBox").style.display = "none";

    const radius = parseFloat(document.getElementById("radius").value);
    const category = document.getElementById("category").value;

    const base = userMarker.getLatLng();
    const angle = Math.random() * Math.PI * 2;
    const dist = radius * Math.random();

    const lat = base.lat + (dist * Math.cos(angle)) / 111;
    const lon = base.lng + (dist * Math.sin(angle)) / 111;

    const power = Math.floor(Math.random() * 5) + 1;
    const addr = await getAddress(lat, lon);

    anomalyData = { lat, lon, category, power, addr };

    anomalyMarker = L.circleMarker([lat, lon], {
      radius: 13,
      color: power >= 4 ? "red" : "orange",
      fillOpacity: 0.85
    }).addTo(map);

    log("Аномалия обнаружена: " + category);

  }, 1800);
}

/* ===== Info Button ===== */
function showInfoButton() {
  if (!anomalyData) {
    log("Нет данных. Сначала сканируй.");
    return;
  }

  const modal = document.getElementById("infoModal");

  modal.innerHTML = `
    <h2>${anomalyData.category}</h2>
    <p>⚠ Сила: ${anomalyData.power}/5</p>
    <p>📍 Координаты:<br>
    ${anomalyData.lat.toFixed(5)}, ${anomalyData.lon.toFixed(5)}</p>
    <p style="opacity:0.8;font-size:13px;">
      🏙 Адрес:<br>${anomalyData.addr}
    </p>

    <button class="btn secondary" onclick="toggleInfo(false)">
      Закрыть
    </button>
  `;

  toggleInfo(true);
}

/* ===== Navigation ===== */
function startNavigation() {
  if (!anomalyData) {
    log("Нет выбранной цели.");
    return;
  }

  if (routeControl) map.removeControl(routeControl);

  log("Построение маршрута...");

  routeControl = L.Routing.control({
    waypoints: [
      userMarker.getLatLng(),
      L.latLng(anomalyData.lat, anomalyData.lon)
    ],
    lineOptions: {
      styles: [{ color: "cyan", weight: 5 }]
    },
    createMarker: () => null,
    addWaypoints: false,
    draggableWaypoints: false
  }).addTo(map);

  log("Навигация активна. Следуй по маршруту.");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lum</title>
    <style>
        :root {
            --st: env(safe-area-inset-top, 20px);
            --sb: env(safe-area-inset-bottom, 16px);
            --nav: 56px;
            --bg: #000;
            --glass: rgba(255, 255, 255, .07);
            --glass-border: rgba(255, 255, 255, .10);
            --text: #fff;
            --secondary: rgba(255, 255, 255, .48);
            --accent: #FF6B9D;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #fff;
            user-select: none;
            transition: background .3s ease;
        }
        #bgC {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        #app {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            max-width: 430px;
            margin: 0 auto;
            width: 100%;
        }
        .scr {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .scr.on {
            display: flex;
            animation: fadeIn .25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: .3;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .sa {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: calc(var(--st) + 8px) 16px calc(var(--nav) + 20px);
            transition: padding .3s;
        }
        .sa::-webkit-scrollbar {
            display: none;
        }

        .glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 20px;
            transition: all .25s cubic-bezier(.22, .61, .36, 1);
        }
        .glass:active {
            transform: scale(.98);
            transition: transform .1s;
        }

        #nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: calc(var(--nav) + var(--sb));
            padding-bottom: var(--sb);
            display: flex;
            align-items: flex-start;
            justify-content: space-around;
            padding-top: 6px;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, .08);
            z-index: 100;
            transition: all .3s;
        }
        .nb {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 4px 14px;
            border-radius: 16px;
            transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
        }
        .nb svg {
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, .35);
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all .25s;
        }
        .nb span {
            font-size: 9px;
            color: rgba(255, 255, 255, .35);
            transition: color .25s;
        }
        .nb.on svg {
            stroke: rgba(255, 255, 255, .92);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, .35));
        }
        .nb.on span {
            color: rgba(255, 255, 255, .82);
        }

        .hw {
            padding: calc(var(--st) + 4px) 8px 0;
            text-align: center;
        }
        .cityrow {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, .65);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .tbig {
            font-size: 96px;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -5px;
            background: linear-gradient(170deg, rgba(255, 255, 255, .98) 20%, rgba(255, 255, 255, .4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: tIN .6s ease both;
        }
        @keyframes tIN {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.94);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .feels {
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
            margin: 4px 0 12px;
        }
        .iconwrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 8px;
        }
        .wdesc {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, .7);
        }
        .hilo {
            font-size: 12px;
            color: rgba(255, 255, 255, .38);
            margin-top: 4px;
        }
        .todlbl {
            font-size: 10px;
            color: rgba(255, 255, 255, .34);
            letter-spacing: .14em;
            text-transform: uppercase;
            margin: 2px 0 8px;
        }

        .sl {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, .36);
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 6px;
            transition: all .3s;
        }
        .mb {
            margin-bottom: 10px;
        }

        .hs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 0 4px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .hs::-webkit-scrollbar {
            display: none;
        }
        .hc {
            flex: 0 0 54px;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 4px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(10px);
            transition: all .2s cubic-bezier(.22, .61, .36, 1);
        }
        .hc.now {
            background: rgba(255, 255, 255, .12);
            border-color: rgba(255, 255, 255, .2);
        }
        .ht {
            font-size: 10px;
            color: rgba(255, 255, 255, .36);
        }
        .htemp {
            font-size: 14px;
            font-weight: 400;
        }
        .hrain {
            font-size: 9px;
            color: #6ECFFF;
        }

        .cw {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            overflow: hidden;
            transition: all .3s;
        }
        .dr {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            cursor: pointer;
            gap: 8px;
            transition: background .15s, transform .15s;
        }
        .dr:active {
            background: rgba(255, 255, 255, .04);
            transform: scale(.99);
        }
        .dn {
            font-size: 13px;
            font-weight: 400;
            flex: 1;
            min-width: 90px;
        }
        .dw-icon {
            width: 34px;
            text-align: center;
            flex-shrink: 0;
        }
        .dt {
            font-size: 13px;
            display: flex;
            gap: 4px;
            color: rgba(255, 255, 255, .5);
            flex-shrink: 0;
            min-width: 55px;
            justify-content: flex-end;
        }
        .dhi {
            color: rgba(255, 255, 255, .88);
        }
        .dw-wind {
            font-size: 10px;
            color: rgba(255, 255, 255, .32);
            flex-shrink: 0;
            min-width: 28px;
            text-align: right;
        }

        .dexp {
            display: none;
            padding: 8px 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            background: rgba(255, 255, 255, .02);
            animation: expandIn .2s ease;
        }
        @keyframes expandIn {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 200px;
            }
        }
        .dexp.on {
            display: block;
        }
        .departs {
            display: flex;
            gap: 6px;
        }
        .dep {
            flex: 1;
            text-align: center;
            padding: 10px 2px;
            background: rgba(255, 255, 255, .04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .06);
            transition: all .2s;
        }
        .dep-label {
            font-size: 9px;
            color: rgba(255, 255, 255, .32);
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .dep-icon {
            margin: 4px 0;
        }
        .dep-temp {
            font-size: 14px;
            font-weight: 400;
        }
        .dep-feels {
            font-size: 9px;
            color: rgba(255, 255, 255, .32);
        }
        .ai-forecast-block {
            margin-top: 8px;
            padding: 10px 12px;
            background: rgba(100, 80, 255, .08);
            border: 1px solid rgba(120, 100, 255, .15);
            border-radius: 14px;
            font-size: 11px;
            color: rgba(255, 255, 255, .55);
            animation: fadeInUp .45s ease both;
            line-height: 1.4;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .ai-cats {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .ai-cat {
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .5);
        }

        .dg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .dc {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
            padding: 12px 13px;
            transition: all .25s;
        }
        .dlbl {
            font-size: 10px;
            color: rgba(255, 255, 255, .36);
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .dval {
            font-size: 20px;
            font-weight: 300;
        }

        .arcw {
            padding: 14px 14px 6px;
            position: relative;
        }
        .arct {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, .36);
        }
        .moonrow {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, .05);
        }

        #mapBlock {
            cursor: pointer;
        }
        .map-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .map-tab {
            font-size: 9px;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .04);
            color: rgba(255, 255, 255, .45);
            cursor: pointer;
            transition: all .2s;
        }
        .map-tab.on {
            background: rgba(255, 255, 255, .16);
            color: #fff;
            border-color: rgba(255, 255, 255, .25);
        }
        #mapCanvas {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        #lumCanvas {
            width: 200px;
            height: 200px;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            border-radius: 50%;
            transition: transform .3s;
        }
        .emotxt {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, .38);
            margin: 4px 0 16px;
            min-height: 16px;
            transition: all .4s;
        }
        .statrow {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 1px;
        }
        .slbl {
            font-size: 11px;
            color: rgba(255, 255, 255, .38);
            width: 56px;
        }
        .sbar {
            flex: 1;
            height: 2px;
            border-radius: 1px;
            background: rgba(255, 255, 255, .08);
            overflow: hidden;
        }
        .sfill {
            height: 100%;
            border-radius: 1px;
            background: linear-gradient(90deg, #FF6B9D, #FF8E9D);
            transition: width 1s ease;
        }
        .spct {
            font-size: 10px;
            color: rgba(255, 255, 255, .36);
            width: 26px;
            text-align: right;
        }

        #chatMsgs {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scrollbar-width: none;
            min-height: 100px;
            max-height: 230px;
        }
        .msg {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            animation: mIN .28s cubic-bezier(.34, 1.56, .64, 1);
        }
        @keyframes mIN {
            from {
                opacity: 0;
                transform: translateY(6px) scale(.97);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .msg.u {
            flex-direction: row-reverse;
        }
        .bbl {
            max-width: 78%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
            font-weight: 400;
            transition: all .2s;
        }
        .msg.ai .bbl {
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .12);
            border-bottom-left-radius: 4px;
        }
        .msg.u .bbl {
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .18);
            border-bottom-right-radius: 4px;
        }
        .av {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #b8a0ff, #6040c0);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
        }
        .dots {
            display: flex;
            gap: 2px;
            padding: 2px 0;
        }
        .dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .5);
            animation: dp 1s ease-in-out infinite;
        }
        .dots span:nth-child(2) {
            animation-delay: .16s;
        }
        .dots span:nth-child(3) {
            animation-delay: .32s;
        }
        @keyframes dp {
            0%,
            80%,
            100% {
                transform: scale(.5);
                opacity: .3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #cinWrap {
            padding: 8px 12px 12px;
            border-top: 1px solid rgba(255, 255, 255, .05);
            background: transparent;
        }
        .hints {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .hint {
            flex-shrink: 0;
            font-size: 10px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 14px;
            color: rgba(255, 255, 255, .55);
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
        }
        .hint:active {
            background: rgba(255, 255, 255, .14);
        }
        .crow {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }
        #cf {
            flex: 1;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 70px;
            transition: all .2s;
        }
        #sb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .16s;
            flex-shrink: 0;
        }

        .fg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .fc {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 18px;
            padding: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all .2s;
        }
        .fc:active {
            transform: scale(.96);
        }
        .fcity {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 2px;
        }
        .fcountry {
            font-size: 10px;
            color: rgba(255, 255, 255, .38);
            margin-bottom: 10px;
        }
        .ftemp {
            font-size: 30px;
            font-weight: 200;
            margin-bottom: 2px;
        }
        .fdesc {
            font-size: 11px;
            color: rgba(255, 255, 255, .4);
        }
        .frm {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: rgba(255, 255, 255, .5);
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sw {
            position: relative;
            margin-bottom: 10px;
        }
        .sf {
            width: 100%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 10px 12px 10px 36px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .sres {
            background: rgba(0, 0, 0, .95);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 14px;
            overflow: hidden;
            margin-top: 4px;
            backdrop-filter: blur(20px);
            position: absolute;
            width: 100%;
            z-index: 10;
        }
        .sitem {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            font-size: 13px;
            color: rgba(255, 255, 255, .65);
        }

        #settingsBtn {
            position: fixed;
            top: calc(var(--st) + 6px);
            right: 14px;
            z-index: 50;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            cursor: pointer;
            display: flex;
            align-items:
                center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all .2s;
        }
        #settingsPanel {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .94);
            display: none;
            flex-direction: column;
            padding: calc(var(--st) + 20px) 18px calc(var(--sb) + 20px);
            overflow-y: auto;
            animation: fadeIn .2s;
        }
        #settingsPanel.on {
            display: flex;
        }
        .set-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            font-size: 14px;
        }
        .set-row input {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            width: 180px;
            outline: none;
        }
        #toast {
            position: fixed;
            top: calc(var(--st) + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(-70px);
            background: rgba(20, 20, 30, .96);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 18px;
            padding: 10px 18px;
            font-size: 13px;
            z-index: 300;
            transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
            white-space: nowrap;
        }
        #toast.vis {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <canvas id="bgC"></canvas>
    <button id="settingsBtn" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
    <div id="settingsPanel">
        <div class="set-title" style="font-size:20px;font-weight:300;margin-bottom:18px;display:flex;justify-content:space-between">Настройки <button onclick="toggleSettings()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:50%;width:28px;height:28px">✕</button></div>
        <div class="set-row"><span>API ключ ИИ</span><input type="password" id="apiKeyInput" placeholder="Введите ключ..."></div>
        <div class="set-row"><span>Единицы</span><select id="unitSelect" style="background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:13px"><option value="c">°C</option><option value="f">°F</option></select></div>
        <div class="set-row"><span>Авто город</span><select id="autoCitySelect" style="background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:13px"><option value="1">Вкл</option><option value="0">Выкл</option></select></div>
        <div class="set-row"><span>Имя пользователя</span><input type="text" id="userNameInput" placeholder="Ваше имя"></div>
        <button onclick="resetAll()" style="margin-top:20px;background:rgba(255,80,80,.2);border:1px solid rgba(255,80,80,.4);color:#fff;padding:8px;border-radius:10px">Сбросить все данные</button>
    </div>
    <div id="app">
        <div class="scr on" id="s-home">
            <div class="sa" id="homeScroll">
                <div class="hw">
                    <div class="cityrow"><span id="cityTxt">Загрузка...</span></div>
                    <div class="tbig" id="tempMain">–°</div>
                    <div class="feels" id="feelsTxt">Ощущается как –°</div>
                    <div class="iconwrap" id="iconWrap"></div>
                    <div class="wdesc" id="descTxt"></div>
                    <div class="hilo" id="hiloTxt"></div>
                    <div class="todlbl" id="todTxt"></div>
                </div>
                <div class="mb"><div class="sl">По часам</div><div class="hs" id="hourlyList"></div></div>
                <div class="mb"><div class="sl">5 дней</div><div class="cw" id="dailyList"></div></div>
                <div class="mb" id="aiForecastHome"></div>
                <div class="mb" id="mapBlock"><div class="sl">Карта</div><div class="map-tabs"><button class="map-tab on" data-layer="rain">Осадки</button><button class="map-tab" data-layer="temp">Температура</button><button class="map-tab" data-layer="wind">Ветер</button></div><canvas id="mapCanvas" width="400" height="220"></canvas></div>
                <div class="mb"><div class="sl">Детали</div><div class="dg" id="detailsGrid"></div></div>
                <div class="mb"><div class="sl">Солнце и луна</div><div class="cw"><div class="arcw" id="arcWrap"></div><div id="moonWrap"></div></div></div>
            </div>
        </div>
        <div class="scr" id="s-lum">
            <div class="sa">
                <div style="text-align:center;padding-top:6px"><div style="font-size:10px;color:rgba(255,255,255,.34)">Питомец</div><div style="font-size:18px;font-weight:300">Люм</div></div>
                <canvas id="lumCanvas"></canvas>
                <div class="emotxt" id="emotxt"></div>
                <div class="glass mb" style="padding:14px">
                    <div class="sl">Привязанность</div>
                    <div class="statrow"><div class="slbl">Любовь</div><div class="sbar"><div class="sfill" id="loveFill"></div></div><div class="spct" id="lovePct">60%</div></div>
                    <div style="padding-top:8px;font-size:10px;color:rgba(255,255,255,.25);display:flex;justify-content:space-between"><span id="lumVisit">Визит: сегодня</span><span id="lumStreak">1 дн.</span></div>
                </div>
                <div class="glass">
                    <div style="padding:12px 14px 6px"><div class="sl">Чат с Люмом</div><div class="hints" id="hints"></div></div>
                    <div id="chatMsgs"></div>
                    <div id="cinWrap"><div class="crow"><textarea id="cf" placeholder="Спроси Люма..." rows="1"></textarea><button id="sb" disabled><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button></div></div>
                </div>
            </div>
        </div>
        <div class="scr" id="s-saved">
            <div class="sa">
                <div style="padding-top:10px;margin-bottom:14px"><div style="font-size:10px;color:rgba(255,255,255,.34)">Мои города</div><div style="font-size:18px;font-weight:300">Избранное</div></div>
                <div class="sw"><svg class="sic" viewBox="0 0 24 24" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;stroke:rgba(255,255,255,.35);fill:none"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" class="sf" id="sfld" placeholder="Поиск города..."><div class="sres" id="sres" style="display:none"></div></div>
                <div class="fg" id="favGrid"></div>
            </div>
        </div>
    </div>
    <nav id="nav">
        <button class="nb on" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Погода</span></button>
        <button class="nb" data-tab="lum"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>Люм</span></button>
        <button class="nb" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Города</span></button>
    </nav>
    <div id="toast"></div>
    <script>
        // ──────────────────────────────────── encrypted OW key
        const OW_KEY = (() => { const a = 'MzUxZTU3YjFlNjk2'; const b = 'MmUyMTViZjk5YzI0OGNhZGJmMGI='; return atob(a) + atob(b) })();
        // ──────────────────────────────────── state
        const ST = {
            lat: 55.7558,
            lon: 37.6173,
            city: 'Москва',
            weather: null,
            isDay: 1,
            wcode: 0,
            windspeed: 0,
            tab: 'home',
            lum: { love: 60, streak: 1, lastVisit: null },
            chat: [],
            favs: [],
            settings: { apiKey: '', unit: 'c', autoCity: true, userName: '' },
            mapLayer: 'rain',
            userProfile: { name: '', facts: {} }
        };
        const S = {
            get(k, d = null) { try { const v = localStorage.getItem('lum_' + k); return v ? JSON.parse(v) : d } catch
                (e) { return d } },
            set(k, v) { try { localStorage.setItem('lum_' + k, JSON.stringify(v)) } catch (e) {} }
        };

        // ──────────────────────────────────── init
        function init() {
            ST.favs = S.get('favs', []);
            ST.settings = S.get('settings', ST.settings);
            ST.userProfile = S.get('profile', ST.userProfile);
            const ls = S.get('lumState', null); if (ls) Object.assign(ST.lum, ls);
            ST.chat = S.get('chat', []);
            document.getElementById('apiKeyInput').value = ST.settings.apiKey || '';
            document.getElementById('unitSelect').value = ST.settings.unit;
            document.getElementById('autoCitySelect').value = ST.settings.autoCity ? '1' : '0';
            document.getElementById('userNameInput').value = ST.userProfile.name || '';
            bg.init();
            lum.init();
            setupNav();
            setupSearch();
            setupChat();
            setupSettings();
            setupMap();
            renderFavs();
            renderLumScreen();
            updateLumVisit();
            if (ST.settings.autoCity && navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => { ST.lat = p.coords.latitude;
                    ST.lon = p.coords.longitude;
                    reverseGeo().then(n => { ST.city = n;
                        loadWeather();
                        toast('📍 ' + n) }) }, () => loadWeather(), { timeout: 6000, maximumAge: 300000 });
            } else loadWeather();
        }

        function setupSettings() {
            document.getElementById('apiKeyInput').addEventListener('change', function() { ST.settings.apiKey = this
                    .value.trim();
                S.set('settings', ST.settings) });
            document.getElementById('unitSelect').addEventListener('change', function() { ST.settings.unit = this
                .value;
                S.set('settings', ST.settings); if (ST.weather) renderHome(ST.weather) });
            document.getElementById('autoCitySelect').addEventListener('change', function() { ST.settings.autoCity =
                    this.value === '1';
                S.set('settings', ST.settings) });
            document.getElementById('userNameInput').addEventListener('change', function() { ST.userProfile.name =
                    this.value.trim();
                S.set('profile', ST.userProfile) });
        }

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('on') }
        document.getElementById('settingsBtn').addEventListener('click', toggleSettings);

        function resetAll() { if (confirm('Удалить все данные?')) { localStorage.clear();
                location.reload() } }

        // ──────────────────────────────────── API
        async function loadWeather() {
            try {
                const [currResp, foreResp] = await Promise.all([
                    fetch(
                        `https://api.openweathermap.org/data/2.5/weather?lat=${ST.lat}&lon=${ST.lon}&appid=${OW_KEY}&units=metric&lang=ru`
                        ),
                    fetch(
                        `https://api.openweathermap.org/data/2.5/forecast?lat=${ST.lat}&lon=${ST.lon}&appid=${OW_KEY}&units=metric&lang=ru`
                        )
                ]);
                const curr = await currResp.json(),
                    fore = await foreResp.json();
                ST.weather = { current: curr, forecast: fore.list, city: curr.name, timezone: fore.city.timezone };
                ST.isDay = curr.dt > curr.sys.sunrise && curr.dt < curr.sys.sunset ? 1 : 0;
                ST.wcode = curr.weather[0].id;
                ST.windspeed = curr.wind.speed;
                renderHome(ST.weather);
                bg.setWeather(ST.wcode, ST.isDay, ST.windspeed);
                lum.setWeather(ST.wcode, ST.isDay);
                renderMap();
            } catch (e) { console.error(e); }
        }
        async function reverseGeo() { try { const r = await fetch(
                `https://api.openweathermap.org/geo/1.0/reverse?lat=${ST.lat}&lon=${ST.lon}&limit=1&appid=${OW_KEY}`
                ); const d = await r.json(); return d[0]?.local_names?.ru || d[0]?.name || 'Мой город' } catch (
            e) { return 'Мой город' } }

        function tC(c) { return ST.settings.unit === 'f' ? Math.round(c * 9 / 5 + 32) : Math.round(c) }

        function renderHome(d) {
            const c = d.current,
                daily = groupForecast(d.forecast);
            document.getElementById('cityTxt').textContent = d.city || ST.city;
            document.getElementById('tempMain').textContent = tC(c.main.temp) + '°';
            document.getElementById('feelsTxt').textContent = 'Ощущается как ' + tC(c.main.feels_like) + '°';
            document.getElementById('descTxt').textContent = c.weather[0].description;
            document.getElementById('hiloTxt').textContent = '↑' + tC(daily[0].max) + '°  ↓' + tC(daily[0].min) + '°';
            document.getElementById('todTxt').textContent = getTimeOfDay(c);
            renderBigIcon('iconWrap', c.weather[0].id, ST.isDay, 80);
            renderHourly(d.forecast);
            renderDaily(daily);
            renderDetails(c);
            renderArc(c, daily[0]);
            renderAIHomeForecast(daily[0], c);
        }
        function getTimeOfDay(c) { const h = new Date().getHours(); if (h >= 5 && h < 7) return 'Рассвет'; if (h >= 7 && h <
                17) return 'День'; if (h >= 17 && h < 20) return 'Вечер'; if (h >= 20 && h < 21) return 'Закат'; return
            'Ночь' }

        function groupForecast(list) {
            const days = {};
            list.forEach(i => { const d = i.dt_txt.split(' ')[0]; if (!days[d]) days[d] = { temps: [],
                    icons: [], winds: [], rains: [] };
                days[d].temps.push(i.main.temp);
                days[d].icons.push(i.weather[0].id);
                days[d].winds.push(i.wind.speed);
                days[d].rains.push(i.pop || 0) });
            return Object.keys(days).slice(0, 5).map(d => ({ date: d, max: Math.max(...days[d].temps), min: Math.min(
                    ...days[d].temps), icon: mostFreq(days[d].icons), wind: (days[d].winds.reduce((a, b) => a + b,
                    0) / days[d].winds.length).toFixed(1), rain: Math.round(Math.max(...days[d].rains) *
                100) }));
        }

        function mostFreq(arr) { return arr.sort((a, b) => arr.filter(v => v === a).length - arr.filter(v => v === b)
                .length).pop() }

        function owIconType(code, isDay) {
            if (code >= 200 && code < 300) return 'storm';
            if (code >= 300 && code < 400) return 'rain';
            if (code >= 500 && code < 510) return 'rain';
            if (code >= 511 && code <= 511) return 'snow';
            if (code >= 520 && code < 600) return 'rain';
            if (code >= 600 && code < 700) return 'snow';
            if (code >= 700 && code < 800) return 'fog';
            if (code === 800) return isDay ? 'sun' : 'moon';
            if (code === 801) return isDay ? 'pcloud' : 'ncloud';
            return 'cloudy';
        }

        function buildIconSVG(t, sz) {
            const s = sz || 28;
            const svgs = {
                sun: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><circle cx="45" cy="45" r="18" fill="#FFD040" filter="drop-shadow(0 0 12px rgba(255,210,0,.7))"/><g style="transform-origin:45px 45px;animation:rr 12s linear infinite">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="45" y1="8" x2="45" y2="16" stroke="rgba(255,220,80,.7)" stroke-width="3" stroke-linecap="round" transform="rotate(${a} 45 45)"/>`).join('')}</g><style>@keyframes rr{to{transform:rotate(360deg)}}</style></svg>`,
                moon: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><path d="M58 48c-12 0-22-9-22-22 0-3.5.7-6.5 1.8-9.5C26 18 16 30 16 44c0 15 12 27 27 27 12 0 22-7 26-17-3.5 1.2-7 1.8-11 1.8z" fill="#D4E8FF" filter="drop-shadow(0 0 10px rgba(160,200,255,.5))"/></svg>`,
                pcloud: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><circle cx="24" cy="38" r="7" fill="#FFD040" filter="drop-shadow(0 0 6px rgba(255,210,0,.6))"/><ellipse cx="50" cy="52" rx="24" ry="15" fill="rgba(200,215,238,.88)"/><circle cx="38" cy="44" r="13" fill="rgba(215,228,248,.88)"/><circle cx="54" cy="46" r="10" fill="rgba(200,215,238,.88)"/></svg>`,
                cloudy: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="46" cy="53" rx="28" ry="17" fill="rgba(175,190,218,.85)"/><circle cx="33" cy="44" r="15" fill="rgba(185,200,228,.85)"/><circle cx="55" cy="46" r="12" fill="rgba(175,190,218,.85)"/></svg>`,
                rain: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="46" cy="38" rx="26" ry="15" fill="rgba(140,158,190,.85)"/><circle cx="33" cy="30" r="13" fill="rgba(150,168,200,.85)"/><circle cx="54" cy="32" r="11" fill="rgba(140,158,190,.85)"/><line x1="28" y1="56" x2="25" y2="66" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round" style="animation:rf 1.1s infinite"/><line x1="42" y1="56" x2="39" y2="66" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round" style="animation:rf 1.1s infinite;animation-delay:.35s"/><line x1="56" y1="56" x2="53" y2="66" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round" style="animation:rf 1.1s infinite;animation-delay:.7s"/><style>@keyframes rf{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}100%{opacity:.6;transform:translateY(10px)}}</style></svg>`,
                snow: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="46" cy="36" rx="26" ry="15" fill="rgba(210,225,248,.82)"/><circle cx="33" cy="28" r="12" fill="rgba(218,232,252,.82)"/><circle cx="54" cy="30" r="10" fill="rgba(210,225,248,.82)"/><g style="animation:sf 1.8s infinite"><circle cx="28" cy="58" r="3" fill="#fff"/></g><g style="animation:sf 1.8s infinite;animation-delay:.6s"><circle cx="44" cy="64" r="3" fill="#fff"/></g><g style="animation:sf 1.8s infinite;animation-delay:1.2s"><circle cx="60" cy="58" r="3" fill="#fff"/></g></svg>`,
                storm: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="44" cy="34" rx="28" ry="17" fill="rgba(75,65,115,.88)"/><circle cx="30" cy="26" r="14" fill="rgba(85,75,125,.88)"/><circle cx="54" cy="28" r="11" fill="rgba(75,65,115,.88)"/><path d="M46 46 L38 56 L43 56 L36 70 L48 50 L42 50 Z" fill="#FFD040" style="animation:lf 2s infinite"/></svg>`,
                fog: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><line x1="14" y1="32" x2="76" y2="32" stroke="rgba(200,210,230,.5)" stroke-width="4"/><line x1="22" y1="46" x2="68" y2="46" stroke="rgba(200,210,230,.4)" stroke-width="4"/></svg>`
            };
            return svgs[t] || svgs['cloudy'];
        }

        function renderBigIcon(id, code, isDay, sz) { document.getElementById(id).innerHTML = buildIconSVG(owIconType(code,
                isDay), sz) }

        function renderHourly(list) {
            document.getElementById('hourlyList').innerHTML = list.slice(0, 24).map((i, idx) => {
                const dt = new Date(i.dt * 1000);
                const hr = dt.getHours().toString().padStart(2, '0') + ':00';
                const temp = tC(i.main.temp);
                const rain = Math.round((i.pop || 0) * 100);
                const icon = owIconType(i.weather[0].id, dt.getHours() > 6 && dt.getHours() < 21 ? 1 : 0);
                return `<div class="hc"><div class="ht">${hr}</div><div style="width:24px;height:24px">${buildIconSVG(icon,18)}</div><div class="htemp">${temp}°</div>${rain>8?`<div class="hrain">${rain}%</div>`:''}</div>`;
            }).join('');
        }

        function renderDaily(daily) {
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'],
                mo = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            document.getElementById('dailyList').innerHTML = daily.map((d, i) => {
                const dt = new Date(d.date);
                const lbl = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : days[dt.getDay()] + ', ' + dt.getDate() +
                    ' ' + mo[dt.getMonth()];
                const hi = tC(d.max),
                    lo = tC(d.min);
                const icon = owIconType(d.icon, 1);
                return `<div class="dr" onclick="toggleDayExpand(this,'${d.date}')"><div class="dn">${lbl}</div>${d.rain>15?`<div style="font-size:9px;color:#6ECFFF">${d.rain}%</div>`:''}<div class="dw-icon">${buildIconSVG(icon,22)}</div><div class="dt"><span class="dhi">${hi}°</span><span>${lo}°</span></div><div class="dw-wind">${d.wind} м/с</div></div><div class="dexp" id="dexp-${d.date}"></div>`;
            }).join('');
        }

        function toggleDayExpand(row, date) {
            const exp = document.getElementById('dexp-' + date);
            document.querySelectorAll('.dexp.on').forEach(e => e.classList.remove('on'));
            if (!exp.classList.contains('on')) { exp.classList.add('on');
                loadDayExpand(exp, date); }
        }

        function loadDayExpand(exp, date) {
            const list = ST.weather.forecast.filter(f => f.dt_txt.startsWith(date));
            const parts = [
                { label: 'Утро', temp: tC(list[2]?.main.temp || list[0].main.temp), feels: tC(list[2]?.main
                        .feels_like || list[0].main.feels_like), icon: list[2]?.weather[0].id || list[0].weather[
                        0].id, isDay: 1 },
                { label: 'День', temp: tC(list[4]?.main.temp || list[0].main.temp), feels: tC(list[4]?.main
                        .feels_like || list[0].main.feels_like), icon: list[4]?.weather[0].id || list[0].weather[
                        0].id, isDay: 1 },
                { label: 'Вечер', temp: tC(list[6]?.main.temp || list[0].main.temp), feels: tC(list[6]?.main
                        .feels_like || list[0].main.feels_like), icon: list[6]?.weather[0].id || list[0].weather[
                        0].id, isDay: 1 },
                { label: 'Ночь', temp: tC(list[7]?.main.temp || list[0].main.temp), feels: tC(list[7]?.main
                        .feels_like || list[0].main.feels_like), icon: list[7]?.weather[0].id || list[0].weather[
                        0].id, isDay: 0 }
            ];
            exp.innerHTML = `<div class="departs">${parts.map(p=>`<div class="dep"><div class="dep-label">${p.label}</div><div class="dep-icon">${buildIconSVG(owIconType(p.icon,p.isDay),18)}</div><div class="dep-temp">${p.temp}°</div><div class="dep-feels">Ощущ. ${p.feels}°</div></div>`).join('')}</div><div class="ai-forecast-block" id="aifb-${date}"><div class="dots"><span></span><span></span><span></span></div></div>`;
            setTimeout(() => generateAIForecast(date, list), 500);
        }

        function generateAIForecast(date, list) {
            const block = document.getElementById('aifb-' + date);
            if (!block) return;
            const hi = tC(Math.max(...list.map(i => i.main.temp))),
                lo = tC(Math.min(...list.map(i => i.main.temp)));
            const desc = list[0].weather[0].description;

                'Привет! Я Люм, спрашивай о чём угодно.', false);
            scrollChat();
            document.getElementById('hints').innerHTML = ['Температура', 'Прогноз', 'Что надеть?', 'Расскажи анекдот'].map(
                h => `<div class="hint">${h}</div>`).join('');
            document.querySelectorAll('.hint').forEach(h => h.addEventListener('click', function() { cf.value = this
                    .textContent;
                sendMsg() }));
        }

        async function sendMsg() {
            const cf = document.getElementById('cf'),
                text = cf.value.trim();
            if (!text) return;
            cf.value = '';
            cf.style.height = 'auto';
            sb.disabled = true;
            addBubble('user', text, true);
            ST.lum.love = Math.min(100, ST.lum.love + 3);
            S.set('lumState', ST.lum);
            renderLumScreen();
            const tid = 't' + Date.now();
            const el = document.getElementById('chatMsgs');
            const d = document.createElement('div');
            d.className = 'msg ai';
            d.id = tid;
            d.innerHTML = '<div class="av">✨</div><div class="bbl"><div class="dots"><span></span><span></span><span></span></div></div>';
            el.appendChild(d);
            scrollChat();
            const wctx = ST.weather ? { city: ST.city, temp: tC(ST.weather.current.main.temp), feels: tC(ST.weather
                    .current.main.feels_like), desc: ST.weather.current.weather[0].description, wind: ST
                    .weather.current.wind.speed.toFixed(1), humidity: ST.weather.current.main.humidity } : null;
            const apiKey = ST.settings.apiKey;
            let reply = '';
            if (apiKey && apiKey.length > 10) {
                try {
                    const r = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                        body: JSON.stringify({ model: 'gpt-4o-mini', messages: [{ role: 'system',
                                content: 'Ты Люм, питомец-огонь. Отвечай коротко, дружелюбно.' }, ...ST
                                .chat.slice(-6).map(m => ({ role: m.role === 'ai' ? 'assistant' :
                                    'user', content: m.text })), { role: 'user',
                                content: `Погода: ${JSON.stringify(wctx)}. Сообщение: ${text}` }] })
                    });
                    const j = await r.json();
                    reply = j.choices?.[0]?.message?.content || fallback(text, wctx);
                } catch (e) { reply = fallback(text, wctx) }
            } else reply = fallback(text, wctx);
            document.getElementById(tid)?.remove();
            addBubble('ai', reply, true);
            ST.chat.push({ role: 'user', text }, { role: 'ai', text: reply });
            S.set('chat', ST.chat.slice(-30));
            brain.learn(text, reply);
            if (text.toLowerCase().includes('температура') && wctx) lum.showAnswer('temp', wctx.temp);
            if (text.toLowerCase().includes('погода') && wctx) lum.showAnswer('icon', ST.wcode);
        }

        function fallback(q, w) {
            const ql = q.toLowerCase();
            if (w && ql.includes('температура')) return `Сейчас в ${w.city} ${w.temp}°. Ощущается как ${w.feels}°.`;
            if (w && ql.includes('погода')) return `В ${w.city} ${w.desc}, ${w.temp}°.`;
            if (w && ql.includes('надеть')) return w.temp < 5 ? 'Тепло одевайся!' : w.temp < 15 ? 'Куртка подойдёт.' :
                'Можно легко.';
            if (ql.includes('анекдот')) return 'Программист говорит: "У меня 10 проблем, но я написал 10 строк кода. Теперь у меня 20 проблем."';
            if (ql.includes('привет') || ql.includes('здравствуй')) return 'Привет! Я Люм, рад тебя видеть.';
            if (ql.includes('как дела')) return 'У меня всё отлично! А у тебя?';
            const mem = brain.recall(q);
            if (mem) return mem;
            return 'Я пока не знаю, как ответить, но я учусь! Спроси что-нибудь о погоде.';
        }

        function addBubble(role, text, animate) { const el = document.getElementById('chatMsgs'); const d = document
                .createElement('div');
            d.className = `msg ${role}`; if (!animate) d.style.animation = 'none';
            d.innerHTML = role === 'ai' ? `<div class="av">✨</div><div class="bbl">${text}</div>` :
                `<div class="bbl">${text}</div>`;
            el.appendChild(d); if (animate) scrollChat() }

        function scrollChat() { const e = document.getElementById('chatMsgs');
            setTimeout(() => e.scrollTo({ top: e.scrollHeight, behavior: 'smooth' }), 40) }

        function renderFavs() {
            const el = document.getElementById('favGrid');
            if (!ST.favs.length) return el.innerHTML =
                '<div style="grid-column:1/-1;text-align:center;padding:30px;color:rgba(255,255,255,.25)">Найди и добавь города</div>';
            el.innerHTML = ST.favs.map((c, i) =>
                `<div class="fc" onclick="loadFav(${i})"><button class="frm" onclick="event.stopPropagation();rmFav(${i})">✕</button><div class="fcity">${c.name}</div><div class="ftemp">${c.temp||'–'}°</div></div>`
                ).join('');
        }

        function rmFav(i) { ST.favs.splice(i, 1);
            S.set('favs', ST.favs);
            renderFavs() }
        async function loadFav(i) { const c = ST.favs[i];
            ST.lat = c.lat;
            ST.lon = c.lon;
            ST.city = c.name;
            switchTab('home');
            await loadWeather();
            toast('📍 ' + c.name) }

        function setupSearch() {
            const sf = document.getElementById('sfld'),
                sr = document.getElementById('sres');
            let deb;
            sf.addEventListener('input', () => {
                clearTimeout(deb);
                const q = sf.value.trim();
                if (q.length < 2) { sr.style.display = 'none'; return }
                deb = setTimeout(async () => {
                    try {
                        const r = await fetch(
                            `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=5&appid=${OW_KEY}`
                            );
                        const d = await r.json(); if (!d.length) { sr.style.display = 'none'; return }
                        sr.style.display = 'block';
                        sr.innerHTML = d.map(r =>
                            `<div class="sitem" onclick="pickCity(${r.lat},${r.lon},'${r.local_names?.ru||r.name}')">${r.local_names?.ru||r.name}</div>`
                            ).join('');
                    } catch (e) { sr.style.display = 'none' }
                }, 300);
            });
            document.addEventListener('click', e => { if (!sf.contains(e.target) && !sr.contains(e.target)) sr.style
                    .display = 'none' });
        }
        async function pickCity(lat, lon, name) { document.getElementById('sres').style.display = 'none';
            document.getElementById('sfld').value = ''; try { const r = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${OW_KEY}&units=metric&lang=ru`
                    ); const d = await r.json(); if (!ST.favs.find(f => f.name === name)) { ST.favs.push({ name,
                        lat, lon, temp: tC(d.main.temp) });
                    S.set('favs', ST.favs);
                    toast('❤️ ' + name + ' добавлен') } else toast('Уже есть');
                renderFavs() } catch (e) { toast('Ошибка') } }

        function setupNav() { document.querySelectorAll('.nb').forEach(b => b.addEventListener('click', () => switchTab(b
                .dataset.tab))) }

        function switchTab(tab) { ST.tab = tab;
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
            document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
            document.getElementById('s-' + tab)?.classList.add('on'); if (tab === 'lum') { renderLumScreen();
                lum.init() } if (tab === 'saved') renderFavs() }

        function toast(msg) { const e = document.getElementById('toast');
            e.textContent = msg;
            e.classList.add('vis');
            setTimeout(() => e.classList.remove('vis'), 2400) }
        init();
    </script>
</body>
</html>

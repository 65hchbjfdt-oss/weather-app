<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #007AFF; 
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --glass: rgba(30, 30, 30, 0.7);
            --blur: blur(25px) saturate(180%);
        }
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, system-ui, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.5) contrast(1.1); }
        
        /* UI Panel */
        .ui-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; background: var(--glass);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 0.5px solid rgba(255,255,255,0.15); border-radius: 32px;
            padding: 20px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 16px; margin: 5px 0; border: none; border-radius: 18px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s;
            background: var(--ios-blue); color: #fff;
        }
        .btn-sec { background: rgba(255,255,255,0.08); color: #fff; }
        .btn:active { transform: scale(0.97); opacity: 0.8; }

        /* Sliders */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 35px; }
        input[type=range]::-webkit-slider-runnable-track { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
            background: #fff; margin-top: -8px; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Radar Unit */
        #radar-ui { margin-bottom: 15px; }
        #radar {
            width: 70px; height: 70px; margin: 0 auto 10px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; position: relative; background: radial-gradient(circle, rgba(52,199,89,0.1) 0%, transparent 70%);
        }
        #radar-arrow {
            position: absolute; top: 50%; left: 50%; width: 2px; height: 30px;
            background: var(--ios-green); transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg); transition: 0.1s ease-out;
        }

        /* Modals & Alerts */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 320px; background: rgba(25,25,25,0.95);
            backdrop-filter: var(--blur); border-radius: 28px; padding: 25px;
            display: none; z-index: 1000; border: 0.5px solid rgba(255,255,255,0.1);
        }
        .custom-alert {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.9); padding: 12px 24px; border-radius: 20px;
            z-index: 2000; font-size: 14px; font-weight: 600; display: none;
            backdrop-filter: blur(10px); box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .active { display: block; animation: iosPop 0.3s ease-out; }
        @keyframes iosPop { from { opacity: 0; scale: 0.9; } to { opacity: 1; scale: 1; } }

        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 30px; height: 30px;
            z-index: 50; border: 1px solid var(--ios-green); border-radius: 50%;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>
<div id="iosAlert" class="custom-alert"></div>

<div class="ui-panel">
    <div id="radar-ui" style="display:none; text-align: center;">
        <div id="radar"><div id="radar-arrow"></div></div>
        <div id="distance-text" style="font-size: 10px; letter-spacing: 2px; color: var(--ios-green); font-weight: 800;">СИГНАЛ: 0%</div>
    </div>

    <div id="scan-box" style="display:none; text-align:center; padding: 20px 0;">
        <div style="font-size: 12px; color: var(--ios-blue); letter-spacing: 3px; font-weight: 800; animation: pulse 1s infinite;">СКАНИРОВАНИЕ...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" onclick="openM('settings')">Настройки</button>
            <button class="btn btn-sec" onclick="openM('map-styles')">Слои</button>
        </div>
        <button class="btn btn-sec" id="selectBtn" onclick="toggleSelect()">📍 Указать точку поиска</button>
        <button class="btn" id="mainBtn" onclick="executeScan()">НАЙТИ АНОМАЛИЮ</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--ios-green); color: #000;" onclick="buildRoute()">ПОСТРОИТЬ МАРШРУТ</button>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" style="flex: 1;" onclick="openM('info')">ДАННЫЕ</button>
            <button class="btn btn-sec" style="flex: 1; color: var(--ios-red);" onclick="resetSystem()">СБРОС</button>
        </div>
    </div>
</div>

<div id="settings" class="modal">
    <h3 style="text-align:center; margin-top:0">KiwiWay Config</h3>
    <label style="font-size: 11px; opacity: 0.5;">КАТЕГОРИЯ</label>
    <select id="catSelect" style="width:100%; background:rgba(255,255,255,0.1); color:#fff; border:none; padding:14px; border-radius:14px; margin: 8px 0 15px;">
        <option value="quantum">Квантовый</option>
        <option value="power">Мощный</option>
        <option value="void">Пустота</option>
    </select>
    
    <label style="font-size: 11px; opacity: 0.5;">РАДИУС: <span id="rL" style="color:var(--ios-blue)">5</span> км</label>
    <input type="range" id="radiusIn" min="1" max="15" value="5" oninput="syncUI()">
    
    <label style="font-size: 11px; opacity: 0.5; margin-top: 10px; display: block;">МОЩНОСТЬ АНОМАЛИИ: <span id="pL" style="color:var(--ios-green)">25</span>%</label>
    <input type="range" id="powerIn" min="1" max="50" value="25" oninput="syncUI()">

    <div style="display:flex; justify-content: space-between; align-items: center; margin-top:15px; font-size: 14px;">
        <span>Звуковое сопровождение</span>
        <input type="checkbox" id="soundToggle" checked>
    </div>
    <button class="btn" style="margin-top:20px" onclick="closeM()">ГОТОВО</button>
</div>

<div id="info" class="modal">
    <h3 id="anomalyName" style="color: var(--ios-green); margin-bottom:5px;">Объект</h3>
    <div id="infoBody" style="font-size: 13px; opacity: 0.7; line-height: 1.5;"></div>
    <div id="coordsBox" style="margin-top:12px; font-family:monospace; background:rgba(0,0,0,0.5); padding:10px; border-radius:12px; text-align:center; color: var(--ios-blue);"></div>
    <div class="btn btn-sec" style="font-size: 12px; margin-top: 10px;" onclick="copyCoords()">СКОПИРОВАТЬ КООРДИНАТЫ</div>
    <button class="btn" style="margin-top:10px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<div id="map-styles" class="modal">
    <button class="btn btn-sec" onclick="setMapStyle('dark')">ТЕМНАЯ МАТЕРИЯ</button>
    <button class="btn btn-sec" onclick="setMapStyle('sat')">СПУТНИК</button>
    <button class="btn" style="margin-top:10px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let map, userPos, searchOrigin, targetPoint, isSelecting = false;
    let radarInterval;

    function showAlert(text) {
        const el = document.getElementById('iosAlert');
        el.innerText = text;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    function playSound(type) {
        if (!document.getElementById('soundToggle').checked) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'tap') {
            osc.frequency.setValueAtTime(900, now);
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'found') {
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.4);
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(); osc.stop(now + 0.4);
        }
    }

    const STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        sat: { "version": 8, "sources": { "s": { "type": "raster", "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], "tileSize": 256 }}, "layers": [{ "id": "s", "type": "raster", "source": "s" }] }
    };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        searchOrigin = userPos;
        map.setCenter(userPos);
        new maplibregl.Marker({ color: '#007AFF' }).setLngLat(userPos).addTo(map);
        syncUI();
    });

    function syncUI() {
        document.getElementById('rL').innerText = document.getElementById('radiusIn').value;
        document.getElementById('pL').innerText = document.getElementById('powerIn').value;
        if (searchOrigin) {
            const r = document.getElementById('radiusIn').value;
            const circle = genCircle(searchOrigin, r);
            if (map.getSource('rad')) map.getSource('rad').setData(circle);
            else {
                map.addSource('rad', { type: 'geojson', data: circle });
                map.addLayer({ id: 'rad-l', type: 'fill', source: 'rad', paint: { 'fill-color': '#007AFF', 'fill-opacity': 0.1 } });
            }
        }
    }

    function toggleSelect() {
        isSelecting = !isSelecting;
        document.getElementById('crosshair').style.display = isSelecting ? 'block' : 'none';
        const b = document.getElementById('mainBtn');
        if (isSelecting) {
            b.innerText = "ПОДТВЕРДИТЬ ТОЧКУ";
            b.style.background = "var(--ios-green)";
            b.onclick = () => {
                searchOrigin = [map.getCenter().lng, map.getCenter().lat];
                toggleSelect(); syncUI(); playSound('tap');
                b.innerText = "НАЙТИ АНОМАЛИЮ"; b.style.background = "";
                b.onclick = executeScan;
            };
        }
    }

    async function executeScan() {
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        
        const mode = document.getElementById('catSelect').value;
        const radius = document.getElementById('radiusIn').value;
        let found = null;

        for (let i = 0; i < 20; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = (Math.sqrt(Math.random()) * radius) / 111;
            const pt = [searchOrigin[0] + d * Math.cos(a), searchOrigin[1] + d * Math.sin(a)];
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                let score = 0;
                if (mode === 'quantum' && (data.addresstype === 'historic' || data.type === 'cemetery' || data.addresstype === 'place_of_worship')) score = 100;
                if (mode === 'power' && (data.address.industrial || data.type === 'construction' || data.type === 'ruins')) score = 100;
                if (mode === 'void' && (!data.address.road && !data.address.house_number)) score = 100;
                if (score === 100) { found = { coords: pt, data: data }; break; }
            } catch(e) {}
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            if (found) {
                targetPoint = found.coords;
                startRadar();
                showTarget(found, mode);
                playSound('found');
            } else {
                resetSystem();
                showAlert("СИГНАЛ ПОТЕРЯН: АНОМАЛИЙ НЕ НАЙДЕНО");
            }
        }, 2000);
    }

    function startRadar() {
        const power = parseInt(document.getElementById('powerIn').value);
        document.getElementById('radar-ui').style.display = 'block';
        radarInterval = setInterval(() => {
            const dist = getDistance(userPos, targetPoint);
            const maxR = document.getElementById('radiusIn').value * 1000;
            // Базовая сила сигнала
            let baseStrength = Math.max(0, (1 - dist / maxR) * 100);
            // Прыжки радара зависят от мощности
            let jitter = (Math.random() - 0.5) * power * 2;
            let currentSignal = Math.max(0, Math.min(100, baseStrength + jitter));
            
            // Редкое пропадание сигнала (аномальное поведение)
            if (Math.random() > 0.95) currentSignal = 0;

            document.getElementById('radar-arrow').style.transform = `translate(-50%, -100%) rotate(${currentSignal * 3.6}deg)`;
            document.getElementById('distance-text').innerText = `СИГНАЛ: ${currentSignal.toFixed(0)}%`;
        }, 150);
    }

    function showTarget(obj, mode) {
        const names = {
            quantum: ["Разрыв 404", "Нулевой Храм", "Эхо Времени"],
            power: ["Сектор Гробо", "Сталь-9", "Зона Распада"],
            void: ["Тихая Топь", "Мертвый Квадрат", "Шепот Ветра"]
        };
        document.getElementById('anomalyName').innerText = names[mode][Math.floor(Math.random()*3)];
        document.getElementById('infoBody').innerHTML = `<b>ТИП:</b> ${mode.toUpperCase()}<br><b>ЛОКАЦИЯ:</b> ${obj.data.display_name}`;
        document.getElementById('coordsBox').innerText = `${targetPoint[1].toFixed(6)}, ${targetPoint[0].toFixed(6)}`;
        
        if (window.m) window.m.remove();
        const el = document.createElement('div');
        el.style.cssText = "width:15px; height:15px; background:var(--ios-red); border-radius:50%; box-shadow: 0 0 15px var(--ios-red);";
        window.m = new maplibregl.Marker(el).setLngLat(targetPoint).addTo(map);
        map.flyTo({ center: targetPoint, zoom: 16, duration: 2500 });
        document.getElementById('ui-found').style.display = 'block';
    }

    async function buildRoute() {
        const res = await fetch(`https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`);
        const data = await res.json();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        map.addSource('route', { type: 'geojson', data: data.routes[0].geometry });
        map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#007AFF', 'line-width': 4 } });
        playSound('tap');
    }

    function resetSystem() {
        clearInterval(radarInterval);
        if (window.m) window.m.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('radar-ui').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        map.flyTo({ center: searchOrigin, zoom: 11 });
    }

    function copyCoords() {
        navigator.clipboard.writeText(document.getElementById('coordsBox').innerText);
        showAlert("КООРДИНАТЫ СКОПИРОВАНЫ");
    }

    function genCircle(c, km) {
        const p = 64; const res = [];
        const dx = km / (111.32 * Math.cos(c[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i <= p; i++) {
            const a = (i / p) * (Math.PI * 2);
            res.push([c[0] + dx * Math.cos(a), c[1] + dy * Math.sin(a)]);
        }
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [res] } };
    }

    function getDistance(p1, p2) {
        const R = 6371000;
        const dLat = (p2[1]-p1[1]) * Math.PI/180;
        const dLon = (p2[0]-p1[0]) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1[1]*Math.PI/180)*Math.cos(p2[1]*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function openM(id) { document.getElementById(id).classList.add('active'); playSound('tap'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); playSound('tap'); }
    function setMapStyle(t) { map.setStyle(STYLES[t]); closeM(); }
</script>
</body>
</html>

<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lum</title>
<style>
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,34px);--nav:62px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#04040e;font-family:-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#bgC{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;max-width:430px;margin:0 auto}
.scr{display:none;flex:1;flex-direction:column;overflow:hidden;position:relative}
.scr.on{display:flex}
.sa{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(var(--st) + 8px) 14px calc(var(--nav) + 24px)}
.sa::-webkit-scrollbar{display:none}

/* glass */
.g{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-radius:20px}
.g:active{transform:scale(.98);transition:transform .12s ease}

/* nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(var(–nav) + var(–sb));padding-bottom:var(–sb);display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px;background:rgba(4,4,14,.8);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid rgba(255,255,255,.08);z-index:100}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;padding:3px 14px;border-radius:12px;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.nb svg{width:21px;height:21px;stroke:rgba(255,255,255,.38);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:all .25s}
.nb span{font-size:9.5px;color:rgba(255,255,255,.38);transition:color .25s;letter-spacing:.01em}
.nb.on svg{stroke:rgba(255,255,255,.92);filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
.nb.on span{color:rgba(255,255,255,.82)}
.nb.on{transform:scale(1.06)}

/* weather screen */
.hw{padding:calc(var(–st) + 2px) 16px 0;text-align:center}
.cityrow{font-size:13px;font-weight:300;color:rgba(255,255,255,.55);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:4px}
.cityrow svg{width:10px;height:10px;stroke:rgba(255,255,255,.4);fill:none;stroke-width:2}
.tbig{font-size:96px;font-weight:100;line-height:1;letter-spacing:-5px;background:linear-gradient(170deg,rgba(255,255,255,.98) 25%,rgba(255,255,255,.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:tIN .65s ease both}
@keyframes tIN{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
.feels{font-size:12px;color:rgba(255,255,255,.4);margin:3px 0 12px}
.iconwrap{width:96px;height:96px;margin:0 auto 8px}
.wdesc{font-size:16px;font-weight:300;color:rgba(255,255,255,.65)}
.hilo{font-size:12px;color:rgba(255,255,255,.38);margin-top:3px;letter-spacing:.04em}
.todlbl{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;margin:2px 0 10px}

/* section label */
.sl{font-size:10px;font-weight:500;color:rgba(255,255,255,.38);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;padding:0 1px}
.mb{margin-bottom:10px}

/* hourly */
.hs{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hc{flex:0 0 58px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;transition:all .18s;-webkit-user-select:none}
.hc.now{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}
.hc:active{transform:scale(.95)}
.ht{font-size:10px;color:rgba(255,255,255,.38)}
.htemp{font-size:14px;font-weight:400}
.hrain{font-size:9px;color:#6ECFFF}

/* daily */
.cw{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;overflow:hidden}
.dr{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;-webkit-user-select:none}
.dr:last-child{border-bottom:none}
.dr:active{background:rgba(255,255,255,.04)}
.dn{font-size:14px;font-weight:300;flex:1}
.dt{font-size:14px;font-weight:300;display:flex;gap:6px;color:rgba(255,255,255,.55)}
.dhi{color:rgba(255,255,255,.9)}

/* details grid */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:15px;padding:12px 13px}
.dlbl{font-size:10px;color:rgba(255,255,255,.38);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.dval{font-size:20px;font-weight:300}
.dsub{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px}
.uvbar{height:3px;border-radius:2px;margin-top:4px;background:linear-gradient(90deg,#4ade80,#facc15,#f97316,#ef4444);position:relative}
.uvm{position:absolute;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;transition:left .5s}

/* sun arc */
.arcw{padding:16px 14px 8px;position:relative}
.arct{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:rgba(255,255,255,.38)}
.arcmid{text-align:center}
.moonrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid rgba(255,255,255,.05)}

/* LUM screen */
#lumCanvas{width:220px;height:230px;display:block;margin:0 auto;cursor:pointer;-webkit-user-select:none}
.emotxt{text-align:center;font-size:12px;color:rgba(255,255,255,.4);margin:2px 0 18px;letter-spacing:.04em;min-height:16px}
.statrow{display:flex;align-items:center;gap:10px;padding:0 2px}
.slbl{font-size:12px;color:rgba(255,255,255,.4);width:64px;flex-shrink:0}
.sbar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.sfill{height:100%;border-radius:2px;background:linear-gradient(90deg,#FF6B9D,#FF8E9D);transition:width 1.2s ease}
.spct{font-size:11px;color:rgba(255,255,255,.38);width:28px;text-align:right}

/* chat (inside lum tab) */
#chatArea{flex:1;display:flex;flex-direction:column;min-height:0}
#chatMsgs{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:7px;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:120px;max-height:240px}
#chatMsgs::-webkit-scrollbar{display:none}
.msg{display:flex;align-items:flex-end;gap:6px;animation:mIN .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes mIN{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg.u{flex-direction:row-reverse}
.bbl{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45;font-weight:300}
.msg.ai .bbl{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:4px}
.msg.u .bbl{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-bottom-right-radius:4px}
.av{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#b8a0ff,#6040c0);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.dots{display:flex;gap:3px;align-items:center;padding:3px 1px}
.dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);animation:dp 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* chat input */
#cinWrap{padding:8px 14px calc(var(–nav) + var(–sb) + 4px);background:rgba(4,4,14,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.06)}
.hints{display:flex;gap:5px;margin-bottom:7px;overflow-x:auto;scrollbar-width:none}
.hints::-webkit-scrollbar{display:none}
.hint{flex-shrink:0;font-size:11px;padding:5px 10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:18px;color:rgba(255,255,255,.6);cursor:pointer;white-space:nowrap;transition:all .15s}
.hint:active{background:rgba(255,255,255,.14)}
.crow{display:flex;gap:7px;align-items:flex-end}
#cf{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);border-radius:20px;padding:9px 14px;color:#fff;font-size:14px;font-family:inherit;outline:none;resize:none;max-height:80px;-webkit-appearance:none}
#cf::placeholder{color:rgba(255,255,255,.3)}
#sb{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0}
#sb:disabled{opacity:.3}
#sb svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sb:not(:disabled):active{transform:scale(.9)}

/* saved */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;padding:14px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.fc:active{transform:scale(.97)}
.fcity{font-size:15px;font-weight:400;margin-bottom:1px}
.fcountry{font-size:10px;color:rgba(255,255,255,.4);margin-bottom:10px}
.ftemp{font-size:30px;font-weight:200;margin-bottom:2px}
.fdesc{font-size:11px;color:rgba(255,255,255,.4)}
.frm{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.1);border:none;cursor:pointer;color:rgba(255,255,255,.45);font-size:12px;display:flex;align-items:center;justify-content:center}

/* search */
.sw{position:relative;margin-bottom:10px}
.sf{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);border-radius:13px;padding:10px 13px 10px 38px;color:#fff;font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none}
.sf::placeholder{color:rgba(255,255,255,.3)}
.sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.sres{background:rgba(10,10,24,.96);border:1px solid rgba(255,255,255,.1);border-radius:13px;overflow:hidden;margin-top:3px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.sitem{padding:11px 13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;color:rgba(255,255,255,.65);transition:background .12s}
.sitem:last-child{border-bottom:none}
.sitem:active{background:rgba(255,255,255,.06)}
.scity{font-size:14px;color:#fff}

/* ptr */
.ptr{position:absolute;top:calc(var(–st) + 2px);left:50%;transform:translateX(-50%) translateY(-42px);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:transform .25s;opacity:0;z-index:5}
.ptr.vis{opacity:1}
.pspin{width:14px;height:14px;border:1.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* skeleton */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shim 1.4s ease-in-out infinite;border-radius:8px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* toast */
#toast{position:fixed;top:calc(var(–st) + 8px);left:50%;transform:translateX(-50%) translateY(-70px);background:rgba(20,20,36,.96);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 16px;font-size:13px;backdrop-filter:blur(18px);z-index:200;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
#toast.vis{transform:translateX(-50%) translateY(0)}

@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.anim{animation:slideUp .45s ease both}
.d1{animation-delay:.04s}.d2{animation-delay:.09s}.d3{animation-delay:.14s}.d4{animation-delay:.19s}
</style>

</head>
<body>
<canvas id="bgC"></canvas>
<div id="app">

<!-- HOME -->

<div class="scr on" id="s-home">
  <div class="ptr" id="ptr"><div class="pspin"></div></div>
  <div class="sa" id="homeScroll">
    <div class="hw">
      <div class="cityrow">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <span id="cityTxt">Загрузка...</span>
      </div>
      <div class="tbig" id="tempMain">–°</div>
      <div class="feels" id="feelsTxt">Ощущается как –°</div>
      <div class="iconwrap" id="iconWrap"></div>
      <div class="wdesc" id="descTxt"></div>
      <div class="hilo" id="hiloTxt"></div>
      <div class="todlbl" id="todTxt"></div>
    </div>
    <div style="height:16px"></div>
    <div class="mb anim d1">
      <div class="sl">По часам</div>
      <div class="hs" id="hourlyList"></div>
    </div>
    <div class="mb anim d2">
      <div class="sl">7 дней</div>
      <div class="cw" id="dailyList"></div>
    </div>
    <div class="mb anim d3">
      <div class="sl">Детали</div>
      <div class="dg" id="detailsGrid"></div>
    </div>
    <div class="mb anim d4">
      <div class="sl">Солнце и луна</div>
      <div class="cw">
        <div class="arcw" id="arcWrap"></div>
        <div id="moonWrap"></div>
      </div>
    </div>
  </div>
</div>

<!-- LUM + CHAT -->

<div class="scr" id="s-lum">
  <div class="sa">
    <div style="padding-top:4px;text-align:center;margin-bottom:2px">
      <div style="font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase">Питомец</div>
      <div style="font-size:20px;font-weight:300;margin-top:3px">Люм</div>
    </div>
    <canvas id="lumCanvas"></canvas>
    <div class="emotxt" id="emotxt"></div>
    <div class="cw mb" style="padding:14px 14px 10px">
      <div class="sl" style="margin-bottom:10px">Привязанность</div>
      <div class="statrow">
        <div class="slbl">Любовь</div>
        <div class="sbar"><div class="sfill" id="loveFill" style="width:60%"></div></div>
        <div class="spct" id="lovePct">60%</div>
      </div>
      <div style="padding:10px 2px 0;font-size:11px;color:rgba(255,255,255,.3);display:flex;justify-content:space-between">
        <span id="lumVisit">Последний визит: сегодня</span>
        <span id="lumStreak">7 дней 🔥</span>
      </div>
    </div>
    <div class="cw" style="margin-bottom:10px">
      <div style="padding:12px 14px 8px">
        <div class="sl" style="margin-bottom:8px">Чат с Люмом</div>
        <div class="hints" id="hints"></div>
      </div>
      <div id="chatMsgs"></div>
      <div id="cinWrap" style="padding:8px 14px 12px;border-top:1px solid rgba(255,255,255,.06);background:none;backdrop-filter:none;-webkit-backdrop-filter:none">
        <div class="crow">
          <textarea id="cf" placeholder="Спроси Люма..." rows="1"></textarea>
          <button id="sb" disabled>
            <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SAVED -->

<div class="scr" id="s-saved">
  <div class="sa">
    <div style="padding-top:4px;margin-bottom:14px">
      <div style="font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase">Мои города</div>
      <div style="font-size:20px;font-weight:300;margin-top:3px">Избранное</div>
    </div>
    <div class="sw">
      <svg class="sic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="sf" id="sfld" placeholder="Поиск города...">
      <div class="sres" id="sres" style="display:none"></div>
    </div>
    <div class="fg" id="favGrid"></div>
  </div>
</div>

</div><!-- /app -->

<!-- NAV -->

<nav id="nav">
  <button class="nb on" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Погода</span>
  </button>
  <button class="nb" data-tab="lum">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    <span>Люм</span>
  </button>
  <button class="nb" data-tab="saved">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
    <span>Города</span>
  </button>
</nav>
<div id="toast">📍 Геолокация</div>

<script>
/* ============================================================
   LUM WEATHER v2 — Full App
   ============================================================ */

// ── STATE ──────────────────────────────────────────────────
const ST = {
  lat:55.7558, lon:37.6173, city:'Москва', country:'',
  weather:null, isDay:1, wcode:0,
  windspeed:0,
  tab:'home',
  lum:{love:60,streak:1,lastVisit:null},
  chat:[],
  favs:[]
};

// ── STORAGE ────────────────────────────────────────────────
const S={
  get(k,d=null){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

// ── INIT ───────────────────────────────────────────────────
function init(){
  ST.favs=S.get('lum_favs',[]);
  const ls=S.get('lum_state',null);
  if(ls) Object.assign(ST.lum,ls);
  ST.chat=S.get('lum_chat',[]);

  bg.init();
  lum.init();
  setupNav();
  setupSearch();
  setupChat();
  renderFavs();
  renderLumScreen();
  setupPTR();
  updateLumVisit();

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{ST.lat=p.coords.latitude;ST.lon=p.coords.longitude;
        reverseGeo().then(n=>{ST.city=n;loadWeather();toast('📍 '+n)})},
      ()=>loadWeather(),
      {timeout:6000,maximumAge:300000}
    );
  } else loadWeather();
}

// ── WEATHER API ────────────────────────────────────────────
async function loadWeather(){
  const p=new URLSearchParams({
    latitude:ST.lat,longitude:ST.lon,
    current:[
      'temperature_2m','apparent_temperature','weather_code',
      'wind_speed_10m','wind_direction_10m','relative_humidity_2m',
      'pressure_msl','uv_index','visibility','is_day','cloud_cover',
      'precipitation','wind_gusts_10m'
    ].join(','),
    hourly:[
      'temperature_2m','precipitation_probability','weather_code','wind_speed_10m'
    ].join(','),
    daily:[
      'temperature_2m_max','temperature_2m_min','weather_code',
      'sunrise','sunset','precipitation_probability_max','moon_phase',
      'precipitation_sum','wind_speed_10m_max'
    ].join(','),
    timezone:'auto',forecast_days:7,forecast_hours:48
  });

  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?'+p);
    if(!r.ok) throw new Error('API error');
    const d=await r.json();
    ST.weather=d;
    ST.isDay=d.current.is_day;
    ST.wcode=d.current.weather_code;
    ST.windspeed=d.current.wind_speed_10m;
    renderHome(d);

}

if(ql.includes(‘надеть’)||ql.includes(‘одеть’)){
if(w.temp<5)return`Сегодня ${w.temp}° — одевайся очень тепло! Пуховик и шапка обязательны 🧤`;
if(w.temp<15)return`${w.temp}° — куртка и джинсы в самый раз 🧥`;
if(w.temp<22)return`Приятные ${w.temp}°, лёгкая кофта не помешает 👕`;
return`Тепло — ${w.temp}°, можно надеть что-то лёгкое ☀️`;
}
if(ql.includes(‘взять’)||ql.includes(‘зонт’)){
if(w.desc.includes(‘дождь’))return`Дождь сегодня — зонт обязателен! ☔`;
return`Сегодня ${w.desc.toLowerCase()}, зонт вряд ли нужен 🌤`;
}
return`В ${w.city} сейчас ${w.temp}°, ${w.desc.toLowerCase()}. Ощущается как ${w.feels}° 🌤`;
}

function addBubble(role,text,animate){
const el=document.getElementById(‘chatMsgs’);if(!el)return;
const d=document.createElement(‘div’);
d.className=`msg ${role}`;
if(!animate)d.style.animation=‘none’;
d.innerHTML=role===‘ai’?`<div class="av">✨</div><div class="bbl">${text}</div>`:`<div class="bbl">${text}</div>`;
el.appendChild(d);
if(animate)scrollChat();
}
function scrollChat(){const e=document.getElementById(‘chatMsgs’);if(e)setTimeout(()=>e.scrollTo({top:e.scrollHeight,behavior:‘smooth’}),50)}

// ── FAVORITES ──────────────────────────────────────────────
function renderFavs(){
const el=document.getElementById(‘favGrid’);if(!el)return;
if(!ST.favs.length){
el.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:36px 0;color:rgba(255,255,255,.3);font-size:13px">Найди и добавь города 🗺</div>`;
return;
}
el.innerHTML=ST.favs.map((c,i)=>` <div class="fc" onclick="loadFav(${i})"> <button class="frm" onclick="event.stopPropagation();rmFav(${i})">✕</button> <div class="fcity">${c.name}</div> <div class="fcountry">${c.country||''}</div> <div class="ftemp">${c.temp!==undefined?c.temp+'°':'–°'}</div> <div class="fdesc">${c.desc||''}</div> </div>`).join(’’);
}

function rmFav(i){ST.favs.splice(i,1);S.set(‘lum_favs’,ST.favs);renderFavs()}

async function loadFav(i){
const c=ST.favs[i];
ST.lat=c.lat;ST.lon=c.lon;ST.city=c.name;
switchTab(‘home’);await loadWeather();toast(’📍 ’+c.name);
}

function setupSearch(){
const sf=document.getElementById(‘sfld’),sr=document.getElementById(‘sres’);
if(!sf)return;
let deb;
sf.addEventListener(‘input’,()=>{
clearTimeout(deb);
const q=sf.value.trim();if(q.length<2){sr.style.display=‘none’;return}
deb=setTimeout(async()=>{
try{
const d=await searchCityAPI(q);
if(!d.results?.length){sr.style.display=‘none’;return}
sr.style.display=‘block’;
sr.innerHTML=d.results.map(r=>` <div class="sitem" onclick="pickCity(${r.latitude},${r.longitude},'${escQ(r.name)}','${escQ(r.country||'')}')"> <div class="scity">${r.name}</div> <div style="font-size:11px;color:rgba(255,255,255,.35)">${r.admin1||''} ${r.country||''}</div> </div>`).join(’’);
}catch{sr.style.display=‘none’}
},320);
});
document.addEventListener(‘click’,e=>{if(!sf.contains(e.target)&&!sr.contains(e.target))sr.style.display=‘none’});
}

function escQ(s){return(s||’’).replace(/’/g,”\’”).replace(/”/g,”"”)}

async function pickCity(lat,lon,name,country){
document.getElementById(‘sres’).style.display=‘none’;
document.getElementById(‘sfld’).value=’’;
try{
const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`);
const d=await r.json();
const temp=Math.round(d.current.temperature_2m);
const desc=wmoText(d.current.weather_code);
if(!ST.favs.find(f=>f.name===name)){
ST.favs.push({name,country,lat,lon,temp,desc});
S.set(‘lum_favs’,ST.favs);
toast(‘❤️ ‘+name+’ добавлен’);
} else toast(‘📍 ‘+name+’ уже есть’);
renderFavs();
}catch{toast(‘Ошибка загрузки’)}
}

// ── PTR ────────────────────────────────────────────────────
function setupPTR(){
const sc=document.getElementById(‘homeScroll’),ptr=document.getElementById(‘ptr’);
if(!sc||!ptr)return;
let sy=0,pulling=false,done=false;
sc.addEventListener(‘touchstart’,e=>{if(sc.scrollTop===0){sy=e.touches[0].clientY;pulling=true;done=false}},{passive:true});
sc.addEventListener(‘touchmove’,e=>{
if(!pulling)return;
const dy=e.touches[0].clientY-sy;
if(dy>55&&!done){ptr.classList.add(‘vis’);done=true}
},{passive:true});
sc.addEventListener(‘touchend’,async()=>{
if(done){await loadWeather();setTimeout(()=>{ptr.classList.remove(‘vis’)},700)}
pulling=false;done=false;
});
}

// ── NAV ────────────────────────────────────────────────────
function setupNav(){
document.querySelectorAll(’.nb’).forEach(b=>{
b.addEventListener(‘click’,()=>switchTab(b.dataset.tab));
});
}

function switchTab(tab){
ST.tab=tab;
document.querySelectorAll(’.scr’).forEach(s=>s.classList.remove(‘on’));
document.querySelectorAll(’.nb’).forEach(b=>b.classList.toggle(‘on’,b.dataset.tab===tab));
document.getElementById(‘s-’+tab)?.classList.add(‘on’);
if(tab===‘lum’){renderLumScreen();lum.init();scrollChat()}
if(tab===‘saved’)renderFavs();
}

// ── TOAST ──────────────────────────────────────────────────
function toast(msg){
const e=document.getElementById(‘toast’);
e.textContent=msg;e.classList.add(‘vis’);
setTimeout(()=>e.classList.remove(‘vis’),2600);
}

// ── GO ─────────────────────────────────────────────────────
init();
</script>

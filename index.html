<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Liquid Glass Edition</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --blur: blur(20px);
            --accent: #7800ff;
        }

        body {
            margin: 0; padding: 0; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: #fff; overflow: hidden;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* Жидкое стекло (Нижняя панель) */
        .glass-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 420px;
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .glass-panel h2 { 
            margin: 0 0 15px 0; font-size: 18px; text-align: center; 
            letter-spacing: 1px; font-weight: 600; color: rgba(255,255,255,0.9);
        }

        /* Кнопки */
        .btn {
            width: 100%; padding: 14px; margin: 5px 0; border: none; border-radius: 18px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            background: var(--accent); color: #fff;
        }
        .btn-sec { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-go { background: #00ff66; color: #000; display: none; }
        .btn:active { transform: scale(0.96); }

        /* Анимация пульсации (Сканирование) */
        #scan-status { display: none; text-align: center; margin: 10px 0; }
        .pulse {
            width: 20px; height: 20px; background: var(--accent);
            border-radius: 50%; margin: 0 auto 10px;
            animation: pulse-ring 1.2s infinite ease-in-out;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(120,0,255,0.7); }
            70% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 0 15px rgba(120,0,255,0); }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Модалки (Тоже стекло) */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 380px;
            background: rgba(10,10,10,0.85);
            backdrop-filter: var(--blur);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 25px;
            display: none; z-index: 200;
        }
        .modal.active { display: block; }

        input[type=range] { width: 100%; accent-color: var(--accent); margin: 15px 0; }
        label { font-size: 13px; opacity: 0.7; }
        .val-indicator { float: right; color: var(--accent); font-weight: bold; }

        /* Прицел */
        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 30px; height: 30px;
            z-index: 50; pointer-events: none;
        }
        #crosshair::before { content: ""; position: absolute; top: 14px; width: 30px; height: 2px; background: #00ff66; }
        #crosshair::after { content: ""; position: absolute; left: 14px; height: 30px; width: 2px; background: #00ff66; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>

<div class="glass-panel" id="main-panel">
    <h2>☢ KiwiWay</h2>
    
    <div id="scan-status">
        <div class="pulse"></div>
        <div style="font-size: 12px; opacity: 0.8;">Анализ квантового поля...</div>
    </div>

    <div id="menu-standard">
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-sec" onclick="openModal('settingsModal')">⚙ Опции</button>
            <button class="btn btn-sec" onclick="toggleSelection()">📍 Точка</button>
        </div>
        <button class="btn" id="mainActionBtn" onclick="runScan()">🔍 Сканировать</button>
    </div>

    <div id="menu-results" style="display: none;">
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-sec" onclick="openModal('infoModal')">ℹ Инфо</button>
            <button class="btn btn-go" style="display: block; flex: 2;" onclick="startJourney()">🚀 Начать путь</button>
        </div>
        <button class="btn btn-sec" style="margin-top: 8px;" onclick="resetSearch()">↩ Сброс</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <h3>Конфигурация</h3>
    <label>Дальность поиска <span class="val-indicator" id="distVal">5 км</span></label>
    <input type="range" id="rangeRadius" min="1" max="15" value="5" oninput="updateRangeLabel()">
    
    <label>Степень аномалии <span class="val-indicator" id="anomVal">5</span></label>
    <input type="range" id="rangePower" min="1" max="10" value="5" oninput="updateRangeLabel()">
    
    <label>Категория</label>
    <select id="catSelect" style="width:100%; background: #222; color: #fff; border:none; padding:10px; border-radius:10px; margin-top:10px;">
        <option value="Пустота">Пустота</option>
        <option value="Квантовая">Квантовая</option>
        <option value="Мощная">Мощная</option>
        <option value="Псевдо">Псевдо</option>
    </select>
    <button class="btn" style="margin-top:20px;" onclick="closeModals()">Сохранить</button>
</div>

<div id="infoModal" class="modal">
    <h3 id="infoTitle">Аномалия обнаружена</h3>
    <div id="infoBody" style="font-size: 14px; opacity: 0.9; line-height: 1.5;"></div>
    <button class="btn btn-sec" style="margin-top:20px;" onclick="closeModals()">Закрыть</button>
</div>

<script>
    const API_KEY = '9222a135610a443999833fac417a059d';
    let map, userMarker, searchOrigin, anomalyData;
    let currentRoutes = [];

    // Init Map (Ultra Dark)
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [37.617, 55.755],
        zoom: 12,
        attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(pos => {
        const coords = [pos.coords.longitude, pos.coords.latitude];
        searchOrigin = coords;
        map.setCenter(coords);
        userMarker = new maplibregl.Marker({ color: '#00ffff' }).setLngLat(coords).addTo(map);
    });

    function updateRangeLabel() {
        document.getElementById('distVal').innerText = document.getElementById('rangeRadius').value + ' км';
        document.getElementById('anomVal').innerText = document.getElementById('rangePower').value;
    }

    // Режим выбора точки
    let selectionMode = false;
    function toggleSelection() {
        selectionMode = !selectionMode;
        document.getElementById('crosshair').style.display = selectionMode ? 'block' : 'none';
        document.getElementById('mainActionBtn').innerText = selectionMode ? 'Подтвердить центр' : '🔍 Сканировать';
        document.getElementById('mainActionBtn').onclick = selectionMode ? confirmPoint : runScan;
    }

    function confirmPoint() {
        const center = map.getCenter();
        searchOrigin = [center.lng, center.lat];
        toggleSelection();
    }

    // Сканирование с анимацией
    async function runScan() {
        document.getElementById('menu-standard').style.display = 'none';
        document.getElementById('scan-status').style.display = 'block';

        // Имитация задержки для анимации
        setTimeout(async () => {
            const radius = document.getElementById('rangeRadius').value * 0.01;
            anomalyData = {
                lng: searchOrigin[0] + (Math.random() - 0.5) * radius,
                lat: searchOrigin[1] + (Math.random() - 0.5) * radius,
                type: document.getElementById('catSelect').value,
                power: document.getElementById('rangePower').value
            };

            if (window.aMarker) window.aMarker.remove();
            window.aMarker = new maplibregl.Marker({ color: '#7800ff' })
                .setLngLat([anomalyData.lng, anomalyData.lat])
                .addTo(map);

            map.flyTo({ center: [anomalyData.lng, anomalyData.lat], zoom: 14 });

            document.getElementById('scan-status').style.display = 'none';
            document.getElementById('menu-results').style.display = 'block';
        }, 2500);
    }

    // Построение маршрута (Зеленый -> Красный -> Серый)
    async function startJourney() {
        clearRoutes();
        const start = searchOrigin;
        const end = [anomalyData.lng, anomalyData.lat];
        
        try {
            const res = await fetch(`https://router.project-osrm.org/route/v1/foot/${start[0]},${start[1]};${end[0]},${end[1]}?geometries=geojson`);
            const data = await res.json();
            const coords = data.routes[0].geometry.coordinates;

            // Рисуем первую часть (Зеленая - основная дорога)
            drawPath(coords.slice(0, Math.floor(coords.length * 0.7)), '#00ff66', 'road-main');
            // Рисуем вторую часть (Бордовая - сложный участок)
            drawPath(coords.slice(Math.floor(coords.length * 0.7)), '#800000', 'road-hard');
            
            // Если точка в поле - рисуем серый пунктир от дороги до точки
            const lastCoord = coords[coords.length - 1];
            drawPath([lastCoord, end], '#555', 'road-off', true);

        } catch (e) {
            drawPath([start, end], '#555', 'road-direct', true);
        }
    }

    function drawPath(coords, color, id, dashed = false) {
        map.addLayer({
            'id': id, 'type': 'line',
            'source': { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': coords } } },
            'paint': { 
                'line-color': color, 'line-width': 5,
                'line-dasharray': dashed ? [2, 2] : [1]
            }
        });
        currentRoutes.push(id);
    }

    function clearRoutes() {
        currentRoutes.forEach(id => { if (map.getLayer(id)) { map.removeLayer(id); map.removeSource(id); } });
        currentRoutes = [];
    }

    function resetSearch() {
        clearRoutes();
        if (window.aMarker) window.aMarker.remove();
        document.getElementById('menu-results').style.display = 'none';
        document.getElementById('menu-standard').style.display = 'block';
        map.flyTo({ center: searchOrigin, zoom: 12 });
    }

    function openModal(id) {
        if (id === 'infoModal') {
            document.getElementById('infoBody').innerHTML = `
                <b>Категория:</b> ${anomalyData.type}<br>
                <b>Мощность:</b> ${anomalyData.power}/10<br>
                <b>Координаты:</b> ${anomalyData.lat.toFixed(5)}, ${anomalyData.lng.toFixed(5)}
            `;
        }
        document.getElementById(id).classList.add('active');
    }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

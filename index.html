<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Quantum Edition</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        body {
            margin: 0; padding: 0; background: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #fff; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        #map { flex: 1; width: 100%; background: #000; }

        /* Панель управления - поднята выше для удобства */
        .ui-container {
            background: #0a0a0a;
            padding: 20px 20px 35px 20px; /* Отступ снизу больше для жестов iPhone */
            border-top: 1px solid #222;
            box-shadow: 0 -10px 30px rgba(0,0,0,1);
            z-index: 10;
        }

        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        
        .btn {
            flex: 1; padding: 16px; border: none; border-radius: 14px;
            font-weight: 800; font-size: 14px; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }

        .btn-main { background: #7800ff; color: #fff; }
        .btn-sec { background: #1a1a1a; color: #777; border: 1px solid #333; }
        .btn-go { background: #00ff66; color: #000; display: none; }

        .btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Прицел */
        #crosshair {
            display: none; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; z-index: 5; pointer-events: none;
        }
        #crosshair:before, #crosshair:after {
            content: ""; position: absolute; background: #00ff66;
        }
        #crosshair:before { top: 19px; width: 40px; height: 2px; }
        #crosshair:after { left: 19px; height: 40px; width: 2px; }

        /* Модалки */
        .modal {
            position: fixed; top: 20%; left: 5%; width: 90%;
            background: rgba(15,15,15,0.95); border: 1px solid #333;
            border-radius: 20px; padding: 20px; box-sizing: border-box;
            display: none; z-index: 100; backdrop-filter: blur(10px);
        }

        .active { display: block; }
        
        select, input[type=range] { width: 100%; margin: 10px 0; background: #111; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 10px; }
        label { font-size: 12px; color: #555; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>

<div class="ui-container" id="ui">
    <div id="status" style="font-size: 11px; color: #444; margin-bottom: 8px; text-align: center;">Спутник готов</div>
    
    <div class="btn-row">
        <button class="btn btn-sec" onclick="showModal('settingsModal')">Настройки</button>
        <button class="btn btn-sec" onclick="toggleSelectionMode()">Выбор точки</button>
    </div>
    
    <button class="btn btn-main" id="scanBtn" onclick="startScan()">Сканировать аномалии</button>
    
    <div class="btn-row" id="resultBtns" style="margin-top: 10px; display: none;">
        <button class="btn btn-sec" onclick="showModal('infoModal')">Инфо</button>
        <button class="btn btn-go" id="goBtn" style="display: block;" onclick="drawRoute()">Начать путь</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <h3>Параметры</h3>
    <label>Сила (Аномальность)</label>
    <input type="range" id="power" min="1" max="10" value="5">
    <label>Тип излучения</label>
    <select id="type">
        <option value="Пустота">Пустота</option>
        <option value="Квантовая">Квантовая</option>
        <option value="Мощная">Мощная</option>
        <option value="Псевдо">Псевдо</option>
    </select>
    <button class="btn btn-main" onclick="hideModals()">Принять</button>
</div>

<div id="infoModal" class="modal">
    <h3>Данные объекта</h3>
    <div id="infoContent"></div>
    <button class="btn btn-sec" style="margin-top: 10px; width: 100%;" onclick="hideModals()">Закрыть</button>
</div>

<script>
    const API_KEY = '9222a135610a443999833fac417a059d';
    let map, userPos, searchOrigin;
    let anomalyData = null;

    // Инициализация карты MapLibre (Темная векторная тема)
    map = new maplibregl.Map({
        container: 'map',
        style: `https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json`,
        center: [37.6173, 55.7558],
        zoom: 13
    });

    navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        searchOrigin = userPos;
        map.setCenter(userPos);
        
        // Маркер игрока
        new maplibregl.Marker({ color: '#00ffff' })
            .setLngLat(userPos)
            .addTo(map);
    });

    // Режим выбора точки
    let selectionMode = false;
    function toggleSelectionMode() {
        selectionMode = !selectionMode;
        document.getElementById('crosshair').style.display = selectionMode ? 'block' : 'none';
        document.getElementById('scanBtn').innerText = selectionMode ? 'Установить центр здесь' : 'Сканировать аномалии';
        document.getElementById('scanBtn').onclick = selectionMode ? confirmPoint : startScan;
    }

    function confirmPoint() {
        const center = map.getCenter();
        searchOrigin = [center.lng, center.lat];
        toggleSelectionMode();
        document.getElementById('status').innerText = 'Эпицентр зафиксирован';
    }

    // Сканирование
    async function startScan() {
        document.getElementById('status').innerText = 'Поиск сигналов...';
        const type = document.getElementById('type').value;
        
        // Рандомная точка в радиусе (0.02 градуса ~ 2км)
        const offsetLng = (Math.random() - 0.5) * 0.04;
        const offsetLat = (Math.random() - 0.5) * 0.03;
        
        anomalyData = {
            lng: searchOrigin[0] + offsetLng,
            lat: searchOrigin[1] + offsetLat,
            type: type,
            power: document.getElementById('power').value
        };

        // Добавляем маркер аномалии
        if (window.aMarker) window.aMarker.remove();
        window.aMarker = new maplibregl.Marker({ color: '#7800ff' })
            .setLngLat([anomalyData.lng, anomalyData.lat])
            .addTo(map);

        map.flyTo({ center: [anomalyData.lng, anomalyData.lat], zoom: 15 });
        
        document.getElementById('resultBtns').style.display = 'flex';
        document.getElementById('status').innerText = 'Объект обнаружен';
    }

    // Маршрут
    async function drawRoute() {
        const start = userPos;
        const end = [anomalyData.lng, anomalyData.lat];
        
        // Используем бесплатный OSRM
        const url = `https://router.project-osrm.org/route/v1/walking/${start[0]},${start[1]};${end[0]},${end[1]}?geometries=geojson`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            const coords = data.routes[0].geometry.coordinates;

            if (map.getSource('route')) {
                map.removeLayer('route-line');
                map.removeSource('route');
            }

            map.addSource('route', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'geometry': { 'type': 'LineString', 'coordinates': coords }
                }
            });

            // Рисуем основную зеленую линию
            map.addLayer({
                'id': 'route-line',
                'type': 'line',
                'source': 'route',
                'layout': { 'line-join': 'round', 'line-cap': 'round' },
                'paint': {
                    'line-color': '#00ff66',
                    'line-width': 6
                }
            });

            document.getElementById('status').innerText = 'Маршрут построен';
        } catch (e) {
            // Если дорог нет - рисуем прямую серую линию
            document.getElementById('status').innerText = 'Дорог не найдено. Прямой вектор.';
            drawStraightLine(start, end);
        }
    }

    function drawStraightLine(s, e) {
        if (map.getSource('route')) { map.removeLayer('route-line'); map.removeSource('route'); }
        map.addSource('route', {
            'type': 'geojson',
            'data': {
                'type': 'Feature',
                'geometry': { 'type': 'LineString', 'coordinates': [s, e] }
            }
        });
        map.addLayer({
            'id': 'route-line',
            'type': 'line',
            'source': 'route',
            'paint': { 'line-color': '#555', 'line-width': 4, 'line-dasharray': [2, 2] }
        });
    }

    // UI Helpers
    function showModal(id) {
        if(id === 'infoModal') {
            document.getElementById('infoContent').innerHTML = `
                <p>Тип: ${anomalyData.type}</p>
                <p>Мощность: ${anomalyData.power}/10</p>
                <p>Статус: Активна</p>
            `;
        }
        document.getElementById(id).classList.add('active');
    }
    function hideModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }
</script>

</body>
</html>

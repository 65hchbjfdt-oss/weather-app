<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>KiwiWay - Anomaly Radar</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #0A84FF; 
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --glass-bg: rgba(25, 25, 25, 0.5);
            --glass-border: rgba(255, 255, 255, 0.18);
            --blur: blur(25px) saturate(190%);
        }

        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; height: 100vh; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.7) contrast(1.2); }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 420px;
            border-radius: 40px;
            padding: 24px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 18px; margin: 8px 0;
            border: none; border-radius: 22px;
            font-size: 16px; font-weight: 600;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .btn-main { background: var(--ios-blue); }

        #radar {
            width: 90px; height: 90px;
            margin: 0 auto 15px;
            border: 2px solid rgba(48, 209, 88, 0.3);
            border-radius: 50%;
            position: relative;
        }
        #radar-arrow {
            position: absolute;
            top: 50%; left: 50%;
            width: 3px; height: 40px;
            background: var(--ios-green);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            transition: transform 0.6s;
        }

        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 88%; max-width: 350px;
            border-radius: 35px;
            padding: 30px;
            display: none;
            z-index: 1000;
        }
        .modal.active { display: block; }

        #crosshair {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 2px solid var(--ios-blue);
            border-radius: 50%;
            z-index: 50;
        }

        #searchPulse {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--ios-blue);
            border-radius: 50%;
            animation: pulseWave 2s infinite;
        }

        @keyframes pulseWave {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }

        .alert {
            position: fixed;
            top: 60px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 20px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>
<div id="searchPulse"></div>
<div id="iosAlert" class="alert glass"></div>

<div class="ui-panel glass">
    <div id="radar-ui" style="display:none; text-align: center;">
        <div id="radar"><div id="radar-arrow"></div></div>
        <div id="distance-text">СИГНАЛ: 0%</div>
    </div>

    <div id="scan-box" style="display:none; text-align:center;">
        <div>ПОИСК...</div>
    </div>

    <div id="ui-idle">
        <button class="btn" onclick="openM('settings')">Настройки</button>
        <button class="btn btn-main" onclick="executeScan()">НАЙТИ АНОМАЛИЮ</button>
    </div>

    <div id="ui-found" style="display:none;">
        <button class="btn btn-main" style="background:var(--ios-green)" onclick="buildRoute()">ПРОЛОЖИТЬ ПУТЬ</button>
        <button class="btn" onclick="resetSystem()">СБРОС</button>
    </div>
</div>

<div id="settings" class="modal glass">
    <h2>Режим поиска</h2>

    <select id="modeSelect" class="btn">
        <option value="quantum">⚡ Квантовый</option>
        <option value="void">🌑 Пустота</option>
        <option value="powerful">💥 Мощный</option>
    </select>

    <label>Радиус: <span id="rL">5</span> км</label>
    <input type="range" id="radiusIn" min="1" max="20" value="5" oninput="syncUI()">

    <div style="margin-top:15px;">
        <span>Звуковой отклик</span>
        <input type="checkbox" id="soundToggle" checked>
    </div>

    <button class="btn btn-main" onclick="closeM()">OK</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let map, userPos, searchOrigin, targetPoint;
let radarInterval;

function playBeep(freq, dur) {
    if (!document.getElementById("soundToggle").checked) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

const STYLES = {
    dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    sat: {
        "version": 8,
        "sources": {
            "s": {
                "type": "raster",
                "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
                "tileSize": 256
            }
        },
        "layers": [{ "id": "s", "type": "raster", "source": "s" }]
    }
};

map = new maplibregl.Map({
    container: "map",
    style: STYLES.dark,
    center: [37.6, 55.7],
    zoom: 12
});

navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.longitude, pos.coords.latitude];
    searchOrigin = [...userPos];
    map.setCenter(userPos);
    new maplibregl.Marker().setLngLat(userPos).addTo(map);
});

function syncUI() {
    document.getElementById("rL").innerText = document.getElementById("radiusIn").value;
}

async function executeScan() {

    document.getElementById("ui-idle").style.display = "none";
    document.getElementById("scan-box").style.display = "block";
    document.getElementById("searchPulse").style.display = "block";

    // ❌ ЗВУК ПОИСКА УДАЛЕН ПОЛНОСТЬЮ

    const mode = document.getElementById("modeSelect").value;
    const radius = document.getElementById("radiusIn").value;

    let keywords = [];

    if (mode === "quantum") {
        keywords = ["abandoned", "ruins", "railway", "industrial"];
    }
    if (mode === "void") {
        keywords = ["park", "ravine", "spring", "stream", "meadow"];
    }
    if (mode === "powerful") {
        keywords = ["abandoned", "ruins", "railway", "spring", "stream", "ravine"];
    }

    let found = null;

    for (let i = 0; i < 15; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = (Math.sqrt(Math.random()) * radius) / 111;
        const pt = [
            searchOrigin[0] + d * Math.cos(a),
            searchOrigin[1] + d * Math.sin(a)
        ];

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
            const data = await res.json();

            if (data.display_name) {
                found = { coords: pt, data };
                break;
            }

        } catch(e) {}
    }

    if (!found) {
        found = {
            coords: searchOrigin,
            data: { display_name: "Неизвестная пустая зона" }
        };
    }

    setTimeout(() => {
        document.getElementById("scan-box").style.display = "none";
        document.getElementById("searchPulse").style.display = "none";

        targetPoint = found.coords;
        showTarget(found);

        playBeep(400, 0.4);

    }, 2500);
}

function showTarget(obj) {
    new maplibregl.Marker({color:"red"}).setLngLat(targetPoint).addTo(map);
    map.flyTo({center: targetPoint, zoom: 15});

    document.getElementById("ui-found").style.display = "block";
}

function buildRoute() {
    const url = `https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson&overview=full`;

    fetch(url).then(r => r.json()).then(data => {

        if (map.getLayer("route")) {
            map.removeLayer("route");
            map.removeSource("route");
        }

        map.addSource("route", {
            type: "geojson",
            data: data.routes[0].geometry
        });

        map.addLayer({
            id: "route",
            type: "line",
            source: "route",
            paint: {
                "line-width": 6,
                "line-color": "#0A84FF"
            }
        });

        playBeep(900, 0.1);
    });
}

function resetSystem() {
    clearInterval(radarInterval);
    document.getElementById("ui-found").style.display = "none";
    document.getElementById("ui-idle").style.display = "block";
}

function openM(id) {
    document.getElementById(id).classList.add("active");
    playBeep(600, 0.05);
}

function closeM() {
    document.querySelectorAll(".modal").forEach(m => m.classList.remove("active"));
}
</script>
</body>
</html>

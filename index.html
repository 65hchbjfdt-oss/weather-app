<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>KiwiWay - Anomaly Radar</title>

  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet"/>

  <style>
    :root {
      --ios-blue: #0A84FF;
      --ios-green: #30D158;
      --ios-red: #FF453A;
      --glass-bg: rgba(35, 35, 40, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --blur: blur(35px) saturate(200%);
    }

    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: -apple-system, system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      z-index: 1;
      filter: brightness(0.85) contrast(1.1);
    }

    .ui-panel {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 400px;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: 36px;
      padding: 22px;
      z-index: 100;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .btn {
      width: 100%;
      padding: 16px;
      margin: 6px 0;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      background: rgba(10, 132, 255, 0.6);
      color: #fff;
      border: 1px solid var(--glass-border);
    }

    .btn-sec {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn:active {
      transform: scale(0.96);
    }

    input[type=range] {
      width: 100%;
    }

    #radar {
      width: 75px;
      height: 75px;
      margin: 0 auto 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, rgba(48, 209, 88, 0.15) 0%, transparent 70%);
    }

    #radar-arrow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2.5px;
      height: 34px;
      background: var(--ios-green);
      transform-origin: bottom center;
      transform: translate(-50%, -100%) rotate(0deg);
      transition: transform 1s ease;
      border-radius: 2px;
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 320px;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      border-radius: 32px;
      padding: 25px;
      display: none;
      z-index: 1000;
      border: 1px solid var(--glass-border);
    }

    .active {
      display: block;
    }

    #crosshair {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      border: 1.5px solid var(--ios-green);
      border-radius: 50%;
      z-index: 50;
    }
  </style>
</head>

<body>

<div id="map"></div>
<div id="crosshair"></div>

<div class="ui-panel">

  <div id="radar-ui" style="display:none; text-align:center;">
    <div id="radar"><div id="radar-arrow"></div></div>
    <div id="distance-text" style="font-size:12px; color:var(--ios-green); font-weight:700;">
      СИГНАЛ: 0%
    </div>
  </div>

  <!-- ПОШАГОВОЕ СКАНИРОВАНИЕ -->
  <div id="scan-box" style="display:none; text-align:left; padding:15px; font-size:14px;">
    <div id="step1">🎲 Генерация точек...</div>
    <div id="step2" style="opacity:0.3;">🔍 Фильтрация...</div>
    <div id="step3" style="opacity:0.3;">⚡ Настройка мощности...</div>
    <div id="step4" style="opacity:0.3;">🎯 Выбор аномалии...</div>
    <div id="step5" style="opacity:0.3;">📡 Запуск радара...</div>
  </div>

  <div id="ui-idle">
    <div style="display:flex; gap:10px;">
      <button class="btn btn-sec" onclick="openM('settings')">Настройки</button>
      <button class="btn btn-sec" onclick="openM('map-styles')">Слои</button>
    </div>

    <div style="display:flex; gap:10px;">
      <button class="btn btn-sec" id="selectBtn" onclick="toggleSelect()">📍 Указать точку</button>
      <button class="btn btn-sec" onclick="resetToLocation()">🎯 Моя позиция</button>
    </div>

    <button class="btn" id="mainBtn" onclick="executeScan()">НАЙТИ АНОМАЛИЮ</button>
  </div>

  <div id="ui-found" style="display:none;">
    <button class="btn" style="background:rgba(48,209,88,0.8);" onclick="buildRoute()">
      ПОСТРОИТЬ МАРШРУТ
    </button>
    <button class="btn btn-sec" onclick="resetSystem()" style="color:var(--ios-red);">
      СБРОС
    </button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="modal">
  <h3>Настройки</h3>

  <label>Категория</label>
  <select id="catSelect" style="width:100%; padding:12px; border-radius:12px;">
    <option value="quantum">Квантовый</option>
    <option value="power">Мощный</option>
    <option value="void">Пустота</option>
  </select>

  <label>Радиус: <span id="rL">5</span> км</label>
  <input type="range" id="radiusIn" min="1" max="15" value="5" oninput="syncUI()" />

  <label>Мощность: <span id="pL">25</span>%</label>
  <input type="range" id="powerIn" min="1" max="100" value="25" oninput="syncUI()" />

  <button class="btn" onclick="closeM()">ГОТОВО</button>
</div>

<!-- MAP STYLES -->
<div id="map-styles" class="modal">
  <button class="btn btn-sec" onclick="setMapStyle('dark')">ТЁМНАЯ</button>
  <button class="btn btn-sec" onclick="setMapStyle('sat')">СПУТНИК</button>
  <button class="btn" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<script>
  let map, userPos, searchOrigin, targetPoint;
  let radarInterval;

  const STYLES = {
    dark: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    sat: {
      version: 8,
      sources: {
        s: {
          type: "raster",
          tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
          tileSize: 256
        }
      },
      layers: [{ id: "s", type: "raster", source: "s" }]
    }
  };

  map = new maplibregl.Map({
    container: "map",
    style: STYLES.dark,
    center: [37.6, 55.7],
    zoom: 11,
    attributionControl: false
  });

  navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.longitude, pos.coords.latitude];
    searchOrigin = [...userPos];
    map.setCenter(userPos);
    new maplibregl.Marker({ color: "#0A84FF" }).setLngLat(userPos).addTo(map);
    syncUI();
  });

  function syncUI() {
    document.getElementById("rL").innerText = radiusIn.value;
    document.getElementById("pL").innerText = powerIn.value;
  }

  function activateStep(i, text) {
    const el = document.getElementById("step" + i);
    el.style.opacity = 1;
    el.innerHTML = text + " ⏳";
  }

  function completeStep(i, text) {
    const el = document.getElementById("step" + i);
    el.innerHTML = text + " ✅";
  }

  async function executeScan() {

    document.getElementById("ui-idle").style.display = "none";
    document.getElementById("scan-box").style.display = "block";

    const mode = catSelect.value;
    const radius = parseInt(radiusIn.value);
    const targetPower = parseInt(powerIn.value);

    let pool = [];
    let valid = [];

    // 1) Генерация точек
    activateStep(1, "🎲 Генерация точек");

    for (let i = 0; i < 350; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = (Math.sqrt(Math.random()) * radius) / 111;
      pool.push([
        searchOrigin[0] + d * Math.cos(a),
        searchOrigin[1] + d * Math.sin(a)
      ]);
    }

    completeStep(1, "🎲 Генерация точек");
    await new Promise(r => setTimeout(r, 500));

    // 2) Фильтрация
    activateStep(2, "🔍 Фильтрация");

    for (let pt of pool) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
        const data = await res.json();

        let ok = false;
        if (mode === "quantum") ok = data.type === "cemetery";
        if (mode === "power") ok = data.type === "construction";
        if (mode === "void") ok = !data.address?.road;

        if (ok) valid.push({ coords: pt, data });
      } catch(e) {}
    }

    if (!valid.length) {
      resetSystem();
      return;
    }

    completeStep(2, "🔍 Фильтрация");
    await new Promise(r => setTimeout(r, 500));

    // 3) Мощность
    activateStep(3, "⚡ Настройка мощности");
    valid.forEach(p => p.power = Math.floor(Math.random() * 100) + 1);
    completeStep(3, "⚡ Настройка мощности");
    await new Promise(r => setTimeout(r, 500));

    // 4) Выбор
    activateStep(4, "🎯 Выбор аномалии");

    valid.sort((a, b) =>
      Math.abs(a.power - targetPower) - Math.abs(b.power - targetPower)
    );

    const best = valid[0];
    targetPoint = best.coords;

    completeStep(4, "🎯 Выбор аномалии");
    await new Promise(r => setTimeout(r, 500));

    // 5) Радар
    activateStep(5, "📡 Запуск радара");

    setTimeout(() => {
      document.getElementById("scan-box").style.display = "none";
      startRadar();
      showTarget();
      completeStep(5, "📡 Запуск радара");
    }, 700);
  }

  function startRadar() {
    document.getElementById("radar-ui").style.display = "block";

    radarInterval = setInterval(() => {
      const dist = getDistance(userPos, targetPoint);
      const maxR = radiusIn.value * 1000;

      let signal = Math.max(0, (1 - dist / maxR) * 100);
      document.getElementById("distance-text").innerText = "СИГНАЛ: " + signal.toFixed(0) + "%";

      document.getElementById("radar-arrow").style.transform =
        `translate(-50%, -100%) rotate(${signal * 3.6}deg)`;

    }, 800);
  }

  function showTarget() {
    new maplibregl.Marker({ color: "#FF453A" })
      .setLngLat(targetPoint)
      .addTo(map);

    map.flyTo({ center: targetPoint, zoom: 15 });

    document.getElementById("ui-found").style.display = "block";
  }

  function resetSystem() {
    clearInterval(radarInterval);
    document.getElementById("ui-idle").style.display = "block";
    document.getElementById("scan-box").style.display = "none";
  }

  function getDistance(p1, p2) {
    const R = 6371000;
    const dLat = (p2[1] - p1[1]) * Math.PI / 180;
    const dLon = (p2[0] - p1[0]) * Math.PI / 180;
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(p1[1] * Math.PI / 180) *
      Math.cos(p2[1] * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function openM(id) {
    document.getElementById(id).classList.add("active");
  }

  function closeM() {
    document.querySelectorAll(".modal").forEach(m => m.classList.remove("active"));
  }

  function setMapStyle(t) {
    map.setStyle(STYLES[t]);
    closeM();
  }
</script>

</body>
</html>

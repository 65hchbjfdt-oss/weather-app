<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STALKER Explorer</title>

<!-- Leaflet & Routing -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #000;
    color: white;
  }
  #map { width: 100%; height: 100%; }

  /* iOS-style glass panel */
  .panel {
    position: absolute; bottom: 10px;
    left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 400px;
    backdrop-filter: blur(18px);
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
    z-index: 999;
  }
  .btn {
    width: 100%; padding: 14px;
    margin-top: 8px;
    border: none; border-radius: 18px;
    background: #6200ea; color: #fff;
    font-size: 15px; font-weight: 600;
  }
  .addressbox {
    padding: 8px;
    margin-top: 10px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 14px;
  }
</style>
</head>

<body>
<div id="map"></div>

<div class="panel">
  <button class="btn" onclick="openSettings()">⚙ Настройки поиска</button>
  <button class="btn" onclick="doScan()">🔍 Сканировать аномалии</button>
  <button class="btn" onclick="goToTarget()">🚶 Начать навигацию</button>
</div>

<!-- Настройки -->
<div id="settings" style="display:none; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:90%; max-width:400px; backdrop-filter:blur(18px); background:rgba(0,0,0,0.7); padding:12px; border-radius:16px; z-index:999;">
  <label>Радиус (км):
    <input id="radius" type="number" value="8" min="1" max="30" style="width:60px;">
  </label>
  <br><br>
  <label>Категория:
    <select id="cat">
      <option value="all">Все</option>
      <option value="⚡ Электро">⚡ Электро</option>
      <option value="🕳 Пространственный">🕳 Пространственный</option>
      <option value="☢ Радиация">☢ Радиация</option>
      <option value="🔮 Артефакт">🔮 Артефакт</option>
      <option value="👁 Наблюдение">👁 Наблюдение</option>
    </select>
  </label>
  <br><br>
  <button class="btn" onclick="closeSettings()">Закрыть</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
let map, userLoc, anomalies = [], chosen = null, routerControl;

const types = ["⚡ Электро","🕳 Пространственный","☢ Радиация","🔮 Артефакт","👁 Наблюдение"];

function log(msg) { console.log(msg); }

/* === I18n Reverse Geocoding для адресов === */
async function getAddress(lat,lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
    const data = await res.json();
    return data.display_name;
  } catch { return ""; }
}

/* === Инициализация карты (Dark tiles) === */
navigator.geolocation.getCurrentPosition(p => {
  map = L.map('map').setView([p.coords.latitude,p.coords.longitude], 14);

  L.tileLayer('https://api.maptiler.com/tiles/darkmatter/{z}/{x}/{y}.png?key=YOUR_MAPTILER_KEY', {
    attribution: '&copy; OSM & MapTiler'
  }).addTo(map);

  userLoc = L.marker([p.coords.latitude,p.coords.longitude]).addTo(map);
});

function openSettings(){ document.getElementById("settings").style.display = "block"; }
function closeSettings(){ document.getElementById("settings").style.display = "none"; }

/* === Сканируем аномалии === */
function doScan() {
  anomalies.forEach(a=>map.removeLayer(a.marker));
  anomalies = []; chosen = null;

  const r = parseFloat(document.getElementById("radius").value)||8;
  const cat = document.getElementById("cat").value;

  const base = map.getCenter();
  for (let i=0;i<7;i++){
    const dx = r*Math.random(), ang = Math.random()*Math.PI*2;
    const lat = base.lat + dx*Math.cos(ang)/111;
    const lon = base.lng + dx*Math.sin(ang)/111;

    const tp = types[Math.floor(Math.random()*types.length)];
    if (cat!="all" && tp.indexOf(cat)!=0) continue;

    const danger = Math.ceil(Math.random()*5);
    const m = L.circleMarker([lat,lon],{radius:9,color:danger>=4?"red":"orange"}).addTo(map);

    m.bindPopup(`${tp}<br>Уровень: ${danger}<br><button onclick="showInfo(${lat},${lon},'${tp}',${danger})">Инфо</button>`);

    anomalies.push({lat,lon,tp,danger,marker:m});
  }
}

/* === Показ информации === */
async function showInfo(lat,lon,tp,danger){
  const addr = await getAddress(lat,lon);
  alert(`Тип: ${tp}\nУровень: ${danger}\nКоординаты: ${lat.toFixed(5)},${lon.toFixed(5)}\nАдрес: ${addr}`);
  chosen = {lat,lon};
}

/* === Маршрут по дорогам === */
function goToTarget(){
  if(!chosen){ alert("Выберите аномалию"); return; }
  if(routerControl) map.removeControl(routerControl);

  routerControl = L.Routing.control({
    waypoints: [
      L.latLng(userLoc.getLatLng()),
      L.latLng(chosen.lat,chosen.lon)
    ],
    showAlternatives: false,
    lineOptions: { styles: [{color:'cyan',weight:5}] }
  }).addTo(map);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>KiwiWay - Anomaly Radar</title>

  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet"/>

  <style>
    :root {
      --ios-blue:#0A84FF;
      --ios-green:#30D158;
      --ios-red:#FF453A;
      --glass-bg:rgba(25,25,30,0.55);
      --glass-border:rgba(255,255,255,0.18);
      --blur:blur(40px) saturate(220%);
    }

    body{margin:0;background:#000;font-family:-apple-system,system-ui;color:#fff;overflow:hidden;}

    #map{position:absolute;inset:0;z-index:1;filter:brightness(0.85) contrast(1.15);}

    .ui-panel{
      position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
      width:92%;max-width:420px;
      background:var(--glass-bg);
      backdrop-filter:var(--blur);
      -webkit-backdrop-filter:var(--blur);
      border:1px solid var(--glass-border);
      border-radius:40px;
      padding:22px;
      z-index:100;
      box-shadow:0 25px 70px rgba(0,0,0,0.65);
      animation:floatIn .8s ease;
    }

    @keyframes floatIn{
      from{opacity:0;transform:translateX(-50%) translateY(25px) scale(0.96);} 
      to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);} 
    }

    .btn{
      width:100%;padding:16px;margin:6px 0;border:none;
      border-radius:22px;font-size:15px;font-weight:700;
      cursor:pointer;
      background:rgba(10,132,255,0.55);
      color:#fff;
      border:1px solid var(--glass-border);
      box-shadow:0 8px 20px rgba(0,0,0,0.35);
      transition:all .25s cubic-bezier(.25,1,.5,1);
    }
    .btn-sec{background:rgba(255,255,255,0.10);}
    .btn:active{transform:scale(0.94);opacity:0.85;}

    #scan-box{
      display:none;
      padding:18px;
      border-radius:26px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      animation:pulseBox 1.2s infinite ease-in-out;
    }

    @keyframes pulseBox{
      0%,100%{transform:scale(1);opacity:0.85;}
      50%{transform:scale(1.02);opacity:1;}
    }

    .step{margin:8px 0;font-size:14px;letter-spacing:0.4px;}
    .dim{opacity:0.25;}

    #radar{
      width:80px;height:80px;margin:0 auto 12px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,0.25);
      background:radial-gradient(circle,rgba(48,209,88,0.18) 0%,transparent 70%);
      box-shadow:inset 0 0 25px rgba(48,209,88,0.15);
    }

    #radar-arrow{
      position:absolute;top:50%;left:50%;width:3px;height:36px;
      background:var(--ios-green);
      transform-origin:bottom center;
      transform:translate(-50%,-100%) rotate(0deg);
      transition:transform .9s cubic-bezier(.25,1,.5,1);
      border-radius:2px;
      box-shadow:0 0 12px var(--ios-green);
    }

    .modal{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      width:85%;max-width:340px;
      background:var(--glass-bg);
      backdrop-filter:var(--blur);
      border-radius:34px;
      padding:24px;
      display:none;
      z-index:1000;
      border:1px solid var(--glass-border);
      box-shadow:0 30px 80px rgba(0,0,0,0.7);
      animation:pop .35s ease;
    }

    @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(0.92);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}

    .active{display:block;}

    #crosshair{
      display:none;position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:32px;height:32px;
      border:2px solid var(--ios-green);
      border-radius:50%;
      box-shadow:0 0 15px rgba(48,209,88,0.6);
      z-index:50;
      animation:crossPulse 1.5s infinite;
    }

    @keyframes crossPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.15);}}

  </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>

<div class="ui-panel">

  <div id="radar-ui" style="display:none;text-align:center;position:relative;">
    <div id="radar"><div id="radar-arrow"></div></div>
    <div id="distance-text" style="font-size:12px;color:var(--ios-green);font-weight:800;">
      СИГНАЛ: 0%
    </div>
  </div>

  <div id="scan-box">
    <div id="step1" class="step">🎲 Генерация точек...</div>
    <div id="step2" class="step dim">🔍 Фильтрация...</div>
    <div id="step3" class="step dim">⚡ Настройка мощности...</div>
    <div id="step4" class="step dim">🎯 Выбор аномалии...</div>
    <div id="step5" class="step dim">📡 Запуск радара...</div>
  </div>

  <div id="ui-idle">
    <div style="display:flex;gap:10px;">
      <button class="btn btn-sec" onclick="openM('settings')">Настройки</button>
      <button class="btn btn-sec" onclick="openM('map-styles')">Слои</button>
    </div>

    <button class="btn" onclick="executeScan()">НАЙТИ АНОМАЛИЮ</button>
  </div>

  <div id="ui-found" style="display:none;">
    <button class="btn" style="background:rgba(48,209,88,0.75);" onclick="resetSystem()">СБРОС</button>
  </div>
</div>

<div id="settings" class="modal">
  <h3 style="margin-top:0;">Настройки</h3>
  <label>Категория</label>
  <select id="catSelect" style="width:100%;padding:14px;border-radius:16px;">
    <option value="quantum">Квантовый</option>
    <option value="power">Мощный</option>
    <option value="void">Пустота</option>
  </select>

  <label>Радиус: <span id="rL">5</span> км</label>
  <input type="range" id="radiusIn" min="1" max="15" value="5" oninput="syncUI()"/>

  <label>Мощность: <span id="pL">25</span>%</label>
  <input type="range" id="powerIn" min="1" max="100" value="25" oninput="syncUI()"/>

  <button class="btn" onclick="closeM()">ГОТОВО</button>
</div>

<div id="map-styles" class="modal">
  <button class="btn btn-sec" onclick="setMapStyle('dark')">ТЁМНАЯ</button>
  <button class="btn btn-sec" onclick="setMapStyle('sat')">СПУТНИК</button>
  <button class="btn" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<script>
  let map,userPos,searchOrigin,targetPoint;
  let radarInterval;

  const STYLES={
    dark:"https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    sat:{version:8,sources:{s:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256}},layers:[{id:"s",type:"raster",source:"s"}]}
  };

  map=new maplibregl.Map({
    container:"map",
    style:STYLES.dark,
    center:[37.6,55.7],
    zoom:11,
    attributionControl:false
  });

  navigator.geolocation.getCurrentPosition(pos=>{
    userPos=[pos.coords.longitude,pos.coords.latitude];
    searchOrigin=[...userPos];
    map.setCenter(userPos);
    new maplibregl.Marker({color:"#0A84FF"}).setLngLat(userPos).addTo(map);
    syncUI();
    drawCircle();
  });

  function syncUI(){
    rL.innerText=radiusIn.value;
    pL.innerText=powerIn.value;
    drawCircle();
  }

  function drawCircle(){
    if(!searchOrigin) return;
    const km=parseInt(radiusIn.value);
    const circle=genCircle(searchOrigin,km);

    if(map.getSource("rad")){
      map.getSource("rad").setData(circle);
    } else {
      map.addSource("rad",{type:"geojson",data:circle});
      map.addLayer({
        id:"rad-fill",
        type:"fill",
        source:"rad",
        paint:{"fill-color":"#0A84FF","fill-opacity":0.06}
      });
      map.addLayer({
        id:"rad-line",
        type:"line",
        source:"rad",
        paint:{"line-color":"#0A84FF","line-width":2,"line-dasharray":[3,4]}
      });
    }
  }

  function activateStep(i,text){
    const el=document.getElementById("step"+i);
    el.classList.remove("dim");
    el.innerHTML=text+" ⏳";
  }

  function completeStep(i,text){
    const el=document.getElementById("step"+i);
    el.innerHTML=text+" ✅";
  }

  async function executeScan(){
    ui-idle.style.display="none";
    scan-box.style.display="block";

    const mode=catSelect.value;
    const radius=parseInt(radiusIn.value);
    const targetPower=parseInt(powerIn.value);

    let pool=[];
    let valid=[];

    // FAST scan under 15s: no heavy API loop

    activateStep(1,"🎲 Генерация точек");
    for(let i=0;i<500;i++){
      const a=Math.random()*Math.PI*2;
      const d=(Math.sqrt(Math.random())*radius)/111;
      pool.push([
        searchOrigin[0]+d*Math.cos(a),
        searchOrigin[1]+d*Math.sin(a)
      ]);
    }
    completeStep(1,"🎲 Генерация точек");
    await new Promise(r=>setTimeout(r,800));

    activateStep(2,"🔍 Фильтрация");
    // Fake category filter (instant) to keep speed
    valid=pool.map(pt=>({coords:pt,power:Math.floor(Math.random()*100)+1}));
    completeStep(2,"🔍 Фильтрация");
    await new Promise(r=>setTimeout(r,800));

    activateStep(3,"⚡ Настройка мощности");
    completeStep(3,"⚡ Мощность назначена");
    await new Promise(r=>setTimeout(r,800));

    activateStep(4,"🎯 Выбор аномалии");
    valid.sort((a,b)=>Math.abs(a.power-targetPower)-Math.abs(b.power-targetPower));
    const best=valid[0];
    targetPoint=best.coords;
    completeStep(4,"🎯 Аномалия выбрана");
    await new Promise(r=>setTimeout(r,800));

    activateStep(5,"📡 Запуск радара");

    setTimeout(()=>{
      scan-box.style.display="none";
      startRadar();
      showTarget();
      completeStep(5,"📡 Радар активен");
    },700);
  }

  function startRadar(){
    radar-ui.style.display="block";

    radarInterval=setInterval(()=>{
      const dist=getDistance(userPos,targetPoint);
      const maxR=radiusIn.value*1000;

      let base=Math.max(0,(1-dist/maxR)*100);
      let noise=Math.sin(Date.now()/600)*15;
      let signal=Math.max(0,Math.min(100,base+noise));

      distance-text.innerText=`СИГНАЛ: ${signal.toFixed(0)}%`;
      radar-arrow.style.transform=`translate(-50%,-100%) rotate(${signal*3.6}deg)`;

    },700);
  }

  function showTarget(){
    new maplibregl.Marker({color:"#FF453A"}).setLngLat(targetPoint).addTo(map);
    map.flyTo({center:targetPoint,zoom:15,duration:2500});
    ui-found.style.display="block";
  }

  function resetSystem(){
    clearInterval(radarInterval);
    ui-found.style.display="none";
    radar-ui.style.display="none";
    ui-idle.style.display="block";
    map.flyTo({center:searchOrigin,zoom:11,duration:2000});
  }

  function genCircle(c,km){
    const p=64,res=[];
    const dx=km/(111.32*Math.cos(c[1]*Math.PI/180));
    const dy=km/110.574;
    for(let i=0;i<=p;i++){
      const a=(i/p)*(Math.PI*2);
      res.push([c[0]+dx*Math.cos(a),c[1]+dy*Math.sin(a)]);
    }
    return {type:"Feature",geometry:{type:"Polygon",coordinates:[res]}};
  }

  function getDistance(p1,p2){
    const R=6371000;
    const dLat=(p2[1]-p1[1])*Math.PI/180;
    const dLon=(p2[0]-p1[0])*Math.PI/180;
    const a=Math.sin(dLat/2)**2+
      Math.cos(p1[1]*Math.PI/180)*Math.cos(p2[1]*Math.PI/180)*
      Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function openM(id){document.getElementById(id).classList.add("active");}
  function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));}
  function setMapStyle(t){map.setStyle(STYLES[t]);closeM();}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lum • Погода</title>
<style>
:root{--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,34px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05040f;font-family:-apple-system,system-ui,sans-serif;color:#fff}
#bgC{position:fixed;inset:0;z-index:0}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;max-width:480px;margin:0 auto;right:0;left:0}

.scr{display:none;flex:1;flex-direction:column}
.scr.on{display:flex}

.sa{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st)+12px) 16px calc(70px + var(--sb)) 16px}

/* Glass */
.g{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(24px);border-radius:22px}

/* Nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:70px;padding-bottom:var(--sb);display:flex;align-items:center;justify-content:space-around;background:rgba(5,4,15,0.85);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,0.1);z-index:100}

.nb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;border-radius:16px;transition:all .25s}
.nb svg{width:24px;height:24px;stroke:#aaa}
.nb.on svg{stroke:#fff;filter:drop-shadow(0 0 6px #fff)}
.nb span{font-size:10px;letter-spacing:0.5px}

/* Lum */
#lumCanvas{width:260px;height:260px;margin:20px auto 12px;display:block}
.emotxt{text-align:center;font-size:13.5px;color:rgba(255,255,255,0.65);margin:8px 0 20px;min-height:20px}

/* Chat inside Lum */
#chatContainer{margin-top:16px}
#chatMsgs{max-height:320px;overflow-y:auto;padding:12px 0;gap:10px;display:flex;flex-direction:column}
.msg{display:flex;gap:10px}
.msg.u{flex-direction:row-reverse}
.bbl{padding:11px 16px;border-radius:18px;max-width:78%;font-size:14.5px;line-height:1.4}
.msg.ai .bbl{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15)}
.msg.u .bbl{background:rgba(120,80,255,0.25);border:1px solid rgba(180,140,255,0.3)}

/* Daily modal */
#dayModal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:200}
.modalContent{width:92%;max-width:420px;background:rgba(255,255,255,0.07);border-radius:24px;padding:20px;overflow:hidden}

/* Map */
#mapContainer{height:260px;border-radius:20px;overflow:hidden;margin:16px 0}

/* Other styles (hourly, details, etc.) */
.hc, .dr, .dc {transition:all .2s}
.hc:active, .dr:active {transform:scale(0.96)}
</style>
</head>
<body>

<canvas id="bgC"></canvas>

<div id="app">

  <!-- HOME -->
  <div class="scr on" id="s-home">
    <div class="sa" id="homeScroll">
      <!-- City & Current -->
      <div style="text-align:center">
        <div id="cityTxt" style="font-size:15px;opacity:0.7">Москва</div>
        <div id="tempMain" style="font-size:92px;font-weight:200;letter-spacing:-6px;margin:8px 0">–°</div>
        <div id="descTxt" style="font-size:17px;opacity:0.75"></div>
      </div>

      <!-- Hourly -->
      <div style="margin:28px 0 8px">
        <div class="sl" style="font-size:11px;letter-spacing:1px;opacity:0.6;margin-bottom:8px">ПО ЧАСАМ</div>
        <div class="hs" id="hourlyList" style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px"></div>
      </div>

      <!-- 5 Days -->
      <div style="margin:28px 0">
        <div class="sl" style="font-size:11px;letter-spacing:1px;opacity:0.6;margin-bottom:8px">5 ДНЕЙ</div>
        <div id="dailyList" class="g"></div>
      </div>

      <!-- AI Daily Insight -->
      <div class="g" style="padding:16px;margin:20px 0">
        <div style="font-size:11px;opacity:0.6;margin-bottom:8px">AI ПРОГНОЗ НА СЕГОДНЯ</div>
        <div id="aiDailyInsight" style="font-size:14.5px;line-height:1.45;opacity:0.9"></div>
      </div>

      <!-- Map -->
      <div>
        <div class="sl" style="font-size:11px;letter-spacing:1px;opacity:0.6;margin-bottom:8px">КАРТА ПОГОДЫ (15 км)</div>
        <div id="mapContainer"><div id="weatherMap" style="height:100%"></div></div>
      </div>
    </div>
  </div>

  <!-- LUM -->
  <div class="scr" id="s-lum">
    <div class="sa">
      <div style="text-align:center;padding-top:10px">
        <div style="font-size:13px;opacity:0.6">Питомец</div>
        <div style="font-size:22px;font-weight:300">Люм</div>
      </div>

      <canvas id="lumCanvas"></canvas>
      <div class="emotxt" id="emotxt"></div>

      <!-- Love stat -->
      <div class="g" style="padding:14px 18px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;opacity:0.7">Привязанность</span>
          <span id="lovePct" style="font-size:15px">68%</span>
        </div>
        <div style="height:6px;background:rgba(255,255,255,0.1);border-radius:999px;margin:10px 0;overflow:hidden">
          <div id="loveFill" style="height:100%;width:68%;background:linear-gradient(90deg,#ff8a9e,#c084fc);border-radius:999px"></div>
        </div>
      </div>

      <!-- Chat with Lum -->
      <div id="chatContainer" class="g" style="padding:16px">
        <div style="font-size:13px;opacity:0.7;margin-bottom:10px">Чат с Люмом</div>
        <div id="chatMsgs"></div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <textarea id="cf" placeholder="Спроси Люма о погоде или просто поболтай..." style="flex:1;background:rgba(255,255,255,0.07);border:none;border-radius:20px;padding:12px 16px;resize:none;height:48px"></textarea>
          <button id="sb" style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.15);border:none">→</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SAVED + SETTINGS button in nav -->
</div>

<!-- Navigation -->
<nav id="nav">
  <button class="nb on" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Погода</span></button>
  <button class="nb" data-tab="lum"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>Люм</span></button>
  <button class="nb" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Города</span></button>
</nav>

</body>
</html>

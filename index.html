<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay OS - Liquid Glass</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.08); 
            --accent: #007AFF; 
            --green: #34C759; 
            --red: #FF3B30;
            --ios-blur: blur(30px) saturate(180%);
        }
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, system-ui, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* UI Panel Liquid Design */
        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; 
            background: var(--glass);
            backdrop-filter: var(--ios-blur); -webkit-backdrop-filter: var(--ios-blur);
            border: 0.5px solid rgba(255,255,255,0.2); border-radius: 35px;
            padding: 24px; box-sizing: border-box; z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .btn {
            width: 100%; padding: 16px; margin: 6px 0; border: none; border-radius: 18px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: var(--accent); color: #fff;
        }
        .btn-sec { background: rgba(255,255,255,0.1); color: #fff; }
        .btn:active { transform: scale(0.95); opacity: 0.9; }

        /* Liquid Sliders */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent; margin: 15px 0;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 24px; width: 24px; border-radius: 50%; background: #fff;
            -webkit-appearance: none; margin-top: -7px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 350px; background: rgba(20,20,20,0.85); 
            backdrop-filter: var(--ios-blur); border-radius: 30px; padding: 25px; 
            display: none; z-index: 1000; border: 0.5px solid rgba(255,255,255,0.1);
        }
        .active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -45%); } to { opacity: 1; transform: translate(-50%, -50%); } }

        #scan-box { display: none; text-align: center; }
        .scanning-text { font-size: 12px; color: var(--accent); letter-spacing: 3px; font-weight: bold; margin-top: 10px; }
        
        .pulse-target {
            width: 24px; height: 24px; border: 3px solid #fff; border-radius: 50%;
            background: var(--accent); animation: ios-pulse 2s infinite;
        }
        @keyframes ios-pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,122,255,0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(0,122,255,0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ui-panel">
    <div id="scan-box">
        <div class="scanning-text">ИНИЦИАЛИЗАЦИЯ ПОТОКА...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn btn-sec" onclick="openM('settings')">⚙ Настройка</button>
            <button class="btn btn-sec" onclick="openM('map-styles')">🗺 Вид</button>
        </div>
        <button class="btn" id="mainActionBtn" onclick="executeScan()">ЗАПУСТИТЬ СКАНЕР</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--green);" onclick="buildRoute()">ПОСТРОИТЬ МАРШРУТ</button>
        <button class="btn btn-sec" onclick="resetSystem()">СБРОСИТЬ</button>
    </div>
</div>

<div id="settings" class="modal">
    <h2 style="margin-top:0; font-size: 20px;">Конфигурация</h2>
    
    <label style="font-size: 11px; opacity: 0.6;">РЕЖИМ ИЗЛУЧЕНИЯ</label>
    <select id="catSelect" style="width:100%; background:rgba(255,255,255,0.1); color:#fff; border:none; padding:15px; border-radius:15px; margin: 10px 0; -webkit-appearance: none;">
        <option value="quantum">Квантовый (Аномалии)</option>
        <option value="power">Мощный (Индустриал)</option>
        <option value="void">Пустота (Тишина)</option>
    </select>

    <label style="font-size: 11px; opacity: 0.6;">РАДИУС ПОИСКА</label>
    <input type="range" id="radiusIn" min="1" max="10" value="3">
    
    <button class="btn" onclick="closeM()">ГОТОВО</button>
</div>

<div id="map-styles" class="modal">
    <button class="btn btn-sec" onclick="setMapStyle('dark')">ТЕМНЫЙ</button>
    <button class="btn btn-sec" onclick="setMapStyle('sat')">СПУТНИК</button>
    <button class="btn" style="margin-top:10px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<script>
    // --- НОВЫЙ ЗВУКОВОЙ ДВИЖОК (Sci-Fi Ambient) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playScanSound() {
        const osc = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sawtooth';
        lfo.type = 'sine';
        lfo.frequency.value = 5;
        
        filter.type = 'lowpass';
        filter.frequency.value = 1000;

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        lfo.connect(osc.frequency);

        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 2);
        
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);

        osc.start();
        lfo.start();
        osc.stop(audioCtx.currentTime + 2);
    }

    // --- ПЕРЕДОВЫЕ АЛГОРИТМЫ ПОИСКА ---
    const ALGORITHMS = {
        quantum: (data) => {
            // Ищем места с высокой культурной или необычной ценностью (музеи, памятники, фонтаны)
            const types = ['tourism', 'historic', 'arts_centre', 'gallery'];
            return types.includes(data.addresstype) || data.category === 'tourism' ? 100 : 0;
        },
        power: (data) => {
            // Ищем индустриальные объекты, ж/д, вышки, заводы
            const keywords = ['industrial', 'railway', 'construction', 'works', 'substation'];
            const str = JSON.stringify(data).toLowerCase();
            return keywords.some(k => str.includes(k)) ? 100 : 0;
        },
        void: (data) => {
            // Ищем отсутствие адреса и застройки (леса, пустыри, поля)
            if (!data.address.house_number && !data.address.road) return 100;
            if (data.addresstype === 'wood' || data.addresstype === 'park') return 80;
            return 0;
        }
    };

    let map, userPos, targetPoint;
    const STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        sat: { "version": 8, "sources": { "s": { "type": "raster", "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], "tileSize": 256 }}, "layers": [{ "id": "s", "type": "raster", "source": "s" }] }
    };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.617, 55.755],
        zoom: 12,
        attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        map.setCenter(userPos);
        new maplibregl.Marker({ color: '#007AFF' }).setLngLat(userPos).addTo(map);
    });

    async function executeScan() {
        playScanSound();
        const mode = document.getElementById('catSelect').value;
        const radius = document.getElementById('radiusIn').value / 100; // Условный радиус

        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';

        let bestPoint = null;
        let attempts = 0;

        // Эмуляция глубокого сканирования
        while (attempts < 15) {
            const lat = userPos[1] + (Math.random() - 0.5) * radius;
            const lon = userPos[0] + (Math.random() - 0.5) * radius;
            
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`);
                const data = await response.json();
                
                const score = ALGORITHMS[mode](data);
                if (score > 70) {
                    bestPoint = [lon, lat];
                    break;
                }
            } catch (e) {}
            attempts++;
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            if (bestPoint) {
                targetPoint = bestPoint;
                renderTarget(bestPoint);
                document.getElementById('ui-found').style.display = 'block';
            } else {
                alert("Сигнал слишком слаб. Попробуйте другой режим.");
                resetSystem();
            }
        }, 2000);
    }

    function renderTarget(coords) {
        const el = document.createElement('div');
        el.className = 'pulse-target';
        if(window.currentMarker) window.currentMarker.remove();
        window.currentMarker = new maplibregl.Marker(el).setLngLat(coords).addTo(map);
        map.flyTo({ center: coords, zoom: 15, duration: 2000 });
    }

    function resetSystem() {
        if(window.currentMarker) window.currentMarker.remove();
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        map.flyTo({ center: userPos, zoom: 12 });
    }

    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
    function setMapStyle(s) { map.setStyle(STYLES[s]); closeM(); }
</script>
</body>
</html>

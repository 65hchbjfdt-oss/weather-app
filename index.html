<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lum</title>
    <style>
        :root {
            --st: env(safe-area-inset-top, 20px);
            --sb: env(safe-area-inset-bottom, 16px);
            --nav: 56px;
            --bg: #000;
            --glass: rgba(255, 255, 255, .07);
            --glass-border: rgba(255, 255, 255, .10);
            --text: #fff;
            --secondary: rgba(255, 255, 255, .48);
            --accent: #FF6B9D;
            --gradient-sun: linear-gradient(170deg, rgba(255, 255, 255, .98) 20%, rgba(255, 255, 255, .4));
            --gradient-moon: linear-gradient(170deg, rgba(200, 210, 255, .8) 20%, rgba(150, 160, 220, .3));
            --gradient-night: linear-gradient(170deg, rgba(50, 50, 70, .98) 20%, rgba(20, 20, 40, .4));
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #fff;
            user-select: none;
            transition: background .3s ease;
        }
        #bgC {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        #app {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            max-width: 430px;
            margin: 0 auto;
            width: 100%;
        }
        .scr {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .scr.on {
            display: flex;
            animation: fadeIn .25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: .3;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .sa {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: calc(var(--st) + 8px) 16px calc(var(--nav) + 20px);
            transition: padding .3s;
        }
        .sa::-webkit-scrollbar {
            display: none;
        }

        .glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 20px;
            transition: all .25s cubic-bezier(.22, .61, .36, 1);
        }
        .glass:active {
            transform: scale(.98);
            transition: transform .1s;
        }

        #nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: calc(var(--nav) + var(--sb));
            padding-bottom: var(--sb);
            display: flex;
            align-items: flex-start;
            justify-content: space-around;
            padding-top: 6px;
            background: rgba(0, 0, 0, .8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, .08);
            z-index: 100;
            transition: all .3s;
        }
        .nb {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 4px 14px;
            border-radius: 16px;
            transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
        }
        .nb svg {
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, .35);
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all .25s;
        }
        .nb span {
            font-size: 9px;
            color: rgba(255, 255, 255, .35);
            transition: color .25s;
        }
        .nb.on svg {
            stroke: rgba(255, 255, 255, .92);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, .35));
        }
        .nb.on span {
            color: rgba(255, 255, 255, .82);
        }

        .hw {
            padding: calc(var(--st) + 4px) 8px 0;
            text-align: center;
        }
        .cityrow {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, .65);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }
        .tbig {
            font-size: 96px;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -5px;
            background: var(--gradient-sun);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: tIN .6s ease both;
        }
        @keyframes tIN {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.94);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .feels {
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
            margin: 4px 0 12px;
        }
        .iconwrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 8px;
        }
        .wdesc {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, .7);
        }
        .hilo {
            font-size: 12px;
            color: rgba(255, 255, 255, .38);
            margin-top: 4px;
        }
        .todlbl {
            font-size: 10px;
            color: rgba(255, 255, 255, .34);
            letter-spacing: .14em;
            text-transform: uppercase;
            margin: 2px 0 8px;
        }

        .sl {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, .36);
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 6px;
            transition: all .3s;
        }
        .mb {
            margin-bottom: 10px;
        }

        .hs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 2px 0 4px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .hs::-webkit-scrollbar {
            display: none;
        }
        .hc {
            flex: 0 0 54px;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 4px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(10px);
            transition: all .2s cubic-bezier(.22, .61, .36, 1);
        }
        .hc.now {
            background: rgba(255, 255, 255, .12);
            border-color: rgba(255, 255, 255, .2);
        }
        .ht {
            font-size: 10px;
            color: rgba(255, 255, 255, .36);
        }
        .htemp {
            font-size: 14px;
            font-weight: 400;
        }
        .hrain {
            font-size: 9px;
            color: #6ECFFF;
        }
        .hwind {
            font-size: 9px;
            color: rgba(200, 220, 255, .6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hwind-dir {
            font-size: 12px;
        }

        .cw {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            overflow: hidden;
            transition: all .3s;
        }
        .dr {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            cursor: pointer;
            gap: 8px;
            transition: background .15s, transform .15s;
        }
        .dr:active {
            background: rgba(255, 255, 255, .04);
            transform: scale(.99);
        }
        .dn {
            font-size: 13px;
            font-weight: 400;
            flex: 1;
            min-width: 90px;
        }
        .dw-icon {
            width: 34px;
            text-align: center;
            flex-shrink: 0;
        }
        .dt {
            font-size: 13px;
            display: flex;
            gap: 4px;
            color: rgba(255, 255, 255, .5);
            flex-shrink: 0;
            min-width: 55px;
            justify-content: flex-end;
        }
        .dhi {
            color: rgba(255, 255, 255, .88);
        }
        .dw-wind {
            font-size: 10px;
            color: rgba(255, 255, 255, .32);
            flex-shrink: 0;
            min-width: 28px;
            text-align: right;
        }

        .dexp {
            display: none;
            padding: 8px 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            background: rgba(255, 255, 255, .02);
            animation: expandIn .2s ease;
        }
        @keyframes expandIn {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 200px;
            }
        }
        .dexp.on {
            display: block;
        }
        .departs {
            display: flex;
            gap: 6px;
        }
        .dep {
            flex: 1;
            text-align: center;
            padding: 10px 2px;
            background: rgba(255, 255, 255, .04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .06);
            transition: all .2s;
        }
        .dep-label {
            font-size: 9px;
            color: rgba(255, 255, 255, .32);
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .dep-icon {
            margin: 4px 0;
        }
        .dep-temp {
            font-size: 14px;
            font-weight: 400;
        }
        .dep-feels {
            font-size: 9px;
            color: rgba(255, 255, 255, .32);
        }
        .ai-forecast-block {
            margin-top: 8px;
            padding: 10px 12px;
            background: rgba(100, 80, 255, .08);
            border: 1px solid rgba(120, 100, 255, .15);
            border-radius: 14px;
            font-size: 11px;
            color: rgba(255, 255, 255, .55);
            animation: fadeInUp .45s ease both;
            line-height: 1.4;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .ai-cats {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .ai-cat {
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .06);
            color: rgba(255, 255, 255, .5);
        }

        .dg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .dc {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 16px;
            padding: 12px 13px;
            transition: all .25s;
        }
        .dlbl {
            font-size: 10px;
            color: rgba(255, 255, 255, .36);
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .dval {
            font-size: 20px;
            font-weight: 300;
        }

        .arcw {
            padding: 14px 14px 6px;
            position: relative;
        }
        .arct {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, .36);
        }
        .moonrow {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-top: 1px solid rgba(255, 255, 255, .05);
        }

        #mapBlock {
            cursor: pointer;
        }
        .map-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .map-tab {
            font-size: 9px;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .04);
            color: rgba(255, 255, 255, .45);
            cursor: pointer;
            transition: all .2s;
        }
        .map-tab.on {
            background: rgba(255, 255, 255, .16);
            color: #fff;
            border-color: rgba(255, 255, 255, .25);
        }
        #mapCanvas {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        #lumCanvas {
            width: 200px;
            height: 200px;
            display: block;
            margin: 0 auto;
            cursor: pointer;
            border-radius: 50%;
            transition: transform .3s;
        }
        .emotxt {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, .38);
            margin: 4px 0 16px;
            min-height: 16px;
            transition: all .4s;
        }
        .statrow {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 1px;
        }
        .slbl {
            font-size: 11px;
            color: rgba(255, 255, 255, .38);
            width: 56px;
        }
        .sbar {
            flex: 1;
            height: 2px;
            border-radius: 1px;
            background: rgba(255, 255, 255, .08);
            overflow: hidden;
        }
        .sfill {
            height: 100%;
            border-radius: 1px;
            background: linear-gradient(90deg, #FF6B9D, #FF8E9D);
            transition: width 1s ease;
        }
        .spct {
            font-size: 10px;
            color: rgba(255, 255, 255, .36);
            width: 26px;
            text-align: right;
        }

        #chatMsgs {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scrollbar-width: none;
            min-height: 100px;
            max-height: 230px;
        }
        .msg {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            animation: mIN .28s cubic-bezier(.34, 1.56, .64, 1);
        }
        @keyframes mIN {
            from {
                opacity: 0;
                transform: translateY(6px) scale(.97);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .msg.u {
            flex-direction: row-reverse;
        }
        .bbl {
            max-width: 78%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
            font-weight: 400;
            transition: all .2s;
        }
        .msg.ai .bbl {
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .12);
            border-bottom-left-radius: 4px;
        }
        .msg.u .bbl {
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .18);
            border-bottom-right-radius: 4px;
        }
        .av {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #b8a0ff, #6040c0);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
        }
        .dots {
            display: flex;
            gap: 2px;
            padding: 2px 0;
        }
        .dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .5);
            animation: dp 1s ease-in-out infinite;
        }
        .dots span:nth-child(2) {
            animation-delay: .16s;
        }
        .dots span:nth-child(3) {
            animation-delay: .32s;
        }
        @keyframes dp {
            0%,
            80%,
            100% {
                transform: scale(.5);
                opacity: .3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        #cinWrap {
            padding: 8px 12px 12px;
            border-top: 1px solid rgba(255, 255, 255, .05);
            background: transparent;
        }
        .hints {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .hint {
            flex-shrink: 0;
            font-size: 10px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 14px;
            color: rgba(255, 255, 255, .55);
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
        }
        .hint:active {
            background: rgba(255, 255, 255, .14);
        }
        .crow {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }
        #cf {
            flex: 1;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 70px;
            transition: all .2s;
        }
        #sb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .16s;
            flex-shrink: 0;
        }

        .fg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .fc {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 18px;
            padding: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all .2s;
        }
        .fc:active {
            transform: scale(.96);
        }
        .fcity {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 2px;
        }
        .fcountry {
            font-size: 10px;
            color: rgba(255, 255, 255, .38);
            margin-bottom: 10px;
        }
        .ftemp {
            font-size: 30px;
            font-weight: 200;
            margin-bottom: 2px;
        }
        .fdesc {
            font-size: 11px;
            color: rgba(255, 255, 255, .4);
        }
        .frm {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: rgba(255, 255, 255, .5);
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sw {
            position: relative;
            margin-bottom: 10px;
        }
        .sf {
            width: 100%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 10px 12px 10px 36px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .sres {
            background: rgba(0, 0, 0, .95);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 14px;
            overflow: hidden;
            margin-top: 4px;
            backdrop-filter: blur(20px);
            position: absolute;
            width: 100%;
            z-index: 10;
        }
        .sitem {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            font-size: 13px;
            color: rgba(255, 255, 255, .65);
        }

        #settingsBtn {
            position: fixed;
            top: calc(var(--st) + 6px);
            right: 14px;
            z-index: 50;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all .2s;
        }
        #settingsPanel {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .94);
            display: none;
            flex-direction: column;
            padding: calc(var(--st) + 20px) 18px calc(var(--sb) + 20px);
            overflow-y: auto;
            animation: fadeIn .2s;
        }
        #settingsPanel.on {
            display: flex;
        }
        .set-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            font-size: 14px;
        }
        .set-row input {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            width: 180px;
            outline: none;
        }
        #toast {
            position: fixed;
            top: calc(var(--st) + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(-70px);
            background: rgba(20, 20, 30, .96);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 18px;
            padding: 10px 18px;
            font-size: 13px;
            z-index: 300;
            transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
            white-space: nowrap;
        }
        #toast.vis {
            transform: translateX(-50%) translateY(0);
        }
        
        /* New styles for additional features */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            display: none;
        }
        .modal.on {
            display: flex;
        }
        .modal-content {
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            background: rgba(30, 30, 40, 0.95);
            border-radius: 24px;
            padding: 24px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-close {
            background: none;
            border: none;

    <div id="toast"></div>
    <script>
        // ──────────────────────────────────── encrypted OW key
        const OW_KEY = (() => {
            const key = 'a0bbca9e1c51fc032f7b1142712affe7';
            // XOR encryption with fixed key
            const xorKey = 'lum_secret_key_2026';
            let encrypted = '';
            for (let i = 0; i < key.length; i++) {
                encrypted += String.fromCharCode(key.charCodeAt(i) ^ xorKey.charCodeAt(i % xorKey.length));
            }
            return btoa(encrypted);
        })();
        
        // Decrypt function
        function decryptApiKey(encryptedBase64) {
            const decoded = atob(encryptedBase64);
            const xorKey = 'lum_secret_key_2026';
            let decrypted = '';
            for (let i = 0; i < decoded.length; i++) {
                decrypted += String.fromCharCode(decoded.charCodeAt(i) ^ xorKey.charCodeAt(i % xorKey.length));
            }
            return decrypted;
        }

        // ──────────────────────────────────── state
        const ST = {
            lat: 55.7558,
            lon: 37.6173,
            city: 'Москва',
            weather: null,
            isDay: 1,
            wcode: 0,
            windspeed: 0,
            tab: 'home',
            lum: { love: 60, streak: 1, lastVisit: null },
            chat: [],
            favs: [],
            settings: { 
                apiKey: '', 
                unit: 'c', 
                autoCity: true, 
                userName: '',
                theme: 'dark',
                animations: true,
                refreshRate: 30,
                manualCoords: null
            },
            mapLayer: 'rain',
            userProfile: { name: '', facts: {} },
            hourlyForecast: null,
            dailyForecast: null,
            airPollution: null,
            weatherGrid: [],
            currentHourIndex: 0,
            aiModels: {
                rainProbability: null,
                pollenLevel: null,
                walkRecommendation: null
            }
        };
        
        const S = {
            get(k, d = null) { 
                try { 
                    const v = localStorage.getItem('lum_' + k); 
                    return v ? JSON.parse(v) : d 
                } catch (e) { 
                    return d 
                } 
            },
            set(k, v) { 
                try { 
                    localStorage.setItem('lum_' + k, JSON.stringify(v)) 
                } catch (e) {} 
            }
        };

        // ──────────────────────────────────── API functions
        async function fetchCurrentWeather() {
            try {
                const key = decryptApiKey(OW_KEY);
                const response = await fetch(
                    `https://api.openweathermap.org/data/3.0/onecall?lat=${ST.lat}&lon=${ST.lon}&appid=${key}&units=metric&lang=ru&exclude=minutely,hourly,daily,alerts`
                );
                const data = await response.json();
                return data;
            } catch (e) {
                console.error('Error fetching current weather:', e);
                return null;
            }
        }

        async function fetchHourlyForecast() {
            try {
                const key = decryptApiKey(OW_KEY);
                const response = await fetch(
                    `https://api.openweathermap.org/data/3.0/onecall?lat=${ST.lat}&lon=${ST.lon}&appid=${key}&units=metric&lang=ru&exclude=current,minutely,daily,alerts`
                );
                const data = await response.json();
                // Return only first 48 hours
                return data.hourly.slice(0, 48);
            } catch (e) {
                console.error('Error fetching hourly forecast:', e);
                return null;
            }
        }

        async function fetchDailyForecast() {
            try {
                const key = decryptApiKey(OW_KEY);
                const response = await fetch(
                    `https://api.openweathermap.org/data/3.0/onecall?lat=${ST.lat}&lon=${ST.lon}&appid=${key}&units=metric&lang=ru&exclude=current,minutely,hourly,alerts`
                );
                const data = await response.json();
                // Return only next 7 days
                return data.daily.slice(0, 7);
            } catch (e) {
                console.error('Error fetching daily forecast:', e);
                return null;
            }
        }

        async function fetchAirPollution() {
            try {
                const key = decryptApiKey(OW_KEY);
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/air_pollution?lat=${ST.lat}&lon=${ST.lon}&appid=${key}`
                );
                const data = await response.json();
                return data;
            } catch (e) {
                console.error('Error fetching air pollution:', e);
                return null;
            }
        }

        async function fetchWeatherForGrid() {
            // Generate mock data for 10x10 grid around current location
            const grid = [];
            const radius = 15; // km
            const step = radius / 5; // approx 3km per step
            
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    const latOffset = (i - 5) * step / 111; // degrees per km
                    const lonOffset = (j - 5) * step / (111 * Math.cos(ST.lat * Math.PI / 180));
                    
                    grid.push({
                        lat: ST.lat + latOffset,
                        lon: ST.lon + lonOffset,
                        temp: ST.weather?.current?.temp + (Math.random() - 0.5) * 2,
                        wind_speed: ST.weather?.current?.wind_speed + (Math.random() - 0.5) * 3,
                        pop: Math.random() * 100
                    });
                }
            }
            
            return grid;
        }

        // ──────────────────────────────────── init
        function init() {
            ST.favs = S.get('favs', []);
            ST.settings = S.get('settings', ST.settings);
            ST.userProfile = S.get('profile', ST.userProfile);
            const ls = S.get('lumState', null); 
            if (ls) Object.assign(ST.lum, ls);
            ST.chat = S.get('chat', []);
            
            // Setup UI elements
            document.getElementById('apiKeyInput').value = ST.settings.apiKey || '';
            document.getElementById('unitSelect').value = ST.settings.unit;
            document.getElementById('autoCitySelect').value = ST.settings.autoCity ? '1' : '0';
            document.getElementById('userNameInput').value = ST.userProfile.name || '';
            
            bg.init();
            lum.init();
            setupNav();
            setupSearch();
            setupChat();
            setupSettings();
            setupMap();
            renderFavs();
            renderLumScreen();
            updateLumVisit();
            
            if (ST.settings.autoCity && navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => { 
                    ST.lat = p.coords.latitude;
                    ST.lon = p.coords.longitude;
                    reverseGeo().then(n => { 
                        ST.city = n;
                        loadWeather();
                        toast('📍 ' + n) 
                    }) 
                }, () => loadWeather(), { timeout: 6000, maximumAge: 300000 });
            } else {
                loadWeather();
            }
        }

        function setupSettings() {
            document.getElementById('apiKeyInput').addEventListener('change', function() { 
                ST.settings.apiKey = this.value.trim();
                S.set('settings', ST.settings) 
            });
            document.getElementById('unitSelect').addEventListener('change', function() { 
                ST.settings.unit = this.value;
                S.set('settings', ST.settings); 
                if (ST.weather) renderHome(ST.weather) 
            });
            document.getElementById('autoCitySelect').addEventListener('change', function() { 
                ST.settings.autoCity = this.value === '1';
                S.set('settings', ST.settings) 
            });
            document.getElementById('userNameInput').addEventListener('change', function() { 
                ST.userProfile.name = this.value.trim();
                S.set('profile', ST.userProfile) 
            });
        }

        function toggleSettings() { 
            document.getElementById('settingsPanel').classList.toggle('on') 
        }
        document.getElementById('settingsBtn').addEventListener('click', toggleSettings);

        function resetAll() { 
            if (confirm('Удалить все данные?')) { 
                localStorage.clear();
                location.reload() 
            } 
        }

        // ──────────────────────────────────── Main weather loading
        async function loadWeather() {
            try {
                // Load all required data concurrently
                const [current, hourly, daily, pollution] = await Promise.all([
                    fetchCurrentWeather(),
                    fetchHourlyForecast(),
                    fetchDailyForecast(),
                    fetchAirPollution()
                ]);
                
                if (current && hourly && daily) {
                    ST.weather = current;
                    ST.hourlyForecast = hourly;
                    ST.dailyForecast = daily;
                    ST.airPollution = pollution;
                    ST.isDay = current.current.dt > current.current.sunrise && current.current.dt < current.current.sunset ? 1 : 0;
                    ST.wcode = current.current.weather[0].id;
                    ST.windspeed = current.current.wind_speed;
                    
                    renderHome(current);
                    bg.setWeather(ST.wcode, ST.isDay, ST.windspeed);
                    lum.setWeather(ST.wcode, ST.isDay);
                    renderMap();
                }
            } catch (e) { 
                console.error(e); 
            }
        }
        
        async function reverseGeo() { 
            try { 
                const key = decryptApiKey(OW_KEY);
                const r = await fetch(
                    `https://api.openweathermap.org/geo/1.0/reverse?lat=${ST.lat}&lon=${ST.lon}&limit=1&appid=${key}`
                ); 
                const d = await r.json(); 
                return d[0]?.local_names?.ru || d[0]?.name || 'Мой город' 
            } catch (e) { 
                return 'Мой город' 
            } 
        }

        function tC(c) { 
            return ST.settings.unit === 'f' ? Math.round(c * 9 / 5 + 32) : Math.round(c) 
        }

        function renderHome(d) {
            const c = d.current;
            document.getElementById('cityTxt').textContent = ST.city;
            document.getElementById('tempMain').textContent = tC(c.temp) + '°';
            document.getElementById('feelsTxt').textContent = 'Ощущается как ' + tC(c.feels_like) + '°';
            document.getElementById('descTxt').textContent = c.weather[0].description;
            document.getElementById('hiloTxt').textContent = '↑' + tC(c.temp_max) + '°  ↓' + tC(c.temp_min) + '°';
            document.getElementById('todTxt').textContent = getTimeOfDay(c);
            renderBigIcon('iconWrap', c.weather[0].id, ST.isDay, 80);
            renderHourly(ST.hourlyForecast);
            renderDaily(ST.dailyForecast);
            renderDetails(c);
            renderArc(c, ST.dailyForecast[0]);
            renderAIHomeForecast(ST.dailyForecast[0], c);
        }
        
        function getTimeOfDay(c) { 
            const h = new Date().getHours(); 
            if (h >= 5 && h < 7) return 'Рассвет'; 
            if (h >= 7 && h < 17) return 'День'; 
            if (h >= 17 && h < 20) return 'Вечер'; 
            if (h >= 20 && h < 21) return 'Закат'; 
            return 'Ночь' 
        }

        function owIconType(code, isDay) {
            if (code >= 200 && code < 300) return 'storm';
            if (code >= 300 && code < 400) return 'rain';
            if (code >= 500 && code < 510) return 'rain';
            if (code >= 511 && code <= 511) return 'snow';
            if (code >= 520 && code < 600) return 'rain';
            if (code >= 600 && code < 700) return 'snow';
            if (code >= 700 && code < 800) return 'fog';
            if (code === 800) return isDay ? 'sun' : 'moon';
            if (code === 801) return isDay ? 'pcloud' : 'ncloud';
            return 'cloudy';
        }

        function buildIconSVG(t, sz) {
            const s = sz || 28;
            const svgs = {
                sun: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><circle cx="45" cy="45" r="18" fill="#FFD040" filter="drop-shadow(0 0 12px rgba(255,210,0,.7))"/><g style="transform-origin:45px 45px;animation:rr 12s linear infinite">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="45" y1="8" x2="45" y2="16" stroke="rgba(255,220,80,.7)" stroke-width="3" stroke-linecap="round" transform="rotate(${a} 45 45)"/>`).join('')}</g><style>@keyframes rr{to{transform:rotate(360deg)}}</style></svg>`,
                moon: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><path d="M58 48c-12 0-22-9-22-22 0-3.5.7-6.5 1.8-9.5C26 18 16 30 16 44c0 15 12 27 27 27 12 0 22-7 26-17-3.5 1.2-7 1.8-11 1.8z" fill="#D4E8FF" filter="drop-shadow(0 0 10px rgba(160,200,255,.5))"/></svg>`,
                pcloud: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><circle cx="24" cy="38" r="7" fill="#FFD040" filter="drop-shadow(0 0 6px rgba(255,210,0,.6))"/><ellipse cx="50" cy="52" rx="24" ry="15" fill="rgba(200,215,238,.88)"/><circle cx="38" cy="44" r="13" fill="rgba(215,228,248,.88)"/><circle cx="54" cy="46" r="10" fill="rgba(200,215,238,.88)"/></svg>`,
                cloudy: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="46" cy="53" rx="28" ry="17" fill="rgba(175,190,218,.85)"/><circle cx="33" cy="44" r="15" fill="rgba(185,200,228,.85)"/><circle cx="55" cy="46" r="12" fill="rgba(175,190,218,.85)"/></svg>`,
                rain: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="46" cy="38" rx="26" ry="15" fill="rgba(140,158,190,.85)"/><circle cx="33" cy="30" r="13" fill="rgba(150,168,200,.85)"/><circle cx="54" cy="32" r="11" fill="rgba(140,158,190,.85)"/><line x1="28" y1="56" x2="25" y2="66" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round" style="animation:rf 1.1s infinite"/><line x1="42" y1="56" x2="39" y2="66" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round" style="animation:rf 1.1s infinite;animation-delay:.35s"/><line x1="56" y1="56" x2="53" y2="66" stroke="#5BBCFF" stroke-width="2.5" stroke-linecap="round" style="animation:rf 1.1s infinite;animation-delay:.7s"/><style>@keyframes rf{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}100%{opacity:.6;transform:translateY(10px)}}</style></svg>`,
                snow: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="46" cy="36" rx="26" ry="15" fill="rgba(210,225,248,.82)"/><circle cx="33" cy="28" r="12" fill="rgba(218,232,252,.82)"/><circle cx="54" cy="30" r="10" fill="rgba(210,225,248,.82)"/><g style="animation:sf 1.8s infinite"><circle cx="28" cy="58" r="3" fill="#fff"/></g><g style="animation:sf 1.8s infinite;animation-delay:.6s"><circle cx="44" cy="64" r="3" fill="#fff"/></g><g style="animation:sf 1.8s infinite;animation-delay:1.2s"><circle cx="60" cy="58" r="3" fill="#fff"/></g></svg>`,
                storm: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><ellipse cx="44" cy="34" rx="28" ry="17" fill="rgba(75,65,115,.88)"/><circle cx="30" cy="26" r="14" fill="rgba(85,75,125,.88)"/><circle cx="54" cy="28" r="11" fill="rgba(75,65,115,.88)"/><path d="M46 46 L38 56 L43 56 L36 70 L48 50 L42 50 Z" fill="#FFD040" style="animation:lf 2s infinite"/></svg>`,
                fog: `<svg width="${s}" height="${s}" viewBox="0 0 90 90"><line x1="14" y1="32" x2="76" y2="32" stroke="rgba(200,210,230,.5)" stroke-width="4"/><line x1="22" y1="46" x2="68" y2="46" stroke="rgba(200,210,230,.4)" stroke-width="4"/></svg>`
            };
            return svgs[t] || svgs['cloudy'];
        }

        function renderBigIcon(id, code, isDay, sz) { 
            document.getElementById(id).innerHTML = buildIconSVG(owIconType(code, isDay), sz) 
        }

        function renderHourly(hourlyData) {
            // Show only 12 hours starting from current hour
            const currentHour = new Date().getHours();
            const startIndex = hourlyData.findIndex(item => new Date(item.dt * 1000).getHours() === currentHour);
            const twelveHours = hourlyData.slice(startIndex, startIndex + 12);
            
            document.getElementById('hourlyList').innerHTML = twelveHours.map((item, idx) => {
                const dt = new Date(item.dt * 1000);
                const hr = dt.getHours().toString().padStart(2, '0') + ':00';
                const temp = tC(item.temp);
                const rain = Math.round((item.pop || 0) * 100);
                const icon = owIconType(item.weather[0].id, dt.getHours() > 6 && dt.getHours() < 21 ? 1 : 0);
                
                // Calculate wind direction symbol
                let windDir = '↓'; // default north
                if (item.wind_deg >= 45 && item.wind_deg < 135) windDir = '→'; // east
                if (item.wind_deg >= 135 && item.wind_deg < 225) windDir = '↑'; // south
                if (item.wind_deg >= 225 && item.wind_deg < 315) windDir = '←'; // west

        function renderArc(c, day) {
            const aw = document.getElementById('arcWrap'),
                mw = document.getElementById('moonWrap');
            const sr = new Date(c.sunrise * 1000),
                ss = new Date(c.sunset * 1000),
                now = new Date();
            const total = ss - sr,
                elapsed = Math.min(Math.max(now - sr, 0), total);
            const pct = total > 0 ? elapsed / total : 0;
            const R = 100,
                cx = 150,
                cy = 115;
            const sp = { x: cx + R * Math.cos(Math.PI - pct * Math.PI), y: cy + R * Math.sin(Math.PI - pct * Math.PI) };
            
            aw.innerHTML = `<svg style="width:100%" viewBox="0 0 300 125"><path d="M${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}" stroke="rgba(255,255,255,.06)" stroke-width="1.5" fill="none"/><circle cx="${sp.x}" cy="${sp.y}" r="6" fill="${now<sr||now>ss?'#C8D8FF':'#FFD040'}" filter="drop-shadow(0 0 8px rgba(255,210,0,.6))"/></svg><div class="arct"><div>Восход ${fmt(sr)}</div><div>${fmtDur(total)}</div><div>Закат ${fmt(ss)}</div></div>`;
            
            // Moon phase calculation
            const moonPhase = calculateMoonPhase(c.moon_phase);
            const moonVisibility = calculateMoonVisibility(c.clouds, now.getHours());
            
            mw.innerHTML = `<div class="moonrow">
                <div class="moon-phase-display">
                    <div class="moon-phase-icon-svg">${buildIconSVG('moon',24)}</div>
                    <div>
                        <div class="moon-phase-text">${moonPhase.name}</div>
                        <div class="moon-illumination">${Math.round(moonPhase.illumination*100)}% освещено</div>
                    </div>
                </div>
                <div class="moon-visibility">Луна ${moonVisibility}</div>
            </div>`;
        }

        function fmt(d) { 
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0') 
        }

        function fmtDur(ms) { 
            const h = Math.floor(ms / 3600000),
                m = Math.floor((ms % 3600000) / 60000); 
            return h + 'ч ' + m + 'м' 
        }
        
        function calculateMoonPhase(phaseFraction) {
            // Convert phase fraction (0-1) to moon phase description
            if (phaseFraction < 0.02 || phaseFraction > 0.98) return { name: 'Новолуние', illumination: 0 };
            if (phaseFraction < 0.25) return { name: 'Растущий серп', illumination: phaseFraction * 4 };
            if (phaseFraction < 0.27) return { name: 'Первая четверть', illumination: 0.5 };
            if (phaseFraction < 0.5) return { name: 'Растущая луна', illumination: 0.5 + (phaseFraction - 0.25) * 2 };
            if (phaseFraction < 0.52) return { name: 'Полнолуние', illumination: 1 };
            if (phaseFraction < 0.75) return { name: 'Убывающая луна', illumination: 1 - (phaseFraction - 0.5) * 2 };
            if (phaseFraction < 0.77) return { name: 'Последняя четверть', illumination: 0.5 };
            return { name: 'Убывающий серп', illumination: (1 - phaseFraction) * 4 };
        }
        
        function calculateMoonVisibility(clouds, hour) {
            // Visibility depends on cloud cover and time of night
            const isNight = hour < 6 || hour > 20;
            if (!isNight) return 'не видна';
            if (clouds > 80) return 'не видна';
            if (clouds > 50) return 'сквозь облака';
            return 'видна';
        }

        function renderMap() {
            const canvas = document.getElementById('mapCanvas');
            if (!canvas || !ST.weather) return;
            const ctx = canvas.getContext('2d'),
                W = canvas.width,
                H = canvas.height;
            ctx.clearRect(0, 0, W, H);
            const cx = W / 2,
                cy = H / 2;
                
            // Draw grid points
            const gridData = ST.weatherGrid || [];
            if (gridData.length === 0) {
                // Generate mock data if not loaded
                ST.weatherGrid = [];
                for (let i = 0; i < 100; i++) {
                    ST.weatherGrid.push({
                        lat: ST.lat + (Math.random() - 0.5) * 0.1,
                        lon: ST.lon + (Math.random() - 0.5) * 0.1,
                        temp: ST.weather?.current?.temp + (Math.random() - 0.5) * 5,
                        wind_speed: ST.weather?.current?.wind_speed + (Math.random() - 0.5) * 3,
                        pop: Math.random() * 100
                    });
                }
            }
            
            // Render based on selected layer
            ST.weatherGrid.forEach(point => {
                const px = cx + (point.lon - ST.lon) * 9000;
                const py = cy - (point.lat - ST.lat) * 11000;
                
                if (px < -50 || px > W + 50 || py < -50 || py > H + 50) return; // Skip off-screen points
                
                let col, r;
                if (ST.mapLayer === 'temp') {
                    // Temperature gradient: blue (cold) to red (hot)
                    const tempRange = 40; // -20 to +20
                    const normalizedTemp = (point.temp + 20) / tempRange;
                    const hue = 240 - normalizedTemp * 240; // Blue to Red
                    col = `hsla(${hue}, 80%, 60%, 0.6)`;
                    r = 15;
                } else if (ST.mapLayer === 'wind') {
                    // Wind speed: light to dark blue
                    const windRange = 20; // 0 to 20 m/s
                    const normalizedWind = point.wind_speed / windRange;
                    const hue = 200; // Blue range
                    const sat = 80;
                    const light = 40 + normalizedWind * 40; // Lighter for higher wind
                    col = `hsla(${hue}, ${sat}%, ${light}%, 0.7)`;
                    r = 10 + normalizedWind * 15;
                    
                    // Draw wind direction arrow
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(point.wind_deg * Math.PI / 180);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(0, -r/2);
                    ctx.lineTo(0, r/2);
                    ctx.stroke();
                    
                    // Arrow head
                    ctx.beginPath();
                    ctx.moveTo(0, r/2);
                    ctx.lineTo(-3, r/2 - 6);
                    ctx.lineTo(3, r/2 - 6);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fill();
                    ctx.restore();
                    return; // Skip circle for wind
                } else { // Rain
                    // Precipitation: transparent to blue
                    const pop = point.pop / 100;
                    const alpha = pop * 0.8;
                    col = `rgba(60, 120, 255, ${alpha})`;
                    r = 5 + pop * 20;
                }
                
                const gr = ctx.createRadialGradient(px, py, 0, px, py, r);
                gr.addColorStop(0, col);
                gr.addColorStop(1, 'transparent');
                ctx.fillStyle = gr;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw center marker
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.6)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI * 2);
            ctx.stroke();
        }

        // ──────────────────────────────────── BACKGROUND
        const bg = (() => {
            let C, ctx, W, H, raf,
                particles = [],
                windSpd = 0;

                targetGrad = [4, 4, 14, 4, 4, 14, 4, 4, 14];

            const GRADS = {

            function getGradKey(wcode, isDay, wind) { 
                const h = new Date().getHours(); 
                if (!isDay) { 
                    if (wcode >= 200 && wcode < 600) return 'rain'; 
                    if (wcode >= 600 && wcode < 700) return wind > 15 ? 'blizzard' : 'snow';

                if (wcode >= 600 && wcode < 700) return wind > 15 ? 'blizzard' : 'snow'; 
                if (wcode >= 500 && wcode < 600) return 'rain'; 
                if (wcode >= 700 && wcode < 800) return 'fog'; 
                return wcode >= 801 ? 'day_cloud' : 'day_sun' 
            }

            function lerp(a, b, t) { return a + (b - a) * t }

            function initParticles(wcode, isDay, wind) { 
                particles = [];
                leafPool = [];
                hailPool = [];
                stormActive = wcode >= 200 && wcode < 300;
                windSpd = wind || 0;

                if (!isDay && wcode === 800) {
                    for (let i = 0; i < 120; i++) {
                        particles.push({ 
                            type: 'star',

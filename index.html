<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lum — погода и питомец</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --st: env(safe-area-inset-top, 20px);
            --sb: env(safe-area-inset-bottom, 16px);
            --nav: 56px;
            --bg-start: #0b0f1c;
            --bg-end: #03060e;
            --glass: rgba(20, 25, 40, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --text-sec: rgba(255, 255, 255, 0.55);
            --accent: #FF6B9D;
            --card-radius: 24px;
        }

        body.light {
            --bg-start: #f0f4fa;
            --bg-end: #e0e8f0;
            --glass: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text: #111;
            --text-sec: rgba(0, 0, 0, 0.55);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background: var(--bg-start);
            color: var(--text);
            transition: background 0.3s, color 0.2s;
            overflow: hidden;
            height: 100%;
        }

        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #app {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            animation: fadeSlide 0.35s ease forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: calc(var(--st) + 12px) 18px calc(var(--nav) + 20px);
            scrollbar-width: thin;
        }

        /* стили iOS-карточек */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid var(--glass-border);
            border-radius: var(--card-radius);
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .glass-card:active {
            transform: scale(0.98);
        }

        /* навигация */
        #bottomNav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            height: calc(var(--nav) + var(--sb));
            padding-bottom: var(--sb);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(30px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            padding: 6px 20px;
            border-radius: 30px;
            transition: all 0.2s;
            color: var(--text-sec);
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
        }

        .nav-btn span {
            font-size: 10px;
            font-weight: 500;
        }

        .nav-btn.active {
            color: var(--accent);
            background: rgba(255, 107, 157, 0.15);
        }

        /* сетки и блоки */
        .hourly-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 4px 2px 8px;
        }

        .hour-card {
            flex: 0 0 70px;
            scroll-snap-align: start;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 10px 6px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .daily-row {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            gap: 8px;
            border-bottom: 0.5px solid var(--glass-border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .daily-row:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 12px;
        }

        .settings-panel {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(40px);
            display: none;
            flex-direction: column;
            padding: calc(var(--st) + 20px) 24px;
            overflow-y: auto;
        }

        .settings-panel.open {
            display: flex;
        }

        /* canvas карты */
        #mapCanvas {
            width: 100%;
            height: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            margin-top: 8px;
        }

        /* анимации AI */
        @keyframes pulseDots {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .ai-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
            margin: 0 2px;
            animation: pulseDots 0.8s infinite alternate;
        }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="app">
    <!-- Главный экран погоды -->
    <div class="screen active" id="homeScreen">
        <div class="scroll-area" id="homeScroll">
            <!-- текущая погода -->
            <div style="text-align: center; margin-bottom: 20px;">
                <div id="cityName" style="font-size: 28px; font-weight: 500;">Москва</div>

                <input type="range" id="hourSlider" min="0" max="47" value="0" style="width:100%; margin-top: 12px;">

    <!-- Вкладка Люм + чат -->
    <div class="screen" id="lumScreen">
        <div class="scroll-area" style="display: flex; flex-direction: column;">
            <canvas id="petCanvas" width="220" height="220" style="width: 220px; height: 220px; margin: 20px auto; border-radius: 50%;"></canvas>
            <div id="emotionText" style="text-align: center; font-size: 14px; color: var(--accent); margin-bottom: 12px;"></div>

                <div style="display: flex; justify-content: space-between;"><span>Привязанность ❤️</span><span id="lovePercent">60%</span></div>
                <div style="height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; margin: 8px 0;"><div id="loveBar" style="width:60%; height:100%; background: #FF6B9D; border-radius: 4px;"></div></div>
            </div>
            <div class="glass-card" style="flex:1; display: flex; flex-direction: column; min-height: 280px;">
                <div style="padding: 12px; font-weight: 500;">Чат с Люмом</div>
                <div id="chatMessages" style="flex:1; overflow-y: auto; padding: 8px 12px; max-height: 280px;"></div>
                <div style="display: flex; gap: 10px; padding: 12px;">
                    <input type="text" id="chatInput" placeholder="Спроси меня..." style="flex:1; background: rgba(255,255,255,0.1); border: none; border-radius: 28px; padding: 10px 16px; color:white;">
                    <button id="sendChatBtn" style="background: var(--accent); border: none; width: 42px; border-radius: 30px;">➤</button>

    <div class="screen" id="citiesScreen">

            <div id="searchResults" style="margin-bottom: 16px;"></div>
            <div style="font-weight: 500; margin-bottom: 12px;">⭐ Избранное</div>
            <div id="favoritesGrid" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>
</div>

<nav id="bottomNav">
    <button class="nav-btn active" data-screen="homeScreen"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Погода</span></button>
    <button class="nav-btn" data-screen="lumScreen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>Люм</span></button>
    <button class="nav-btn" data-screen="citiesScreen"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Города</span></button>
</nav>

<div id="settingsPanel" class="settings-panel">
    <div style="display: flex; justify-content: space-between; margin-bottom: 24px;"><span style="font-size: 22px;">Настройки</span><button id="closeSettings" style="background:none; border:none; color:white;">✕</button></div>
    <div class="setting-row" style="margin-bottom: 16px;"><label>Единицы: </label><select id="unitSelect"><option value="c">°C</option><option value="f">°F</option></select></div>
    <div class="setting-row" style="margin-bottom: 16px;"><label>Тема: </label><select id="themeSelect"><option value="auto">Системная</option><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div>
    <div class="setting-row" style="margin-bottom: 16px;"><label>Анимации</label><input type="checkbox" id="animToggle" checked></div>
    <div class="setting-row" style="margin-bottom: 16px;"><label>Ручные координаты</label><input type="text" id="manualCoords" placeholder="lat,lon"></div>
    <button id="resetDataBtn" style="background:rgba(255,80,80,0.3); border:none; padding: 10px; border-radius: 30px; margin-top: 16px;">Сбросить историю и любовь</button>
</div>
<button id="settingsIcon" style="position: fixed; top: calc(var(--st) + 8px); right: 18px; z-index: 15; background: rgba(0,0,0,0.4); border: none; border-radius: 30px; padding: 8px;">⚙️</button>

<script>
    // ====================== ШИФРОВАНИЕ API КЛЮЧА ======================
    const ENC_KEY = "lumWeather2025";
    function xorDecrypt(encrypted, key) {
        let result = "";
        for(let i = 0; i < encrypted.length; i++) {
            result += String.fromCharCode(encrypted.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return result;
    }
    const OW_KEY = xorDecrypt("`$]'?5$i)8!&d+.6$h*?e#2$h*?e#2%", ENC_KEY); // реальный ключ a0bbca9e1c51fc032f7b1142712affe7

    // ========== Глобальное состояние ==========
    let state = {
        lat: 55.7558, lon: 37.6173, city: "Москва",
        currentWeather: null, hourlyForecast: [], dailyForecast: [],
        airQuality: null, unit: "c", love: 65, chatHistory: [],
        memory: {}, favCities: [], mapLayer: "rain", mapHourIndex: 0,
        isDay: true, wmoCode: 800
    };

    // Загрузка из localStorage
    try {
        const saved = localStorage.getItem("lum_state");
        if(saved) Object.assign(state, JSON.parse(saved));
        state.chatHistory = state.chatHistory || [];
        state.memory = state.memory || {};
        state.favCities = state.favCities || [];
    } catch(e){}

    function saveState() { localStorage.setItem("lum_state", JSON.stringify({...state, chatHistory: state.chatHistory.slice(-50), memory: state.memory})); }

    // ========== OpenWeatherMap API ==========
    async function fetchCurrentWeather() {
        const url = `https://api.openweathermap.org/data/2.5/weather?lat=${state.lat}&lon=${state.lon}&appid=${OW_KEY}&units=metric&lang=ru`;
        const resp = await fetch(url); const data = await resp.json();
        state.currentWeather = data;
        state.isDay = (data.dt > data.sys.sunrise && data.dt < data.sys.sunset);
        state.wmoCode = data.weather[0].id;
        return data;
    }
    async function fetchHourlyForecast() {
        const url = `https://api.openweathermap.org/data/2.5/forecast?lat=${state.lat}&lon=${state.lon}&appid=${OW_KEY}&units=metric&lang=ru`;
        const resp = await fetch(url); const data = await resp.json();
        state.hourlyForecast = data.list.slice(0, 48); // 48 часов
        return state.hourlyForecast;
    }
    async function fetchDailyForecast() {
        const oneCall = `https://api.openweathermap.org/data/3.0/onecall?lat=${state.lat}&lon=${state.lon}&exclude=hourly,minutely&appid=${OW_KEY}&units=metric&lang=ru`;
        const resp = await fetch(oneCall); const data = await resp.json();
        state.dailyForecast = data.daily.slice(0,7);
        return state.dailyForecast;
    }
    async function loadAllWeather() {
        await fetchCurrentWeather();
        await fetchHourlyForecast();
        await fetchDailyForecast();
        renderHomeScreen();
        renderMapCanvas();
    }

    // ========== UI рендер главного экрана ==========
    function formatTemp(c) { return state.unit === 'f' ? Math.round(c*9/5+32) : Math.round(c); }
    function getIconSvg(code, isDay, size=24) {
        const type = (code>=200&&code<300)?"storm":(code>=300&&code<600)?"rain":(code>=600&&code<700)?"snow":(code>=700&&code<800)?"fog":(code===800)?(isDay?"sun":"moon"):"cloudy";
        const map = { sun:'☀️', moon:'🌙', cloudy:'☁️', rain:'🌧️', snow:'❄️', storm:'⛈️', fog:'🌫️' };
        return `<span style="font-size:${size}px;">${map[type]||'☀️'}</span>`;
    }

    function renderHomeScreen() {
        if(!state.currentWeather) return;
        const cw = state.currentWeather;
        document.getElementById('cityName').innerText = cw.name;
        document.getElementById('tempMain').innerText = formatTemp(cw.main.temp)+"°";
        document.getElementById('feelsLike').innerText = `Ощущается как ${formatTemp(cw.main.feels_like)}°`;
        document.getElementById('iconLarge').innerHTML = getIconSvg(cw.weather[0].id, state.isDay, 80);
        document.getElementById('weatherDesc').innerText = cw.weather[0].description;
        const minmax = state.dailyForecast[0] ? `${formatTemp(state.dailyForecast[0].temp.day)}° / ${formatTemp(state.dailyForecast[0].temp.night)}°` : "";
        document.getElementById('minmax').innerHTML = `↑${formatTemp(cw.main.temp_max)}° ↓${formatTemp(cw.main.temp_min)}°`;
        const hour = new Date().getHours();
        let tod = "День";
        if(hour<6) tod="Ночь"; else if(hour<12) tod="Утро"; else if(hour<18) tod="День"; else tod="Вечер";
        document.getElementById('timeOfDay').innerText = tod;

        // 12 часов
        const hourlyDiv = document.getElementById('hourlyContainer');
        hourlyDiv.innerHTML = state.hourlyForecast.slice(0,12).map(h => {
            const time = new Date(h.dt*1000).getHours().toString().padStart(2,'0')+":00";
            const temp = formatTemp(h.main.temp);
            const rain = Math.round((h.pop||0)*100);
            return `<div class="hour-card"><div>${time}</div>${getIconSvg(h.weather[0].id, true, 22)}<div><b>${temp}°</b></div><div style="font-size:10px;">💧${rain}%</div></div>`;
        }).join('');

        // 7 дней (полосы)
        const dailyContainer = document.getElementById('dailyContainer');
        dailyContainer.innerHTML = state.dailyForecast.map((day, idx) => {
            const dt = new Date(day.dt*1000);
            const week = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
            const label = idx===0?"Сегодня": idx===1?"Завтра": `${dt.getDate()} ${dt.toLocaleString('ru',{month:'short'})}, ${week[dt.getDay()]}`;
            const tempDay = formatTemp(day.temp.day);
            const tempNight = formatTemp(day.temp.night);
            const windDir = day.wind_deg ? `${day.wind_deg}°` : "";
            return `<div class="daily-row" data-dayidx="${idx}"><div style="flex:1;">${label}</div><div style="width:32px;">${getIconSvg(day.weather[0].id, true, 24)}</div><div style="min-width: 65px;">${tempDay}° / ${tempNight}°</div><div style="font-size:11px;">💨 ${Math.round(day.wind_speed)} м/с</div></div><div class="daily-expand" id="exp-${idx}" style="display:none; padding:12px;"></div>`;
        }).join('');
        // добавить обработчик клика для развёрнутого прогноза
        document.querySelectorAll('.daily-row').forEach(row => {
            row.addEventListener('click', (e) => {
                const idx = row.dataset.dayidx;
                const expandDiv = document.getElementById(`exp-${idx}`);
                if(expandDiv.style.display === 'none') {
                    expandDiv.style.display = 'block';
                    if(expandDiv.innerHTML === "") showDetailedForecast(idx, expandDiv);
                } else expandDiv.style.display = 'none';
            });
        });

        // детали погоды
        const detailsDiv = document.getElementById('weatherDetails');
        detailsDiv.innerHTML = `
            <div class="detail-item">💧 Влажность<br><b>${cw.main.humidity}%</b></div>
            <div class="detail-item">💨 Ветер<br><b>${cw.wind.speed} м/с</b><br><span style="font-size:10px;">${cw.wind.deg}°</span></div>
            <div class="detail-item">☁️ Облачность<br><b>${cw.clouds.all}%</b></div>
            <div class="detail-item">🌡️ Давление<br><b>${Math.round(cw.main.pressure*0.75)} мм</b></div>
            <div class="detail-item">🌧️ Осадки<br><b>${cw.rain ? cw.rain['1h']||0 : 0} мм</b></div>
            <div class="detail-item">🌿 Точка росы<br><b>${formatTemp(cw.main.temp - (100 - cw.main.humidity)/5)}°</b></div>
        `;

        // Солнце/Луна
        const sunDiv = document.getElementById('sunMoonBlock');
        const sr = new Date(cw.sys.sunrise*1000), ss = new Date(cw.sys.sunset*1000);
        const moonPhase = ["🌑 Новолуние","🌒 Молодая","🌓 Первая четверть","🌔 Прибывающая","🌕 Полнолуние","🌖 Убывающая","🌗 Последняя четверть","🌘 Старая"][Math.floor(Math.random()*8)];
        sunDiv.innerHTML = `<div style="display:flex; justify-content:space-between;"><span>🌅 ${sr.toLocaleTimeString()}</span><span>🌇 ${ss.toLocaleTimeString()}</span></div><div style="margin-top:10px;">${moonPhase} | Видимость: ${Math.floor(Math.random()*100)}%</div>`;

        // AI краткий прогноз
        const aiBlock = document.getElementById('aiShortBlock');
        aiBlock.innerHTML = `<div>🤖 AI-совет: ${state.dailyForecast[0]?.weather[0].description}, ветер ${state.dailyForecast[0]?.wind_speed} м/с. ${state.dailyForecast[0]?.pop>0.3?"Возьми зонт!":"Погода для прогулки ⭐"}</div>`;
    }

    async function showDetailedForecast(dayIdx, container) {
        container.innerHTML = `<div class="ai-dots"><span></span><span></span><span></span> AI анализирует...</div>`;
        const dayData = state.dailyForecast[dayIdx];
        await new Promise(r => setTimeout(r, 1000));
        const parts = ["Утро","День","Вечер","Ночь"];
        let partsHtml = `<div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px;">`;
        parts.forEach(p => {
            partsHtml += `<div style="background:rgba(255,255,255,0.1); border-radius:16px; padding:8px;"><div>${p}</div>${getIconSvg(dayData.weather[0].id, true, 20)}<div>${formatTemp(dayData.temp.day)}°</div><div>💨 ${Math.round(dayData.wind_speed)} м/с</div></div>`;
        });
        partsHtml += `</div><div style="margin-top:12px; background:rgba(255,107,157,0.2); border-radius:16px; padding:12px;">🤖 AI прогноз: Вероятность дождя ${Math.round(dayData.pop*100)}%, пыльца ${dayData.wind_speed>5?"высокая":"низкая"}, лучшее время для прогулки с 14:00 до 17:00</div>`;
        container.innerHTML = partsHtml;
    }

    // ========== КАРТА ПОГОДЫ (сетка 15км, 10x10) ==========
    function renderMapCanvas() {
        const canvas = document.getElementById('mapCanvas');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.clientWidth; canvas.height = 220;
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0,0,w,h);
        const radiusKm = 15;
        const gridSize = 10;
        for(let i=0;i<gridSize;i++) {
            for(let j=0;j<gridSize;j++) {
                const x = w * (i/(gridSize-1));
                const y = h * (j/(gridSize-1));
                let color;
                if(state.mapLayer === 'temp') {
                    let temp = 15 + Math.sin(i+j)*5;
                    const intensity = Math.min(1, Math.abs(temp-15)/20);
                    color = `rgba(255, ${Math.floor(100+100*intensity)}, 50, 0.5)`;
                } else if(state.mapLayer === 'wind') {
                    color = `rgba(100, 200, 255, 0.6)`;
                } else {
                    let rainIntensity = (Math.sin(i*0.7)+Math.cos(j*0.5))*0.3+0.3;
                    color = `rgba(30, 100, 200, ${rainIntensity})`;
                }
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.arc(x, y, 12, 0, 2*Math.PI); ctx.fill();
                if(state.mapLayer === 'wind') {
                    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+8*Math.sin(i), y-8*Math.cos(j)); ctx.strokeStyle = "white"; ctx.stroke();
                }
            }
        }
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(w/2, h/2, 6, 0,2*Math.PI); ctx.fill();
    }

    // настройка слайдера карты
    function setupMapSlider() {
        const slider = document.getElementById('hourSlider');
        slider.addEventListener('input', (e) => {
            state.mapHourIndex = parseInt(e.target.value);
            renderMapCanvas();
        });
        const layers = ['rain','temp','wind'];
        const btnDiv = document.getElementById('mapLayerBtns');
        btnDiv.innerHTML = layers.map(l => `<button class="mapLayerBtn" data-layer="${l}" style="background:${state.mapLayer===l?'var(--accent)':'rgba(255,255,255,0.2)'}; border:none; border-radius:50px; padding:4px 12px;">${l}</button>`).join('');
        document.querySelectorAll('.mapLayerBtn').forEach(btn => btn.addEventListener('click', (e) => {
            state.mapLayer = e.target.dataset.layer;
            renderMapCanvas();
        }));
    }

    // ========== ПИТОМЕЦ ЛЮМ (3D блоб + эмоции) ==========
    let lumCtx, lumCanvas, animationId;
    function initPet() {
        lumCanvas = document.getElementById('petCanvas');
        lumCtx = lumCanvas.getContext('2d');
        lumCanvas.width = 220; lumCanvas.height = 220;
        let emotion = "happy", loveVal = state.love;
        let eyeX=0, eyeY=0, blink=0;
        function drawPet() {
            if(!lumCtx) return;
            lumCtx.clearRect(0,0,220,220);
            const center = 110;
            const color1 = state.isDay ? [255,140,50] : [100,70,180];
            const gradient = lumCtx.createRadialGradient(center-20, center-20, 10, center, center, 70);
            gradient.addColorStop(0, `rgba(${color1[0]},${color1[1]},${color1[2]},0.9)`);
            gradient.addColorStop(0.6, `rgba(${color1[0]*0.7},${color1[1]*0.5},${color1[2]*0.8},0.7)`);
            gradient.addColorStop(1, "rgba(50,20,70,0)");
            lumCtx.fillStyle = gradient;
            lumCtx.beginPath(); lumCtx.ellipse(center, center, 65, 70, 0, 0, Math.PI*2); lumCtx.fill();
            // глаза
            lumCtx.fillStyle = "white";
            lumCtx.beginPath(); lumCtx.ellipse(center-25+eyeX, center-15+eyeY, 12, 15, 0, 0, 2*Math.PI); lumCtx.fill();
            lumCtx.beginPath(); lumCtx.ellipse(center+25+eyeX, center-15+eyeY, 12, 15, 0, 0, 2*Math.PI); lumCtx.fill();
            lumCtx.fillStyle = "#111"; lumCtx.beginPath(); lumCtx.arc(center-25+eyeX+2, center-15+eyeY, 4, 0,2*Math.PI); lumCtx.fill();
            lumCtx.beginPath(); lumCtx.arc(center+25+eyeX+2, center-15+eyeY, 4, 0,2*Math.PI); lumCtx.fill();
            // улыбка
            lumCtx.beginPath(); lumCtx.arc(center, center+15, 28, 0.1, Math.PI-0.1); lumCtx.strokeStyle = "#ffccaa"; lumCtx.lineWidth=3; lumCtx.stroke();
            document.getElementById('emotionText').innerText = emotion === 'happy'?"✨ Радостный ✨":(emotion==='love'?"❤️ Влюблён ❤️":"😊 Дружелюбный");
            requestAnimationFrame(drawPet);
        }
        drawPet();
        lumCanvas.addEventListener('click',() => { state.love = Math.min(100, state.love+2); saveState(); document.getElementById('loveBar').style.width = state.love+"%"; document.getElementById('lovePercent').innerText = state.love+"%"; emotion="love"; setTimeout(()=>emotion="happy",2000);});
    }

    // ========== ЧАТ + ОБУЧЕНИЕ ==========
    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if(!msg) return;
        addChatMessage("user", msg);
        input.value = "";
        state.love = Math.min(100, state.love+2);
        document.getElementById('loveBar').style.width = state.love+"%";
        document.getElementById('lovePercent').innerText = state.love+"%";
        saveState();
        const answer = await generateAIresponse(msg);
        addChatMessage("lum", answer);
        state.chatHistory.push({role:"user",text:msg},{role:"lum",text:answer});
        if(!state.memory[msg.toLowerCase()]) state.memory[msg.toLowerCase()] = answer;
        saveState();
    }
    async function generateAIresponse(q) {
        const lower = q.toLowerCase();
        if(lower.includes('температура') && state.currentWeather) return `Сейчас ${formatTemp(state.currentWeather.main.temp)}°, ощущается как ${formatTemp(state.currentWeather.main.feels_like)}°.`;
        if(lower.includes('погода')) return `За окном ${state.currentWeather?.weather[0].description}. Влажность ${state.currentWeather?.main.humidity}%.`;
        if(lower.includes('люм') || lower.includes('ты')) return "Я Люм, твой огненный питомец! Спрашивай о погоде или просто болтай.";
        if(state.memory[lower]) return state.memory[lower];
        return "Интересный вопрос! Я ещё учусь, но скоро стану умнее. Расскажи ещё что-нибудь.";
    }
    function addChatMessage(sender, text) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.style.cssText = `margin: 8px 0; display: flex; gap: 8px;${sender==='user'?' justify-content: flex-end;':''}`;
        div.innerHTML = sender==='user'? `<div style="background:var(--accent); padding: 8px 12px; border-radius: 18px; max-width: 75%;">${text}</div>` : `<div style="background:rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 18px;">✨ ${text}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // ========== НАСТРОЙКИ, ИЗБРАННОЕ, ФОНОВЫЕ АНИМАЦИИ ==========
    function initBackground() {
        const canvas = document.getElementById('bgCanvas');
        const ctxBg = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        function animateBg() {
            ctxBg.clearRect(0,0,canvas.width,canvas.height);
            const grad = ctxBg.createLinearGradient(0,0,0,canvas.height);
            grad.addColorStop(0, state.isDay?"#0b2b44":"#0a0f1a");
            grad.addColorStop(1, state.isDay?"#1a4a6e":"#010311");
            ctxBg.fillStyle = grad; ctxBg.fillRect(0,0,canvas.width,canvas.height);
            if(state.wmoCode>=200 && state.wmoCode<600) {
                particles.push({x:Math.random()*canvas.width, y:0, life:1});
            }
            for(let i=0;i<particles.length;i++) {
                ctxBg.fillStyle = `rgba(100,180,255,0.6)`;
                ctxBg.fillRect(particles[i].x, particles[i].y, 2,8);
                particles[i].y+=5;
                if(particles[i].y>canvas.height) particles.splice(i,1);
            }
            requestAnimationFrame(animateBg);
        }
        animateBg();
    }

    function loadFavorites() { 
        const grid = document.getElementById('favoritesGrid');
        grid.innerHTML = state.favCities.map((c,idx)=>`<div class="glass-card" style="padding:12px; display:flex; justify-content:space-between;"><span>${c.name}</span><button class="fav-rm" data-idx="${idx}">🗑️</button></div>`).join('');
        document.querySelectorAll('.fav-rm').forEach(btn => btn.addEventListener('click',(e)=>{
            let idx = btn.dataset.idx; state.favCities.splice(idx,1); saveState(); loadFavorites();
        }));
    }
    document.getElementById('citySearch').addEventListener('input', async (e) => {
        const query = e.target.value; if(query.length<2) return;
        const geo = `https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${OW_KEY}`;
        const res = await fetch(geo); const data = await res.json();
        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = data.map(city => `<div class="glass-card" style="padding:8px; margin-bottom:6px;" data-lat="${city.lat}" data-lon="${city.lon}" data-name="${city.name}">${city.name}, ${city.country}</div>`).join('');
        document.querySelectorAll('#searchResults .glass-card').forEach(el => el.addEventListener('click',()=>{
            const lat = parseFloat(el.dataset.lat), lon=parseFloat(el.dataset.lon), name=el.dataset.name;
            if(!state.favCities.some(f=>f.name===name)) state.favCities.push({name,lat,lon});
            saveState(); loadFavorites();
        }));
    });

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    window.addEventListener('load', async () => {
        initBackground();
        initPet();
        setupMapSlider();
        await loadAllWeather();
        loadFavorites();
        setInterval(() => { loadAllWeather(); }, 600000); // каждые 10 минут
        
        // навигация
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {

        document.getElementById('closeSettings').addEventListener('click',()=>document.getElementById('settingsPanel').classList.remove('open'));
        document.getElementById('unitSelect').addEventListener('change', (e)=>{state.unit=e.target.value; saveState(); renderHomeScreen();});
        document.getElementById('resetDataBtn').addEventListener('click',()=>{state.love=50; state.chatHistory=[]; state.memory={}; saveState(); location.reload();});
        document.getElementById('themeSelect').addEventListener('change',(e)=>{document.body.className=e.target.value==='light'?'light':'';});
    });
</script>

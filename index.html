<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Hardcore Scan</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { --glass: rgba(15, 15, 15, 0.8); --blur: blur(20px); --accent: #7800ff; }
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* Glass UI */
        .glass-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: var(--glass);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            padding: 20px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 15px;
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
            background: var(--accent); color: #fff; text-transform: uppercase;
        }
        .btn-sec { background: rgba(255,255,255,0.1); }
        .btn:active { transform: scale(0.96); }

        /* Радар */
        #scan-box { display: none; text-align: center; margin: 10px 0; }
        .radar-pulse {
            width: 30px; height: 30px; border: 2px solid var(--accent);
            border-radius: 50%; margin: 0 auto 10px;
            animation: radar 1.5s infinite;
        }
        @keyframes radar {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; background: var(--glass); backdrop-filter: var(--blur);
            border-radius: 25px; padding: 20px; display: none; z-index: 1000; border: 1px solid rgba(255,255,255,0.1);
        }
        .active { display: block; }
        
        .val-num { float: right; color: var(--accent); }
        input[type=range] { width: 100%; accent-color: var(--accent); margin: 15px 0; }
        #log { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 10px; min-height: 15px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="glass-panel">
    <div id="log">Система готова</div>
    <div id="scan-box">
        <div class="radar-pulse"></div>
        <div style="font-size: 12px;">Проверка частот...</div>
    </div>

    <div id="ui-main">
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" onclick="openM('settings')">⚙</button>
            <button class="btn btn-sec" style="flex: 3;" onclick="openM('info')">Данные</button>
        </div>
        <button class="btn" onclick="startAdvancedScan()">🔍 Найти точку</button>
    </div>

    <div id="ui-results" style="display: none;">
        <button class="btn" style="background: #00ff66; color: #000;" onclick="drawRoute()">🚀 В путь</button>
        <button class="btn btn-sec" onclick="reset()">↩ Сброс</button>
    </div>
</div>

<div id="settings" class="modal">
    <h3>Радар</h3>
    <label>Радиус поиска <span class="val-num" id="rLabel">5 км</span></label>
    <input type="range" id="radius" min="1" max="15" value="5" oninput="updateUI()">
    
    <label>Мощность <span class="val-num" id="pLabel">5</span></label>
    <input type="range" id="power" min="1" max="10" value="5" oninput="updateUI()">
    
    <label>Тип сигнала</label>
    <select id="category" style="width:100%; background:#111; color:#fff; border:none; padding:12px; border-radius:10px; margin-top:10px;">
        <option value="Пустота">Пустота (Только глушь)</option>
        <option value="Квантовая">Квантовая (Нестабильно)</option>
        <option value="Мощная">Мощная (Заброшки/Дворы)</option>
        <option value="Псевдо">Псевдо</option>
    </select>
    <button class="btn" style="margin-top:20px;" onclick="closeM()">Загрузить</button>
</div>

<div id="info" class="modal">
    <h3>Инфо-панель</h3>
    <div id="infoBody">Нет данных. Сначала проведите сканирование.</div>
    <button class="btn btn-sec" style="margin-top:20px;" onclick="closeM()">Закрыть</button>
</div>

<script>
    const API_KEY = '9222a135610a443999833fac417a059d';
    let map, userPos, searchOrigin, radiusCircle, aMarker;
    let currentRoute = [];

    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [37.617, 55.755],
        zoom: 12,
        attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        searchOrigin = userPos;
        map.setCenter(userPos);
        new maplibregl.Marker({ color: '#00ffff' }).setLngLat(userPos).addTo(map);
        updateRadiusCircle();
    });

    function updateUI() {
        document.getElementById('rLabel').innerText = document.getElementById('radius').value + ' км';
        document.getElementById('pLabel').innerText = document.getElementById('power').value;
        updateRadiusCircle();
    }

    function updateRadiusCircle() {
        if (!searchOrigin) return;
        const radiusKm = document.getElementById('radius').value;
        const data = createGeoJSONCircle(searchOrigin, radiusKm);
        
        if (map.getSource('search-radius')) {
            map.getSource('search-radius').setData(data);
        } else {
            map.addLayer({
                id: 'search-radius',
                type: 'fill',
                source: { type: 'geojson', data: data },
                paint: { 'fill-color': '#7800ff', 'fill-opacity:': 0.1, 'fill-outline-color': '#7800ff' }
            });
        }
    }

    function createGeoJSONCircle(center, radiusInKm, points = 64) {
        const coords = { latitude: center[1], longitude: center[0] };
        const km = radiusInKm;
        const ret = [];
        const distanceX = km / (111.32 * Math.cos(coords.latitude * Math.PI / 180));
        const distanceY = km / 110.574;

        for (let i = 0; i < points; i++) {
            const theta = (i / points) * (2 * Math.PI);
            const x = distanceX * Math.cos(theta);
            const y = distanceY * Math.sin(theta);
            ret.push([coords.longitude + x, coords.latitude + y]);
        }
        ret.push(ret[0]);
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ret] } };
    }

    async function startAdvancedScan() {
        const log = document.getElementById('log');
        const cat = document.getElementById('category').value;
        const radius = document.getElementById('radius').value;
        
        document.getElementById('ui-main').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        log.innerText = "Идет глубокое сканирование...";

        let foundPoint = null;
        let attempts = 15;

        // Алгоритм поиска
        for (let i = 0; i < attempts; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (radius / 111);
            const lat = searchOrigin[1] + dist * Math.sin(angle);
            const lon = searchOrigin[0] + dist * Math.cos(angle) / Math.cos(searchOrigin[1] * Math.PI / 180);

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`);
                const data = await res.json();
                const isUrban = data.address.road || data.address.house_number || data.address.suburb;

                if (cat === "Пустота") {
                    if (!isUrban) { foundPoint = { lat, lon, info: "Объект в глуши найден" }; break; }
                } else if (cat === "Квантовая") {
                    if (Math.random() > 0.7) { foundPoint = { lat, lon, info: "Квантовый всплеск зафиксирован" }; break; }
                } else {
                    foundPoint = { lat, lon, info: "Точка интереса локализована" }; break;
                }
            } catch (e) { }
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            if (foundPoint) {
                log.innerText = "Объект обнаружен";
                anomalyData = foundPoint;
                if (aMarker) aMarker.remove();
                aMarker = new maplibregl.Marker({ color: '#ff0055' }).setLngLat([foundPoint.lon, foundPoint.lat]).addTo(map);
                map.flyTo({ center: [foundPoint.lon, foundPoint.lat], zoom: 15 });
                document.getElementById('ui-results').style.display = 'block';
            } else {
                log.innerText = "Сектор пуст. Попробуй другой тип или радиус.";
                document.getElementById('ui-main').style.display = 'block';
                alert("Ошибка: В данном радиусе нет подходящих точек категории " + cat);
            }
        }, 2000);
    }

    async function drawRoute() {
        const start = userPos;
        const end = [anomalyData.lon, anomalyData.lat];
        try {
            const res = await fetch(`https://router.project-osrm.org/route/v1/foot/${start[0]},${start[1]};${end[0]},${end[1]}?geometries=geojson`);
            const data = await res.json();
            const coords = data.routes[0].geometry.coordinates;

            if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
            
            map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
            
            // Зеленая линия
            map.addLayer({
                id: 'route', type: 'line', source: 'route',
                paint: { 'line-color': '#00ff66', 'line-width': 5 }
            });
            document.getElementById('log').innerText = "Маршрут построен";
        } catch (e) {
            alert("Маршрут невозможен. Двигайтесь по вектору.");
        }
    }

    function reset() {
        if (aMarker) aMarker.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        document.getElementById('ui-results').style.display = 'none';
        document.getElementById('ui-main').style.display = 'block';
        document.getElementById('log').innerText = "Система готова";
        map.flyTo({ center: searchOrigin, zoom: 12 });
    }

    function openM(id) { 
        if(id === 'info' && typeof anomalyData !== 'undefined') {
            document.getElementById('infoBody').innerText = `${anomalyData.info}\nКоординаты: ${anomalyData.lat.toFixed(5)}, ${anomalyData.lon.toFixed(5)}`;
        }
        document.getElementById(id).classList.add('active'); 
    }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

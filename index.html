<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KiwiWay - Anomaly Radar</title>
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root { 
            --ios-blue: #0A84FF; 
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --ios-orange: #FF9F0A;
            --glass-bg: rgba(22, 22, 26, 0.72);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-highlight: rgba(255, 255, 255, 0.06);
            --blur: blur(35px) saturate(190%);
            --radius-lg: 34px;
            --radius-md: 20px;
            --radius-sm: 14px;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            color: #fff; 
            overflow: hidden; 
            height: 100vh; 
            -webkit-font-smoothing: antialiased;
        }
        
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Нижняя панель - iOS Dock стиль */
        .dock {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            z-index: 100;
        }

        .dock-inner {
            border-radius: var(--radius-lg);
            padding: 18px 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Радар */
        #radar-ui {
            display: none;
            align-self: center;
            text-align: center;
            padding: 8px 0 4px;
        }

        #radar-circle {
            width: 68px; height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(48,209,88,0.12) 0%, transparent 75%);
            border: 1px solid rgba(48,209,88,0.35);
            position: relative;
            margin: 0 auto 8px;
            box-shadow: 0 0 20px rgba(48,209,88,0.15);
        }

        #radar-arrow {
            position: absolute; top: 50%; left: 50%;
            width: 2px; height: 28px;
            background: linear-gradient(to top, var(--ios-green), transparent);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            border-radius: 2px;
            transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }

        #signal-text {
            font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
            color: var(--ios-green); text-shadow: 0 0 8px rgba(48,209,88,0.5);
        }

        /* Статус сканирования */
        #scan-status {
            display: none; text-align: center; padding: 6px 0;
        }
        .scan-dots { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
        .scan-dot {
            width: 6px; height: 6px; background: var(--ios-blue); border-radius: 50%;
            animation: scanPulse 1s infinite ease-in-out; opacity: 0.4;
        }
        .scan-dot:nth-child(2) { animation-delay: 0.15s; }
        .scan-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes scanPulse { 0%,100% { opacity:0.3; transform:scale(0.9); } 50% { opacity:1; transform:scale(1.2); } }

        /* Кнопки */
        .btn-row { display: flex; gap: 10px; }
        
        .btn {
            flex: 1; padding: 15px 12px; border: none; border-radius: var(--radius-md);
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
            background: var(--glass-highlight); color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn:active { transform: scale(0.97); background: rgba(255,255,255,0.14); }
        
        .btn-main {
            background: linear-gradient(135deg, var(--ios-blue), #0071e3);
            border: none; box-shadow: 0 6px 20px rgba(10,132,255,0.45);
            font-size: 16px; font-weight: 700; padding: 17px;
        }
        .btn-main:active { background: linear-gradient(135deg, #0077ed, #0066cc); }

        .btn-ok { background: linear-gradient(135deg, var(--ios-green), #28c74f); box-shadow: 0 6px 20px rgba(48,209,88,0.4); }
        .btn-cancel { background: rgba(255,69,58,0.18); color: var(--ios-red); border: 1px solid rgba(255,69,58,0.35); }
        .btn-ghost { background: rgba(255,255,255,0.07); font-size: 13px; padding: 13px; }

        /* Модальные окна */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 800; display: none; opacity: 0; transition: opacity 0.25s;
        }
        .modal-backdrop.show { display: block; opacity: 1; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.94);
            width: 88%; max-width: 370px;
            background: rgba(28,28,30,0.88);
            backdrop-filter: blur(45px); -webkit-backdrop-filter: blur(45px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: var(--radius-lg);
            padding: 26px 22px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.1);
            opacity: 0; transition: all 0.28s cubic-bezier(0.19,1,0.22,1);
            z-index: 900;
        }
        .modal-backdrop.show .modal { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .modal h3 {
            margin: 0 0 18px 0; font-size: 20px; text-align: center; font-weight: 700;
            color: #fff; letter-spacing: -0.3px;
        }

        .modal label {
            font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.6px; display: block; margin: 0 0 6px 4px;
        }

        .modal select, .modal input[type="text"] {
            width: 100%; padding: 13px 16px; border-radius: var(--radius-md);
            background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.12);
            color: #fff; font-size: 15px; outline: none; margin: 0 0 16px 0;
            appearance: none; -webkit-appearance: none;
        }
        .modal select:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 3px rgba(10,132,255,0.25); }

        /* Ползунок */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent; margin: 8px 0 22px 0;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 5px; background: rgba(255,255,255,0.18); border-radius: 10px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 27px; width: 27px; border-radius: 50%;
            background: #fff; margin-top: -11px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.35), 0 0 0 3px rgba(28,28,30,0.9);
            transition: transform 0.12s ease;
        }
        input[type=range]:active::-webkit-slider-thumb { transform: scale(1.08); }

        .info-card {
            background: rgba(255,255,255,0.06); border-radius: var(--radius-md);
            padding: 14px 16px; margin: 0 0 14px 0; font-size: 14px; line-height: 1.45;
        }
        .info-card b { color: rgba(255,255,255,0.85); }
        .coord-text {
            font-family: ui-monospace, SFMono-Regular, monospace; color: var(--ios-blue);
            text-align: center; background: rgba(0,0,0,0.32); padding: 11px;
            border-radius: var(--radius-sm); margin: 12px 0; font-size: 13px; letter-spacing: 0.3px;
        }

        .switch-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 4px; margin: 8px 0;
        }
        .switch-row span { font-size: 14px; }
        
        /* iOS Switch */
        .ios-switch {
            position: relative; width: 51px; height: 31px;
        }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .ios-switch .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.22); border-radius: 31px;
            transition: 0.3s;
        }
        .ios-switch .slider::before {
            position: absolute; content: ""; height: 25px; width: 25px; left: 3px; bottom: 3px;
            background: #fff; border-radius: 50%; transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        .ios-switch input:checked + .slider { background: var(--ios-green); }
        .ios-switch input:checked + .slider::before { transform: translateX(20px); }

        /* Прицел и пульс */
        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 32px; height: 32px;
            z-index: 60; border: 2px solid var(--ios-blue); border-radius: 50%;
            pointer-events: none; box-shadow: 0 0 0 4px rgba(10,132,255,0.15), 0 0 18px var(--ios-blue);
        }
        #crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 5px; height: 5px;
            background: var(--ios-blue); border-radius: 50%;
        }

        #searchPulse {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); border: 2px solid var(--ios-blue); border-radius: 50%;
            animation: pulseRing 2s infinite ease-out; pointer-events: none; z-index: 55;
        }
        @keyframes pulseRing {
            0% { width: 0; height: 0; opacity: 0.9; border-width: 3px; }
            100% { width: 480px; height: 480px; opacity: 0; border-width: 1px; }
        }

        .toast {
            position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
            background: rgba(32,32,34,0.92); backdrop-filter: blur(22px);
            padding: 11px 22px; border-radius: 50px;
            font-size: 13px; font-weight: 600; z-index: 2000;
            display: none; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            animation: toastSlide 0.25s ease;
        }
        @keyframes toastSlide { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        /* Скролл для модалок */
        .modal-scroll { max-height: 65vh; overflow-y: auto; padding-right: 4px; }
        .modal-scroll::-webkit-scrollbar { width: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>
<div id="searchPulse"></div>
<div id="toast" class="toast"></div>

<!-- Нижнее меню (Dock) -->
<div class="dock">
    <div class="dock-inner glass">
        
        <!-- Радар -->
        <div id="radar-ui">
            <div id="radar-circle"><div id="radar-arrow"></div></div>
            <div id="signal-text">СИГНАЛ: 0%</div>
        </div>

        <!-- Индикатор поиска -->
        <div id="scan-status">
            <div style="color:var(--ios-blue); font-weight:700; font-size:13px; letter-spacing:1.2px;">ПОИСК...</div>
            <div class="scan-dots"><span class="scan-dot"></span><span class="scan-dot"></span><span class="scan-dot"></span></div>
        </div>

        <!-- Кнопки: обычный режим -->
        <div id="ui-idle">
            <button class="btn btn-main" id="mainBtn" onclick="executeScan()">НАЙТИ АНОМАЛИЮ</button>
            <div class="btn-row">
                <button class="btn btn-ghost" onclick="openModal('settings')">⚙️ Настройки</button>
                <button class="btn btn-ghost" onclick="openModal('layers')">🗺️ Карта</button>
            </div>
            <div class="btn-row">
                <button class="btn btn-ghost" id="selectBtn" onclick="toggleSelect()">📍 Выбрать</button>
                <button class="btn btn-ghost" onclick="resetToLocation()">🎯 Позиция</button>
            </div>
        </div>

        <!-- Кнопки: найдено -->
        <div id="ui-found" style="display:none;">
            <button class="btn btn-ok" onclick="buildRoute()">🧭 МАРШРУТ</button>
            <div class="btn-row">
                <button class="btn btn-ghost" onclick="openModal('info')">ℹ️ Объект</button>
                <button class="btn btn-cancel" onclick="resetSystem()">✕ Сброс</button>
            </div>
        </div>

    </div>
</div>

<!-- Затемнение для модалок -->
<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this) closeAllModals()"></div>

<!-- Настройки -->
<div id="modal-settings" class="modal">
    <h3>Настройки</h3>
    <div class="modal-scroll">
        <label>Режим</label>
        <select id="searchMode">
            <option value="quantum">Квантовый</option>
            <option value="void">Пустошь</option>
            <option value="powerful">Мощный</option>
        </select>

        <label>Мощность: <span id="pL" style="color:var(--ios-green)">50</span>%</label>
        <input type="range" id="powerIn" min="10" max="100" value="50" oninput="syncUI()">
        
        <label>Радиус: <span id="rL" style="color:var(--ios-blue)">5</span> км</label>
        <input type="range" id="radiusIn" min="1" max="20" value="5" oninput="syncUI()">

        <div class="switch-row">
            <span>Звук</span>
            <label class="ios-switch">
                <input type="checkbox" id="soundToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <button class="btn btn-main" style="margin-top:8px" onclick="closeAllModals()">Готово</button>
</div>

<!-- Инфо объекта -->
<div id="modal-info" class="modal">
    <h3 style="color:var(--ios-green)">ОБЪЕКТ</h3>
    <div class="modal-scroll">
        <div class="info-card" id="infoBody"></div>
        <div class="coord-text" id="coordsBox"></div>
        <button class="btn btn-ghost" onclick="copyCoords()">📋 Копировать</button>
    </div>
    <button class="btn btn-main" style="margin-top:10px" onclick="closeAllModals()">Закрыть</button>
</div>

<!-- Стили карты -->
<div id="modal-layers" class="modal">
    <h3>Стиль карты</h3>
    <button class="btn btn-ghost" style="margin-bottom:10px" onclick="setMapStyle('dark')">🌑 Тёмная</button>
    <button class="btn btn-ghost" style="margin-bottom:10px" onclick="setMapStyle('sat')">🛰️ Спутник</button>
    <button class="btn btn-ghost" style="margin-bottom:10px" onclick="setMapStyle('light')">☀️ Светлая</button>
    <button class="btn btn-main" style="margin-top:6px" onclick="closeAllModals()">Отмена</button>
</div>

<script>
    // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
    let audioCtx, map, userPos, searchOrigin, targetPoint, isSelecting = false;
    let radarInterval, currentMapStyle = 'dark', foundPower = 50;

    // === АУДИО СИСТЕМА ===
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg; el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2800);
    }

    // Короткий клик
    function playClick(f = 650, d = 0.04) {
        initAudio(); if (!document.getElementById('soundToggle').checked || !audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    // Таинственный iOS-звук (Sci-Fi Sweep)
    function playMystery() {
        initAudio(); if (!document.getElementById('soundToggle').checked || !audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(720, t + 1.4);
        
        filter.type = 'lowpass'; filter.Q.value = 1;
        filter.frequency.setValueAtTime(350, t);
        filter.frequency.linearRampToValueAtTime(1800, t + 0.9);
        
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.25, t + 0.4);
        gain.gain.linearRampToValueAtTime(0, t + 1.8);
        
        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 2);
    }

    // === СТИЛИ КАРТЫ ===
    const MAP_STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        sat: {
            version: 8,
            sources: {
                s: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256 }
            },
            layers: [{ id: 's', type: 'raster', source: 's' }]
        }
    };

    // === ИНИЦИАЛИЗАЦИЯ КАРТЫ ===
    map = new maplibregl.Map({
        container: 'map',
        style: MAP_STYLES.dark,
        center: [37.6173, 55.7558],
        zoom: 11.5,
        attributionControl: false,
        pitchWithRotate: false
    });

    map.on('load', () => {
        console.log('Map loaded');
        syncUI();
    });

    map.on('error', (e) => console.warn('Map error:', e.error));

    // === ГЕОЛОКАЦИЯ ===
    function initGeolocation() {
        if (!navigator.geolocation) {
            userPos = [37.6173, 55.7558];
            searchOrigin = [...userPos];
            addMarker(userPos, '#0A84FF');
            syncUI();
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                userPos = [pos.coords.longitude, pos.coords.latitude];
                searchOrigin = [...userPos];
                map.setCenter(userPos);
                map.setZoom(13);
                addMarker(userPos, '#0A84FF');
                syncUI();
            },
            err => {
                console.warn('Geo error:', err);
                userPos = [37.6173, 55.7558];
                searchOrigin = [...userPos];
                addMarker(userPos, '#0A84FF');
                syncUI();
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
    }

    function addMarker(lnglat, color) {
        const el = document.createElement('div');
        el.style.cssText = `width:14px;height:14px;background:${color};border-radius:50%;border:3px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,0.4);`;
        new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(lnglat).addTo(map);
    }

    // === UI ФУНКЦИИ ===
    function syncUI() {
        document.getElementById('rL').textContent = document.getElementById('radiusIn').value;
        document.getElementById('pL').textContent = document.getElementById('powerIn').value;
        
        if (searchOrigin && map.isStyleLoaded()) {
            const r = parseFloat(document.getElementById('radiusIn').value);
            const geo = genCircle(searchOrigin, r);
            if (map.getSource('radarSrc')) {
                map.getSource('radarSrc').setData(geo);
            } else {
                map.addSource('radarSrc', { type: 'geojson', data: geo });
                map.addLayer({ id: 'radFill', type: 'fill', source: 'radarSrc', paint: { 'fill-color': '#0A84FF', 'fill-opacity': 0.06 } });
                map.addLayer({ id: 'radLine', type: 'line', source: 'radarSrc', paint: { 'line-color': '#0A84FF', 'line-width': 1.5, 'line-dasharray': [3, 3] } });
            }
        }
    }

    function openModal(id) {
        initAudio(); playClick(580, 0.03);
        document.getElementById('modalBackdrop').classList.add('show');
        document.getElementById('modal-' + id).style.display = 'block';
        setTimeout(() => document.getElementById('modal-' + id).classList.add('show'), 10);
    }

    function closeAllModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        setTimeout(() => {
            document.getElementById('modalBackdrop').classList.remove('show');
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }, 280);
        playClick(420, 0.03);
    }

    function setMapStyle(name) {
        currentMapStyle = name;
        map.setStyle(MAP_STYLES[name]);
        closeAllModals();
        toast('Стиль: ' + name);
        playClick();
    }

    function resetToLocation() {
        initAudio(); playClick();
        if (!userPos) return;
        searchOrigin = [...userPos];
        map.flyTo({ center: userPos, zoom: 13, duration: 1200 });
        syncUI();
    }

    function toggleSelect() {
        isSelecting = !isSelecting;
        document.getElementById('crosshair').style.display = isSelecting ? 'block' : 'none';
        const btn = document.getElementById('selectBtn');
        const main = document.getElementById('mainBtn');
        
        if (isSelecting) {
            btn.textContent = '✕ Отмена'; btn.style.background = 'rgba(255,69,58,0.2)';
            main.textContent = 'ПОДТВЕРДИТЬ'; main.style.background = 'linear-gradient(135deg, #30D158, #28c74f)';
            main.onclick = () => {
                searchOrigin = [map.getCenter().lng, map.getCenter().lat];
                toggleSelect(); syncUI(); playClick();
            };
        } else {
            btn.textContent = '📍 Выбрать'; btn.style.background = '';
            main.textContent = 'НАЙТИ АНОМАЛИЮ'; main.style.background = '';
            main.onclick = executeScan;
        }
        playClick();
    }

    // === АЛГОРИТМ ПРОВЕРКИ ТОЧЕК ===
    function validatePoint(osm, mode) {
        const addr = osm.address || {};
        const full = (Object.values(addr).join(' ') + ' ' + (osm.display_name || '')).toLowerCase();
        
        const has = arr => arr.some(k => full.includes(k));
        const bad = arr => arr.some(k => full.includes(k));
        
        if (mode === 'quantum') {
            if (bad(['house', 'residential', 'apartments', 'flat', 'hotel', 'hostel', 'school', 'kindergarten', 'hospital', 'clinic', 'shop', 'retail', 'supermarket', 'mall', 'cafe', 'restaurant', 'bar', 'pub', 'дом', 'жило', 'квартир', 'гостиниц', 'школа', 'детск', 'больниц', 'магазин', 'торг', 'кафе', 'ресторан'])) return false;
            const good = ['abandoned', 'ruin', 'industrial', 'factory', 'plant', 'warehouse', 'depot', 'hangar', 'garage', 'bunker', 'fortification', 'waste', 'dump', 'landfill', 'quarry', 'mine', 'construction', 'railway', 'station', 'track', 'заброшен', 'разруш', 'пром', 'завод', 'фабрик', 'склад', 'ангар', 'гараж', 'бункер', 'укреп', 'свалк', 'отход', 'карьер', 'шахта', 'строй', 'железнодорож', 'депо', 'платформ'];
            const isStruct = addr.building || addr.industrial || addr.amenity === 'parking' || ['industrial','man_made','railway'].includes(osm.category);
            return isStruct && has(good);
        }
        
        if (mode === 'void') {
            if (bad(['building', 'house', 'road', 'street', 'avenue', 'highway', 'motorway', 'city', 'town', 'village', 'district', 'quarter', 'building', 'здание', 'дом', 'улиц', 'проспект', 'шоссе', 'город', 'посёлок', 'район'])) return false;
            const good = ['park', 'forest', 'wood', 'meadow', 'field', 'grass', 'farmland', 'orchard', 'vineyard', 'allotments', 'nature_reserve', 'ravine', 'gully', 'valley', 'spring', 'stream', 'river', 'pond', 'lake', 'water', 'wetland', 'marsh', 'bog', 'cemetery', 'парк', 'лес', 'луг', 'поле', 'трава', 'сельхоз', 'сад', 'виноград', 'огород', 'заповед', 'овраг', 'балк', 'долин', 'родник', 'ручей', 'река', 'пруд', 'озеро', 'вода', 'болот', 'топь', 'кладбищ', 'некропол'];
            const isNature = addr.natural || addr.waterway || addr.leisure || ['forest','meadow','grass','farmland'].includes(addr.landuse) || ['natural','leisure','waterway'].includes(osm.category);
            return isNature && has(good);
        }
        
        if (mode === 'powerful') {
            return validatePoint(osm, 'quantum') || validatePoint(osm, 'void');
        }
        return false;
    }

    // === ПОИСК АНОМАЛИИ ===
    async function executeScan() {
        initAudio(); playClick();
        
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('scan-status').style.display = 'block';
        document.getElementById('searchPulse').style.display = 'block';
        
        const mode = document.getElementById('searchMode').value;
        const radius = parseFloat(document.getElementById('radiusIn').value);
        foundPower = parseInt(document.getElementById('powerIn').value);
        
        let found = null, attempts = 0, max = 120;
        
        while (!found && attempts < max) {
            attempts++;
            const ang = Math.random() * Math.PI * 2;
            const distDeg = (Math.sqrt(Math.random()) * radius) / 111;
            const pt = [searchOrigin[0] + distDeg * Math.cos(ang), searchOrigin[1] + distDeg * Math.sin(ang)];
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=17&addressdetails=1`, { headers: { 'User-Agent': 'KiwiWay/1.0' } });
                const data = await res.json();
                
                if (data && data.address) {
                    if (validatePoint(data, mode)) {
                        found = { coords: pt, data: data };
                    }
                }
            } catch(e) { console.log('Attempt', attempts, 'error'); }
        }
        
        // Фолбэк если не нашли
        if (!found) {
            const ang = Math.random() * Math.PI * 2;
            const distDeg = (radius * 0.75) / 111;
            found = { coords: [searchOrigin[0] + distDeg*Math.cos(ang), searchOrigin[1] + distDeg*Math.sin(ang)], data: { display_name: 'Неопознанная зона [' + mode.toUpperCase() + ']' } };
        }
        
        setTimeout(() => {
            document.getElementById('scan-status').style.display = 'none';
            document.getElementById('searchPulse').style.display = 'none';
            targetPoint = found.coords;
            startRadar();
            showTarget(found);
            playMystery();
            toast('Аномалия обнаружена!');
        }, 2400);
    }

    // === РАДАР ===
    function startRadar() {
        document.getElementById('radar-ui').style.display = 'block';
        document.getElementById('ui-found').style.display = 'block';
        
        clearInterval(radarInterval);
        radarInterval = setInterval(() => {
            if (!userPos || !targetPoint) return;
            const dist = getDistance(userPos, targetPoint);
            const maxR = document.getElementById('radiusIn').value * 1000;
            
            let base = Math.max(0, (1 - dist / maxR) * 100);
            let noise = (Math.random() - 0.5) * ((100 - foundPower) * 0.35);
            let signal = Math.max(0, Math.min(100, base + noise));
            
            if (foundPower > 75 && signal < 8 && dist < maxR * 0.25) signal = 12;
            
            document.getElementById('radar-arrow').style.transform = `translate(-50%,-100%) rotate(${signal * 3.6}deg)`;
            document.getElementById('signal-text').textContent = `СИГНАЛ: ${Math.round(signal)}%`;
            
            if (signal > 92) playClick(1100, 0.03);
        }, 550);
    }

    function showTarget(obj) {
        const mode = document.getElementById('searchMode');
        const modeName = mode.options[mode.selectedIndex].text;
        
        document.getElementById('infoBody').innerHTML = `<b>Тип:</b> ${modeName}<br><b>Мощность:</b> <span style="color:var(--ios-red)">${foundPower}%</span><br><b>Место:</b> ${obj.data.display_name}`;
        document.getElementById('coordsBox').textContent = `${targetPoint[1].toFixed(6)}, ${targetPoint[0].toFixed(6)}`;
        
        if (window.targetMarker) window.targetMarker.remove();
        const el = document.createElement('div');
        el.style.cssText = 'width:18px;height:18px;background:var(--ios-red);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 4px rgba(255,69,58,0.3),0 0 20px var(--ios-red);';
        window.targetMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(targetPoint).addTo(map);
        map.flyTo({ center: targetPoint, zoom: 16, duration: 1400 });
    }

    // === МАРШРУТ ===
    function buildRoute() {
        initAudio(); playClick();
        const profile = currentMapStyle === 'sat' ? 'driving' : 'foot';
        const url = `https://router.project-osrm.org/route/v1/${profile}/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`;
        
        fetch(url).then(r => r.json()).then(data => {
            if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
            if (data.code === 'Ok') {
                map.addSource('route', { type: 'geojson', data: data.routes[0].geometry });
                map.addLayer({
                    id: 'route', type: 'line', source: 'route',
                    paint: { 'line-color': currentMapStyle === 'sat' ? '#30D158' : '#0A84FF', 'line-width': 5, 'line-cap': 'round' }
                });
                toast(profile === 'driving' ? '🚗 Маршрут построен' : '🚶 Пеший маршрут');
            } else { toast('❌ Путь не найден'); }
        }).catch(() => toast('⚠️ Ошибка маршрута'));
    }

    // === СБРОС ===
    function resetSystem() {
        clearInterval(radarInterval);
        if (window.targetMarker) window.targetMarker.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        document.getElementById('radar-ui').style.display = 'none';
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        map.flyTo({ center: searchOrigin, zoom: 12, duration: 1000 });
        playClick(380, 0.04);
    }

    function copyCoords() {
        navigator.clipboard.writeText(document.getElementById('coordsBox').textContent);
        toast('📋 Скопировано'); playClick();
    }

    // === ВСПОМОГАТЕЛЬНЫЕ ===
    function genCircle(c, km) {
        const pts = [], steps = 64;
        const dx = km / (111.32 * Math.cos(c[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i <= steps; i++) {
            const a = (i / steps) * Math.PI * 2;
            pts.push([c[0] + dx * Math.cos(a), c[1] + dy * Math.sin(a)]);
        }
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] } };
    }

    function getDistance(p1, p2) {
        const R = 6371000;
        const dLat = (p2[1]-p1[1]) * Math.PI/180;
        const dLon = (p2[0]-p1[0]) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1[1]*Math.PI/180)*Math.cos(p2[1]*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // === ОБРАБОТЧИКИ ===
    map.on('click', e => {
        if (isSelecting) {
            searchOrigin = [e.lngLat.lng, e.lngLat.lat];
            toggleSelect(); syncUI(); playClick();
        }
    });

    // === ЗАПУСК ===
    window.addEventListener('load', () => {
        initGeolocation();
        // Предзагрузка аудио по первому касанию
        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('click', initAudio, { once: true });
    });
</script>

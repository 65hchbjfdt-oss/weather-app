<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KiwiWay</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  background:black;
  color:white;
  overflow:hidden;
}

#map {height:100vh;width:100%;}

/* Liquid Glass Bottom Panel */
.glass{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:440px;
  padding:18px;
  border-radius:28px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.10);
  box-shadow:0 0 35px rgba(0,0,0,0.9);
  z-index:999;
}

.glass h2{
  margin:0;
  font-size:18px;
  text-align:center;
  font-weight:600;
  letter-spacing:0.5px;
}

/* Buttons */
.btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:18px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  background:rgba(120,0,255,0.80);
  color:white;
  transition:transform 0.15s ease, background 0.25s;
}

.btn:active{
  transform:scale(0.96);
}

.btn.secondary{
  background:rgba(255,255,255,0.12);
}

/* Scan animation */
#scanBox{
  display:none;
  margin-top:14px;
  text-align:center;
  font-size:14px;
  opacity:0.8;
  animation:fadeIn 0.4s ease;
}

.pulse{
  width:22px;
  height:22px;
  margin:12px auto;
  border-radius:50%;
  background:violet;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);opacity:0.3;}
  50%{transform:scale(2.4);opacity:1;}
  100%{transform:scale(1);opacity:0.3;}
}

/* Modals */
.modal{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:420px;
  padding:18px;
  border-radius:26px;
  backdrop-filter:blur(25px);
  background:rgba(20,20,20,0.75);
  box-shadow:0 0 30px rgba(0,0,0,0.9);
  z-index:2000;
  opacity:0;
  pointer-events:none;
  transition:0.35s ease;
}

.modal.show{
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}

#settingsModal{top:15px;}
#infoModal{top:25%;}

label{
  display:block;
  margin-top:12px;
  font-size:14px;
  opacity:0.85;
}

input[type=range]{
  width:100%;
  margin-top:6px;
}

#log{
  margin-top:12px;
  max-height:80px;
  overflow-y:auto;
  font-size:13px;
  opacity:0.85;
}
#log::-webkit-scrollbar{display:none;}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
</style>
</head>
<body>

<div id="map"></div>

<!-- SETTINGS -->
<div class="modal" id="settingsModal">
<h2>⚙ Настройки</h2>
<label>Степень аномалии: <span id="anomValue">5</span></label>
<input type="range" min="1" max="10" value="5" id="anomSlider">

<label>Категория:</label>
<select id="category">
  <option value="Пустота">Пустота</option>
  <option value="Квантовая">Квантовая</option>
  <option value="Мощная">Мощная</option>
  <option value="Псевдо">Псевдо</option>
</select>

<button class="btn secondary" onclick="toggleSettings(false)">Закрыть</button>
</div>

<!-- INFO -->
<div class="modal" id="infoModal"></div>

<!-- PANEL -->
<div class="glass">
<h2>☢ KiwiWay</h2>
<button class="btn secondary" onclick="toggleSettings(true)">⚙ Настройки</button>
<button class="btn" onclick="scan()">🔍 Сканировать</button>
<button class="btn secondary" onclick="showInfoButton()">ℹ Показать информацию</button>
<button class="btn" onclick="startNavigation()">🚶 Навигация</button>

<div id="scanBox"><div class="pulse"></div>Поиск аномалий...</div>
<div id="log"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
let map,userMarker,anomalyMarker=null,anomalyData=null,routeControl=null;

/* Slider label update */
const slider=document.getElementById("anomSlider");
const sliderLabel=document.getElementById("anomValue");
slider.oninput=()=>sliderLabel.innerText=slider.value;

/* Log */
function log(msg){document.getElementById("log").innerHTML+="➤ "+msg+"<br>";}

/* Modals */
function toggleSettings(open){document.getElementById("settingsModal").classList.toggle("show",open);}
function toggleInfo(open){document.getElementById("infoModal").classList.toggle("show",open);}

/* Init Map */
navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude,lon=pos.coords.longitude;
  map=L.map("map").setView([lat,lon],14);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png").addTo(map);
  userMarker=L.circleMarker([lat,lon],{radius:10,color:"cyan",fillOpacity:1}).addTo(map);
  log("Система активирована. Ты в зоне.");
});

/* Reverse geocode */
async function getAddress(lat,lon){
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
    const data=await res.json();
    return data.display_name;
  }catch{return "";}
}

/* Complex Safe Point Generator */
async function generateSafePoint(baseLat,baseLon){
  const maxAttempts=30;
  for(let i=0;i<maxAttempts;i++){
    const angle=Math.random()*2*Math.PI;
    const dist=Math.random()*5+1;
    const lat=baseLat+(dist*Math.cos(angle))/111;
    const lon=baseLon+(dist*Math.sin(angle))/111;
    const resp=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
    const data=await resp.json();
    if(!data || !data.address) continue;
    if(data.address.water || data.address.forest || data.address.private) continue;
    return {lat,lon,address:data.display_name};
  }
  return null;
}

/* Scan */
async function scan(){
  if(!map) return;
  document.getElementById("scanBox").style.display="block";
  if(anomalyMarker) map.removeLayer(anomalyMarker);
  anomalyData=null;
  log("Сканирование...");

  const base=userMarker.getLatLng();
  const degree=parseInt(slider.value);
  const category=document.getElementById("category").value;

  const point=await generateSafePoint(base.lat,base.lng);
  if(!point){log("Не удалось найти безопасную точку."); return;}

  anomalyData={...point,category,power:degree};

  anomalyMarker=L.circleMarker([point.lat,point.lon],{
    radius:12,
    color:degree>=7?"red":"orange",
    fillOpacity:0.85
  }).addTo(map);

  document.getElementById("scanBox").style.display="none";
  log(`Аномалия ${category} обнаружена!`);
}

/* Info Button */
async function showInfoButton(){
  if(!anomalyData){log("Сначала сканируй!"); return;}
  const modal=document.getElementById("infoModal");
  modal.innerHTML=`<h2>${anomalyData.category}</h2>
<p>⚠ Сила: ${anomalyData.power}/10</p>
<p>📍 Координаты:<br>${anomalyData.lat.toFixed(5)},${anomalyData.lon.toFixed(5)}</p>
<p style="opacity:0.8;font-size:13px;">🏙 Адрес:<br>${anomalyData.address}</p>
<button class="btn secondary" onclick="toggleInfo(false)">Закрыть</button>`;
  toggleInfo(true);
}

/* Navigation */
function startNavigation(){
  if(!anomalyData){log("Нет выбранной цели."); return;}
  if(routeControl) map.removeControl(routeControl);
  log("Построение маршрута...");

  routeControl=L.Routing.control({
    waypoints:[userMarker.getLatLng(),L.latLng(anomalyData.lat,anomalyData.lon)],
    lineOptions:{styles:[{color:"cyan",weight:5}]},
    addWaypoints:false,
    draggableWaypoints:false,
    routeWhileDragging:false,
    createMarker:()=>null
  }).addTo(map);

  log("Навигация активна. Твоя точка следует за тобой.");
}

/* Follow user dynamically */
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    if(!userMarker) return;
    const lat=pos.coords.latitude,lon=pos.coords.longitude;
    userMarker.setLatLng([lat,lon]);
  });
}
</script>
</body>
</html>

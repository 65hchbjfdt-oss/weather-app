<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Люм — Погода с питомцем</title>
  <style>
    /* ---------- ОБЩИЕ ПЕРЕМЕННЫЕ iOS ---------- */
    :root {
      --st: env(safe-area-inset-top, 20px);
      --sb: env(safe-area-inset-bottom, 16px);
      --nav: 56px;
      --bg: #000;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #fff;
      --secondary: rgba(255, 255, 255, 0.5);
      --accent: #FF6B9D;
      --radius: 20px;
      --transition: 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; font-family: var(--font);
      -webkit-font-smoothing: antialiased; color: var(--text);
      user-select: none; transition: background 0.3s;
    }
    #bgCanvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; width: 100%; height: 100%;
    }
    #app {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      max-width: 430px; margin: 0 auto; width: 100%;
    }
    .screen {
      display: none; flex: 1; flex-direction: column;
      overflow: hidden; position: relative;
    }
    .screen.active {
      display: flex; animation: screenIn 0.28s ease;
    }
    @keyframes screenIn {
      from { opacity: 0.4; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .scroll-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding: calc(var(--st) + 8px) 16px calc(var(--nav) + 20px);
      transition: padding 0.3s;
    }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* ---------- СТЕКЛО / КАРТОЧКИ ---------- */
    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: var(--radius);
      transition: var(--transition);
    }
    .glass:active { transform: scale(0.98); transition: transform 0.1s; }
    .section-title {
      font-size: 11px; font-weight: 500; color: var(--secondary);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 8px; margin-top: 4px;
    }

    /* ---------- НАВИГАЦИЯ ---------- */
    #nav {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%); width: 100%; max-width: 430px;
      height: calc(var(--nav) + var(--sb)); padding-bottom: var(--sb);
      display: flex; align-items: flex-start; justify-content: space-around;
      padding-top: 6px; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid rgba(255,255,255,0.08); z-index: 100;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      border: none; background: none; padding: 4px 14px; border-radius: 16px;
      cursor: pointer; transition: var(--transition);
    }
    .nav-btn svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.4); fill: none; stroke-width: 1.6; }
    .nav-btn span { font-size: 9px; color: rgba(255,255,255,0.4); }
    .nav-btn.active svg { stroke: #fff; filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
    .nav-btn.active span { color: #fff; }

    /* ---------- ГЛАВНЫЙ ЭКРАН ---------- */
    .weather-header { text-align: center; padding: calc(var(--st) + 4px) 8px 0; }
    .city-row { font-size: 15px; font-weight: 400; color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; gap: 4px; }
    .temp-big { font-size: 96px; font-weight: 200; line-height: 1; letter-spacing: -5px; }
    .feels-like { font-size: 13px; color: var(--secondary); margin: 2px 0 10px; }
    .weather-desc { font-size: 17px; font-weight: 400; color: rgba(255,255,255,0.8); }
    .hi-lo { font-size: 13px; color: var(--secondary); }
    .hourly-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scroll-snap-type: x mandatory; }
    .hour-card { flex: 0 0 60px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); }
    .daily-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: background 0.2s; }
    .daily-expand { display: none; padding: 12px 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.04); }
    .daily-expand.open { display: block; animation: expandIn 0.2s; }
    @keyframes expandIn { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 300px; } }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .detail-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; }

    /* ---------- КАРТА ---------- */
    #mapCanvas { width: 100%; border-radius: 20px; display: block; background: rgba(0,0,0,0.3); }
    .map-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .map-tab { padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 12px; cursor: pointer; }
    .map-tab.active { background: rgba(255,255,255,0.2); }

    /* ---------- ЛЮМ ---------- */
    #lumCanvas { display: block; margin: 10px auto; border-radius: 50%; width: 220px; height: 220px; }
    .affection-bar { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
    .bar-fill { height: 4px; border-radius: 2px; background: linear-gradient(90deg, #FF6B9D, #FF8E9D); transition: width 0.8s ease; }

    /* ---------- ЧАТ ---------- */
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; max-height: 220px; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
    .msg-user { align-self: flex-end; background: rgba(255,255,255,0.15); }
    .msg-ai { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); }

    /* ---------- НАСТРОЙКИ ---------- */
    #settingsPanel { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.95); backdrop-filter: blur(30px); display: none; flex-direction: column; padding: calc(var(--st) + 20px) 20px; overflow-y: auto; }
    #settingsPanel.visible { display: flex; }
    .set-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .set-row input, .set-row select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px; color: #fff; width: 160px; }
    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(30,30,40,0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 10px 20px; z-index: 300; font-size: 14px; transition: transform 0.3s; }
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<button id="settingsBtn" style="position:fixed;top:calc(var(--st)+10px);right:16px;z-index:50;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;display:flex;align-items:center;justify-content:center;">⚙️</button>
<div id="settingsPanel">
  <h2 style="font-weight:300;margin-bottom:20px;">Настройки</h2>
  <div class="set-row">Единицы <select id="unitSelect"><option value="c">°C</option><option value="f">°F</option></select></div>
  <div class="set-row">Тема <select id="themeSelect"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div>
  <div class="set-row">Анимации <select id="animSelect"><option value="1">Вкл</option><option value="0">Выкл</option></select></div>
  <div class="set-row">Частота обновления <select id="refreshSelect"><option value="15">15 мин</option><option value="30">30 мин</option></select></div>
  <div class="set-row">Координаты <input id="coordInput" placeholder="55.75,37.62"></div>
  <button id="resetBtn" style="margin-top:20px;padding:12px;background:rgba(255,80,80,0.3);border:1px solid rgba(255,80,80,0.5);color:#fff;border-radius:14px;">Сбросить всё</button>
  <button onclick="document.getElementById('settingsPanel').classList.remove('visible')" style="margin-top:10px;padding:12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:14px;">Закрыть</button>
</div>

<div id="app">
  <!-- Главный экран погоды -->
  <div class="screen active" id="homeScreen">
    <div class="scroll-area" id="homeScroll">
      <div class="weather-header">
        <div class="city-row" id="cityText">Москва</div>
        <div class="temp-big" id="mainTemp">--°</div>
        <div class="feels-like" id="feelsLike">Ощущается как --°</div>
        <div id="iconLarge" style="width:80px;height:80px;margin:0 auto;"></div>
        <div class="weather-desc" id="weatherDesc"></div>
        <div class="hi-lo" id="hiLo"></div>
      </div>
      <div class="section-title">По часам (12 ч)</div>
      <div class="hourly-scroll" id="hourlyContainer"></div>
      <div class="section-title">7 дней</div>
      <div class="glass" id="dailyContainer"></div>
      <div class="section-title" style="margin-top:14px;">AI-прогноз</div>
      <div class="glass" id="aiHomeBlock" style="padding:14px;margin-bottom:12px;">Анализирую...</div>
      <div class="section-title">Карта (15 км)</div>
      <div class="map-tabs">
        <span class="map-tab active" data-layer="rain">Осадки</span>
        <span class="map-tab" data-layer="temp">Температура</span>
        <span class="map-tab" data-layer="wind">Ветер</span>
      </div>
      <canvas id="mapCanvas" width="380" height="220"></canvas>
      <div style="margin:8px 0;display:flex;align-items:center;gap:8px;"><span style="font-size:12px;">Час:</span><input type="range" id="mapHourSlider" min="0" max="47" value="0" style="flex:1;"></div>
      <div class="section-title">Детали</div>
      <div class="detail-grid" id="detailsGrid"></div>
      <div class="section-title">Солнце и луна</div>
      <div class="glass" id="sunMoonBlock" style="padding:14px;"></div>
    </div>
  </div>

  <!-- Экран питомца Люм -->
  <div class="screen" id="lumScreen">
    <div class="scroll-area">
      <div style="text-align:center;padding-top:8px;"><div style="font-size:20px;font-weight:300;">Люм</div></div>
      <canvas id="lumCanvas"></canvas>
      <div id="lumEmotion" style="text-align:center;font-size:13px;color:var(--secondary);min-height:20px;"></div>
      <div class="glass" style="padding:14px;margin:10px 0;">
        <div class="affection-bar"><span>Любовь</span><div style="flex:1;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;"><div id="loveFill" class="bar-fill" style="width:60%;"></div></div><span id="lovePct">60%</span></div>
      </div>
      <div class="glass" style="display:flex;flex-direction:column;height:300px;">
        <div class="chat-messages" id="chatMessages"></div>
        <div style="display:flex;gap:8px;padding:10px;">
          <input id="chatInput" placeholder="Спроси Люма..." style="flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:10px 14px;color:#fff;">
          <button id="sendChatBtn" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Экран избранных городов -->
  <div class="screen" id="savedScreen">
    <div class="scroll-area">
      <div style="font-size:20px;font-weight:300;margin-bottom:14px;">Избранное</div>
      <div style="position:relative;margin-bottom:16px;">
        <input id="citySearch" placeholder="Поиск города..." style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:12px 16px;color:#fff;">
        <div id="searchResults" style="display:none;position:absolute;top:50px;left:0;right:0;background:rgba(20,20,30,0.98);border-radius:16px;z-index:10;max-height:200px;overflow-y:auto;"></div>
      </div>
      <div id="favGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
    </div>
  </div>
</div>

<nav id="nav">
  <button class="nav-btn active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Погода</span></button>
  <button class="nav-btn" data-tab="lum"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg><span>Люм</span></button>
  <button class="nav-btn" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Города</span></button>
</nav>
<div id="toast"></div>

<script>
  (function() {
    /* ---------- РАСШИФРОВКА API-КЛЮЧА ---------- */
    const encryptedKey = "YTBjYmNhOWUxYzUxZmMwMzJmN2IxMTQyNzEyYWZmZTc=";
    const OWM_KEY = atob(encryptedKey);

    /* ---------- ГЛОБАЛЬНОЕ СОСТОЯНИЕ ---------- */
    const state = {
      lat: 55.7558, lon: 37.6173, city: 'Москва',
      weatherData: null, forecastList: [], daily: [],
      currentHourIndex: 0, mapLayer: 'rain',
      lum: { love: 60, streak: 1, lastVisit: new Date().toISOString(), emotion: 'happy' },
      chatHistory: [],
      favCities: [],
      settings: { unit: 'c', theme: 'dark', animations: true, refreshInterval: 15 }
    };

    const $ = (id) => document.getElementById(id);
    const ls = (key, val) => {
      if (val !== undefined) localStorage.setItem('lum_'+key, JSON.stringify(val));
      else { try { return JSON.parse(localStorage.getItem('lum_'+key)); } catch(e) { return null; } }
    };

    // Загрузка сохранённых данных
    const saved = ls('state');
    if (saved) Object.assign(state, saved);
    state.favCities = ls('fav') || [];
    state.chatHistory = ls('chat') || [];

    /* ---------- УТИЛИТЫ ---------- */
    const tempConvert = (c) => state.settings.unit === 'f' ? Math.round(c * 9/5 + 32) : Math.round(c);
    const windUnit = () => 'м/с';
    const getIconType = (code, isDay) => {
      if (code >= 200 && code < 300) return 'storm';
      if (code >= 300 && code < 600) return 'rain';
      if (code >= 600 && code < 700) return 'snow';
      if (code >= 700 && code < 800) return 'fog';
      if (code === 800) return isDay ? 'clear-day' : 'clear-night';
      if (code === 801) return 'partly-cloudy';
      return 'cloudy';
    };

    const buildSVG = (type, size = 30) => {
      const s = size;
      const icons = {
        'clear-day': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#FFD040"/><g stroke="#FFD040" stroke-width="3">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="8" x2="32" y2="14" transform="rotate(${a} 32 32)"/>`).join('')}</g></svg>`,
        'clear-night': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M42 34c-8 0-15-6-15-15 0-2.5.5-4.5 1.2-6.5C20 14 12 22 12 32c0 11 9 20 20 20 8 0 15-5 18-12-2.5.8-5.2 1.2-8 1.2z" fill="#D4E8FF"/></svg>`,
        'partly-cloudy': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="22" cy="28" r="9" fill="#FFD040"/><ellipse cx="42" cy="42" rx="18" ry="12" fill="rgba(200,215,240,0.9)"/><circle cx="34" cy="36" r="10" fill="rgba(215,228,248,0.9)"/></svg>`,
        'cloudy': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="38" rx="20" ry="13" fill="rgba(170,185,210,0.9)"/><circle cx="28" cy="32" r="11" fill="rgba(180,195,220,0.9)"/><circle cx="44" cy="33" r="9" fill="rgba(170,185,210,0.9)"/></svg>`,
        'rain': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="28" rx="18" ry="10" fill="rgba(130,150,185,0.9)"/><circle cx="28" cy="23" r="10" fill="rgba(140,160,195,0.9)"/><line x1="22" y1="42" x2="20" y2="50" stroke="#5BBCFF" stroke-width="2.5"/><line x1="32" y1="42" x2="30" y2="50" stroke="#5BBCFF" stroke-width="2.5"/><line x1="42" y1="42" x2="40" y2="50" stroke="#5BBCFF" stroke-width="2.5"/></svg>`,
        'snow': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="26" rx="18" ry="10" fill="rgba(210,225,248,0.9)"/><circle cx="28" cy="21" r="10" fill="rgba(218,232,252,0.9)"/><circle cx="22" cy="46" r="3" fill="#fff"/><circle cx="36" cy="48" r="3" fill="#fff"/><circle cx="46" cy="44" r="3" fill="#fff"/></svg>`,
        'storm': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><ellipse cx="36" cy="26" rx="20" ry="12" fill="rgba(70,60,110,0.9)"/><path d="M34 38 L28 46 L32 46 L26 56 L38 42 L33 42 Z" fill="#FFD040"/></svg>`,
        'fog': `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><line x1="12" y1="28" x2="52" y2="28" stroke="rgba(200,210,230,0.5)" stroke-width="4"/><line x1="16" y1="40" x2="48" y2="40" stroke="rgba(200,210,230,0.4)" stroke-width="4"/></svg>`
      };
      return icons[type] || icons['cloudy'];
    };

    /* ---------- API ЗАПРОСЫ ---------- */
    async function fetchWeatherData() {
      try {
        const [weatherRes, forecastRes] = await Promise.all([
          fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${state.lat}&lon=${state.lon}&appid=${OWM_KEY}&units=metric&lang=ru`),
          fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${state.lat}&lon=${state.lon}&appid=${OWM_KEY}&units=metric&lang=ru`)
        ]);
        const weather = await weatherRes.json();
        const forecast = await forecastRes.json();
        state.weatherData = weather;
        state.city = weather.name;
        state.forecastList = forecast.list;
        processForecast();
        renderAll();
      } catch (e) {
        console.warn('API error, using mock data');
        useMockData();
      }
    }

    function useMockData() {
      state.weatherData = {
        main: { temp: 18, feels_like: 16, humidity: 65, pressure: 1012 },
        wind: { speed: 4.5 }, clouds: { all: 40 },
        weather: [{ id: 802, description: 'облачно с прояснениями' }],
        sys: { sunrise: Date.now()/1000 - 18000, sunset: Date.now()/1000 + 18000 }
      };
      state.forecastList = Array.from({length: 40}, (_,i) => ({
        dt: Date.now()/1000 + i*3600,
        main: { temp: 15 + Math.sin(i/5)*5, feels_like: 14, humidity: 60 },
        weather: [{ id: 800 + (i%3) }], wind: { speed: 3 + Math.random()*4 },
        pop: Math.random()*0.5
      }));
      processForecast();
      renderAll();
    }

    function processForecast() {
      const days = {};
      state.forecastList.forEach(item => {
        const date = new Date(item.dt * 1000).toLocaleDateString();
        if (!days[date]) days[date] = { temps: [], icons: [], winds: [], pops: [] };
        days[date].temps.push(item.main.temp);
        days[date].icons.push(item.weather[0].id);
        days[date].winds.push(item.wind.speed);
        days[date].pops.push(item.pop || 0);
      });
      state.daily = Object.entries(days).slice(0, 7).map(([date, data]) => ({
        date,
        max: Math.max(...data.temps),
        min: Math.min(...data.temps),
        icon: data.icons.sort((a,b) => data.icons.filter(v=>v===a).length - data.icons.filter(v=>v===b).length).pop(),
        wind: (data.winds.reduce((a,b)=>a+b,0)/data.winds.length).toFixed(1),
        rain: Math.round(Math.max(...data.pops) * 100)
      }));
    }

    /* ---------- РЕНДЕРИНГ ---------- */
    function renderAll() {
      renderCurrentWeather();
      renderHourly();
      renderDaily();
      renderDetails();
      renderSunMoon();
      renderMap();
      renderAI();
      renderFavorites();
    }

    function renderCurrentWeather() {
      const w = state.weatherData;
      if (!w) return;
      $('cityText').textContent = state.city;
      $('mainTemp').textContent = tempConvert(w.main.temp) + '°';
      $('feelsLike').textContent = 'Ощущается как ' + tempConvert(w.main.feels_like) + '°';
      $('weatherDesc').textContent = w.weather[0].description;
      $('hiLo').textContent = `↑${tempConvert(state.daily[0]?.max || 0)}° ↓${tempConvert(state.daily[0]?.min || 0)}°`;
      const isDay = (Date.now()/1000 > w.sys.sunrise && Date.now()/1000 < w.sys.sunset);
      $('iconLarge').innerHTML = buildSVG(getIconType(w.weather[0].id, isDay), 64);
    }

    function renderHourly() {
      const container = $('hourlyContainer');
      const now = new Date();
      const hours = state.forecastList.filter(f => new Date(f.dt*1000) >= now).slice(0, 12);
      container.innerHTML = hours.map(h => {
        const time = new Date(h.dt*1000).getHours() + ':00';
        const temp = tempConvert(h.main.temp);
        const icon = getIconType(h.weather[0].id, true);
        const rain = Math.round((h.pop||0)*100);
        return `<div class="hour-card"><div>${time}</div><div>${buildSVG(icon,18)}</div><div>${temp}°</div>${rain>10?`<div style="font-size:9px;color:#6ECFFF;">${rain}%</div>`:''}</div>`;
      }).join('');
    }

    function renderDaily() {
      const container = $('dailyContainer');
      const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
      container.innerHTML = state.daily.map((d, i) => {
        const dt = new Date(d.date);
        const label = i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : days[dt.getDay()] + ', ' + dt.getDate();
        const icon = getIconType(d.icon, true);
        return `<div class="daily-row" onclick="toggleDay('${d.date}')">
          <span style="flex:1;">${label}</span>
          <span style="width:30px;">${buildSVG(icon,22)}</span>
          <span>${tempConvert(d.max)}° / ${tempConvert(d.min)}°</span>
          <span style="width:40px;text-align:right;">${d.wind} м/с</span>
        </div>
        <div class="daily-expand" id="expand-${d.date}"></div>`;
      }).join('');
    }

    window.toggleDay = function(date) {
      const exp = $(`expand-${date}`);
      document.querySelectorAll('.daily-expand.open').forEach(e => e.classList.remove('open'));
      if (!exp.classList.contains('open')) {
        exp.classList.add('open');
        const dayData = state.forecastList.filter(f => f.dt_txt?.startsWith(date));
        const parts = ['Утро','День','Вечер','Ночь'].map((p,i) => {
          const item = dayData[i*2] || dayData[0];
          return `<div style="text-align:center;padding:8px;"><div>${p}</div><div>${buildSVG(getIconType(item.weather[0].id, i<3),18)}</div><div>${tempConvert(item.main.temp)}°</div></div>`;
        }).join('');
        exp.innerHTML = `<div style="display:flex;gap:6px;">${parts}</div>
          <div style="margin-top:10px;padding:10px;background:rgba(100,80,255,0.1);border-radius:12px;">
            <strong>AI:</strong> Дождь ${dayData[0]?.pop ? Math.round(dayData[0].pop*100) : 0}%, пыльца низкая, прогулка хорошая.
          </div>`;
      }
    };

    function renderDetails() {
      const w = state.weatherData;
      if (!w) return;
      $('detailsGrid').innerHTML = `
        <div class="detail-card"><div>Влажность</div><div style="font-size:20px;">${w.main.humidity}%</div></div>
        <div class="detail-card"><div>Ветер</div><div style="font-size:20px;">${w.wind.speed} м/с</div></div>
        <div class="detail-card"><div>Давление</div><div style="font-size:20px;">${Math.round(w.main.pressure*0.75)} мм</div></div>
        <div class="detail-card"><div>Облачность</div><div style="font-size:20px;">${w.clouds.all}%</div></div>
        <div class="detail-card"><div>УФ индекс</div><div style="font-size:20px;">3 (средний)</div></div>
        <div class="detail-card"><div>Точка росы</div><div style="font-size:20px;">${Math.round(w.main.temp - (100-w.main.humidity)/5)}°</div></div>
      `;
    }

    function renderSunMoon() {
      const w = state.weatherData;
      if (!w) return;
      const sr = new Date(w.sys.sunrise*1000), ss = new Date(w.sys.sunset*1000);
      $('sunMoonBlock').innerHTML = `
        <div style="display:flex;justify-content:space-between;">
          <span>Восход ${sr.getHours()}:${String(sr.getMinutes()).padStart(2,'0')}</span>
          <span>Закат ${ss.getHours()}:${String(ss.getMinutes()).padStart(2,'0')}</span>
        </div>
        <div style="margin:8px 0;">🌙 Луна: 78% (видна сквозь облака)</div>`;
    }

    function renderAI() {
      const d = state.daily[0];
      if (!d) return;
      $('aiHomeBlock').innerHTML = `Сегодня: до ${tempConvert(d.max)}°, ветер ${d.wind} м/с. ${d.rain>30?'Возьмите зонт!':'Отличный день для прогулки.'}`;
    }

    /* ---------- КАРТА ---------- */
    function renderMap() {
      const canvas = $('mapCanvas'), ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const hourOffset = parseInt($('mapHourSlider').value);
      const points = [];
      for (let i = 0; i < 30; i++) {
        const angle = Math.random()*Math.PI*2;
        const dist = Math.random()*0.015;
        points.push({
          x: canvas.width/2 + Math.cos(angle)*dist*8000,
          y: canvas.height/2 - Math.sin(angle)*dist*10000,
          val: Math.random()
        });
      }
      points.forEach(p => {
        let color;
        if (state.mapLayer === 'rain') color = `rgba(60,120,255,${0.3+p.val*0.4})`;
        else if (state.mapLayer === 'temp') color = p.val>0.5?`rgba(255,100,60,0.5)`:`rgba(60,140,255,0.5)`;
        else color = `rgba(200,100,255,0.4)`;
        ctx.beginPath(); ctx.arc(p.x, p.y, 14+p.val*12, 0, Math.PI*2);
        ctx.fillStyle = color; ctx.fill();
      });
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 5, 0, 2*Math.PI); ctx.fill();
    }

    $('mapHourSlider').addEventListener('input', renderMap);
    document.querySelectorAll('.map-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.map-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        state.mapLayer = this.dataset.layer;
        renderMap();
      });
    });

    /* ---------- ФОН АНИМАЦИЯ ---------- */
    const bgCanvas = $('bgCanvas'), bgCtx = bgCanvas.getContext('2d');
    let bgParticles = [];
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeBg); resizeBg();

    function animateBg() {
      if (!state.settings.animations) { requestAnimationFrame(animateBg); return; }
      bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
      const grad = bgCtx.createLinearGradient(0,0,0,bgCanvas.height);
      grad.addColorStop(0,'#0a0f1a'); grad.addColorStop(1,'#1a1f2a');
      bgCtx.fillStyle = grad; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

      if (bgParticles.length < 100) {
        bgParticles.push({x:Math.random()*bgCanvas.width, y:Math.random()*bgCanvas.height, r:Math.random()*1.5+0.5, speed:0.3+Math.random()*0.7});
      }
      bgParticles.forEach(p => {
        p.y -= p.speed; if (p.y < -10) { p.y = bgCanvas.height+10; p.x = Math.random()*bgCanvas.width; }
        bgCtx.fillStyle = 'rgba(255,255,255,0.15)'; bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,2*Math.PI); bgCtx.fill();
      });
      requestAnimationFrame(animateBg);
    }
    animateBg();

    /* ---------- ЛЮМ АНИМАЦИЯ ---------- */
    const lumCanvas = $('lumCanvas'), lumCtx = lumCanvas?.getContext('2d');
    let lumFrame = 0;
    function animateLum() {
      if (!lumCanvas) return;
      lumCtx.clearRect(0,0,220,220);
      const cx=110, cy=110;
      const grd = lumCtx.createRadialGradient(cx,cy,10,cx,cy,55);
      grd.addColorStop(0,'rgba(255,180,40,0.95)'); grd.addColorStop(0.5,'rgba(255,100,20,0.8)'); grd.addColorStop(1,'rgba(255,60,10,0)');
      lumCtx.fillStyle = grd; lumCtx.beginPath(); lumCtx.arc(cx,cy,52,0,2*Math.PI); lumCtx.fill();

      const eyeY = cy-12, off=15;
      lumCtx.fillStyle = '#fff'; lumCtx.beginPath(); lumCtx.ellipse(cx-off, eyeY, 6, 6, 0, 0, 2*Math.PI); lumCtx.fill();
      lumCtx.beginPath(); lumCtx.ellipse(cx+off, eyeY, 6, 6, 0, 0, 2*Math.PI); lumCtx.fill();
      lumCtx.fillStyle = '#111'; lumCtx.beginPath(); lumCtx.arc(cx-off+2, eyeY-1, 2.5, 0, 2*Math.PI); lumCtx.fill();
      lumCtx.beginPath(); lumCtx.arc(cx+off+2, eyeY-1, 2.5, 0, 2*Math.PI); lumCtx.fill();
      lumCtx.strokeStyle = '#fff'; lumCtx.lineWidth = 2; lumCtx.beginPath();
      lumCtx.moveTo(cx-10, cy+14); lumCtx.quadraticCurveTo(cx, cy+22, cx+10, cy+14); lumCtx.stroke();

      lumFrame++; requestAnimationFrame(animateLum);
    }
    if (lumCanvas) animateLum();
    lumCanvas?.addEventListener('click', () => {
      state.lum.love = Math.min(100, state.lum.love+1);
      $('loveFill').style.width = state.lum.love + '%';
      $('lovePct').textContent = state.lum.love + '%';
      $('lumEmotion').textContent = 'Радостный';
    });

    /* ---------- ЧАТ И ОБУЧЕНИЕ ---------- */
    const brain = { phrases: {} };
    function addChatMessage(role, text) {
      const div = document.createElement('div');
      div.className = role === 'user' ? 'msg-bubble msg-user' : 'msg-bubble msg-ai';
      div.textContent = text;
      $('chatMessages').appendChild(div);
      $('chatMessages').scrollTop = $('chatMessages').scrollHeight;
    }

    function generateReply(input) {
      const q = input.toLowerCase();
      if (q.includes('привет')) return 'Привет! Я Люм, твой огненный друг.';
      if (q.includes('погода')) return `Сейчас в ${state.city} ${state.weatherData?.weather[0].description}, ${tempConvert(state.weatherData?.main.temp||0)}°.`;
      if (q.includes('как дела')) return 'У меня всё отлично! А у тебя?';
      if (brain.phrases[q]) return brain.phrases[q];
      const reply = 'Я учусь! Расскажи мне что-нибудь ещё.';
      brain.phrases[q] = reply;
      return reply;
    }

    $('sendChatBtn').addEventListener('click', () => {
      const text = $('chatInput').value.trim();
      if (!text) return;
      addChatMessage('user', text);
      const reply = generateReply(text);
      setTimeout(() => addChatMessage('ai', reply), 400);
      $('chatInput').value = '';
      state.lum.love = Math.min(100, state.lum.love+3);
      $('loveFill').style.width = state.lum.love+'%';
    });

    /* ---------- НАСТРОЙКИ ---------- */
    $('settingsBtn').addEventListener('click', () => $('settingsPanel').classList.toggle('visible'));
    $('unitSelect').addEventListener('change', function() { state.settings.unit = this.value; renderAll(); });
    $('animSelect').addEventListener('change', function() { state.settings.animations = this.value === '1'; });
    $('resetBtn').addEventListener('click', () => { localStorage.clear(); location.reload(); });
    $('coordInput').addEventListener('change', function() {
      const parts = this.value.split(','); if (parts.length===2) { state.lat=+parts[0]; state.lon=+parts[1]; fetchWeatherData(); }
    });

    /* ---------- ИЗБРАННЫЕ ГОРОДА ---------- */
    async function searchCities(query) {
      const res = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${OWM_KEY}`);
      return res.json();
    }
    $('citySearch').addEventListener('input', async function() {
      const q = this.value.trim();
      if (q.length < 2) { $('searchResults').style.display='none'; return; }
      const cities = await searchCities(q);
      $('searchResults').innerHTML = cities.map(c => `<div style="padding:10px;cursor:pointer;" onclick="addFav(${c.lat},${c.lon},'${c.local_names?.ru||c.name}')">${c.local_names?.ru||c.name}</div>`).join('');
      $('searchResults').style.display = 'block';
    });
    window.addFav = function(lat, lon, name) {
      if (!state.favCities.find(c=>c.name===name)) {
        state.favCities.push({name, lat, lon});
        ls('fav', state.favCities);
        renderFavorites();
      }
      $('searchResults').style.display = 'none';
    };

    function renderFavorites() {
      $('favGrid').innerHTML = state.favCities.map(c => `<div class="glass" style="padding:14px;cursor:pointer;" onclick="selectFav(${c.lat},${c.lon},'${c.name}')">${c.name}</div>`).join('');
    }
    window.selectFav = function(lat, lon, name) {
      state.lat = lat; state.lon = lon; state.city = name;
      fetchWeatherData(); switchTab('home');
    };

    /* ---------- НАВИГАЦИЯ ---------- */
    function switchTab(tab) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab+'Screen').classList.add('active');
      document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
    }
    document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

    // Инициализация
    fetchWeatherData();
    renderFavorites();
    setInterval(fetchWeatherData, (state.settings.refreshInterval||15)*60000);
  })();
</script>
</body>
</html>

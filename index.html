<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Anomaly Radar</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #0A84FF; 
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --glass-bg: rgba(35, 35, 40, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --blur: blur(35px) saturate(200%);
        }
        
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, system-ui, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.85) contrast(1.1); }
        
        /* UI Panel */
        .ui-panel {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; 
            background: var(--glass-bg);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); 
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 36px; padding: 22px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 16px; margin: 6px 0; border: none; border-radius: 20px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            background: rgba(10, 132, 255, 0.6); color: #fff;
            backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
        }
        .btn-sec { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Radar Unit */
        #radar {
            width: 75px; height: 75px; margin: 0 auto 12px; border: 1px solid rgba(255,255,255,0.25);
            border-radius: 50%; position: relative; 
            background: radial-gradient(circle, rgba(48, 209, 88, 0.15) 0%, transparent 70%);
        }
        #radar-arrow {
            position: absolute; top: 50%; left: 50%; width: 2.5px; height: 34px;
            background: var(--ios-green); transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg); 
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            border-radius: 2px; box-shadow: 0 0 8px var(--ios-green);
        }

        /* Анимация импульса на карте */
        #mapPulse {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 0; height: 0;
            border: 2px solid var(--ios-blue); border-radius: 50%;
            z-index: 10; pointer-events: none;
            animation: wave 2.5s infinite ease-out;
        }
        @keyframes wave {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }

        /* Modals */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
            width: 85%; max-width: 320px; background: var(--glass-bg);
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border-radius: 32px; padding: 25px; display: none; z-index: 1000; 
            border: 1px solid var(--glass-border); opacity: 0; transition: all 0.4s ease;
        }
        .active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        
        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 30px; height: 30px;
            z-index: 50; border: 1.5px solid var(--ios-green); border-radius: 50%;
        }

        .custom-alert {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 69, 58, 0.85); padding: 14px 28px; border-radius: 24px;
            z-index: 2000; font-size: 14px; font-weight: 600; display: none; opacity: 0; transition: all 0.3s ease;
        }
        .alert-active { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>
<div id="mapPulse"></div>
<div id="iosAlert" class="custom-alert"></div>

<div class="ui-panel">
    <div id="radar-ui" style="display:none; text-align: center;">
        <div id="radar"><div id="radar-arrow"></div></div>
        <div id="distance-text" style="font-size: 11px; letter-spacing: 2px; color: var(--ios-green); font-weight: 800;">СИГНАЛ: 0%</div>
    </div>

    <div id="scan-box" style="display:none; text-align:center; padding: 20px 0;">
        <div style="font-size: 13px; color: var(--ios-blue); letter-spacing: 4px; font-weight: 800; animation: pulse 1.5s infinite;">ПОИСК ИЗЛУЧЕНИЯ...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" onclick="openM('settings')">Настройки</button>
            <button class="btn btn-sec" onclick="openM('map-styles')">Слои</button>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" style="flex:1" onclick="toggleSelect()" id="selectBtn">📍 Точка</button>
            <button class="btn btn-sec" style="flex:1; color: var(--ios-blue);" onclick="resetToUser()">🎯 Моя позиция</button>
        </div>
        <button class="btn" id="mainBtn" onclick="executeScan()">НАЙТИ АНОМАЛИЮ</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--ios-green);" onclick="buildRoute()">МАРШРУТ</button>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-sec" style="flex: 1;" onclick="openM('info')">ДАННЫЕ</button>
            <button class="btn btn-sec" style="flex: 1; color: var(--ios-red);" onclick="resetSystem()">СБРОС</button>
        </div>
    </div>
</div>

<div id="settings" class="modal">
    <h3 style="text-align:center; margin-top:0;">Параметры</h3>
    <label style="font-size: 12px; opacity: 0.6;">КАТЕГОРИЯ</label>
    <select id="catSelect" style="width:100%; background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--glass-border); padding:14px; border-radius:16px; margin: 8px 0 20px;">
        <option value="quantum">Квантовая</option>
        <option value="power">Энергетическая</option>
        <option value="void">Пустотная</option>
    </select>
    
    <label style="font-size: 12px; opacity: 0.6;">РАДИУС ПОИСКА: <span id="rL" style="color:var(--ios-blue)">5</span> км</label>
    <input type="range" id="radiusIn" min="1" max="15" value="5" oninput="syncUI()">
    
    <label style="font-size: 12px; opacity: 0.6; margin-top: 15px; display: block;">МОЩНОСТЬ АНОМАЛИИ: <span id="pL" style="color:var(--ios-green)">25</span>%</label>
    <input type="range" id="powerIn" min="1" max="100" value="25" oninput="syncUI()">

    <div style="display:flex; justify-content: space-between; margin-top:20px;">
        <span>Звуковые эффекты</span>
        <input type="checkbox" id="soundToggle" checked>
    </div>
    <button class="btn" style="margin-top:25px" onclick="closeM()">ПРИНЯТЬ</button>
</div>

<div id="info" class="modal">
    <h3 id="anomalyName" style="color: var(--ios-green);"></h3>
    <div id="infoBody" style="font-size: 14px; opacity: 0.8;"></div>
    <div id="coordsBox" style="margin-top:15px; font-family: monospace; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px; text-align:center;"></div>
    <button class="btn" style="margin-top:20px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<div id="map-styles" class="modal">
    <button class="btn btn-sec" onclick="setMapStyle('dark')">ТЕМНАЯ КАРТА</button>
    <button class="btn btn-sec" onclick="setMapStyle('sat')">СПУТНИК</button>
    <button class="btn" style="margin-top:15px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let map, userPos, searchOrigin, targetPoint, isSelecting = false;
    let radarInterval;

    function playSound(type) {
        if (!document.getElementById('soundToggle').checked) return;
        const now = ctx.currentTime;
        const g = ctx.createGain();
        const osc = ctx.createOscillator();
        
        if (type === 'search') {
            // Таинственный низкий гул (Drone)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(50, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 3);
            
            const lfo = ctx.createOscillator();
            lfo.frequency.value = 2;
            const lfoGain = ctx.createGain();
            lfoGain.gain.value = 10;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            lfo.start();

            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(0.2, now + 0.5);
            g.gain.linearRampToValueAtTime(0, now + 3);
            
            osc.connect(g).connect(ctx.destination);
            osc.start(); osc.stop(now + 3);
        } else if (type === 'tap') {
            osc.frequency.value = 800;
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(g).connect(ctx.destination);
            osc.start(); osc.stop(now + 0.1);
        }
    }

    const STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        sat: { "version": 8, "sources": { "s": { "type": "raster", "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], "tileSize": 256 }}, "layers": [{ "id": "s", "type": "raster", "source": "s" }] }
    };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(pos => {
        userPos = [pos.coords.longitude, pos.coords.latitude];
        searchOrigin = [...userPos];
        map.setCenter(userPos);
        new maplibregl.Marker({ color: '#0A84FF' }).setLngLat(userPos).addTo(map);
        syncUI();
    });

    function resetToUser() {
        if (!userPos) return;
        searchOrigin = [...userPos];
        map.flyTo({ center: userPos, zoom: 11 });
        syncUI();
        playSound('tap');
    }

    function syncUI() {
        document.getElementById('rL').innerText = document.getElementById('radiusIn').value;
        document.getElementById('pL').innerText = document.getElementById('powerIn').value;
        if (searchOrigin) {
            const r = document.getElementById('radiusIn').value;
            const circle = genCircle(searchOrigin, r);
            if (map.getSource('rad')) map.getSource('rad').setData(circle);
            else {
                map.addSource('rad', { type: 'geojson', data: circle });
                map.addLayer({ id: 'rad-l', type: 'fill', source: 'rad', paint: { 'fill-color': '#0A84FF', 'fill-opacity': 0.05 } });
                map.addLayer({ id: 'rad-b', type: 'line', source: 'rad', paint: { 'line-color': '#0A84FF', 'line-width': 2, 'line-dasharray': [2, 2] } });
            }
        }
    }

    function toggleSelect() {
        isSelecting = !isSelecting;
        document.getElementById('crosshair').style.display = isSelecting ? 'block' : 'none';
        const b = document.getElementById('mainBtn');
        const sBtn = document.getElementById('selectBtn');
        if (isSelecting) {
            b.innerText = "ПОДТВЕРДИТЬ ТОЧКУ";
            sBtn.innerText = "ОТМЕНА";
            b.onclick = () => {
                searchOrigin = [map.getCenter().lng, map.getCenter().lat];
                toggleSelect(); syncUI();
                b.innerText = "НАЙТИ АНОМАЛИЮ"; b.onclick = executeScan;
                sBtn.innerText = "📍 Точка";
            };
        } else {
            b.innerText = "НАЙТИ АНОМАЛИЮ"; b.onclick = executeScan;
            sBtn.innerText = "📍 Точка";
        }
    }

    async function executeScan() {
        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        document.getElementById('mapPulse').style.display = 'block';
        playSound('search');
        
        const mode = document.getElementById('catSelect').value;
        const radius = document.getElementById('radiusIn').value;
        let found = null;

        // Поиск...
        for (let i = 0; i < 15; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = (Math.sqrt(Math.random()) * radius) / 111;
            const pt = [searchOrigin[0] + d * Math.cos(a), searchOrigin[1] + d * Math.sin(a)];
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                if (data) { found = { coords: pt, data: data }; break; }
            } catch(e) {}
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            document.getElementById('mapPulse').style.display = 'none';
            if (found) {
                targetPoint = found.coords;
                startRadar();
                showTarget(found, mode);
            } else {
                resetSystem();
                showAlert("СИГНАЛ НЕ ОБНАРУЖЕН");
            }
        }, 3000);
    }

    function startRadar() {
        const power = parseInt(document.getElementById('powerIn').value);
        document.getElementById('radar-ui').style.display = 'block';
        radarInterval = setInterval(() => {
            const dist = getDistance(userPos, targetPoint);
            const maxR = document.getElementById('radiusIn').value * 1000;
            let strength = Math.max(0, (1 - dist / maxR) * 100);
            // Мощность аномалии влияет на помехи (чем выше мощность, тем стабильнее сигнал)
            let noise = (Math.random() - 0.5) * (110 - power);
            let finalSignal = Math.max(0, Math.min(100, strength + noise));
            
            document.getElementById('radar-arrow').style.transform = `translate(-50%, -100%) rotate(${finalSignal * 3.6}deg)`;
            document.getElementById('distance-text').innerText = `СИГНАЛ: ${finalSignal.toFixed(0)}%`;
        }, 800);
    }

    function showTarget(obj, mode) {
        document.getElementById('anomalyName').innerText = "ОБЪЕКТ ОБНАРУЖЕН";
        document.getElementById('infoBody').innerHTML = `<b>ТИП:</b> ${mode.toUpperCase()}<br><b>АДРЕС:</b> ${obj.data.display_name}`;
        document.getElementById('coordsBox').innerText = `${targetPoint[1].toFixed(6)}, ${targetPoint[0].toFixed(6)}`;
        
        if (window.m) window.m.remove();
        window.m = new maplibregl.Marker({ color: '#FF453A' }).setLngLat(targetPoint).addTo(map);
        map.flyTo({ center: targetPoint, zoom: 15, duration: 2500 });
        document.getElementById('ui-found').style.display = 'block';
    }

    function resetSystem() {
        clearInterval(radarInterval);
        if (window.m) window.m.remove();
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('radar-ui').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        playSound('tap');
    }

    function genCircle(c, km) {
        const p = 64; const res = [];
        const dx = km / (111.32 * Math.cos(c[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i <= p; i++) {
            const a = (i / p) * (Math.PI * 2);
            res.push([c[0] + dx * Math.cos(a), c[1] + dy * Math.sin(a)]);
        }
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [res] } };
    }

    function getDistance(p1, p2) {
        const R = 6371000;
        const dLat = (p2[1]-p1[1]) * Math.PI/180;
        const dLon = (p2[0]-p1[0]) * Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1[1]*Math.PI/180)*Math.cos(p2[1]*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function showAlert(t) {
        const e = document.getElementById('iosAlert'); e.innerText = t;
        e.classList.add('alert-active'); setTimeout(() => e.classList.remove('alert-active'), 3000);
    }
    function openM(id) { document.getElementById(id).classList.add('active'); playSound('tap'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); playSound('tap'); }
    function setMapStyle(t) { map.setStyle(STYLES[t]); closeM(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Моя Волна</title>
    <style>
        :root {
            --bg: #000;
            --glass: rgba(255, 255, 255, .04);
            --text: #fff;
            --accent: #FF6B9D;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--text);
            user-select: none;
        }
        #bgC {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        #app {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 430px;
            margin: 0 auto;
        }
        .center {
            text-align: center;
            padding: 0 24px;
        }
        .title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            background: linear-gradient(110deg, #FFD040, #FF6B9D, #D66FD5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 210, 64, 0.3);
        }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 14px 28px;
            color: #fff;
            font-size: 15px;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(12px);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        #lumCanvas {
            width: 240px;
            height: 240px;
            margin: 32px 0;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 100, 150, 0.4);
            transition: transform 0.4s ease;
        }
        #lumCanvas:hover {
            transform: scale(1.03);
        }
        .chat-container {
            width: 100%;
            max-width: 360px;
            margin-top: 20px;
            padding: 16px;
            background: var(--glass);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: none;
        }
        .chat-bubbles {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        .bubble.ai {
            background: rgba(255, 255, 255, 0.06);
            border-left: 3px solid var(--accent);
            margin-left: auto;
        }
        .bubble.user {
            background: rgba(255, 255, 255, 0.12);
            margin-right: auto;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }
        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        #cf {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            resize: none;
        }
        #sb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #sb:active {
            transform: scale(0.92);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Hide all UI except Lum and title on load */
        .hidden { display: none; }
    </style>
</head>
<body>
    <canvas id="bgC"></canvas>
    <div id="app">
        <div class="center">
            <h1 class="title">Моя волна</h1>
            <button class="btn" id="startBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7 7 7-7"/>
                    <path d="M12 5l7 7 7-7"/>
                </svg>
                Начать
            </button>
        </div>

        <!-- Lum Canvas -->
        <canvas id="lumCanvas"></canvas>

        <!-- Chat Panel -->
        <div class="chat-container" id="chatPanel">
            <div class="chat-bubbles" id="chatBubbles"></div>
            <div class="input-area">
                <textarea id="cf" placeholder="Спроси..." rows="1"></textarea>
                <button id="sb">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m22 2-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ──────────────────────────────────── CONFIG
        const OW_KEY = '351e57b1e6962e215bf99c248cadbf0b'; // ваш ключ
        const ST = {
            lat: 55.7558, // Москва
            lon: 37.6173,
            city: 'Москва',
            weather: null,
            isDay: 1,
            wcode: 0,
            tab: 'home',
            lum: { love: 60, lastVisit: null },
            chat: [],
            pendingQuestion: null,
            aiState: 'idle' // idle | guessing | confirming | explaining
        };

        const S = {
            get(k, d = null) {
                try { return JSON.parse(localStorage.getItem('lum_' + k)) || d } catch { return d }
            },
            set(k, v) {
                try { localStorage.setItem('lum_' + k, JSON.stringify(v)) } catch {}
            }
        };

        // ──────────────────────────────────── UTILS
        function tC(c) { return Math.round(c) }
        function fmtTime(dt) {
            const d = new Date(dt * 1000);
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }
        function lerp(a, b, t) { return a + (b - a) * t }
        function clamp(x, min, max) { return Math.max(min, Math.min(max, x)) }

        // ──────────────────────────────────── API
        async function fetchWeather() {
            try {
                const res = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${ST.lat}&lon=${ST.lon}&appid=${OW_KEY}&units=metric&lang=ru`
                );
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                ST.weather = data;
                ST.isDay = data.dt > data.sys.sunrise && data.dt < data.sys.sunset ? 1 : 0;
                ST.wcode = data.weather[0].id;
                
                updateLumFromWeather();
                renderLum();
                showChat();
                return true;
            } catch (e) {
                console.error('Погода не загрузилась:', e);
                toast('❌ Не удалось загрузить погоду. Проверьте подключение.');
                return false;
            }
        }

        // ──────────────────────────────────── LUM ENGINE
        const lum = (() => {
            let C, ctx, t = 0, raf;
            let blobs = [];
            let eyeTarget = { x: 0, y: 0 }, eyeCurrent = { x: 0, y: 0 };
            let blinkTimer = 0, blinkState = 1;
            let emotion = 'curious';
            let smileAmt = 0;
            let colorPalette = [[255, 150, 30], [255, 90, 10], [255, 210, 60]];
            let lastTransform = null;

            function init() {
                C = document.getElementById('lumCanvas');
                ctx = C.getContext('2d');
                C.width = C.offsetWidth;
                C.height = C.offsetHeight;
                C.addEventListener('click', handleLumClick);
                createBlobs();
                animate();
            }

            function createBlobs() {
                blobs = [];
                for (let i = 0; i < 18; i++) {
                    blobs.push({
                        x: 0,
                        y: 0,
                        r: 8 + Math.random() * 12,
                        alpha: 0.3 + Math.random() * 0.5,
                        pulse: Math.random() * Math.PI * 2,
                        speed: 0.02 + Math.random() * 0.04,
                        hueOffset: Math.random() * 360
                    });
                }
            }

            function updateColors() {
                const base = colorPalette[0];
                const h = new Date().getHours();
                const isNight = h < 6 || h > 20;
                
                if (ST.wcode >= 200 && ST.wcode < 300) {
                    colorPalette = [[95, 15, 190], [130, 35, 230], [70, 5, 150]]; // storm
                } else if (ST.wcode >= 600 && ST.wcode < 700) {
                    colorPalette = [[135, 175, 250], [175, 205, 250], [195, 215, 250]]; // snow
                } else if (ST.wcode >= 700 && ST.wcode < 800) {
                    colorPalette = [[115, 125, 145], [140, 150, 170], [95, 105, 125]]; // fog
                } else if (ST.wcode === 800) {
                    colorPalette = isNight ? 
                        [[70, 50, 170], [110, 70, 210], [150, 110, 245]] : // moon
                        [[255, 190, 40], [220, 100, 15], [255, 230, 80]]; // sun
                } else if (ST.wcode >= 801) {
                    colorPalette = [[135, 145, 175], [95, 105, 155], [165, 175, 205]]; // cloudy
                } else {
                    colorPalette = [[10, 75, 155], [25, 95, 195], [0, 55, 125]]; // rain
                }
            }

            function animate() {
                t += 0.02;
                ctx.clearRect(0, 0, C.width, C.height);
                
                updateColors();
                
                // Update eyes
                blinkTimer += 0.02;
                if (blinkTimer > 4 + Math.random() * 3) {
                    blinkTimer = 0;
                    blinkState = 0;
                    setTimeout(() => blinkState = 1, 180);
                }
                
                // Draw blobs (flame)
                blobs.forEach((blob, i) => {
                    const phase = t * blob.speed + blob.pulse;
                    const dx = Math.sin(phase) * 8;
                    const dy = Math.cos(phase) * 6;
                    
                    const r = blob.r * (1 + Math.sin(t * 0.5 + i) * 0.2);
                    const cx = C.width / 2 + dx;
                    const cy = C.height / 2 + dy;
                    
                    // Color with HSV oscillation
                    const hue = (colorPalette[0][0] + Math.sin(t * 0.3 + i) * 20 + blob.hueOffset) % 360;
                    const sat = 80 + Math.sin(t * 0.4 + i) * 10;
                    const light = 50 + Math.sin(t * 0.6 + i) * 15;
                    const alpha = blob.alpha * (0.7 + Math.sin(t * 0.8 + i) * 0.3);
                    
                    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                    grd.addColorStop(0, `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`);
                    grd.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
                    
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Draw eyes
                const eyeY = C.height / 2 - 24 + (Math.sin(t * 0.7) * 2) * (blinkState === 0 ? 0 : 1);
                const eyeOff = 22;
                
                [C.width/2 - eyeOff, C.width/2 + eyeOff].forEach(ex => {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.beginPath();
                    ctx.ellipse(ex, eyeY, 6, 6 * (blinkState === 0 ? 0 : 1), 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    if (blinkState === 1) {
                        ctx.fillStyle = '#1a1a2e';
                        ctx.beginPath();
                        ctx.ellipse(ex + 1, eyeY - 1, 2.5, 2.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Highlight
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                        ctx.beginPath();
                        ctx.arc(ex + 2.5, eyeY - 2.5, 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Draw mouth (subtle)
                const mouthY = C.height / 2 + 28;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(C.width/2 - 14, mouthY);
                ctx.quadraticCurveTo(C.width/2, mouthY + smileAmt * 4, C.width/2 + 14, mouthY);
                ctx.stroke();

                raf = requestAnimationFrame(animate);
            }

            function handleLumClick() {
                ST.lum.love = Math.min(100, ST.lum.love + 1);
                S.set('lum', ST.lum);
                emotion = 'giggle';
                smileAmt = 1.8;
                setTimeout(() => {
                    emotion = 'curious';
                    smileAmt = 1;
                }, 1200);
            }

            function updateEmotion(newEmo) {
                emotion = newEmo;
                if (emotion === 'love') smileAmt = 1.5;
                else if (emotion === 'sad') smileAmt = -1;
                else smileAmt = 1;
            }

            function transformTo(iconType) {
                lastTransform = iconType;
                let target = null;
                switch (iconType) {
                    case 'sun': target = { x: 0, y: 0, r: 30 }; break;
                    case 'cloud': target = { x: 0, y: 0, r: 35 }; break;
                    case 'rain': target = { x: 0, y: 0, r: 32 }; break;
                    case 'snow': target = { x: 0, y: 0, r: 30 }; break;
                    default: return;
                }
                
                // Animate transformation
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 0.05;
                    if (progress >= 1) {
                        clearInterval(interval);
                        lastTransform = null;
                        setTimeout(() => emotion = 'curious', 1000);
                    }
                }, 50);
            }

            return { init, updateEmotion, transformTo };
        })();

        // ──────────────────────────────────── CHAT AI (LOCAL)
        const brain = {
            // Simple intent classifier
            classifyIntent(text) {
                const lower = text.toLowerCase();
                if (lower.includes('как дела') || lower.includes('привет')) return 'greeting';
                if (lower.includes('температура') || lower.includes('сколько градусов')) return 'temp';
                if (lower.includes('погода') || lower.includes('что за погода')) return 'weather';
                if (lower.includes('надеть') || lower.includes('одеться')) return 'outfit';
                if (lower.includes('дождь') || lower.includes('осадки')) return 'rain';
                if (lower.includes('ветер') || lower.includes('ветрено')) return 'wind';
                if (lower.includes('солнце') || lower.includes('ясно')) return 'sun';
                if (lower.includes('лун') || lower.includes('ночь')) return 'moon';
                if (lower.includes('пыльца') || lower.includes('аллергия')) return 'pollen';
                if (lower.includes('прогулка') || lower.includes('гулять')) return 'walk';
                return 'general';
            },

            // Generate response based on intent and context
            generateResponse(intent, context) {
                const w = ST.weather;
                if (!w) return "Я пока не знаю... Но могу узнать погоду!";
                
                const temp = tC(w.main.temp);
                const feels = tC(w.main.feels_like);
                const desc = w.weather[0].description;
                const wind = w.wind.speed.toFixed(1);
                const humidity = w.main.humidity;
                
                switch (intent) {
                    case 'greeting':
                        return `Привет! 🌟 Я Люм — твой огонёк. Хочешь узнать погоду?`;
                    case 'temp':
                        return `Сейчас ${temp}°, ощущается как ${feels}°. ${
                            temp > 25 ? 'Жарко! 💦' : temp < 5 ? 'Холодно! 🧤' : 'Комфортно. 😌'
                        }`;
                    case 'weather':
                        return `В ${ST.city} сейчас ${desc}. Температура ${temp}°, ветер ${wind} м/с.`;
                    case 'outfit':
                        return temp > 20 ? 'Легкая одежда — можно в футболке!' :
                               temp > 10 ? 'Куртка или толстовка подойдут.' :
                               'Теплая куртка, шапка и перчатки!';
                    case 'rain':
                        return w.weather[0].main.toLowerCase().includes('rain') ?
                            'Да, идёт дождь. Возьми зонт! ☔' :
                            'Сейчас сухо. Зонт не нужен.';
                    case 'wind':
                        return wind > 8 ? 'Сильный ветер (${wind} м/с)! Следи за шляпой 😄' :
                               wind > 4 ? 'Умеренный ветер (${wind} м/с).' :
                               'Тихо и спокойно.';
                    case 'sun':
                        return w.weather[0].id === 800 ?
                            'Солнечно! 🌞 Выходи гулять — отличный день!' :
                            'Облачно, но светло.';
                    case 'moon':
                        return ST.isDay ? 'Сейчас день — луны не видно.' :
                               'Луна сегодня в фазе роста. 🌙';
                    case 'pollen':
                        return 'Уровень пыльцы низкий — безопасно для аллергиков.';
                    case 'walk':
                        return (temp > 10 && wind < 8 && !w.weather[0].main.toLowerCase().includes('rain')) ?
                            'Отличное время для прогулки! 🚶‍♂️' :
                            'Лучше остаться дома — погода не идеальна.';
                    default:
                        return "Интересно! Расскажи подробнее — я хочу понять тебя лучше.";
                }
            },

            // Main AI loop: guess → confirm → explain
            async respond(userMsg) {
                const intent = this.classifyIntent(userMsg);
                const response = this.generateResponse(intent, ST);

                // Step 1: Guess intention
                const guesses = [
                    "Ты хочешь узнать про погоду?",
                    "Интересуешься температурой?",
                    "Хочешь совет по одежде?",
                    "Готовишься к прогулке?"
                ];
                const guess = guesses[Math.floor(Math.random() * guesses.length)];

                addBubble('ai', guess);
                
                // Wait 1.2s, then show buttons
                setTimeout(() => {
                    ST.aiState = 'confirming';
                    const btns = `<div style="display:flex;gap:8px;margin-top:8px">
                        <button class="btn" onclick="confirmYes('${intent}')">Да</button>
                        <button class="btn" onclick="confirmNo()">Нет, другое</button>
                    </div>`;
                    addBubble('ai', '', btns);
                }, 1200);
            }
        };

        // ──────────────────────────────────── UI FUNCTIONS
        function showChat() {
            document.getElementById('chatPanel').style.display = 'block';
            document.getElementById('startBtn').classList.add('hidden');
            scrollChat();
        }

        function addBubble(role, text, extraHTML = '') {
            const el = document.getElementById('chatBubbles');
            const div = document.createElement('div');
            div.className = `bubble ${role}`;
            div.innerHTML = text + extraHTML;
            el.appendChild(div);
            scrollChat();
        }

        function scrollChat() {
            const el = document.getElementById('chatBubbles');
            el.scrollTop = el.scrollHeight;
        }

        function toast(msg) {
            alert(msg); // simple fallback; in real app: use snackbar
        }

        // ──────────────────────────────────── EVENT HANDLERS
        document.getElementById('startBtn').addEventListener('click', async () => {
            const success = await fetchWeather();
            if (success) {
                document.getElementById('startBtn').remove();
                lum.init();
            }
        });

        document.getElementById('cf').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        });

        document.getElementById('sb').addEventListener('click', sendMsg);

        function sendMsg() {
            const input = document.getElementById('cf');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            addBubble('user', text);
            
            // Increment love
            ST.lum.love = Math.min(100, ST.lum.love + 2);
            S.set('lum', ST.lum);
            
            // AI responds
            brain.respond(text);
        }

        window.confirmYes = (intent) => {
            ST.aiState = 'explaining';
            const response = brain.generateResponse(intent, ST);
            addBubble('ai', response);
            setTimeout(() => {
                ST.aiState = 'idle';
            }, 2000);
        };

        window.confirmNo = () => {
            ST.aiState = 'idle';
            addBubble('ai', 'Расскажи подробнее — я слушаю...');
        };

        // ──────────────────────────────────── LUM WEATHER SYNC
        function updateLumFromWeather() {
            const w = ST.weather;
            if (!w) return;
            
            // Set emotion by weather
            if (w.weather[0].id >= 200 && w.weather[0].id < 300) lum.updateEmotion('scared');
            else if (w.weather[0].id >= 600 && w.weather[0].id < 700) lum.updateEmotion('sleepy');
            else if (w.weather[0].id >= 700 && w.weather[0].id < 800) lum.updateEmotion('curious');
            else if (w.weather[0].id === 800) lum.updateEmotion(ST.isDay ? 'happy' : 'sleepy');
            else if (w.weather[0].id === 801) lum.updateEmotion('curious');
            else lum.updateEmotion('happy');
        }

        // ──────────────────────────────────── INITIALIZE
        document.addEventListener('DOMContentLoaded', () => {
            // Restore state
            const saved = S.get('lum', { love: 60, lastVisit: null });
            ST.lum = saved;
            
            // Check geolocation
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        ST.lat = pos.coords.latitude;
                        ST.lon = pos.coords.longitude;
                        reverseGeo().then(name => {
                            ST.city = name;
                            fetchWeather();
                        });
                    },
                    () => fetchWeather(),
                    { timeout: 5000 }
                );
            } else {
                fetchWeather();
            }
        });

        async function reverseGeo() {
            try {
                const res = await fetch(
                    `https://api.openweathermap.org/geo/1.0/reverse?lat=${ST.lat}&lon=${ST.lon}&limit=1&appid=${OW_KEY}`
                );
                const data = await res.json();
                return data[0]?.local_names?.ru || data[0]?.name || 'Москва';
            } catch {
                return 'Москва';
            }
        }

        // ──────────────────────────────────── BACKGROUND ANIMATION
        const bg = (() => {
            let C, ctx, W, H, raf;
            let particles = [];

            function init() {
                C = document.getElementById('bgC');
                ctx = C.getContext('2d');
                resize();
                window.addEventListener('resize', resize);
                animate();
            }

            function resize() {
                W = C.width = window.innerWidth;
                H = C.height = window.innerHeight;
            }

            function createParticles() {
                particles = [];
                const count = ST.isDay ? 80 : 120;
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        size: 1 + Math.random() * 2,
                        speed: 0.5 + Math.random() * 1.5,
                        alpha: 0.1 + Math.random() * 0.3,
                        type: Math.random() > 0.7 ? 'star' : 'dot'
                    });
                }
            }

            function animate() {
                ctx.clearRect(0, 0, W, H);
                
                // Gradient background
                const gradient = ctx.createLinearGradient(0, 0, 0, H);
                if (ST.isDay) {
                    gradient.addColorStop(0, '#0a0a1a');
                    gradient.addColorStop(0.5, '#1a1a3a');
                    gradient.addColorStop(1, '#0a0a1a');
                } else {
                    gradient.addColorStop(0, '#050515');
                    gradient.addColorStop(0.5, '#0a0a2a');
                    gradient.addColorStop(1, '#050515');
                }
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, H);

                // Stars/dots
                particles.forEach(p => {
                    p.y -= p.speed;
                    if (p.y < -10) {
                        p.y = H + 10;
                        p.x = Math.random() * W;
                    }
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                raf = requestAnimationFrame(animate);
            }

            return { init, createParticles };
        })();

        // Start background
        bg.init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Multi-Map Edition</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { --glass: rgba(12, 12, 12, 0.9); --accent: #7800ff; --green: #00ff66; --red: #ff0055; }
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        #crosshair {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 40px; height: 40px;
            z-index: 50; pointer-events: none;
        }
        #crosshair::before { content: ""; position: absolute; top: 19px; width: 40px; height: 2px; background: var(--green); box-shadow: 0 0 10px var(--green); }
        #crosshair::after { content: ""; position: absolute; left: 19px; height: 40px; width: 2px; background: var(--green); box-shadow: 0 0 10px var(--green); }

        .ui-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 420px; background: var(--glass);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            padding: 20px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 16px; margin: 5px 0; border: none; border-radius: 18px;
            font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.2s;
            background: var(--accent); color: #fff; text-transform: uppercase;
        }
        .btn-sec { background: rgba(255,255,255,0.08); font-size: 11px; }
        .btn:active { transform: scale(0.96); }

        #scan-box { display: none; text-align: center; padding: 10px 0; }
        .line { width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 15px var(--accent); animation: scan 1.5s infinite; position: relative; }
        @keyframes scan { 0% { top: -10px; opacity: 0; } 50% { opacity: 1; } 100% { top: 10px; opacity: 0; } }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; background: #0a0a0a; border: 1px solid #333;
            border-radius: 25px; padding: 25px; display: none; z-index: 1000;
        }
        .active { display: block; }
        
        .copy-btn { background: #1a1a1a; color: var(--green); border: 1px solid #333; padding: 12px; border-radius: 15px; font-size: 11px; cursor: pointer; margin-top: 10px; text-align: center; font-weight: bold; }
        
        .map-opt { background: #111; border: 1px solid #333; padding: 15px; margin: 8px 0; border-radius: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .map-opt:hover { border-color: var(--accent); }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; float: right; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>

<div class="ui-panel">
    <div id="status-log" style="font-size: 9px; color: #555; text-align: center; margin-bottom: 8px; letter-spacing: 2px;">SYSTEM V3.0 ONLINE</div>
    
    <div id="scan-box">
        <div class="line"></div>
        <div style="font-size: 11px; margin-top: 10px; color: var(--accent);">АНАЛИЗ ЭФИРА...</div>
    </div>

    <div id="ui-idle">
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" onclick="openM('settings')">⚙ ОПЦИИ</button>
            <button class="btn btn-sec" onclick="openM('map-styles')">🗺 КАРТА</button>
            <button class="btn btn-sec" style="flex: 1.5;" onclick="togglePointSelection()" id="selectBtn">📍 ЦЕНТР</button>
        </div>
        <button class="btn" id="mainActionBtn" onclick="executeScan()">ЗАПУСК ПОИСКА</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--green); color: #000;" onclick="playRouteSound(); buildRoute()">ПРОЛОЖИТЬ ПУТЬ</button>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-sec" style="flex: 1;" onclick="openM('info')">ДАННЫЕ</button>
            <button class="btn btn-sec" style="flex: 1;" onclick="resetSystem()">СБРОС</button>
        </div>
    </div>
</div>

<div id="map-styles" class="modal">
    <h3 style="margin:0 0 15px 0">РЕЖИМ ВИЗУАЛИЗАЦИИ</h3>
    <div class="map-opt" onclick="setMapStyle('dark')">ТЕМНАЯ СХЕМА <span>●</span></div>
    <div class="map-opt" onclick="setMapStyle('sat')">СПУТНИК (ARCGIS) <span>🛰</span></div>
    <div class="map-opt" onclick="setMapStyle('street')">УЛИЧНАЯ СЕТЬ <span>🏙</span></div>
    <button class="btn btn-sec" style="margin-top:15px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<div id="settings" class="modal">
    <h3 style="margin:0 0 15px 0">ПАРАМЕТРЫ</h3>
    <div style="margin-bottom: 15px;">
        <span style="font-size: 14px;">Музыка</span>
        <label class="switch"><input type="checkbox" id="musicToggle" onchange="toggleMusic()"><span class="slider"></span></label>
    </div>
    <label style="font-size: 11px; color: #777;">РАДИУС: <span id="rL" style="color:var(--accent)">5 км</span></label>
    <input type="range" id="radiusIn" min="1" max="15" value="5" style="width:100%; margin:10px 0;" oninput="syncUI()">
    <label style="font-size: 11px; color: #777;">МОЩНОСТЬ: <span id="pL" style="color:var(--accent)">5</span></label>
    <input type="range" id="powerIn" min="1" max="10" value="5" style="width:100%; margin:10px 0;" oninput="syncUI()">
    <select id="catSelect" style="width:100%; background:#111; color:#fff; border:1px solid #333; padding:15px; border-radius:15px; outline:none;">
        <option value="Пустота">ПУСТОТА (БЕЗ ДОМОВ)</option>
        <option value="Квантовая">КВАНТОВАЯ (ЛЮБАЯ)</option>
        <option value="Мощная">МОЩНАЯ (ДОРОГИ)</option>
    </select>
    <button class="btn" style="margin-top:20px" onclick="closeM()">ПРИМЕНИТЬ</button>
</div>

<div id="info" class="modal">
    <h3 style="margin:0 0 15px 0">ЛОГ ОБЪЕКТА</h3>
    <div id="infoBody" style="font-size: 12px; line-height: 1.5; color: #ccc; max-height: 100px; overflow: auto;"></div>
    <div id="coordsBox" style="margin-top:10px; padding:12px; background:#000; border-radius:12px; font-family:monospace; font-size:11px; color:var(--green); border:1px solid #222; text-align: center;"></div>
    <div class="copy-btn" id="copyBtn" onclick="copyCoords()">СКОПИРОВАТЬ КООРДИНАТЫ</div>
    <button class="btn btn-sec" style="margin-top:15px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<script>
    const bgMusic = new Audio('https://www.chosic.com/wp-content/uploads/2021/07/The-Void.mp3'); 
    bgMusic.loop = true;

    let map, userPos, searchOrigin, targetPoint, isSelecting = false;
    let currentAddress = "", currentMarkerColor = "#ff0055";

    const STYLES = {
        dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        street: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
        sat: {
            "version": 8,
            "sources": { "sat-tiles": { "type": "raster", "tiles": ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], "tileSize": 256, "attribution": "Esri" }},
            "layers": [{ "id": "sat-layer", "type": "raster", "source": "sat-tiles", "minzoom": 0, "maxzoom": 22 }]
        }
    };

    map = new maplibregl.Map({
        container: 'map',
        style: STYLES.dark,
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    map.on('load', () => {
        navigator.geolocation.getCurrentPosition(pos => {
            userPos = [pos.coords.longitude, pos.coords.latitude];
            searchOrigin = userPos;
            map.setCenter(userPos);
            new maplibregl.Marker({ color: '#00ffff' }).setLngLat(userPos).addTo(map);
            syncUI();
        });
    });

    function setMapStyle(type) {
        map.setStyle(STYLES[type]);
        // Ждем перерисовки, чтобы восстановить слои радиуса и маршрута
        map.once('styledata', () => {
            syncUI();
            if (targetPoint) {
                // Восстанавливаем маркер цели
                if (window.m) window.m.addTo(map);
            }
        });
        closeM();
    }

    function toggleMusic() {
        if (document.getElementById('musicToggle').checked) bgMusic.play().catch(() => {});
        else bgMusic.pause();
    }

    function togglePointSelection() {
        isSelecting = !isSelecting;
        document.getElementById('crosshair').style.display = isSelecting ? 'block' : 'none';
        const mainBtn = document.getElementById('mainActionBtn');
        if (isSelecting) {
            mainBtn.innerText = "ПОДТВЕРДИТЬ";
            mainBtn.style.background = "var(--green)";
            mainBtn.style.color = "#000";
            mainBtn.onclick = () => {
                const c = map.getCenter();
                searchOrigin = [c.lng, c.lat];
                togglePointSelection();
                syncUI();
            };
        } else {
            mainBtn.innerText = "ЗАПУСК ПОИСКА";
            mainBtn.style.background = "";
            mainBtn.style.color = "";
            mainBtn.onclick = executeScan;
        }
    }

    function syncUI() {
        const r = document.getElementById('radiusIn').value;
        document.getElementById('rL').innerText = r + ' км';
        document.getElementById('pL').innerText = document.getElementById('powerIn').value;
        if (searchOrigin) {
            const data = genCircle(searchOrigin, r);
            if (map.getSource('rad')) map.getSource('rad').setData(data);
            else {
                map.addSource('rad', { type: 'geojson', data: data });
                map.addLayer({ id: 'rad-l', type: 'fill', source: 'rad', paint: { 'fill-color': '#7800ff', 'fill-opacity': 0.15 } });
            }
        }
    }

    function genCircle(center, km) {
        const points = 64; const ret = [];
        const dx = km / (111.32 * Math.cos(center[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i < points; i++) {
            const t = (i / points) * (2 * Math.PI);
            ret.push([center[0] + dx * Math.cos(t), center[1] + dy * Math.sin(t)]);
        }
        ret.push(ret[0]);
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ret] } };
    }

    async function executeScan() {
        const p = parseInt(document.getElementById('powerIn').value);
        const r = parseInt(document.getElementById('radiusIn').value);
        const cat = document.getElementById('catSelect').value;
        
        // Цвет от мощности
        const redChan = Math.max(50, 255 - (p * 20));
        currentMarkerColor = `rgb(${redChan}, 0, 40)`;

        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';

        let found = null;
        for (let i = 0; i < p * 5; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (r / 111);
            const pt = [searchOrigin[0] + dist * Math.cos(angle), searchOrigin[1] + dist * Math.sin(angle)];
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                if (p === 1 || (cat === "Пустота" && !data.address.house_number) || cat === "Квантовая" || (cat === "Мощная" && data.address.road)) {
                    found = pt; currentAddress = data.display_name; break;
                }
            } catch(e) {}
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            if (found) {
                targetPoint = found;
                if (window.m) window.m.remove();
                window.m = new maplibregl.Marker({ color: currentMarkerColor }).setLngLat(found).addTo(map);
                map.flyTo({ center: found, zoom: 15 });
                document.getElementById('ui-found').style.display = 'block';
                document.getElementById('infoBody').innerHTML = `<b>ОБЪЕКТ ОБНАРУЖЕН</b><br>${currentAddress}`;
                document.getElementById('coordsBox').innerText = `${found[1].toFixed(6)}, ${found[0].toFixed(6)}`;
            } else {
                alert("СИГНАЛ ПОТЕРЯН. ПОПРОБУЙТЕ СНОВА.");
                document.getElementById('ui-idle').style.display = 'block';
            }
        }, 1500);
    }

    function copyCoords() {
        navigator.clipboard.writeText(document.getElementById('coordsBox').innerText);
        const b = document.getElementById('copyBtn'); b.innerText = "ГОТОВО!";
        setTimeout(() => b.innerText = "СКОПИРОВАТЬ КООРДИНАТЫ", 2000);
    }

    async function buildRoute() {
        const res = await fetch(`https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`);
        const data = await res.json();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        map.addSource('route', { type: 'geojson', data: data.routes[0].geometry });
        map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#00ff66', 'line-width': 4 } });
    }

    function resetSystem() {
        if (window.m) window.m.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        targetPoint = null;
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        map.flyTo({ center: searchOrigin, zoom: 11 });
    }

    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

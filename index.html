<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аномальная Экспедиция</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #050010;
      color: white;
      text-align: center;
    }

    #map {
      height: 70vh;
      width: 100%;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      background: purple;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: darkviolet;
    }

    #panel {
      padding: 10px;
      background: rgba(255,255,255,0.05);
    }

    #log {
      height: 120px;
      overflow-y: auto;
      background: black;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      text-align: left;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h2>🌀 Аномальная Экспедиция</h2>

<div id="panel">
  <button onclick="scanAnomalies()">🔍 Сканировать аномалии</button>
  <button onclick="startJourney()">🚶 Начать экспедицию</button>
</div>

<div id="map"></div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let userMarker;
let anomalies = [];
let selectedTarget = null;
let routeLine = null;

const anomalyTypes = [
  "⚡ Электросигнал",
  "🕳 Портал",
  "☢ Радиационная зона",
  "🔮 Артефакт",
  "👁 Наблюдение"
];

// Лог событий
function addLog(text) {
  const log = document.getElementById("log");
  log.innerHTML += "➤ " + text + "<br>";
  log.scrollTop = log.scrollHeight;
}

// Геолокация
navigator.geolocation.getCurrentPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  map = L.map("map").setView([lat, lon], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png")
    .addTo(map);

  userMarker = L.marker([lat, lon])
    .addTo(map)
    .bindPopup("📍 Ты здесь")
    .openPopup();

  addLog("Система активирована. Местоположение определено.");
});

// Генерация случайной точки в радиусе
function randomPoint(lat, lon, radiusKm) {
  const radiusDeg = radiusKm / 111;
  const u = Math.random();
  const v = Math.random();
  const w = radiusDeg * Math.sqrt(u);
  const t = 2 * Math.PI * v;

  return [
    lat + w * Math.cos(t),
    lon + w * Math.sin(t)
  ];
}

// Сканирование аномалий
function scanAnomalies() {
  if (!map) return;

  anomalies.forEach(a => map.removeLayer(a.marker));
  anomalies = [];
  selectedTarget = null;

  addLog("🔍 Сканирование запущено...");

  const baseLat = userMarker.getLatLng().lat;
  const baseLon = userMarker.getLatLng().lng;

  for (let i = 0; i < 7; i++) {
    const coords = randomPoint(baseLat, baseLon, 10);

    const danger = Math.floor(Math.random() * 5) + 1;
    const type = anomalyTypes[Math.floor(Math.random() * anomalyTypes.length)];

    const anomaly = {
      coords,
      danger,
      type,
      marker: null
    };

    const marker = L.circleMarker(coords, {
      radius: 10,
      color: danger >= 4 ? "red" : danger >= 2 ? "orange" : "lime",
      fillOpacity: 0.8
    })
      .addTo(map)
      .bindPopup(
        `<b>${type}</b><br>
         Опасность: ${danger}/5<br>
         <i>Нажми чтобы выбрать</i>`
      )
      .on("click", () => {
        selectedTarget = anomaly;
        addLog("🎯 Цель выбрана: " + type + " (опасность " + danger + ")");
        buildRoute();
      });

    anomaly.marker = marker;
    anomalies.push(anomaly);
  }

  addLog("Найдено 7 аномальных точек.");
}

// Построение маршрута
function buildRoute() {
  if (!selectedTarget) return;

  if (routeLine) map.removeLayer(routeLine);

  const start = userMarker.getLatLng();
  const end = selectedTarget.coords;

  routeLine = L.polyline([start, end], {
    color: "cyan"
  }).addTo(map);

  const dist = map.distance(start, end) / 1000;
  addLog("📍 Расстояние до цели: " + dist.toFixed(2) + " км");
}

// Экспедиция
function startJourney() {
  if (!selectedTarget) {
    addLog("❗ Сначала выбери аномальную точку.");
    return;
  }

  addLog("🚶 Экспедиция началась...");

  let progress = 0;
  const danger = selectedTarget.danger;

  const interval = setInterval(() => {
    progress += 20;

    // Случайные события
    if (Math.random() < danger * 0.15) {
      randomEvent(danger);
    }

    addLog("⏳ Продвижение: " + progress + "%");

    if (progress >= 100) {
      clearInterval(interval);
      finishJourney();
    }

  }, 1200);
}

// События по пути
function randomEvent(danger) {
  const events = [
    "Ты услышал странный шёпот в лесу...",
    "Компас начал вращаться!",
    "Появился силуэт вдали...",
    "Ты нашёл обломок неизвестного устройства.",
    "Связь пропала на несколько секунд..."
  ];

  const event = events[Math.floor(Math.random() * events.length)];
  addLog("⚠ Событие: " + event);

  if (danger >= 4 && Math.random() < 0.3) {
    addLog("☢ Ты получил аномальный эффект! Экспедиция опасна...");
  }
}

// Финал
function finishJourney() {
  addLog("✅ Экспедиция завершена!");

  const rewardChance = Math.random();

  if (rewardChance > 0.6) {
    addLog("🎁 Ты нашёл артефакт!");
  } else if (rewardChance > 0.3) {
    addLog("📡 Ты записал странный сигнал.");
  } else {
    addLog("👁 Ты почувствовал, что за тобой наблюдают...");
  }

  addLog("🌀 Возвращайся и запускай новый поиск.");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>KiwiWay - Clean Interface</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { --glass: rgba(10, 10, 10, 0.9); --accent: #7800ff; --green: #00ff66; }
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; background: var(--glass);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 35px;
            padding: 24px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 20px;
            font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s;
            background: var(--accent); color: #fff; text-transform: uppercase;
        }
        .btn-sec { background: rgba(255,255,255,0.08); }
        .btn:active { transform: scale(0.96); }

        #scan-box { display: none; text-align: center; padding: 10px 0; }
        .line { width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 15px var(--accent); animation: scan 1.5s infinite; position: relative; }
        @keyframes scan { 0% { top: -10px; opacity: 0; } 50% { opacity: 1; } 100% { top: 10px; opacity: 0; } }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; background: #0a0a0a; border: 1px solid #333;
            border-radius: 30px; padding: 25px; display: none; z-index: 1000;
        }
        .active { display: block; }
        .copy-btn { background: #222; color: var(--green); border: 1px solid #333; padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="ui-panel">
    <div id="status-log" style="font-size: 10px; color: #555; text-align: center; margin-bottom: 8px;">ГОТОВ К ЗАПУСКУ</div>
    
    <div id="scan-box">
        <div class="line"></div>
        <div style="font-size: 12px; margin-top: 10px; color: var(--accent);">ПОИСК АНОМАЛИЙ...</div>
    </div>

    <div id="ui-idle">
        <button class="btn btn-sec" onclick="openM('settings')">⚙ НАСТРОЙКИ</button>
        <button class="btn" onclick="executeScan()">НАЧАТЬ ПОИСК</button>
    </div>

    <div id="ui-found" style="display: none;">
        <button class="btn" style="background: var(--green); color: #000;" onclick="playRouteSound(); buildRoute()">ПРОЛОЖИТЬ ПУТЬ</button>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-sec" style="flex: 1;" onclick="openM('info')">ДАННЫЕ</button>
            <button class="btn btn-sec" style="flex: 1;" onclick="resetSystem()">СБРОС</button>
        </div>
    </div>
</div>

<div id="settings" class="modal">
    <h3 style="margin-top:0">КОНФИГУРАЦИЯ</h3>
    <label style="font-size: 12px; color: #666;">РАДИУС: <span id="rL" style="color:var(--accent)">5 км</span></label>
    <input type="range" id="radiusIn" min="1" max="15" value="5" style="width:100%; margin:15px 0;" oninput="syncUI()">
    
    <label style="font-size: 12px; color: #666;">МОЩНОСТЬ: <span id="pL" style="color:var(--accent)">5</span></label>
    <input type="range" id="powerIn" min="1" max="10" value="5" style="width:100%; margin:15px 0;" oninput="syncUI()">
    
    <select id="catSelect" style="width:100%; background:#111; color:#fff; border:1px solid #333; padding:14px; border-radius:15px;">
        <option value="Пустота">ПУСТОТА</option>
        <option value="Квантовая">КВАНТОВАЯ</option>
        <option value="Мощная">МОЩНАЯ</option>
    </select>
    <button class="btn" style="margin-top:20px" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<div id="info" class="modal">
    <h3 style="margin-top:0">АНАЛИЗ ОБЪЕКТА</h3>
    <div id="infoBody" style="font-size: 13px; line-height: 1.5; color: #ccc;">
        </div>
    <div id="copy-status" style="font-size: 10px; color: var(--green); margin-top: 10px; display: none;">Адрес скопирован!</div>
    <button class="btn btn-sec" style="margin-top:20px" onclick="closeM()">ВЕРНУТЬСЯ</button>
</div>

<script>
    const routeSound = new Audio('iOS-3.wav');
    let map, userPos, targetPoint, currentAddress = "";

    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [37.6, 55.7],
        zoom: 11,
        attributionControl: false
    });

    map.on('load', () => {
        navigator.geolocation.getCurrentPosition(pos => {
            userPos = [pos.coords.longitude, pos.coords.latitude];
            map.setCenter(userPos);
            new maplibregl.Marker({ color: '#00ffff' }).setLngLat(userPos).addTo(map);
            syncUI();
        });
    });

    function syncUI() {
        const r = document.getElementById('radiusIn').value;
        const p = document.getElementById('powerIn').value;
        document.getElementById('rL').innerText = r + ' км';
        document.getElementById('pL').innerText = p;
        if (userPos) {
            if (map.getSource('rad')) map.getSource('rad').setData(genCircle(userPos, r));
            else {
                map.addSource('rad', { type: 'geojson', data: genCircle(userPos, r) });
                map.addLayer({ id: 'rad-l', type: 'fill', source: 'rad', paint: { 'fill-color': '#7800ff', 'fill-opacity': 0.1 } });
            }
        }
    }

    function genCircle(center, km) {
        const points = 64;
        const ret = [];
        const dx = km / (111.32 * Math.cos(center[1] * Math.PI / 180));
        const dy = km / 110.574;
        for (let i = 0; i < points; i++) {
            const t = (i / points) * (2 * Math.PI);
            ret.push([center[0] + dx * Math.cos(t), center[1] + dy * Math.sin(t)]);
        }
        ret.push(ret[0]);
        return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ret] } };
    }

    async function executeScan() {
        const power = parseInt(document.getElementById('powerIn').value);
        const radius = parseInt(document.getElementById('radiusIn').value);
        const cat = document.getElementById('catSelect').value;

        document.getElementById('ui-idle').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';

        let found = null;
        let attempts = power * 4;

        for (let i = 0; i < attempts; i++) {
            const angle = Math.random() * Math.PI * 2;
            const d = Math.random() * (radius / 111);
            const pt = [userPos[0] + d * Math.cos(angle), userPos[1] + d * Math.sin(angle)];

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                
                // Простейшая проверка строгости (Power)
                if (power === 1 || (cat === "Пустота" && !data.address.house_number) || (cat === "Мощная" && data.address.road) || cat === "Квантовая") {
                    found = pt;
                    currentAddress = data.display_name;
                    break;
                }
            } catch (e) {}
        }

        setTimeout(() => {
            document.getElementById('scan-box').style.display = 'none';
            if (found) {
                targetPoint = found;
                if (window.m) window.m.remove();
                window.m = new maplibregl.Marker({ color: '#ff0055' }).setLngLat(found).addTo(map);
                map.flyTo({ center: found, zoom: 15 });
                document.getElementById('ui-found').style.display = 'block';
                updateLogs(cat, power);
            } else {
                alert("Объект не найден. Попробуйте снизить мощность или увеличить радиус.");
                document.getElementById('ui-idle').style.display = 'block';
            }
        }, 2000);
    }

    function updateLogs(cat, p) {
        document.getElementById('infoBody').innerHTML = `
            <b style="color:var(--accent)">ТИП:</b> ${cat.toUpperCase()}<br>
            <b style="color:var(--accent)">МОЩНОСТЬ:</b> ${p}/10<br>
            <b style="color:var(--accent)">АДРЕС:</b><br>
            <span id="addr-text">${currentAddress}</span><br>
            <div class="copy-btn" onclick="copyAddr()">КОПИРОВАТЬ АДРЕС</div>
        `;
    }

    function copyAddr() {
        const text = document.getElementById('addr-text').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const status = document.getElementById('copy-status');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 2000);
        });
    }

    function playRouteSound() {
        routeSound.currentTime = 0;
        routeSound.play().catch(() => console.log("Файл iOS-3.wav не найден"));
    }

    async function buildRoute() {
        const url = `https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        map.addSource('route', { type: 'geojson', data: data.routes[0].geometry });
        map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#00ff66', 'line-width': 5 } });
    }

    function resetSystem() {
        if (window.m) window.m.remove();
        if (map.getLayer('route')) { map.removeLayer('route'); map.removeSource('route'); }
        document.getElementById('ui-found').style.display = 'none';
        document.getElementById('ui-idle').style.display = 'block';
        map.flyTo({ center: userPos, zoom: 11 });
    }

    function openM(id) { document.getElementById(id).classList.add('active'); }
    function closeM() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
</script>
</body>
</html>

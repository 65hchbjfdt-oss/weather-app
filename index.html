<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>KiwiWay - Anomaly Radar</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #0A84FF; 
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --glass-bg: rgba(25, 25, 25, 0.5);
            --glass-border: rgba(255, 255, 255, 0.18);
            --blur: blur(25px) saturate(190%);
        }

        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; height: 100vh; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.7) contrast(1.2); }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 420px;
            border-radius: 40px;
            padding: 24px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; padding: 18px; margin: 8px 0;
            border: none; border-radius: 22px;
            font-size: 16px; font-weight: 600;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1); color: #fff;
        }

        .btn-main { background: var(--ios-blue); }

        #radar {
            width: 90px; height: 90px;
            margin: 0 auto 15px;
            border: 2px solid rgba(48, 209, 88, 0.3);
            border-radius: 50%;
            position: relative;
        }

        #radar-arrow {
            position: absolute;
            top: 50%; left: 50%;
            width: 3px; height: 40px;
            background: var(--ios-green);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            transition: 0.6s;
        }

        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 88%; max-width: 350px;
            border-radius: 35px;
            padding: 30px;
            display: none;
            z-index: 1000;
        }

        .modal.active { display: block; }

        #crosshair {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 2px solid var(--ios-blue);
            border-radius: 50%;
            z-index: 50;
        }

        #searchPulse {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--ios-blue);
            border-radius: 50%;
            animation: pulseWave 2s infinite;
        }

        @keyframes pulseWave {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }

        .alert {
            position: fixed;
            top: 60px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="crosshair"></div>
<div id="searchPulse"></div>
<div id="iosAlert" class="alert glass"></div>

<div class="ui-panel glass">

    <div id="radar-ui" style="display:none; text-align:center;">
        <div id="radar"><div id="radar-arrow"></div></div>
        <div id="distance-text">СИГНАЛ: 0%</div>
    </div>

    <div id="scan-box" style="display:none; text-align:center;">
        <div style="color:var(--ios-blue); font-weight:800;">ПОИСК...</div>
    </div>

    <div id="ui-idle">
        <button class="btn" onclick="openM('settings')">Настройки</button>
        <button class="btn btn-main" onclick="executeScan()">НАЙТИ</button>
    </div>

    <div id="ui-found" style="display:none;">
        <button class="btn btn-main" style="background:var(--ios-green)" onclick="buildRoute()">ПРОЛОЖИТЬ ПУТЬ</button>
        <button class="btn" onclick="openM('info')">ИНФО</button>
        <button class="btn" style="color:var(--ios-red)" onclick="resetSystem()">СБРОС</button>
    </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="modal glass">
    <h2>Режим поиска</h2>

    <select id="modeSelect" class="btn">
        <option value="quantum">⚛ Квантовый</option>
        <option value="void">🌑 Пустота</option>
        <option value="powerful">🔥 Мощный</option>
    </select>

    <button class="btn btn-main" onclick="closeM()">OK</button>
</div>

<!-- INFO -->
<div id="info" class="modal glass">
    <h2 id="anomalyName"></h2>
    <div id="infoBody"></div>
    <div id="coordsBox"></div>
    <button class="btn btn-main" onclick="closeM()">ЗАКРЫТЬ</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let map, userPos, targetPoint;

function playBeep(freq, dur) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

const OBJECTS = {
    quantum: [
        "Заброшенное место",
        "Старая дорога",
        "Неизвестный объект",
        "Заброшенный мост",
        "Промышленная зона"
    ],
    void: [
        "Овраг",
        "Пустой парк",
        "Скрытый двор",
        "Родник",
        "Необычный ручей"
    ],
    powerful: [
        "Заброшенное место",
        "Овраг",
        "Старая дорога",
        "Родник",
        "Неизвестная зона"
    ]
};

map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [37.6, 55.7],
    zoom: 12
});

navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.longitude, pos.coords.latitude];
    map.setCenter(userPos);
    new maplibregl.Marker().setLngLat(userPos).addTo(map);
});

async function executeScan() {

    document.getElementById("ui-idle").style.display="none";
    document.getElementById("scan-box").style.display="block";
    document.getElementById("searchPulse").style.display="block";

    const mode = document.getElementById("modeSelect").value;
    const list = OBJECTS[mode];

    setTimeout(()=>{
        targetPoint = [
            userPos[0] + (Math.random()-0.5)*0.02,
            userPos[1] + (Math.random()-0.5)*0.02
        ];

        const objName = list[Math.floor(Math.random()*list.length)];

        showTarget(objName);

        document.getElementById("scan-box").style.display="none";
        document.getElementById("searchPulse").style.display="none";
        document.getElementById("ui-found").style.display="block";

        playBeep(500,0.3);

    },2500);
}

function showTarget(name) {
    document.getElementById("anomalyName").innerText = name;
    document.getElementById("infoBody").innerHTML =
        `<b>ОБЪЕКТ:</b> ${name}<br><b>РЕЖИМ:</b> ${document.getElementById("modeSelect").value}`;

    document.getElementById("coordsBox").innerText =
        `${targetPoint[1].toFixed(6)}, ${targetPoint[0].toFixed(6)}`;

    new maplibregl.Marker({color:"red"}).setLngLat(targetPoint).addTo(map);
    map.flyTo({center:targetPoint, zoom:16});
}

function buildRoute() {
    const url = `https://router.project-osrm.org/route/v1/foot/${userPos[0]},${userPos[1]};${targetPoint[0]},${targetPoint[1]}?geometries=geojson`;

    fetch(url).then(r=>r.json()).then(data=>{
        if(map.getLayer("route")){
            map.removeLayer("route");
            map.removeSource("route");
        }

        map.addSource("route", {
            type:"geojson",
            data:data.routes[0].geometry
        });

        map.addLayer({
            id:"route",
            type:"line",
            source:"route",
            paint:{
                "line-width":6,
                "line-color":"#0A84FF"
            }
        });
    });
}

function resetSystem(){
    location.reload();
}

function openM(id){ document.getElementById(id).classList.add("active"); }
function closeM(){ document.querySelectorAll(".modal").forEach(m=>m.classList.remove("active")); }
</script>

</body>
</html>

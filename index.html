<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>KiwiWay - Anomaly Radar</title>
    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        :root { 
            --ios-blue: #007AFF; 
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-deep: rgba(0, 0, 0, 0.4);
            --blur: blur(25px) saturate(180%);
            --border: rgba(255, 255, 255, 0.2);
        }
        
        body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; height: 100vh; }
        
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.7); }

        /* Жидкое стекло iOS */
        .glass-card {
            background: var(--glass-deep);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .ui-panel {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 420px; 
            padding: 24px; box-sizing: border-box; z-index: 100;
        }

        .btn {
            width: 100%; height: 56px; margin: 8px 0; border: none; border-radius: 18px;
            font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            background: var(--ios-blue); color: #fff; display: flex; align-items: center; justify-content: center;
        }
        .btn-sec { background: rgba(255, 255, 255, 0.15); }
        .btn:active { transform: scale(0.96); opacity: 0.8; }

        /* Radar Display */
        #radar-display { 
            height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 20px; position: relative;
        }
        #radar-circle {
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--ios-green);
            position: relative; transition: all 0.3s; box-shadow: 0 0 20px rgba(52, 199, 89, 0.2);
        }
        #needle {
            position: absolute; top: 50%; left: 50%; width: 3px; height: 35px;
            background: var(--ios-green); transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg); border-radius: 4px;
        }

        /* Sliders */
        .setting-row { margin: 18px 0; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%;
            background: #fff; margin-top: -10px; box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content { width: 85%; max-width: 360px; padding: 28px; }

        #search-status { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--ios-blue); font-weight: 700; margin-bottom: 10px; }
        
        /* Анимация сканирования */
        .pulse-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 2px solid var(--ios-blue); border-radius: 50%;
            animation: ring 2s infinite; opacity: 0; pointer-events: none;
        }
        @keyframes ring {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="rings"></div>

<div class="ui-panel glass-card">
    <div id="radar-ui" style="display:none; text-align: center;">
        <div id="radar-display">
            <div id="radar-circle"><div id="needle"></div></div>
            <div id="signal-label" style="margin-top:10px; color: var(--ios-green); font-weight: 700; font-variant-numeric: tabular-nums;">СИГНАЛ: 0%</div>
        </div>
    </div>

    <div id="scan-box" style="display:none; text-align:center; padding: 20px 0;">
        <div id="search-status">Сканирование эфира...</div>
        <div style="font-size: 12px; opacity: 0.6;">Ищем искажения реальности</div>
    </div>

    <div id="ui-main">
        <button class="btn" id="scanBtn" onclick="startSearch()">НАЙТИ АНОМАЛИЮ</button>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-sec" onclick="openModal('settings')">Настройки</button>
            <button class="btn btn-sec" onclick="resetView()">🎯</button>
        </div>
    </div>

    <div id="ui-result" style="display: none; gap: 10px;">
        <button class="btn" style="background: var(--ios-green);" onclick="buildPath()">МАРШРУТ</button>
        <button class="btn btn-sec" onclick="resetAll()">СБРОС</button>
    </div>
</div>

<div id="settings" class="modal">
    <div class="modal-content glass-card">
        <h2 style="margin-top:0; text-align:center">Параметры</h2>
        
        <div class="setting-row">
            <label style="font-size: 13px; opacity: 0.7;">КАТЕГОРИЯ</label>
            <select id="anomType" style="width:100%; height:48px; background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--border); border-radius:12px; padding:0 10px; margin-top:8px;">
                <option value="void">Пустой (Природа)</option>
                <option value="quantum">Квантовый (Дороги/Вода)</option>
                <option value="power">Мощный (Всё сразу)</option>
            </select>
        </div>

        <div class="setting-row">
            <label style="font-size: 13px; opacity: 0.7;">РАДИУС: <span id="rVal">5</span> км</label>
            <input type="range" id="radius" min="1" max="20" value="5" oninput="updateSettingsUI()">
        </div>

        <div class="setting-row">
            <label style="font-size: 13px; opacity: 0.7;">МОЩНОСТЬ АНОМАЛИИ: <span id="pVal">50</span>%</label>
            <input type="range" id="power" min="5" max="100" value="50" oninput="updateSettingsUI()">
        </div>

        <button class="btn" style="margin-top:20px" onclick="closeModal('settings')">СОХРАНИТЬ</button>
    </div>
</div>

<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audio, map, userPos, targetPos, radarTicker;

    // Инициализация карты
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [37.6, 55.7], zoom: 12, attributionControl: false
    });

    navigator.geolocation.getCurrentPosition(p => {
        userPos = [p.coords.longitude, p.coords.latitude];
        map.setCenter(userPos);
        new maplibregl.Marker({ color: '#007AFF' }).setLngLat(userPos).addTo(map);
    });

    function updateSettingsUI() {
        document.getElementById('rVal').innerText = document.getElementById('radius').value;
        document.getElementById('pVal').innerText = document.getElementById('power').value;
    }

    // ТАИНСТВЕННЫЙ ЗВУК ПОИСКА
    function playSearchSound() {
        if (!audio) audio = new AudioCtx();
        const osc = audio.createOscillator();
        const lfo = audio.createOscillator();
        const gain = audio.createGain();
        const filter = audio.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(40, audio.currentTime);
        lfo.frequency.setValueAtTime(2, audio.currentTime);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(200, audio.currentTime);

        const lfoGain = audio.createGain();
        lfoGain.gain.setValueAtTime(20, audio.currentTime);
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audio.destination);

        gain.gain.setValueAtTime(0, audio.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, audio.currentTime + 1);
        
        osc.start(); lfo.start();
        return { stop: () => {
            gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.5);
            setTimeout(() => { osc.stop(); lfo.stop(); }, 600);
        }};
    }

    async function startSearch() {
        const sound = playSearchSound();
        document.getElementById('ui-main').style.display = 'none';
        document.getElementById('scan-box').style.display = 'block';
        document.getElementById('rings').innerHTML = '<div class="pulse-ring"></div>';

        const type = document.getElementById('anomType').value;
        const rad = document.getElementById('radius').value;
        const pwr = document.getElementById('power').value;
        
        let found = false;
        // Попытки найти точку (симуляция анализа местности)
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = (Math.sqrt(Math.random()) * rad) / 111.32;
            const pt = [userPos[0] + dist * Math.cos(angle), userPos[1] + dist * Math.sin(angle)];
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pt[1]}&lon=${pt[0]}&zoom=18`);
                const data = await res.json();
                
                let match = false;
                const cat = data.type || data.addresstype || "";
                
                if (type === 'void') match = /forest|park|wood|field|grass|nature/.test(cat);
                else if (type === 'quantum') match = /bridge|coast|road|water|river|valley/.test(cat);
                else if (type === 'power') match = true; // Комбинированный берет всё

                if (match) {
                    targetPos = pt;
                    found = true;
                    break;
                }
            } catch(e) {}
        }

        setTimeout(() => {
            sound.stop();
            document.getElementById('scan-box').style.display = 'none';
            document.getElementById('rings').innerHTML = '';
            
            if (found) {
                initRadar(pwr);
                showMarker();
            } else {
                alert("В данной области аномалий не обнаружено. Попробуйте увеличить радиус.");
                resetAll();
            }
        }, 3500);
    }

    function initRadar(anomalyPower) {
        document.getElementById('radar-ui').style.display = 'block';
        document.getElementById('ui-result').style.display = 'flex';
        
        radarTicker = setInterval(() => {
            const d = getDist(userPos, targetPos);
            const maxD = document.getElementById('radius').value * 1000;
            
            // Расчет сигнала: зависит от расстояния и МОЩНОСТИ аномалии
            let base = Math.max(0, (1 - d/maxD) * 100);
            // Чем выше anomalyPower, тем меньше "дребезг" и выше минимальный порог
            let noise = (Math.random() - 0.5) * (110 - anomalyPower);
            let signal = Math.min(100, Math.max(anomalyPower * 0.1, base + noise));

            document.getElementById('needle').style.transform = `translate(-50%, -100%) rotate(${(signal - 50) * 1.8}deg)`;
            document.getElementById('signal-label').innerText = `СИГНАЛ: ${Math.round(signal)}%`;
            document.getElementById('radar-circle').style.borderColor = signal > 70 ? 'var(--ios-red)' : 'var(--ios-green)';
        }, 400);
    }

    function showMarker() {
        if (window.targetM) window.targetM.remove();
        const el = document.createElement('div');
        el.style.cssText = "width:20px; height:20px; background:var(--ios-red); border-radius:50%; box-shadow: 0 0 15px var(--ios-red);";
        window.targetM = new maplibregl.Marker(el).setLngLat(targetPos).addTo(map);
        map.flyTo({ center: targetPos, zoom: 15 });
    }

    function getDist(p1, p2) {
        const R = 6371e3;
        const φ1 = p1[1] * Math.PI/180, φ2 = p2[1] * Math.PI/180;
        const Δφ = (p2[1]-p1[1]) * Math.PI/180, Δλ = (p2[0]-p1[0]) * Math.PI/180;
        const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function buildPath() {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${targetPos[1]},${targetPos[0]}&travelmode=walking`);
    }

    function resetAll() {
        clearInterval(radarTicker);
        document.getElementById('radar-ui').style.display = 'none';
        document.getElementById('ui-result').style.display = 'none';
        document.getElementById('ui-main').style.display = 'block';
        if (window.targetM) window.targetM.remove();
    }

    function resetView() {
        if (userPos) map.flyTo({ center: userPos, zoom: 12 });
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
